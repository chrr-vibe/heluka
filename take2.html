<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take#2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#17110c; --ink:#21180f; --pink:#8f7149; --pink-soft:#eadfc9;
  --face:#d8cbb3; --hi:#f4ecdc; --lo:#8c7b62; --paper:#f3ece0;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(214,180,120,.14),transparent 70%) no-repeat var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#ece2cd;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:#c4a676;margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #5e4630}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#6d5d4a;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630;
  box-shadow:inset -1px -1px 0 #5e4630,inset 1px 1px 0 #c9ad84;margin-top:6px}
.nar{align-self:stretch;background:#ebe2d2;border:1px dashed #b3a184;padding:8px 10px;font-size:13px;line-height:1.55;color:#4a3d30;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a8d7c;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630}
.btn:disabled{color:#8f826f;text-shadow:none;cursor:default}
.btn.main:disabled{background:#bfa888}
.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.hint{font-size:12px;color:#a39580;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
</style>
</head>

은 검은 머리의 남자가."], ["O", "할아버지 다리엔 사람이 강가에 혼자 앉아 있어. 자네 다리엔 사람이 다리 한가운데 서 있고."], ["P", "......"], ["O", "그 차이는 크지."], ["N", "반대편 작업대에서 무언가 떨어지는 소리가 났다. 루카스의 주걱이었다. 요나스가 고개를 숙이고 어깨를 떨었다."], ["H", "2장. 시장"], ["N", "열사흘째 토요일. 도서관은 주말에 닫았다. 다리 위의 이젤도 토요일엔 쉬었다. 그는 그렇게 정했다고 했다. 루카스가 출근하지 않는 날은 그릴 사람이 없으니까."], ["N", "오후 네 시, 루카스의 휴대폰이 울렸다."], ["P", "루카스, 크리스마스 시장이 어디 있어요? 호텔 직원이 광장 다섯 개에 다 있다는데, 어디가 제일 좋아요?"], ["L", "...다 시끄럽습니다."], ["P", "그럼 제일 덜 시끄러운 데요."], ["L", "그런 데는 없습니다. 12월 하이델베르크에서."], ["P", "ㅎㅎ 그럼 같이 가 줄래요? 저 혼자 가면 또 길에서 사람들한테 잡혀요. 루카스가 '조용히 해 주세요' 해 주면 다들 조용해지잖아요."], ["L", "저를 경비원으로 쓰시는 겁니까."], ["P", "안 돼요?"], ["N", "루카스는 창밖을 보았다. 해가 지고 있었다. 광장 쪽에서 불빛이 하나둘 켜지고 있었다."], ["L", "......다섯 시. 성령교회 앞."], ["N", "다섯 시, 마르크트 광장. 성령교회 앞에 그가 서 있었다. 목도리를 칭칭 감고 털모자를 썼다. 그런데 털모자 아래로 붉은 머리카락이 무릎까지 흘러나와 있었다."], ["L", "...그게 변장입니까."], ["P", "코니아일랜드보다는 나아요. 모자는 썼잖아요."], ["L", "머리는 그대로입니다."], ["P", "머리는 포기했어요."], ["N", "광장은 불빛과 사람으로 가득 차 있었다. 나무로 지은 작은 가게들이 줄지어 있었다. 구운 아몬드 냄새, 계피 냄새, 따뜻한 와인 냄새. 회전목마가 돌고 있었다. 아이들이 소리를 질렀다."], ["N", "루카스는 그 소란 속을 앞장서 걸었다. 그는 그 뒤를 따랐다. 사람들이 붉은 머리를 돌아볼 때마다, 루카스가 걸음을 늦추고 그 사람들을 한 번씩 쳐다보았다. 그러면 사람들이 시선을 거뒀다."], ["P", "ㅎㅎ 진짜 경비원 같아요."], ["L", "그럼 경비비를 내십시오."], ["P", "뭐로요?"], ["L", "...저거."], ["N", "루카스가 가리킨 것은 구운 아몬드 가게였다. 그는 웃으며 두 봉지를 샀다. 하나를 루카스에게 내밀었다. 루카스는 받아 들고 한 알을 먹었다. 그리고 그것이 이 시장에서 루카스가 유일하게 좋아하는 것이라는 사실을 말하지 않았다."], ["N", "광장 한쪽 끝에 낡은 판화 가게가 있었다. 오래된 하이델베르크 풍경을 찍은 판화들이 걸려 있었다. 그가 걸음을 멈췄다."], ["P", "...이거 봐요, 루카스. 다리예요."], ["N", "19세기 동판화였다. 옛 다리와 성. 종이가 누렇게 바래 있었고, 모서리에 얼룩이 있었다."], ["L", "폭스링입니다. 저 갈색 점. 종이에 철분이 있어서 생깁니다."], ["P", "고칠 수 있어요?"], ["L", "대부분은요."], ["P", "ㅎㅎ 그 말 좋아요."], ["N", "그는 그 판화를 샀다. 가게 주인이 포장을 하려 하자 루카스가 막았다. 비닐 말고 종이로, 접지 말고 말아서. 가게 주인이 루카스를 신기한 듯 쳐다보았다."], ["P", "이거 루카스한테 맡겨도 돼요? 폭스링."], ["L", "...개인 의뢰는 안 받습니다."], ["P", "그럼 친구 의뢰는요?"], ["N", "루카스는 대답하지 않았다. 대신 둘둘 만 판화를 그의 손에서 가져가 자기 코트 안쪽에 넣었다. 눈이 묻지 않도록."], ["N", "시장 끝, 강 쪽으로 내려가는 계단에서 두 사람은 잠깐 멈췄다. 강 건너 산 위로 성이 보였다. 불이 켜져 있었다."], ["P", "...루카스. 저 여기 좋아요. 하이델베르크."], ["L", "춥고 시끄럽습니다. 12월엔."], ["P", "그래도요. 할아버지가 왜 이 다리를 그렇게 많이 그렸는지 알 것 같아요."], ["L", "......"], ["P", "떠나기 싫었을 거예요. 그래도 떠나야 했으니까 계속 그린 거겠죠. 잊어버릴까 봐."], ["N", "루카스는 강을 보았다. 무언가 말하려고 입을 열었다. '그럼 떠나지 마십시오.' 아니었다. '여기 있으면 됩니다.' 그것도 아니었다. 그런 말은 루카스가 할 수 있는 말이 아니었다."], ["L", "......아몬드, 한 봉지 더 사도 됩니다."], ["P", "네?"], ["L", "경비비. 아직 덜 냈습니다."], ["N", "그가 웃었다. 그리고 정말로 계단을 다시 올라가 한 봉지를 더 사 왔다. 루카스는 그것을 받아 코트 주머니에 넣었다. 털장갑 옆에."], ["N", "그날 밤, 루카스는 집에 돌아와 판화를 펼쳤다. 갈색 폭스링이 열두 개. 루카스는 그것을 하나하나 세었다. 그리고 생각했다. 이걸 다 지우려면 한 달은 걸리겠다고."], ["N", "한 달. 루카스는 그 숫자를 오래 생각했다. 그리고 그 생각이 무서워서, 판화를 다시 말아 서랍에 넣었다."], ["H", "3장. 기사"], ["N", "열닷새째 아침. 다리 위에 이젤이 서 있었다. 그런데 그 주위에 사람이 있었다. 셋, 넷, 다섯. 카메라를 든 사람도 있었다."], ["N", "루카스는 다리 끝에서 걸음을 멈췄다."], ["N", "그는 사람들에게 둘러싸여 곤란하게 웃고 있었다. 사인을 해 주고, 사진을 찍어 주고, 영어와 서툰 독일어를 섞어 대답하고 있었다. 그러다 다리 끝에 선 루카스를 발견했다. 얼굴이 환해졌다. 손을 들어 흔들었다."], ["N", "그 순간 모든 카메라가 루카스 쪽으로 돌아갔다."], ["L", "......"], ["N", "루카스는 그대로 돌아섰다. 그리고 반대편 다리로 걸어갔다. 한 번도 돌아보지 않았다."], ["N", "그날 오후, 요나스가 휴대폰을 들고 복원실로 뛰어 들어왔다."], ["M", "선배님! 이거 보셨어요?"], ["N", "독일 미술 잡지의 온라인 기사였다. 제목이 컸다. '미국의 붉은 화가, 하이델베르크 다리 위에서 1년 만의 신작'. 사진이 세 장 있었다. 다리 위의 이젤. 그림 그리는 그. 그리고 마지막 사진."], ["N", "안개 낀 다리 한가운데, 난간에 손을 얹고 강을 보는 검은 머리의 남자. 얼굴은 반쯤 가려져 있었다. 그런데 하이델베르크에서 그 사람을 아는 누구라도 알아볼 수 있었다."], ["N", "사진 아래 한 줄이 적혀 있었다. '매일 아침 5분, 화가의 앞을 지나는 신비한 남자. 그는 누구인가?'"], ["L", "......"], ["M", "선배님, 이거 선배님이잖아요. 저 바로 알아봤어요."], ["L", "다리 건너는 사람은 하루에 천 명이야."], ["M", "난간에 그렇게 손 얹는 사람은 선배님 하나예요. 장갑까지 똑같은데요."], ["N", "루카스는 휴대폰을 요나스에게 돌려주었다. 그리고 아무 말 없이 작업으로 돌아갔다. 손이 정확했다. 너무 정확했다. 요나스는 그게 더 무서웠다."], ["N", "다음 날 아침 일곱 시 오십오 분. 그는 다리 한가운데에 서 있었다. 오늘은 사람이 더 많았다. 그는 다리 끝을 보았다. 아무도 오지 않았다."], ["N", "여덟 시. 여덟 시 십 분. 여덟 시 반."], ["N", "루카스는 그 시간, 다리 하나 아래의 다른 다리를 건너고 있었다. 10분을 더 돌아서. 코트 깃을 세우고."], ["N", "그날 오후 세 시. 복원실 문에 노크 소리가 났다."], ["P", "루카스, 오늘 아침에—"], ["L", "바쁩니다."], ["P", "...잠깐이면 돼요."], ["L", "지금 18세기 악보 습식 세척 중입니다. 손 뗄 수 없습니다."], ["N", "그는 문간에 서 있었다. 루카스는 고개를 들지 않았다. 엘제 선생님이 두 사람을 번갈아 보다가, 조용히 그를 복도로 데리고 나갔다."], ["N", "문이 닫혔다. 루카스는 그제서야 주걱을 내려놓았다. 손이 떨리고 있었다. 습식 세척은 오늘 아침에 끝난 작업이었다."], ["H", "4장. 복도"], ["N", "복도. 엘제 선생님은 창가에 기대어 그를 올려다보았다. 그는 혼날 준비를 한 아이 같은 얼굴로 서 있었다."], ["O", "사진 때문일 거예요."], ["P", "...네. 저도 알아요. 오늘 아침에 기사 봤어요. 제가 손 흔들어서 그런 거예요. 그 사람들이 다 루카스 쪽을 봤어요."], ["O", "그 애는 사람들이 쳐다보는 걸 못 견뎌요. 어릴 때부터 그랬어. 복원실이 지하에 있는 것도 그 애한텐 다행인 거고."], ["P", "......"], ["O", "그런데 하나는 알아 둬요. 그 애가 화가 났으면 화를 내요. 짧게, 정확하게. 근데 오늘은 화를 안 냈죠?"], ["P", "네. 그냥... 바쁘다고만."], ["O", "그게 더 나쁜 거예요. 화가 난 게 아니라 숨은 거니까."], ["N", "그는 창밖을 보았다. 도서관 마당에 눈이 조금 쌓여 있었다."], ["P", "...그럼 제가 어떻게 해야 돼요?"], ["O", "글쎄. 그 애한테 정답을 아는 사람은 없어요. 나도 15년째 모르는데."], ["P", "ㅎㅎ 15년이요?"], ["O", "그런데 자네는 3주 만에 그 애가 웃는 소리를 들었다며. 민디가 그러더군요. 나는 그 소리를 5년 걸려서 들었어요."], ["N", "그날 밤, 루카스의 휴대폰에 메시지가 왔다."], ["P", "오늘 아침 미안해요. 제가 손 흔들어서 사람들이 다 루카스를 봤죠. 생각이 짧았어요."], ["P", "이제 다리 위에서 안 그릴게요. 호텔 창문에서 그릴게요. 거기서도 다리 보여요. 그러니까 루카스는 그냥 편하게 다리 건너가요. 아무도 안 쳐다보게."], ["P", "대신 오후에 하르트만 드로잉 보러 가는 건 계속 가도 될까요? 손 씻고, 두 걸음 떨어져서, 조용히."], ["N", "루카스는 그 메시지를 오래 보았다. 답장을 썼다. 지웠다. 다시 썼다."], ["L", "알겠습니다."], ["N", "보냈다. 그리고 휴대폰을 엎었다."], ["N", "그는 그 한 마디를 '괜찮다'로 읽었다. 루카스는 그 한 마디를 '그럼 이제 그 5분도 없구나'로 썼다. 둘 다 상대가 다르게 읽었다는 것을 몰랐다."], ["H", "5장. 반쪽"], ["N", "열여드레째. 다리 위에는 이젤이 없었다. 루카스는 일주일 만에 원래 다리를 건넜다. 아무도 없었다. 카메라도, 사람들도, 붉은 머리도."], ["N", "난간 앞에서 루카스는 걸음을 멈췄다. 습관처럼 장갑 낀 손을 들어 올렸다가, 내렸다. 5분이 지나도록 그 자리에 서 있었다. 강 건너 호텔 창문 중 어느 것이 그의 창인지 루카스는 몰랐다."], ["N", "그날 오후, 다나가 하이델베르크에 도착했다."], ["D", "여기 진짜 춥다. 뉴욕보다 춥다. 그리고 다들 왜 이렇게 조용해?"], ["P", "여기 도서관이에요, 다나."], ["D", "알아, 알아. 너 요즘 매일 여기 온다며. 할아버지 그림 보러? 아니면 그 사람 보러?"], ["N", "도서관 3층 복도 끝, 열람실 앞 휴게 공간. 오후 세 시 반이었다. 루카스는 복원 보고서를 열람실 사서에게 전해 주러 올라왔다가, 모퉁이에서 걸음을 멈췄다."], ["N", "낯익은 목소리 두 개였다. 다나는 목소리가 컸다. 그는 늘 그랬듯 조용했다. 그래서 루카스에게는 다나의 말이 더 잘 들렸다."], ["D", "...그래서 1월 15일 비행기 끊어 놨어. 전시 설치가 2월 말이니까 그 전에 들어와야 해. 여기 정리하고."], ["P", "네. 돌아가야죠. 여기 계속 있을 순 없으니까."], ["D", "다리 연작 몇 점이야?"], ["P", "일곱 점이요. 아직 다 안 끝났어요."], ["D", "그 다리 한가운데 남자 있는 거, 그게 메인이야. 휘트니 큐레이터가 사진 보고 난리 났어. 1년 만의 신작 중심에 미스터리한 독일 남자. 기사가 이미 반은 써 준 거야."], ["P", "...다나, 그 사람 그런 거 싫어해요."], ["D", "싫어하든 말든, 그림은 네 거야. 그 사람 얼굴 정면으로 그린 것도 있다며. 그거 걸자."], ["P", "그건 안 돼요. 허락 안 받았어요."], ["D", "허락? 너 모델한테 언제부터 허락받았어?"], ["N", "그 다음 그의 대답은 작아서 들리지 않았다. 루카스는 들으려고 하지 않았다. 이미 돌아서 있었다."], ["N", "계단을 내려가는 발소리가 아주 정확했다. 하나도 흐트러지지 않았다. 복원실 문을 열었다. 닫았다. 아주 천천히. 습도가 흔들리지 않도록."], ["M", "선배님? 보고서 전해 드리고 오셨어요?"], ["L", "......아니."], ["M", "네? 그럼 그거 왜 아직 들고 계세요?"], ["N", "루카스는 손에 든 보고서를 내려다보았다. 종이 가장자리가 구겨져 있었다. 자기가 쥐고 있었다는 것을 그제서야 알았다. 복원가는 종이를 구기지 않는다. 15년 동안 한 번도 그런 적이 없었다."], ["L", "......펴 줘. 요나스."], ["M", "네?"], ["L", "이거. 펴 줘. 다리미 약하게."], ["N", "요나스는 아무것도 묻지 않고 보고서를 받아 들었다. 루카스는 작업대에 두 손을 짚고 서 있었다. 오래."], ["N", "'돌아가야죠. 여기 계속 있을 순 없으니까.'"], ["N", "'그 다리 한가운데 남자 있는 거, 그게 메인이야.'"], ["N", "'모델한테 언제부터 허락받았어?'"], ["N", "루카스는 그 세 문장을 머릿속에서 몇 번이고 다시 배열했다. 어떤 순서로 놓아도 결론은 같았다. 원래 돌아갈 사람이었다. 처음부터. 그리고 루카스는, 그 사람이 1년 만에 다시 그림을 그리게 해 준, 다리 위의 무언가였다. 그림이 끝나면 필요 없어지는."], ["N", "그것은 놀라운 결론이 아니었다. 루카스가 처음부터 예상했던 결론이었다. 그래서 5분이었다. 그래서 '아직'이었다."], ["N", "그런데 예상했던 것과, 실제로 듣는 것은 달랐다."], ["H", "6장. 다리 위에서"], ["N", "다음 날 아침 일곱 시 오십오 분. 루카스는 다리를 건너지 않았다. 대신 강 건너 호텔 앞에 서 있었다."], ["N", "그는 호텔 로비에서 내려오다가 루카스를 보고 걸음을 멈췄다. 얼굴이 확 밝아졌다. 그리고 그 밝은 얼굴로 뛰어왔다."], ["P", "루카스! 웬일이에요? 일주일 만이에요. 아침은요? 같이—"], ["L", "그림 다 그렸습니까."], ["N", "그가 멈췄다. 루카스의 목소리는 낮았다. 서점에서 '조용히 해 주세요'라고 할 때와 같은 목소리였다. 그런데 그때보다 훨씬 차가웠다."], ["P", "...네? 거의요. 일곱 점 중에 다섯 점이요."], ["L", "그럼 나머지 두 점은 사진 보고 그리셔도 될 겁니다. 기사에 사진 많던데요."], ["P", "루카스, 무슨—"], ["L", "1월 15일 비행기라고 들었습니다."], ["N", "그의 얼굴이 굳었다. 무언가를 알아차린 얼굴이었다."], ["P", "...어제 들었어요? 도서관에서?"], ["L", "들으려고 한 건 아닙니다. 다나 씨 목소리가 큽니다."], ["P", "그거 그런 얘기 아니에요. 끝까지 들으면—"], ["L", "돌아가야 한다는 거, 맞습니까."], ["P", "...네, 1월에 가야 하는 건 맞는데, 그건—"], ["L", "그럼 됐습니다."], ["N", "루카스가 한 걸음 물러섰다. 그가 한 걸음 다가왔다. 루카스가 또 물러섰다. 두 걸음. 복원실에서 그가 늘 앉던 거리였다."], ["L", "처음부터 돌아갈 사람이었습니다. 저도 알고 있었습니다. 그러니까 설명하실 필요 없습니다."], ["P", "루카스."], ["L", "그림은 마음대로 거십시오. 메인이든 뭐든. 얼굴 그린 것도. 허락할 필요 없는 거라면서요."], ["P", "그건 다나가 한 말이에요! 저는 안 된다고—"], ["L", "그리고 이제 도서관에도 안 오셔도 됩니다. 하르트만 드로잉은 엘제 선생님께 말씀드리면 사진 파일로 보내 드릴 겁니다."], ["N", "그의 얼굴에서 핏기가 빠졌다. 붉은 머리카락 아래에서 얼굴만 하얬다."], ["P", "......저 보기 싫어요?"], ["N", "루카스는 대답하지 않았다. 대답하면 목소리가 흔들릴 것 같았다. 그래서 대신 가장 짧고 정확한 말을 골랐다. 늘 그랬듯이."], ["L", "...다시 볼 일 없습니다."], ["N", "서점에서 했던 말이었다. 그때는 틀렸던 말. 그는 그 말을 알아들었다. 그리고 아무것도 말하지 못했다."], ["N", "루카스는 돌아섰다. 다리를 건넜다. 돌아보지 않았다. 이번에는 보안 검색대도 없었다. 걸음을 멈출 곳도 없었다."], ["N", "다리 한가운데에서, 루카스의 손이 습관처럼 난간 쪽으로 움직였다. 루카스는 그 손을 코트 주머니에 넣었다. 주머니 안에 털장갑이 있었다. 루카스는 그것을 꽉 쥐었다."], ["H", "7장. 보관 기간"], ["N", "그날 오후, 요나스가 호텔 로비에 서 있었다. 손에 작은 상자를 들고. 엘제 선생님이 직접 만든 중성지 상자였다."], ["M", "...선배님이 전해 드리래요."], ["N", "그가 상자를 열었다. 안에는 작은 스케치북이 들어 있었다. 쉬는 손 서른 장. 그리고 관람차 앞의 옆모습. 뉴욕 공항에서 그가 건넸던 바로 그것."], ["N", "상자 안에 메모가 한 장 있었다. 루카스의 글씨였다. 정확하고, 짧았다."], ["N", "'보관 기간 종료. 습도 50퍼센트에서 보관할 것. 지하 금지.'"], ["P", "......"], ["M", "저기, 이건 제가 말하면 안 되는 건데요."], ["P", "...네."], ["M", "선배님이 이 상자를 어젯밤에 만드셨어요. 복원실에서. 혼자. 밤 열한 시까지요. 중성지 접는 데 원래 20분이면 되는데, 세 시간 걸리셨대요. 엘제 선생님이 아침에 쓰레기통 보고 아셨어요. 실패한 상자가 일곱 개 있었대요."], ["N", "그는 상자를 내려다보았다. 모서리가 완벽하게 접혀 있었다. 여덟 번째 상자였다."], ["P", "...왜 그렇게까지 했대요. 돌려줄 거면서."], ["M", "모르겠어요. 근데 선배님은 버릴 거면 그냥 버려요. 상자 같은 거 안 만들어요."], ["N", "요나스는 그 말을 남기고 돌아갔다. 그는 로비 소파에 앉아 상자를 무릎에 올려놓고, 한참 동안 움직이지 않았다."], ["N", "다나가 엘리베이터에서 내리다가 그를 발견했다."], ["D", "너 얼굴이 왜 그래. 뭐야 그거."], ["P", "......돌려받았어요."], ["D", "뭘?"], ["P", "그 사람한테 줬던 거요. 보관해 달라고 맡긴 거."], ["N", "다나가 상자를 들여다보았다. 그리고 메모를 읽었다. 표정이 천천히 바뀌었다."], ["D", "...어제 내가 한 얘기 들었구나. 그 사람."], ["P", "네."], ["D", "어디까지?"], ["P", "모르겠어요. 아마 '돌아가야죠'까지요. 그 뒤엔 없었으니까."], ["N", "다나가 소파에 털썩 앉았다. 이마를 짚었다."], ["D", "이 바보야. 그럼 쫓아가서 말을 했어야지. 전부 다. 끝까지."], ["P", "하려고 했어요. 근데 그 사람이 다시 볼 일 없다고 했어요."], ["D", "그래서 그냥 보냈어?"], ["P", "...싫다는 사람 붙잡으면 안 되잖아요."], ["D", "싫다는 사람이 상자를 여덟 번 접어?"], ["N", "그는 대답하지 못했다. 다나가 한숨을 쉬었다."], ["D", "너 진짜 그림 말고는 아무것도 못 해."], ["P", "......알아요."], ["N", "그날 밤, 그는 메시지를 썼다. 길게. 아주 길게. 다리 연작 이야기, 1월 15일 이야기, 다나가 한 말과 자기가 한 말의 차이, 그리고 그 뒤에 하려던 말까지."], ["N", "다 쓰고 나서, 보내기 버튼 위에서 손가락이 멈췄다. '다시 볼 일 없습니다.' 그 목소리가 떠올랐다."], ["N", "그는 메시지를 지웠다. 그리고 한 줄만 보냈다."], ["P", "상자, 잘 보관할게요. 습도 50퍼센트에서. 지하 말고."], ["N", "루카스는 그 메시지를 읽었다. 답장하지 않았다."], ["N", "그 한 줄이 '알겠다, 이제 정리하겠다'로 읽혔다. 그는 그 한 줄에 '그래도 기다릴게요'를 담았다. 이번에도 둘 다, 상대가 다르게 읽었다는 것을 몰랐다."], ["H", "8장. 엘제"], ["N", "크리스마스 이브. 도서관은 오후 두 시에 문을 닫았다. 복원실에는 루카스 혼자 남아 있었다."], ["N", "엘제 선생님이 문을 열고 들어왔다. 코트를 입은 채였다. 손에 보온병을 들고 있었다."], ["O", "집에 안 가니?"], ["L", "이것만 끝내고요."], ["O", "그 양피지, 어제 끝난 거잖아. 나 다 봤어."], ["L", "......"], ["N", "엘제 선생님은 루카스 옆 의자에 앉았다. 보온병 뚜껑에 따뜻한 와인을 따라 작업대에서 먼 쪽에 내려놓았다. 종이에서 정확히 두 걸음 떨어진 곳에."], ["O", "그 사람, 아직 하이델베르크에 있다."], ["L", "압니다."], ["O", "매일 오후 세 시에 도서관 앞까지 왔다가 돌아간대. 민디처럼 내 정보원이 있어서 알아. 요나스라고."], ["L", "...요나스는 다음 달까지 곰팡이 제거입니다."], ["O", "그 애는 각오하고 말한 거야."], ["N", "루카스는 대답하지 않았다. 엘제 선생님은 창도 없는 복원실 벽을 바라보며 말했다."], ["O", "루카스. 너 처음 여기 왔을 때 기억하니? 열아홉 살."], ["L", "...네."], ["O", "첫 작업이 뭐였지?"], ["L", "찢어진 편지였습니다. 18세기. 반쪽만 남은."], ["O", "그리고 넌 반쪽만 보고 그 편지가 이별 편지라고 했어. 나머지 반쪽은 찾을 필요도 없다고."], ["L", "......"], ["O", "그래서 내가 나머지 반쪽을 찾아왔지. 서고 다른 상자에 있었어. 기억나니? 그 편지 끝이 어떻게 끝났는지."], ["N", "루카스는 기억했다. 15년이 지났지만, 그 문장 하나는 정확히 기억했다."], ["L", "'...그러니 기다려 주시오. 봄에 돌아가겠소.'"], ["O", "그래. 이별 편지가 아니었어. 넌 반만 읽고 판결을 내렸고."], ["N", "엘제 선생님이 루카스를 돌아보았다. 화난 얼굴이 아니었다. 슬픈 얼굴도 아니었다. 15년 동안 이 아이를 본 사람의 얼굴이었다."], ["O", "넌 그때부터 그랬어. 끝까지 안 들어. 끝까지 들으면 진짜일까 봐."], ["L", "......진짜면요."], ["O", "응?"], ["L", "끝까지 들었는데 진짜로 돌아가는 거면요. 진짜로 그냥 그림이었던 거면요."], ["N", "목소리가 처음으로 흔들렸다. 아주 조금. 엘제 선생님은 그것을 들었다. 15년 만에 처음 듣는 소리였다."], ["O", "그럼 그때 아파하면 되지. 지금처럼 미리 아파하지 말고."], ["L", "미리 아파하는 게 덜 아픕니다."], ["O", "그래서, 덜 아프니?"], ["N", "루카스는 대답하지 못했다. 작업대 위에 놓인 손이 하얗게 질려 있었다. 털장갑은 코트 주머니에 있었다. 일주일째 끼지 않고."], ["O", "...메리 크리스마스, 루카스. 그 와인 마시고 가. 식기 전에."], ["N", "엘제 선생님이 나간 뒤, 루카스는 오래 앉아 있었다. 와인은 결국 식었다. 루카스는 그것을 다 마셨다. 식은 와인은 맛이 없었다. 그래도 다 마셨다."], ["H", "9장. 1월 15일"], ["N", "1월 15일, 아침 일곱 시 오십오 분. 루카스는 다리 끝에 서 있었다."], ["N", "오늘 그가 떠난다는 것을 알고 있었다. 비행기가 몇 시인지는 몰랐다. 프랑크푸르트까지 기차로 한 시간. 아마 지금쯤 역에 있을 것이다."], ["N", "다리 위에는 아무도 없었다. 이젤도 없었다. 루카스는 다리 한가운데까지 걸어갔다. 그리고 걸음을 멈췄다."], ["N", "난간 위에, 무언가가 놓여 있었다. 작은 캔버스였다. 비닐로 꼼꼼하게 싸여 있었다. 눈이 묻지 않도록."], ["N", "루카스는 그것을 집어 들었다. 비닐을 벗겼다. 손이 떨려서 몇 번이나 실패했다."], ["N", "그림이었다. 다리 위의 이젤에서 그리던 것과 같은 다리. 안개. 강. 그런데 다리 한가운데에 아무도 없었다. 난간만 있었다. 그리고 난간 위에, 털장갑 한 켤레가 놓여 있었다."], ["N", "캔버스 뒷면에 영어로 몇 줄이 적혀 있었다."], ["P", "'일곱 번째 그림이에요. 연작의 마지막. 이건 전시에 안 걸어요. 루카스 거예요.'"], ["P", "'다리에 없는 사람은 그릴 수가 없어서, 장갑만 그렸어요. 그 사람이 거기 있었다는 표시로.'"], ["P", "'끝까지 말 못 하고 가서 미안해요. 근데 다시 볼 일 없다고 했으니까, 이번엔 루카스 말 들을게요. 대신 이건 받아 줘요. 보관 기간 없이.'"], ["N", "루카스는 그 자리에 서 있었다. 5분이 지났다. 10분이 지났다. 출근 시간이 지났다."], ["N", "휴대폰을 꺼냈다. 연락처 맨 위의 이름을 눌렀다. 신호가 갔다. 한 번, 두 번, 세 번."], ["N", "그리고 끊었다. 루카스가 먼저."], ["N", "그가 받으면, 무슨 말을 해야 할지 몰랐다. '가지 마십시오'는 말할 수 없었다. 그건 루카스가 할 수 있는 말이 아니었다. 그렇다고 '잘 가십시오'는 더 말할 수 없었다."], ["N", "그래서 아무 말도 하지 않았다. 늘 그랬듯이."], ["N", "프랑크푸르트행 기차 안. 그의 휴대폰이 진동했다. 부재중 전화 1통. 루카스. 신호 세 번."], ["N", "그는 그 화면을 오래 보았다. 다시 걸까. 손가락이 망설였다. 그러다 기차가 터널로 들어갔다. 신호가 끊겼다."], ["N", "터널을 빠져나왔을 때, 그는 다시 걸지 않았다. 세 번 울리고 끊은 전화. 그는 그걸 '그래도 마지막 인사는 하려고 했구나'로 읽었다. 거기서 더 바라는 건 욕심이라고 생각했다."], ["N", "이번에도 둘 다, 상대가 다르게 읽었다는 것을 몰랐다."], ["H", "10장. 4층, 다시"], ["N", "1월 말, 브루클린. 오래된 공장 건물 4층."], ["N", "작업실은 반쯤 비어 있었다. 벽을 따라 상자가 쌓여 있었다. 물감, 붓, 책, 캔버스 틀. 상자마다 같은 글씨로 적혀 있었다. 'Heidelberg'."], ["N", "그는 그 상자들 사이에서 그림을 그리고 있었다. 밤이었다. 창밖으로 맨해튼의 불빛이 보였다. 그는 그쪽을 보지 않았다."], ["N", "다나가 엘리베이터에서 내렸다. 손에 중국 음식 봉지를 들고 있었다."], ["D", "또 밥 안 먹었지."], ["P", "...먹었어요."], ["D", "뭐."], ["P", "그래놀라 바요."], ["D", "그건 밥이 아니야. 이리 와."], ["N", "그는 붓을 내려놓고 상자 위에 앉았다. 다나가 그 옆에 앉아 국수 상자를 열어 주었다. 그는 젓가락을 들었다가, 그대로 멈췄다."], ["D", "...답장 왔어?"], ["P", "아뇨."], ["D", "너는 보냈어?"], ["P", "안 보냈어요. 다시 볼 일 없다고 했으니까."], ["D", "그 사람이 공항 가는 날 전화했다며. 세 번 울리고 끊었다며."], ["P", "그건 마지막 인사였을 거예요."], ["D", "인사를 하려는 사람이 왜 세 번 만에 끊어."], ["P", "......"], ["N", "다나가 이마를 짚었다. 그리고 그의 등 뒤, 천으로 덮인 캔버스 하나를 보았다. 작업실에서 유일하게 상자에 들어가지 않은 그림이었다."], ["D", "저건 언제 보여 줄 거야? 얼굴 그린 거."], ["P", "안 보여 줘요."], ["D", "전시 말고. 나한테."], ["P", "...다나한테도요. 그 사람이 허락 안 했으니까."], ["D", "그 사람이 너 다시 안 본다는데, 허락은 언제 받게?"], ["P", "모르겠어요."], ["N", "그는 국수를 한 젓가락 먹었다. 그리고 낮게 말했다."], ["P", "그래도 하이델베르크로 가는 건 그대로 해요. 그 사람 때문만은 아니에요. 할아버지 스케치북이 거기서 다시 살아났잖아요. 저도 거기서 다시 그리기 시작했고요."], ["D", "......"], ["P", "그 사람 안 만나도 돼요. 같은 도시에 있으면, 가끔 다리 건너는 거 멀리서 볼 수는 있잖아요."], ["D", "...너 그거 진짜 무서운 말인 거 알지?"], ["P", "ㅎㅎ 그래요?"], ["D", "스토커 같아."], ["P", "아, 그럼 반대편 다리로 다닐게요."], ["N", "다나는 웃지 않았다. 대신 그의 머리를 손바닥으로 한 번 쓸었다. 엄마처럼."], ["N", "2월 초, 민디가 작업실에 왔다. 손에 하르트만의 스케치북 상자를 들고. 복원 이후 첫 상태 점검이었다."], ["R", "상태 완벽해요. 아스카니엔 씨가 했으니까 당연하죠."], ["P", "...그 사람 소식 들었어요?"], ["R", "엘제 선생님이랑 가끔 이메일해요. 근데 그 사람 얘기는 잘 안 하세요. 딱 한 줄 있었어요. 지난주에."], ["P", "뭐라고요?"], ["R", "'요즘 밤마다 판화를 고친다. 개인 의뢰는 안 받는 애가.'"], ["N", "그가 고개를 들었다. 무슨 판화인지, 그는 알았다. 크리스마스 시장. 폭스링 열두 개. 친구 의뢰."], ["P", "......"], ["R", "그거 무슨 뜻이에요?"], ["P", "...모르겠어요."], ["N", "그는 모르겠다고 했다. 그런데 그날 밤, 그는 처음으로 휴대폰을 들고 메시지 창을 열었다. 썼다. 지웠다. 썼다. 지웠다."], ["N", "결국 보내지 않았다. 대신 그 판화의 다리를 기억해서, 작은 종이에 연필로 그렸다. 다리 위에 아무도 없는 그림이었다. 그리고 그 아래 작게 적었다. '폭스링 몇 개 남았어요?'"], ["N", "그 종이는 보내지지 않은 채 'Heidelberg' 상자 맨 위에 들어갔다."], ["H", "11장. 2월"], ["N", "2월. 하이델베르크에 눈이 많이 왔다. 강이 군데군데 얼었다."], ["N", "루카스는 다시 원래 다리로 출근했다. 일곱 시 오십오 분에 다리 한가운데를 지났다. 멈추지 않았다. 멈추면 난간에 손을 얹게 될 것 같았다."], ["N", "일곱 번째 그림은 루카스의 집 거실 벽에 걸렸다. 북향 벽이었다. 직사광선 금지. 습도계를 그 옆에 하나 걸었다. 매일 아침 숫자를 확인했다. 50퍼센트."], ["N", "그리고 밤마다, 서랍에서 크리스마스 시장의 판화를 꺼냈다. 갈색 폭스링 열두 개. 루카스는 하루에 하나씩, 아주 천천히 그것을 지웠다. 개인 의뢰는 받지 않는다고 했었다. 친구 의뢰도 받는다고는 한 적 없었다. 그런데 루카스는 그것을 멈추지 않았다."], ["N", "그와는 연락하지 않았다. 그도 연락하지 않았다. '다시 볼 일 없다'는 말을, 그는 정말로 지키고 있었다. 루카스는 그것이 그 사람다운 일이라고 생각했다. 정중하고, 순순하고, 남의 말을 끝까지 들어 주는."], ["N", "루카스는 그 점이 이상하게 화가 났다. 자기한테."], ["M", "선배님. 이번 주에도 야근하셨죠?"], ["L", "일이 많아서."], ["M", "선배님 작업 목록 제가 다 봐요. 이번 달 거 이미 다 끝내셨어요. 지금 4월 거 하고 계세요."], ["L", "미리 하면 좋잖아."], ["M", "...미리 하면 덜 아프세요?"], ["N", "루카스의 손이 멈췄다. 요나스를 보았다. 요나스는 이번엔 의자를 끌고 도망가지 않았다. 대신 휴대폰을 작업대 위에, 종이에서 두 걸음 떨어진 곳에 내려놓았다."], ["M", "이거 보세요. 제발요. 곰팡이 제거 석 달 해도 돼요."], ["N", "휴대폰 화면에 기사가 떠 있었다. 뉴욕의 미술 전문지. 휘트니 미술관 봄 전시 프리뷰. 제목이 있었다."], ["N", "'붉은 화가의 귀환 — 신작 연작 「Mostly」, 3월 2일 개막.'"], ["L", "......Mostly."], ["M", "'대부분'이요. 선배님 그 말 자주 하잖아요. '대부분은 됩니다.'"], ["N", "루카스는 기사를 읽었다. 천천히. 종이를 읽듯이."], ["N", "연작은 두 부분으로 되어 있다고 했다. 하나는 '쉬는 손' 서른 점. 지하 복원실에서 그린 연필 드로잉을 유화로 다시 옮긴 것. 다른 하나는 '다리' 여섯 점. 하이델베르크 옛 다리. 안개 속의 난간."], ["N", "그리고 기사 중간에 한 문단이 있었다."], ["N", "'이번 연작에는 인물의 얼굴이 단 한 번도 등장하지 않는다. 다리 연작의 중심에 서 있는 남자 역시 뒷모습이나 손만 그려졌다. 작가는 갤러리 측의 요청에도 불구하고 얼굴이 그려진 작품의 전시를 끝까지 거부했다고 한다. 이유를 묻자 작가는 이렇게 답했다. \"그 사람이 아직 허락하지 않았거든요.\"'"], ["L", "......"], ["N", "그리고 기사 맨 아래. 갤러리스트 다나 쿠퍼의 짧은 인터뷰."], ["D", "'전시가 끝나면 그는 작업실을 하이델베르크로 옮깁니다. 1월에 뉴욕에 돌아온 것도 그 정리 때문이었고요. 4층 작업실 짐 싸느라 고생 중이죠. 할아버지 스케치북을 지켜 준 도시로 간다는데, 제가 무슨 말을 하겠어요.'"], ["N", "루카스는 휴대폰을 내려놓았다. 아주 천천히. 종이를 내려놓듯이."], ["M", "...선배님?"], ["L", "......돌아가야 한다고 했어."], ["M", "네?"], ["L", "'돌아가야죠. 여기 계속 있을 순 없으니까.' 그렇게 들었어."], ["M", "짐 싸러 돌아가야 된다는 거였네요. 호텔에 계속 있을 순 없으니까."], ["N", "루카스는 대답하지 않았다. 대답할 수 없었다. 엘제 선생님이 언제부터 문간에 서 있었는지 몰랐다. 선생님은 아무 말도 하지 않았다. 다만 고개를 아주 조금 끄덕였다. 나머지 반쪽을 찾아온 그날처럼."], ["O", "...이별 편지가 아니었네."], ["L", "......"], ["O", "'봄에 돌아가겠소.' 기억나니?"], ["N", "루카스가 일어섰다. 의자가 뒤로 밀렸다. 복원실 바닥을 긁는 소리가 크게 났다. 루카스가 복원실에서 그런 소리를 낸 것은 15년 만에 처음이었다."], ["L", "선생님. 3월 첫 주, 휴가 쓰겠습니다."], ["O", "이유는?"], ["L", "......상태 확인입니다. 하르트만 스케치북. 1년에 한 번."], ["O", "아직 1년 안 됐잖니."], ["L", "곰팡이는 언제 생길지 모릅니다."], ["N", "엘제 선생님이 웃었다. 소리 내어. 요나스가 덩달아 웃었다. 루카스는 웃지 않았다. 대신 코트 주머니에서 털장갑을 꺼내, 일곱 주 만에 처음으로 끼었다."], ["H", "12장. 열한 시간"], ["N", "3월 1일. 프랑크푸르트 공항. 루카스는 알루미늄 가방 없이, 캐리어 하나만 들고 서 있었다."], ["N", "비행기 열한 시간. 버티는 것과 좋아하는 건 다르다고, 루카스는 여러 번 말했었다. 이번 열한 시간은 둘 다 아니었다. 그냥 가야 하는 것이었다."], ["N", "탑승 직전, 휴대폰을 꺼냈다. 연락처 맨 위의 이름. 메시지 창을 열었다. 마지막 메시지는 6주 전의 그것이었다."], ["P", "상자, 잘 보관할게요. 습도 50퍼센트에서. 지하 말고."], ["N", "루카스는 썼다. 지웠다. 다시 썼다. 지웠다. 비행기 문이 닫힌다는 방송이 나왔다."], ["N", "결국 아무것도 보내지 않았다. 대신 휴대폰을 끄고 탑승구로 걸어갔다."], ["N", "이번에는, 말로 하지 않기로 했다. 말은 늘 짧았고, 짧은 말은 늘 다르게 읽혔다. 이번에는 직접 가서 서 있기로 했다. 그 사람이 다리 위에 서 있었던 것처럼."], ["H", "13장. Mostly"], ["N", "3월 2일 저녁, 휘트니 미술관. 개막식이었다. 사람이 많았다. 너무 많았다. 샴페인 잔이 부딪히는 소리, 웃음소리, 카메라 셔터 소리."], ["N", "루카스는 입구에서 잠깐 걸음을 멈췄다. 숨을 한 번 골랐다. 습도 50퍼센트의 지하 복원실을 떠올렸다. 그리고 들어갔다."], ["N", "첫 번째 방. 벽 하나가 전부 손이었다. 서른 개의 캔버스가 격자로 걸려 있었다. 장갑을 벗은 손. 손난로를 쥔 손. 주걱을 막 내려놓은 손. 작업대 가장자리에 가만히 올려놓은 손."], ["N", "사람들이 그 앞에 서서 속삭이고 있었다. '누구 손일까.' '복원가래.' '손만 봐도 사람이 보여.'"], ["N", "루카스는 그 벽 앞에 서지 않았다. 설 수가 없었다. 대신 벽 옆의 작은 설명판을 보았다. 영어로 짧게 적혀 있었다."], ["N", "'Mostly. 대부분은 돌아옵니다. 천천히 말리고, 천천히 떼어 내면. — 한 복원가에게 배운 말.'"], ["L", "......"], ["R", "...아스카니엔 씨?"], ["N", "돌아보니 민디였다. 손에 샴페인 잔을 든 채 입을 벌리고 서 있었다."], ["R", "오셨어요? 진짜요? 아무도 몰랐어요. 그 사람도 몰라요. 그 사람 지금 저기서—"], ["L", "조용히 해 주십시오."], ["R", "...네."], ["L", "어디 있습니까."], ["R", "다음 방이요. 다리 그림 있는 방. 사람들한테 둘러싸여 있어요. 근데 하나만 말할게요. 그 사람 6주 동안 진짜 이상했어요. 그림은 미친 듯이 그리는데, 한 번도 안 웃었어요. 다나가 걱정돼서 매일 작업실 왔어요."], ["N", "루카스는 대답하지 않았다. 다음 방으로 걸어갔다."], ["N", "두 번째 방. 다리였다. 여섯 점. 안개, 강, 난간. 그리고 그 난간에 손을 얹은 뒷모습. 얼굴은 어디에도 없었다."], ["N", "방 한가운데, 사람들의 벽 너머로 붉은 머리가 보였다. 오늘은 하나로 묶고 있었다. 그런데도 무릎까지 내려와 있었다."], ["N", "그는 웃고 있었다. 평론가와, 수집가와, 기자와. 그런데 루카스는 알았다. 그게 서점 바닥에서 웃던 웃음이 아니라는 것을. 복원실 의자에서 웃음을 참던 얼굴도 아니라는 것을."], ["N", "루카스는 그 방 한구석, 여섯 번째 다리 그림 앞에 섰다. 난간 위의 장갑 낀 손. 그 그림 앞에서, 루카스는 습관처럼 손을 들어 올렸다. 그리고 그림 앞 난간 위에, 장갑 낀 손을 가만히 올려놓았다."], ["N", "5분이었다."], ["N", "사람들 사이에서 그가 고개를 돌린 것은, 그 5분이 다 되어 갈 무렵이었다. 왜 돌아봤는지 그도 몰랐다. 그냥, 방 한구석에서 익숙한 무언가를 느꼈다. 안개 속에서도 보이는 것처럼."], ["N", "그리고 그는 보았다. 자기 그림 앞에, 그림 속과 똑같은 자세로 서 있는 검은 머리를."], ["P", "......"], ["N", "그가 말을 하다 말고 멈췄다. 기자가 질문을 반복했다. 그는 듣지 못했다. 손에 든 샴페인 잔을 옆 사람에게 쥐여 주고, 사람들 사이를 빠져나왔다. 실례합니다, 한마디도 없이. 그 정중한 사람이."], ["N", "다나가 방 반대편에서 그것을 보았다. 그리고 웃으며 기자들 앞을 막아섰다."], ["D", "자, 질문은 저한테 하세요. 작가는 지금 상태 확인 중이에요."], ["H", "14장. 끝까지"], ["N", "그가 루카스 앞에 섰다. 두 걸음 떨어져서. 늘 그랬던 거리였다. 그는 그 이상 다가오지 않았다. 다가와도 되는지 몰라서."], ["P", "......루카스."], ["L", "......"], ["P", "여기 어떻게... 왜..."], ["L", "상태 확인입니다."], ["P", "네?"], ["L", "하르트만 스케치북. 1년에 한 번."], ["P", "...아직 1년 안 됐잖아요."], ["L", "곰팡이는 언제 생길지 모릅니다."], ["N", "그가 웃었다. 웃다가, 얼굴을 손으로 가렸다. 어깨가 떨렸다. 웃음인지 다른 것인지 루카스는 알 수 없었다. 아마 둘 다였다."], ["L", "...기사 봤습니다."], ["P", "......"], ["L", "하이델베르크로 옮긴다는 거. 1월에 돌아간 게 짐 싸러 간 거라는 거. 얼굴 그린 건 끝까지 안 걸었다는 거."], ["P", "...네."], ["L", "왜 말 안 했습니까."], ["P", "하려고 했어요. 그날 아침에. 근데 루카스가 다시 볼 일 없다고 했잖아요."], ["L", "그래도 했어야지요."], ["P", "......"], ["L", "당신은 남의 말을 너무 끝까지 듣습니다. 그래서 내 말도 끝까지 들었겠죠. '다시 볼 일 없다'까지. 그게 끝이 아니었는데."], ["N", "그가 손을 내리고 루카스를 보았다. 눈가가 붉었다. 머리카락처럼."], ["P", "그럼 끝이 뭐였어요?"], ["N", "루카스는 대답하려고 입을 열었다. 닫았다. 다시 열었다. 짧은 말을 고르는 버릇이 목에 걸렸다. 가장 짧고 정확한 말. 그런데 이번에는, 짧은 말로는 안 된다는 것을 루카스는 알았다. 짧은 말은 늘 다르게 읽혔다."], ["L", "......끝까지 안 듣는 건, 저입니다."], ["P", "네?"], ["L", "열아홉 살 때부터 그랬습니다. 반쪽만 읽고 판결합니다. 나머지 반쪽은 안 찾습니다. 찾았는데 진짜면, 그게 무서워서."], ["P", "......"], ["L", "그날 도서관에서도 그랬습니다. '돌아가야죠'까지 듣고 돌아섰습니다. 그 뒤를 들으면, 진짜로 돌아가는 사람일까 봐. 진짜로 제가 그냥 다리 위에 있던 무언가일까 봐."], ["N", "목소리가 흔들렸다. 루카스는 그것을 숨기지 않았다. 처음으로."], ["L", "그래서 미리 끝냈습니다. 제가 먼저. 그러면 덜 아플 줄 알았습니다."], ["P", "......덜 아팠어요?"], ["L", "......아니요."], ["N", "두 사람 사이가 조용해졌다. 방 저편의 소란이 아주 멀게 들렸다."], ["L", "당신이 다리에 두고 간 그림. 장갑만 있는 거. 거실 북쪽 벽에 걸었습니다. 습도 50퍼센트. 매일 확인합니다."], ["P", "......"], ["L", "매일 봤습니다. 다리에 없는 사람은 그릴 수 없다고 써 놓은 거. 6주 동안 매일."], ["N", "루카스는 장갑을 벗었다. 맨손이었다. 그 손을 그에게 내밀지는 않았다. 대신 두 사람 사이, 두 걸음의 거리 위에 가만히 들고 있었다."], ["L", "...다리에 다시 서 있어도 됩니까."], ["N", "그가 숨을 들이켰다."], ["L", "아침 일곱 시 오십오 분부터. 5분 말고. 더 길게."], ["N", "그는 대답 대신 한 걸음 다가왔다. 두 걸음이 한 걸음이 되었다. 루카스는 물러서지 않았다. 그는 그 맨손을 두 손으로 감쌌다. 크고 따뜻한 손이었다. 물감 자국이 군데군데 남아 있었다."], ["P", "......저는요, 루카스. 할 말이 너무 많아요. 6주 동안 메시지 백 개는 썼다가 지웠어요."], ["L", "다 하십시오."], ["P", "다요?"], ["L", "끝까지 듣겠습니다. 이번엔."], ["N", "그는 웃었다. 이번엔 진짜 웃음이었다. 서점 바닥에서, 복원실 의자에서, 관람차 앞에서 웃던 그 웃음."], ["P", "그럼 첫 번째부터요. ...루카라고 불러도 돼요?"], ["N", "루카스는 그를 올려다보았다. 3주가 지났다. 그리고 6주가 지났다. 오래 본 사람만 부르는 이름이라고 했었다. 몇 년씩 걸린다고. 그런데 이 사람은 그 몇 년을, 다리 위에서, 의자 위에서, 그리고 바다 건너에서 기다렸다."], ["L", "......불러 보십시오."], ["P", "루카."], ["N", "아주 조용한 목소리였다. 손바닥 위에 올려 보듯이. 루카스는 귀가 간지러웠다. 그런데 이번엔, 고개를 돌리지 않았다."], ["L", "......응."], ["N", "처음으로, 반말이었다. 그는 그 한 글자를 듣고 눈을 크게 떴다. 그리고 루카스의 손을 잡은 채 고개를 숙였다. 붉은 머리카락이 쏟아져 내렸다. 루카스는 그것을 한 손으로 붙잡아 주었다. 복원실에서 그랬던 것처럼."], ["N", "여섯 번째 다리 그림 앞이었다. 그림 속의 남자도 난간에 손을 얹고 있었다. 그런데 그림 밖의 남자는, 이제 혼자가 아니었다."], ["H", "15장. 수장고"], ["N", "그날 밤 열한 시. 개막식이 끝난 휘트니 미술관 지하, 작품 수장고."], ["N", "다나가 열쇠로 문을 열어 주었다. 그리고 들어가기 전에 루카스 앞에 멈춰 섰다. 하이힐을 신고도 루카스보다 조금 작았다."], ["D", "...아스카니엔 씨."], ["L", "네."], ["D", "12월에, 도서관에서. 제가 한 말 들으셨죠. '모델한테 언제부터 허락받았냐'고."], ["L", "......들었습니다."], ["D", "미안해요. 그 말은 제가 한 거지, 이 사람이 한 게 아니에요. 그 뒤에 이 사람이 뭐라고 했는지 아세요?"], ["L", "모릅니다. 거기서 돌아섰으니까요."], ["D", "'그 사람은 모델이 아니에요, 다나. 내가 다시 그릴 수 있게 해 준 사람이에요. 그러니까 그 사람한테 허락받는 건 당연한 거예요.'"], ["N", "루카스는 그를 돌아보았다. 그는 천장을 보며 귀를 붉히고 있었다. 머리카락보다 더."], ["D", "제가 그 문장을 크게 말했으면 좋았을 텐데요. 이 사람 목소리는 작아서."], ["L", "...아닙니다. 제가 끝까지 안 들은 겁니다."], ["D", "그럼 둘 다 반반 잘못한 걸로 해요. 저는 그 반반 위에 조금 더."], ["N", "다나는 그렇게 말하고 수장고 문을 열어 두고 복도로 나갔다. 문을 닫지 않았다. 습도를 걱정하는 사람이 있다는 것을 이제 알았으니까."], ["N", "수장고 안쪽, 벽에 기대 세워진 캔버스 하나. 천으로 덮여 있었다. 그가 그 앞에 섰다."], ["P", "이게 그거예요. 얼굴 그린 거."], ["L", "......"], ["P", "보여 줘도 돼요? 허락 없이 그린 거라서, 보여 주는 것도 허락받아야 할 것 같아서요."], ["N", "루카스는 잠깐 그를 보았다. 그리고 고개를 끄덕였다."], ["N", "천이 걷혔다. 다리 위였다. 안개 속. 난간에 손을 얹고, 강이 아니라 이쪽을 돌아보는 검은 머리의 남자. 막 무언가를 말하려는 얼굴이었다. 입술이 아주 조금 벌어져 있었다."], ["L", "...이건 언제입니까."], ["P", "첫날이요. 하이델베르크 온 첫날. 루카가 다리 끝에서 걸어오다가 저 보고 멈췄을 때. 그 얼굴이 너무 좋아서 그날 밤에 바로 그렸어요."], ["L", "......무슨 말을 하려는 얼굴입니까, 이건."], ["P", "그때 루카스가 '아침 여덟 시라고 했지, 일곱 시 반부터 서 있으라고는 안 했다'고 했어요."], ["L", "......그런 얼굴로 그런 말을 했습니까."], ["P", "네. ㅎㅎ 입은 그렇게 말하는데 얼굴은 반가워했어요. 그래서 그렸어요. 루카는 말이랑 얼굴이 자주 달라요."], ["N", "루카스는 그 그림을 오래 보았다. 자기가 모르는 자기 얼굴이었다. 이 사람만 알고 있던."], ["N", "그리고 코트 안쪽에서 무언가를 꺼냈다. 종이로 싸서 둥글게 만 것이었다. 비행기 열한 시간 동안 무릎 위에서 한 번도 내려놓지 않은 것."], ["L", "...이거. 친구 의뢰."], ["N", "그가 받아서 펼쳤다. 크리스마스 시장의 판화였다. 옛 다리와 성. 갈색 얼룩이 하나도 없었다. 종이가 처음 찍혔을 때처럼 하얬다."], ["P", "......폭스링."], ["L", "열두 개. 다 지웠습니다. 한 달 걸렸습니다."], ["N", "그는 판화를 들고 아무 말도 하지 못했다. 그러다 자기 코트 주머니에서 접힌 종이 한 장을 꺼냈다. 'Heidelberg' 상자 맨 위에 넣어 두었다가, 오늘 아침 왜인지 모르게 챙겨 나온 것."], ["N", "연필로 그린 빈 다리. 그리고 그 아래 작은 글씨. '폭스링 몇 개 남았어요?'"], ["P", "...이거 2월에 쓴 거예요. 못 보냈어요."], ["N", "루카스는 그 종이를 받아 들었다. 읽었다. 그리고 아주 짧게, 그러나 이번에는 다르게 읽히지 않을 만큼 분명하게 대답했다."], ["L", "0개."], ["P", "ㅎㅎ......네."], ["L", "그리고 다리 위에 아무도 없는 그림은 이제 그만 그려."], ["P", "......"], ["L", "거기 서 있을 거니까."], ["N", "그는 대답 대신 판화를 조심스럽게 다시 말았다. 루카스가 가르쳐 준 대로, 접지 않고. 그리고 그 판화와 연필 그림을 함께, 루카스의 코트 안쪽에 다시 넣어 주 const $=id=>document.getElementById(id);
const KEY='new take2-progress';
const steps=STORY.filter(s=>s[0]!=='H').length;
let pos=0,shown=0;   // pos: STORY 인덱스, shown: 보여 준 장면 수(제목 제외)

(()=>{const c=$('heart').getContext('2d'),m=['.##.##.','#######','#######','.#####.','..###..','...#...'];
  c.fillStyle='#fff';m.forEach((r,y)=>[...r].forEach((ch,x)=>ch==='#'&&c.fillRect(x,y,1,1)));})();

function build(s){
  const k=s[0],t=s[1];
  if(k==='H'){const e=document.createElement('div');e.className='chap';e.textContent=t;return e;}
  if(k==='N'){const e=document.createElement('div');e.className='nar';e.textContent=t;return e;}
  const who=k==='L'?'me':({K:'k',M:'m',O:'o',D:'d',R:'r'}[k]||'p'),e=document.createElement('div');
  e.className='msg'+(who==='me'?' me':'');
  const img=new Image();img.className='av';img.alt='';img.src=AV[who];
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;
  $('panel').replaceChildren();
  const c=document.createElement('div');c.className='cover';c.id='cover';
  c.innerHTML='<b>new take#2</b><span>하이델베르크, 반쪽만 읽은 편지.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span>';
  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
