<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take#4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#17110c; --ink:#21180f; --pink:#8f7149; --pink-soft:#eadfc9;
  --face:#d8cbb3; --hi:#f4ecdc; --lo:#8c7b62; --paper:#f3ece0;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(214,180,120,.14),transparent 70%) no-repeat var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#ece2cd;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:#c4a676;margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #5e4630}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#6d5d4a;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630;
  box-shadow:inset -1px -1px 0 #5e4630,inset 1px 1px 0 #c9ad84;margin-top:6px}
.nar{align-self:stretch;background:#ebe2d2;border:1px dashed #b3a184;padding:8px 10px;font-size:13px;line-height:1.55;color:#4a3d30;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a8d7c;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630}
.btn:disabled{color:#8f826f;text-shadow:none;cursor:default}
.btn.main:disabled{background:#bfa888}
.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.hint{font-size:12px;color:#a39580;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
</style>
</head>

const STORY=[["H", "프롤로그"], ["N", "8월 말, 하이델베르크. 루카스의 집, 아니, 이제 두 사람의 집. 습도계 다섯 개."], ["N", "아침 우편함에 편지가 한 통 들어 있었다. 두꺼운 크림색 봉투. 미국 우표. 그리고 수신인 란에, 반듯한 필기체로 적힌 이름."], ["N", "'루카스 아스카니엔 씨에게. 아버지의 스케치북을 고쳐 준 분.'"], ["N", "그의 이름이 아니었다. 루카스의 이름이었다."], ["L", "......이거 누구야."], ["P", "어? 이 글씨..."], ["N", "그가 봉투를 받아 들었다. 그리고 한참 동안 그 필기체를 내려다보았다. 표정이 천천히 굳었다."], ["P", "...엄마예요. 루스."], ["L", "......네 어머니가 나한테 편지를?"], ["P", "ㅎㅎ 저한테도 이메일만 쓰시는데요. 그것도 세 줄."], ["N", "루카스는 봉투를 열었다. 종이 칼로. 봉투 가장자리가 하나도 찢어지지 않도록. 안에서 편지지 두 장이 나왔다. 글씨가 아주 반듯했다. 줄 하나 기울지 않았다."], ["U", "'아스카니엔 씨. 루스 하르트만입니다. 아우구스트와 마거릿의 딸이고, 당신이 아는 그 아이의 어머니입니다.'"], ["U", "'부탁이 있어 편지를 씁니다. 어머니 마거릿은 3년 전에 돌아가셨습니다. 그리고 나에게 상자 하나를 남기셨습니다. 아버지가 결혼 50주년에 어머니에게 준 상자입니다. 안에 편지가 61통 들어 있습니다. 전부 독일어입니다.'"], ["U", "'아버지는 웃으면서 말했답니다. 독일어를 배우면 읽으라고. 어머니는 끝내 배우지 못했습니다. 나도 못 했습니다. 그리고 아버지가 돌아가신 뒤로는, 아무에게도 읽히기 싫었습니다. 번역가에게 맡기면 아버지의 말이 남의 서류가 될 것 같아서.'"], ["U", "'아들이 보내 준 사진으로 스케치북 마지막 장을 보았습니다. 내 어머니의 얼굴과, 그 아래 아버지의 독일어 한 줄. 당신이 그 풀을 떼어 냈다고 들었습니다. 80년 동안 아무도 못 본 것을.'"], ["U", "'9월 10일에 하이델베르크에 가겠습니다. 상자를 가지고. 그 편지들을 당신이 읽어 주었으면 합니다. 그리고 솔직히 말하면, 당신이 어떤 사람인지 보고 싶습니다. — 루스 하르트만.'"], ["N", "루카스는 편지를 내려놓았다. 아주 천천히. 그리고 그를 보았다. 그는 편지지 마지막 줄을 보고 있었다. '당신이 어떤 사람인지 보고 싶습니다.'"], ["P", "......엄마가 비행기를 탄대요. 혼자."], ["L", "......"], ["P", "아빠 돌아가시고 나서 보스턴 밖에 거의 안 나가셨어요. 저 이사 갈 때도 공항까지만 오셨어요."], ["N", "루카스는 대답하지 않았다. 대신 편지지를 다시 접어 봉투에 넣었다. 그리고 그것을 북쪽 벽 습도계 옆, 장갑 그림 아래 선반에 세워 두었다. 직사광선이 닿지 않는 자리에."], ["L", "...마지막 줄."], ["P", "네?"], ["L", "'어떤 사람인지 보고 싶다'. 그거 시험이야."], ["P", "ㅎㅎ 엄마는 원래 그런 식으로 말해요."], ["L", "그러니까 시험이라고."], ["N", "그날 밤, 그는 어머니와 영상통화를 했다. 루카스는 부엌에서 설거지를 하며 모르는 척 귀를 기울였다."], ["H", "1장. 루스"], ["U", "편지 받았다며? 아스카니엔 씨가."], ["P", "네. 루카가 받았어요."], ["U", "...'루카'."], ["N", "화면 너머의 여자가 그 이름을 따라 말했다. 짧게. 루카스는 접시를 씻던 손을 멈췄다."], ["U", "그 사람은 어떤 사람이니. 너 1년 동안 붓 못 잡았을 때, 다들 말렸는데도 독일로 간다고 했잖아. 작업실까지 옮기고."], ["P", "엄마, 그건—"], ["U", "나는 아직 그 사람 얼굴도 못 봤어. 사진 한 장 없어. 네가 그린 그림에는 손이랑 뒷모습뿐이고."], ["P", "그 사람이 사진 싫어해요."], ["U", "그러니까 어떤 사람이냐고 묻는 거야."], ["N", "그가 부엌 쪽을 돌아보았다. 루카스는 다시 접시를 씻고 있었다. 등을 돌린 채로."], ["P", "...와서 직접 봐요. 그럼 알아요."], ["U", "그래. 그러려고 가는 거야."], ["N", "통화가 끝났다. 거실이 조용해졌다. 루카스가 접시를 다 씻고 나왔다. 앞치마를 벗었다."], ["L", "...어머니가 날 싫어하셔."], ["P", "아니에요! 그냥 걱정이 많으신 거예요. 저 때문에요."], ["L", "당연한 거야."], ["P", "네?"], ["L", "아들이 1년 동안 그림 못 그리다가, 겨우 다시 그리기 시작했는데, 독일로 이사 간다고 했잖아. 처음 보는 남자 때문에. 나라도 싫어해."], ["P", "...루카 때문만은 아니라고 했어요."], ["L", "어머니 귀엔 그렇게 안 들렸겠지."], ["N", "루카스는 소파에 앉았다. 그리고 한참 동안 아무 말도 하지 않았다. 그는 옆에 앉아 기다렸다."], ["L", "......어머니는 뭘 좋아하셔."], ["P", "네?"], ["L", "음식. 차. 꽃. 뭘 좋아하시냐고."], ["P", "...루카, 지금 엄마 점수 따려고요?"], ["L", "점수 아니야. 손님이니까."], ["P", "ㅎㅎ 엄마는 홍차요. 우유 넣어서. 그리고 해바라기. 그리고... 아, 정리 안 된 집 싫어하세요."], ["N", "루카스가 거실을 둘러보았다. 책 상자 세 개가 아직 풀리지 않은 채 구석에 있었다. 그의 물감 튜브가 창틀에 굴러다녔다. 이젤 두 개가 벽에 기대어 있었다."], ["L", "......2주."], ["P", "ㅎㅎ 충분해요."], ["L", "아니. 모자라."], ["N", "다음 날부터 루카스는 출근 전 한 시간, 퇴근 후 세 시간을 집 정리에 썼다. 책 상자는 사흘 만에 풀렸다. 서가에 연도순으로 꽂혔다. 물감 튜브는 색상환 순서로 정리되었다. 그가 '남색이 어디 갔지' 하고 찾으면, 루카스가 '청록 다음, 보라 앞'이라고 대답했다."], ["N", "복원실에서 요나스가 물었다."], ["M", "선배님, 요즘 왜 이렇게 피곤해 보이세요?"], ["L", "집 정리."], ["M", "이사 끝난 지 석 달 됐잖아요."], ["L", "...손님 와."], ["M", "누구요?"], ["L", "그 사람 어머니."], ["N", "요나스가 핀셋을 떨어뜨렸다. 엘제 선생님이 반대편 작업대에서 고개를 들었다. 그리고 아주 천천히, 웃었다."], ["O", "...시험이구나."], ["L", "시험 아닙니다."], ["O", "시험이야. 나도 남편 어머니 처음 만날 때 일주일 동안 부엌 타일 줄눈을 칫솔로 닦았어."], ["L", "......줄눈은 이미 닦았습니다."], ["N", "엘제 선생님이 소리 내어 웃었다. 요나스는 웃음을 참느라 얼굴이 빨개졌다."], ["H", "2장. 9월 10일"], ["N", "9월 10일, 프랑크푸르트 공항. 오후 두 시."], ["N", "루카스는 입국장 앞에 서 있었다. 검은 셔츠. 단추는 맨 위까지. 손에는 해바라기 한 다발. 그가 옆에서 몇 번이나 셔츠 맨 위 단추를 풀어 주려 했다. 루카스는 그때마다 다시 채웠다."], ["P", "루카, 숨 막혀 보여요."], ["L", "괜찮아."], ["P", "엄마 안 잡아먹어요. ㅎㅎ"], ["L", "알아."], ["P", "그럼 왜 해바라기를 그렇게 꽉 쥐고 있어요? 줄기 부러지겠어요."], ["N", "루카스가 손을 내려다보았다. 줄기를 쥔 손가락이 하얗게 질려 있었다. 오른손이었다. 흉터가 있는 손목. 루카스는 아무 말 없이 꽃을 왼손으로 옮겨 쥐었다."], ["N", "입국장 문이 열렸다. 사람들이 쏟아져 나왔다. 그 사이로 한 여자가 걸어 나왔다. 일흔을 넘긴 나이. 은발을 단정하게 틀어 올렸다. 회색 트렌치코트. 그리고 두 손에, 나무 상자 하나를 안고 있었다. 캐리어는 공항 직원이 끌고 있었다."], ["N", "여자는 그를 발견했다. 표정이 아주 조금 풀렸다. 그리고 그 옆의 루카스를 보았다. 표정이 다시 정돈되었다."], ["P", "엄마!"], ["U", "그래. 머리 또 길었구나."], ["P", "ㅎㅎ 안 잘라요."], ["U", "안다."], ["N", "루스는 아들을 한 팔로 짧게 안았다. 다른 팔로는 나무 상자를 놓지 않았다. 그리고 루카스 앞에 섰다. 키는 루카스와 비슷했다. 눈높이가 정확히 맞았다."], ["U", "...아스카니엔 씨."], ["L", "루카스 아스카니엔입니다. 먼 길 오셨습니다."], ["N", "루카스가 해바라기를 내밀었다. 루스는 그것을 받아 들었다. 꽃을 보았다. 그리고 루카스를 보았다."], ["U", "해바라기는 누가 알려 줬죠?"], ["L", "......"], ["P", "제가요. ㅎㅎ"], ["U", "그럴 줄 알았어요."], ["N", "루스는 그 말만 하고 꽃을 아들에게 넘겼다. 그리고 다시 나무 상자를 두 팔로 안았다. 루카스는 그 상자를 보았다. 오래된 호두나무. 모서리가 닳아 둥글어져 있었다. 뚜껑에 작은 놋쇠 경첩."], ["L", "...상자, 제가 들까요."], ["U", "아니요. 이건 내가 들어요."], ["L", "그럼 하나만. 그 상자, 비행기 화물칸에 안 넣으셨습니까."], ["U", "...무릎 위에 안고 왔어요. 일곱 시간 반."], ["L", "잘하셨습니다. 화물칸은 습도가 10퍼센트 아래로 떨어집니다. 종이가 갈라집니다."], ["N", "루스가 처음으로 루카스를 제대로 보았다. 몇 초 동안. 그리고 아무 말 없이 걷기 시작했다."], ["N", "기차 안. 하이델베르크까지 한 시간. 루스는 창가에 앉아 상자를 무릎에 올려놓고 있었다. 그가 맞은편에서 이것저것 말을 걸었다. 루스는 짧게 대답했다. 루카스는 통로 쪽에 앉아 아무 말도 하지 않았다."], ["N", "기차가 네카어강을 따라 달리기 시작했을 때, 루스가 창밖을 보며 말했다."], ["U", "...아버지가 이 강 얘기를 딱 한 번 했어요. 내가 열 살 때."], ["P", "뭐라고 하셨어요?"], ["U", "'강이 도시를 가르는데, 다리가 다시 붙여 준다.' 그게 다였어요. 더 물어보니까 그림 그리러 작업실로 들어가 버렸어요."], ["N", "루카스는 창밖을 보았다. 강. 그리고 멀리, 옛 다리."], ["L", "......저 다리입니다."], ["U", "네?"], ["L", "아버님이 그리신 다리. 지금 왼쪽에 보이는 거."], ["N", "루스는 창에 얼굴을 가까이 댔다. 기차가 다리 옆을 지나는 동안, 그녀는 숨을 쉬지 않는 것 같았다. 다리가 시야에서 사라질 때까지."], ["U", "......생각보다 작네요."], ["L", "네. 다들 그렇게 말합니다."], ["U", "아버지 그림에선 훨씬 컸는데."], ["L", "그림 속 다리는 아버님이 보신 크기였을 겁니다. 떠나기 전에."], ["N", "루스가 루카스를 돌아보았다. 이번에는 몇 초보다 더 오래."], ["H", "3장. 첫 번째 편지"], ["N", "그날 저녁. 두 사람의 집. 루스는 소파에 앉아 거실을 둘러보았다. 연도순으로 꽂힌 책. 색상환 순서로 정리된 물감. 벽에 걸린 습도계 다섯 개. 북쪽 벽의 장갑 그림."], ["U", "...정리를 잘하시네요."], ["L", "2주 했습니다."], ["P", "ㅎㅎ 루카!"], ["L", "사실이잖아."], ["N", "루스의 입꼬리가 아주 조금 움직였다. 그는 그것을 보았다. 엄마가 웃음을 참을 때의 얼굴이었다."], ["N", "우유를 넣은 홍차가 나왔다. 루카스가 우려낸 것이었다. 정확히 4분. 우유는 차를 따른 다음에. 루스는 한 모금 마시고 잔을 내려놓았다. 아무 말도 하지 않았다. 그리고 한 모금 더 마셨다."], ["U", "...그럼, 시작할까요."], ["N", "루스가 나무 상자의 뚜껑을 열었다. 경첩이 작게 삐걱거렸다. 안에는 편지 봉투들이 날짜순으로 빼곡히 서 있었다. 누렇게 바랜 것부터, 조금 덜 바랜 것까지. 61통."], ["N", "맨 앞의 봉투. 루카스는 장갑을 꼈다. 그리고 봉투를 들어 빛에 비춰 보았다. 1937년 10월. 독일어 필기체. 스케치북 마지막 장의 그 글씨였다."], ["L", "...보관 상태가 좋습니다."], ["U", "어머니가 35년 동안 침대 옆 서랍에 두셨어요. 아무도 못 만지게 하셨어요. 나도."], ["L", "그러니까 좋은 겁니다. 아무도 안 만지면 종이는 오래 갑니다."], ["N", "루카스는 첫 번째 편지를 펼쳤다. 한 장. 짧았다. 읽었다. 눈으로 먼저. 그리고 잠깐 멈췄다."], ["U", "...뭐라고 써 있죠?"], ["L", "......그대로 읽겠습니다. 제 말 말고, 아버님 말로."], ["N", "루카스가 목소리를 냈다. 낮고 정확한 목소리로. 독일어를 영어로 옮기며."], ["L", "'마거릿. 오늘 당신이 내 영어를 고쳐 주었소. 내가 I am fine이라고 했더니, 당신이 I am well이라고 해야 한다고 했지. 그런데 나는 fine하지도 well하지도 않소. 당신이 웃으면, 나는 숨 쉬는 법을 잊소.'"], ["L", "'이걸 영어로 말할 줄 모르오. 독일어로도 말로는 못 하겠소. 그래서 쓰오. 그리고 이 편지는 부치지 않겠소. 당신이 독일어를 모르니, 부쳐도 읽지 못할 테지. 그래서 안심이 되오. — A.'"], ["N", "거실이 조용해졌다."], ["N", "루스는 찻잔을 두 손으로 감싸 쥔 채 앉아 있었다. 얼굴에 아무 표정도 없었다. 그런데 찻잔이 아주 조금 떨렸다."], ["U", "......그 사람이요?"], ["P", "엄마?"], ["U", "아버지가. 숨 쉬는 법을 잊는다고. 그 사람이."], ["N", "그녀의 목소리가 처음으로 흔들렸다."], ["U", "우리 아버지는 평생 '사랑한다'는 말을 한 번도 안 했어요. 어머니한테도, 나한테도. 생일엔 카드 대신 그림 한 장. 졸업식엔 악수. 어머니가 돌아가실 때도 그 사람은... 아, 아니다. 아버지가 먼저 가셨지."], ["N", "루스는 찻잔을 내려놓았다. 그리고 루카스를 보았다."], ["U", "...그런 사람이 이걸 썼다고요."], ["L", "......네."], ["U", "말로는 못 해서."], ["L", "네."], ["N", "루스는 루카스를 오래 보았다. 루카스는 그 시선을 피하지 않았다. 그리고 루스는, 무언가를 알아본 얼굴이 되었다."], ["U", "...당신도 그렇죠."], ["L", "......"], ["U", "말로는 못 하는 사람."], ["N", "루카스는 대답하지 않았다. 그것이 대답이었다. 루스는 그것을 알아들었다. 그런 아버지와 60년 넘게 산 딸이었으니까."], ["H", "4장. 저녁 식탁"], ["N", "둘째 날 저녁. 루스는 두 사람의 집에서 저녁을 먹기로 했다. 그가 고집을 부렸다. 호텔 레스토랑 말고, 집에서."], ["N", "부엌에는 그가 서 있었다. 감자 그라탱과 구운 연어. 그가 하이델베르크에 와서 배운 몇 안 되는 요리였다. 루카스는 그 옆에서 샐러드를 담당했다. 오이를 정확히 3밀리미터 두께로 썰고 있었다."], ["U", "...루카스 씨는 요리 안 해요?"], ["P", "ㅎㅎ 루카는 계란 담당이에요. 근데 맨날 태워요."], ["L", "탄 데가 맛있다며."], ["P", "그건 제가 한 말이죠."], ["N", "루스는 식탁에 앉아 두 사람의 등을 보았다. 좁은 부엌에서 두 사람이 서로 부딪히지 않고 움직였다. 그가 오븐을 열면 루카스가 반 걸음 옆으로 비켜섰다. 루카스가 냉장고를 열면 그가 고개를 숙여 찬장 문을 피했다. 말 한마디 없이."], ["N", "루스는 그것을 오래 보았다. 아무 말도 하지 않았다."], ["N", "식사가 시작되었다. 그가 대부분 말을 했다. 뉴욕 얘기, 다나 얘기, 도쿄 얘기. 루카스는 거의 말하지 않았다. 다만 루스의 접시가 비면 연어를 한 조각 더 얹었다. 물잔이 반쯤 비면 채웠다. 아무 말 없이."], ["U", "......루카스 씨."], ["L", "네."], ["U", "그 셔츠요."], ["N", "루스가 아들을 가리켰다. 그는 흰 리넨 셔츠를 입고 있었다. 부드러워진 리넨. 단추 서른네 개. 몇 개는 실이 풀렸다가 다시 꿰매어져 있었다."], ["U", "저 셔츠 단추가 몇 개예요? 아까 보니까 끝이 없던데."], ["P", "서른네 개요. ㅎㅎ"], ["U", "그걸 매일 아침 혼자 채우니? 너 원래 단추 많은 옷 싫어하잖아."], ["P", "아뇨, 제가 안 채워요."], ["N", "그가 루카스를 보았다. 루카스는 샐러드를 보고 있었다. 오이 한 조각을 포크로 정확히 반으로 가르고 있었다."], ["P", "루카가 채워요. 매일 아침."], ["U", "......"], ["P", "올해 초에 루카가 손목을 다쳤어요. 수술했어요. 손가락 재활에 단추 채우기가 좋대서, 제가 도쿄에서 이거 사 왔어요. 처음엔 한 시간 넘게 걸렸어요. 지금은 3분이요."], ["U", "...손목을요?"], ["N", "루스가 루카스의 오른손을 보았다. 포크를 쥔 손. 손목 안쪽의 작은 흉터."], ["U", "어쩌다가요."], ["L", "......책 옮기다가. 얼음에 미끄러졌습니다."], ["P", "5백 년 된 책이요. 루카가 끌어안고 넘어져서 책은 멀쩡했어요. 손목만 부러졌어요."], ["L", "그 얘긴 안 해도 돼."], ["P", "왜요? 멋있잖아요."], ["L", "안 멋있어."], ["N", "루스는 두 사람의 대화를 들었다. 그리고 아들의 셔츠를 보았다. 서른네 개의 단추. 하나도 엇갈리지 않은."], ["U", "...다 나았으면, 이제 혼자 채워도 되잖아."], ["P", "네. ㅎㅎ 근데 루카가 계속 채우겠대요."], ["U", "......"], ["P", "저도 계속 입을 거예요. 다 해지면 똑같은 거 또 사러 도쿄 가기로 했어요. 둘이."], ["N", "루카스가 포크를 내려놓았다. 일어섰다. 빈 접시들을 모았다."], ["L", "...설거지 할게."], ["N", "루스는 부엌으로 가는 루카스의 뒷모습을 보았다. 귀 끝이 붉었다. 목덜미까지."], ["N", "그날 밤 호텔로 돌아가는 택시 안에서, 루스는 창밖의 강을 보며 생각했다. 아버지는 어머니의 코트 단추를 채워 준 적이 있었던가. 기억나지 않았다. 그런데 어머니가 늙어 손이 떨리던 마지막 몇 년, 아버지는 매일 아침 어머니의 머리를 빗겨 주었다. 아무 말 없이. 그건 기억났다."], ["N", "루스는 그게 무슨 뜻이었는지, 그날 밤에야 처음으로 생각해 보았다."], ["H", "5장. 하루 열 통"], ["N", "다음 날부터, 하루 열 통씩 읽기로 했다. 루스가 정한 것이었다. 61통을 한 번에 들으면 버틸 수 없을 것 같다고."], ["N", "장소는 복원실이었다. 루카스가 정한 것이었다. 습도 50퍼센트. 직사광선 없음. 그리고 편지를 펼칠 수 있는 넓은 작업대."], ["O", "어서 오세요. 손은요?"], ["U", "...손이요?"], ["O", "씻으셨냐고요. 여기선 다들 그래요."], ["N", "루스는 잠깐 엘제 선생님을 보다가, 세면대로 갔다. 손목까지, 비누 두 번. 그가 옆에서 웃음을 참았다. 루스가 그를 흘겨보았다."], ["U", "너도 했니, 처음에?"], ["P", "ㅎㅎ 뉴욕에서요. 첫날부터."], ["U", "......그 사람이 시켰니?"], ["P", "네. 엄청 무섭게요."], ["N", "루스는 작업대에서 두 걸음 떨어진 의자에 앉았다. 루카스가 미리 놓아 둔 의자였다. 그 옆에 의자가 하나 더 있었다. 그가 앉았다."], ["N", "루카스가 편지를 펼쳤다. 그리고 읽었다. 하루 열 통. 1937년. 1938년. 1939년."], ["L", "'마거릿. 오늘 당신 아버지가 나를 보고 독일 놈이라고 했소. 당신은 아버지에게 소리를 질렀지. 나는 아무 말도 못 했소. 당신이 나 대신 싸우는 걸 보면서, 나는 처음으로 이 나라에 남아도 되겠다고 생각했소.'"], ["L", "'마거릿. 오늘 고향에서 편지가 왔소. 어머니가 돌아오라고 하오. 나는 답장을 쓰다가 찢었소. 세 번. 네 번째는 쓰지 않았소. 그날 저녁 당신이 사과 파이를 구웠지. 나는 두 조각을 먹었소. 그게 내 답장이었소.'"], ["L", "'마거릿. 전쟁이 시작되었소. 나는 이제 돌아갈 수 없소. 돌아갈 곳이 없어졌소. 그런데 이상하오. 슬프지가 않소. 당신이 있는 곳이, 이제 내가 돌아갈 곳이오.'"], ["N", "루스는 의자에 앉아 들었다. 아무 말도 하지 않았다. 손수건을 쥐고 있었지만 쓰지 않았다. 하루 열 통이 끝나면 '고마워요' 한마디를 하고 일어났다. 그리고 호텔로 돌아갔다. 그가 바래다주겠다고 해도 혼자 갔다."], ["N", "사흘째 저녁. 그가 루카스에게 말했다."], ["P", "...엄마가 우는 거 한 번도 못 봤어요. 아빠 장례식에서도."], ["L", "......"], ["P", "근데 매일 저녁 호텔 돌아가실 때 눈이 빨개요. 혼자 우시는 거예요."], ["L", "아버님 닮으셨네."], ["P", "ㅎㅎ 네. 할아버지 딸이에요."], ["N", "나흘째. 1945년의 편지들. 루카스가 스물세 번째 봉투를 열었다. 그리고 첫 줄을 읽고, 멈췄다."], ["U", "...왜요?"], ["L", "......이건, 어머님 얘기입니다."], ["N", "루스의 손이 손수건을 꽉 쥐었다."], ["L", "'마거릿. 딸이 태어났소. 당신 머리색을 닮았소. 이름을 루스라고 하자고 한 건 당신이었지. 나는 성경을 잘 모르오. 그래서 오늘 밤 찾아보았소.'"], ["L", "'룻기 1장 16절. 당신이 가는 곳에 나도 가고, 당신이 머무는 곳에 나도 머물겠다. 당신 백성이 내 백성이 되고.'"], ["L", "'마거릿. 당신은 이 이름을 우리 딸에게 주면서, 나한테 대답한 거요. 내가 이 나라에 머무는 것에 대해. 나는 오늘 처음으로 울었소. 이 나라에 와서. 딸이 내 손가락을 쥐었을 때.'"], ["N", "복원실이 조용해졌다. 엘제 선생님이 반대편 작업대에서 핀셋을 내려놓았다. 요나스는 이미 고개를 숙이고 있었다."], ["N", "루스가 손수건을 들었다. 처음으로. 그리고 얼굴을 가렸다. 어깨가 떨렸다. 소리는 없었다. 아버지처럼."], ["N", "그가 의자에서 일어나 어머니 옆으로 갔다. 루스는 아들의 팔을 잡았다. 꽉."], ["U", "......내 이름 뜻, 어머니가 말해 준 적 있어. 근데 아버지가 이렇게 생각한 줄은 몰랐어. 아버지는 그냥 '좋은 이름이다'라고만 했어. 그게 다였어."], ["P", "......"], ["U", "평생 그 사람이 나를 어떻게 생각하는지 몰랐어. 화가 났다가, 포기했다가. 그런데 여기 다 있었네. 독일어로. 서랍 속에."], ["N", "루카스는 편지를 작업대 위에 내려놓았다. 장갑 낀 손으로, 아주 조심스럽게. 그리고 아무 말도 하지 않았다."], ["N", "그날, 루스는 열 통을 다 듣지 못했다. 스물세 번째에서 멈췄다. 그리고 처음으로, 아들에게 호텔까지 바래다 달라고 했다."], ["H", "6장. 벤치"], ["N", "엿새째 오후. 편지 열 통이 끝나고, 루카스는 요나스와 다음 날 코덱스 작업을 의논하러 서고로 내려갔다. 그는 다나와 통화가 길어졌다."], ["N", "도서관 안뜰 벤치. 루스가 혼자 앉아 있었다. 엘제 선생님이 보온병을 들고 와서 그 옆에 앉았다."], ["O", "홍차예요. 우유 넣은. 루카스가 아침에 타 놓고 갔어요. 어머님 드리라고."], ["U", "...그 사람이요?"], ["O", "네. 4분 우리고, 우유는 나중에. 정확하게. 그 애는 차도 복원하듯이 타요."], ["N", "루스가 웃으며 잔을 받았다. 한 모금. 그리고 오래 잔을 들고 있었다."], ["U", "...15년 동안 가르치셨다고 들었어요."], ["O", "열아홉 살 때부터요. 처음 왔을 때 말 한마디 안 했어요. 석 달 동안 '네', '아니요', '알겠습니다'만 했어요."], ["U", "ㅎㅎ 우리 아버지 같네요."], ["O", "그런데 손이 좋았어요. 첫날 금박을 옮기는데, 한 번도 안 떨더라고요. 그래서 알았어요. 이 애는 말 대신 손으로 사는 애구나."], ["N", "루스는 차를 마셨다. 그리고 낮게 말했다."], ["U", "...저는 그런 사람이 무서워요. 말 대신 손으로 사는 사람."], ["O", "왜요?"], ["U", "아버지가 그랬으니까요. 평생. 저는 아버지가 저를 사랑하는지 몰랐어요. 오늘 이 편지들 듣기 전까지. 일흔이 넘어서야 알았어요."], ["N", "엘제 선생님은 대답하지 않았다. 기다렸다. 루카스를 15년 동안 기다렸듯이."], ["U", "그래서 그 애가 그 사람이랑 산다고 했을 때, 반대했어요. 말이 짧은 사람이라고 그 애가 그러더라고요. 근데 손이 정확하다고. 아버지랑 똑같은 말이었어요. 어머니가 아버지를 그렇게 소개했대요."], ["O", "......"], ["U", "그 애가 우리 어머니처럼 평생 모르고 살까 봐. 사랑받는지 아닌지. 그게 무서웠어요."], ["N", "엘제 선생님은 보온병 뚜껑을 닫았다. 그리고 안뜰 너머, 도서관 지하 창문 쪽을 보았다."], ["O", "...어머님. 루카스가 올해 뭘 했는지 아세요?"], ["U", "손목 다친 거요? 들었어요."], ["O", "그거 말고. 그 애가 올봄에 저한테 처음으로 '무섭다'고 했어요. 15년 만에 처음. 그리고 그 사람한테는 그보다 먼저 말했대요. 전화로. 한밤중에."], ["U", "......"], ["O", "작년 3월엔 비행기를 탔어요. 혼자. 열한 시간. 그 애가 제일 싫어하는 거. 그 사람 전시 보러. 아무한테도 말 안 하고."], ["O", "그리고 지난주엔, 퇴근하면서 저한테 물었어요. '선생님, 미국 사람들은 처음 만나는 어른한테 뭘 선물합니까.' 그 애가 선물을 물어본 건 처음이에요. 결국 해바라기를 샀다고 하더군요."], ["N", "루스는 들고 있던 잔을 내려다보았다. 홍차가 반쯤 남아 있었다. 4분 우린, 우유를 나중에 넣은."], ["O", "어머님 아버님은 편지를 서랍에 넣으셨어요. 그 애는... 서랍이 없어요. 그 사람이 다 열어 놨거든요. 서점 바닥에서부터."], ["U", "......서점 바닥이요?"], ["O", "그 얘긴 그 사람한테 들으세요. 저는 들을 때마다 웃어서."], ["N", "루스는 웃지 않았다. 대신 남은 홍차를 천천히 다 마셨다. 그리고 빈 잔을 엘제 선생님에게 돌려주며 말했다."], ["U", "...맛있다고 전해 주세요."], ["O", "직접 하세요. 그 애는 그 말 들으면 귀가 빨개져요. 보는 재미가 있어요."], ["H", "7장. 질문"], ["N", "일주일째. 서른 통을 넘겼다. 1960년대. 1970년대. 편지는 점점 짧아졌다. 아우구스트가 나이를 먹어 가는 것이 글씨에서 보였다."], ["N", "그날 저녁, 그가 다나와 통화하러 잠깐 나간 사이였다. 복원실에는 루스와 루카스, 둘만 남았다. 루카스는 편지를 봉투에 다시 넣고 있었다."], ["U", "아스카니엔 씨."], ["L", "네."], ["U", "하나 물어봐도 될까요."], ["L", "......네."], ["N", "루스는 의자에서 일어나지 않았다. 작업대에서 두 걸음. 그 거리에서 루카스를 똑바로 보았다."], ["U", "그 애는 당신 때문에 뉴욕을 떠났어요. 작업실을 옮겼고, 갤러리랑 계약을 다시 했고, 친구들을 두고 왔어요. 보스턴에 있는 나한테서도 더 멀어졌고요."], ["L", "......"], ["U", "당신은 그 애를 위해 뭘 포기했죠?"], ["N", "루카스의 손이 봉투 위에서 멈췄다."], ["U", "비난하는 게 아니에요. 진짜로 궁금해서요. 내 아버지는 어머니를 위해 나라를 포기했어요. 고향을, 언어를, 어머니를. 그런데 당신은 여기 그대로 있잖아요. 당신 도시, 당신 일, 당신 집."], ["N", "루카스는 대답하지 않았다. 대답할 수 없었다. 질문이 옳았으니까."], ["N", "그는 아무것도 포기하지 않았다. 다리를 건너 출근하고, 같은 복원실에서, 같은 핀셋을 들었다. 그 사람이 바다를 건너오는 동안. 루카스는 그 사실을 한 번도 그렇게 생각해 본 적이 없었다."], ["U", "...대답 안 해도 돼요. 미안해요. 내가 너무 나갔네."], ["L", "아닙니다."], ["N", "루카스가 봉투를 내려놓았다. 상자에 넣었다. 뚜껑을 닫았다."], ["L", "......대답할 게 없습니다. 그래서 대답 못 하는 겁니다."], ["N", "루스는 그 대답을 들었다. 그리고 아무 말도 하지 않았다. 그가 문을 열고 들어왔다. 두 사람의 얼굴을 번갈아 보았다. 공기가 달라져 있었다."], ["P", "...무슨 일 있었어요?"], ["U", "아니. 아무 일도."], ["L", "......아무 일도."], ["H", "8장. 엄마와 아들"], ["N", "그날 밤 열 시. 루스의 호텔 방. 그가 노크를 했다. 어머니가 문자를 보냈다. '잠깐 와.'"], ["N", "루스는 창가 의자에 앉아 있었다. 창밖으로 다리가 보였다. 불이 켜진 옛 다리."], ["U", "앉아."], ["P", "...무슨 일이에요? 루카가 그러는데 아무 일도 없었다던데."], ["U", "있었어. 내가 그 사람한테 심한 질문을 했어."], ["N", "그가 멈췄다. 루스는 아들을 똑바로 보았다."], ["U", "너를 위해 뭘 포기했냐고 물었어."], ["P", "......엄마."], ["U", "알아. 나도 하고 나서 알았어. 그 사람 얼굴이... 아버지가 내 방 앞에 서 있던 얼굴이랑 똑같았어. 할 말이 너무 많은데 하나도 못 하는 얼굴."], ["N", "그는 침대 끝에 앉았다. 무릎 위에 손을 얹었다. 혼날 준비를 한 아이처럼. 그런데 혼나는 건 그가 아니었다."], ["P", "...루카는 아무것도 포기 안 했어요. 맞아요."], ["U", "그래."], ["P", "근데 엄마, 저도 아무것도 포기 안 했어요."], ["U", "...뭐?"], ["P", "뉴욕 작업실, 갤러리, 친구들. 그거 포기한 거 아니에요. 그냥 들고 왔어요. 다나는 매일 전화하고, 민디는 두 달에 한 번 와요. 작업실은 4층에서 3층으로 바뀌었을 뿐이에요."], ["N", "루스는 아들을 보았다. 아들은 웃고 있었다. 그런데 눈은 진지했다."], ["P", "제가 포기한 건 하나밖에 없어요. 붓 못 잡던 1년. 그거요. 루카가 그거 가져갔어요. 대신 다른 거 줬어요."], ["U", "......뭘?"], ["P", "기다리는 거요. 제가 원래 제일 못하던 거. 저는 그림 안 되면 밤새 붙잡고 있었잖아요. 루카는 안 그래요. 종이가 싫다고 하면 멈춰요. 내일 다시 해요. 그거 배웠어요."], ["N", "창밖의 다리. 불빛이 강물에 흔들렸다."], ["U", "...엄마는 무서웠어. 네가 아버지 같은 사람이랑 살까 봐. 말 한마디 없이 평생. 네 할머니처럼."], ["P", "ㅎㅎ 할머니 행복하셨잖아요."], ["U", "...그랬지. 그런데 몰랐잖아. 이 편지들 없었으면, 할아버지가 무슨 생각했는지 평생."], ["P", "루카는 말해요, 엄마."], ["U", "......"], ["P", "늦게요. 그리고 길게요. 처음엔 한 마디였어요. '아직'. 그 다음엔 '응'. 그 다음엔 '무서워'. 그 다음엔 '여기 살아'. 1년 반 걸렸어요. 근데 할아버지는 그거 50년 걸렸잖아요. 그것도 독일어로."], ["N", "루스가 웃었다. 울음 섞인 웃음이었다."], ["U", "...너 아버지 닮았다, 그런 거 보면."], ["P", "아빠요?"], ["U", "그래. 너희 아빠도 나 기다렸어. 내가 아버지 때문에 사람 못 믿을 때. 3년. 아무 말 없이 매주 일요일에 꽃 한 송이씩 들고 왔어. 해바라기."], ["N", "그가 눈을 크게 떴다."], ["P", "......그래서 해바라기 좋아하는 거예요?"], ["U", "몰랐니?"], ["P", "몰랐어요. 그냥 엄마가 좋아하는 꽃이라고만."], ["U", "그 사람한테 해바라기 사라고 한 거, 너였지?"], ["P", "ㅎㅎ 네."], ["U", "그 사람이 공항에서 그 꽃 들고 서 있는데. 줄기를 너무 꽉 쥐어서 손가락이 하얬어. 그거 보고 알았어. 아, 너희 아빠 같은 사람이구나."], ["N", "그는 아무 말도 하지 못했다. 루스는 창밖의 다리를 보았다."], ["U", "...내일 아침에 그 사람한테 사과할게."], ["P", "엄마, 루카는 사과 안 받아요. ㅎㅎ 아마 '아닙니다' 할 거예요."], ["U", "그럼 다르게 하지 뭐. 홍차 맛있다고 할게. 엘제 선생님이 그러던데, 그 말 하면 귀가 빨개진다며."], ["N", "그날 밤 그가 집에 돌아왔을 때, 루카스는 침대에 누워 천장을 보고 있었다. 잠들지 않은 채로. 그는 그 옆에 누웠다. 아무것도 묻지 않았다. 다만 루카스의 오른손을 찾아 가만히 잡았다. 흉터가 있는 손목을 엄지로 한 번 쓸고, 그대로."], ["N", "그는 곧 잠들었다. 무릎까지 오는 붉은 머리가 베개 위로, 침대 아래로 쏟아져 있었다. 잠든 뒤에도 손은 놓지 않았다."], ["N", "루카스는 천장을 보았다. '당신은 그 애를 위해 뭘 포기했죠?' 그 질문이 머릿속에서 계속 되풀이되었다. 반쪽만 읽고 판결하는 버릇이 다시 고개를 들었다. 나는 받기만 했다. 그 사람은 다 놓고 왔는데. 나는 아무것도."], ["N", "루카스는 그 판결을 내리려다가, 멈췄다. 엘제 선생님의 목소리가 떠올랐다. '넌 끝까지 안 들어.'"], ["N", "그래서 이번엔, 끝까지 생각해 보기로 했다. 잡힌 손을 빼지 않은 채로. 밤새."], ["H", "9장. 크레용"], ["N", "다음 날 아침 일곱 시. 루스가 묵는 호텔 로비. 루스는 창가 테이블에서 홍차를 마시고 있었다. 우유를 넣어서. 그리고 루카스가 로비로 들어오는 것을 보고, 잔을 내려놓았다."], ["U", "...아스카니엔 씨. 이 시간에?"], ["L", "다리 가기 전입니다. 5분만 시간 주시겠습니까."], ["U", "...앉아요."], ["N", "루카스는 맞은편에 앉았다. 손에 중성지 폴더 하나를 들고 있었다. 그것을 테이블 위에 놓았다. 그리고 루스 쪽으로 밀었다."], ["L", "열어 보십시오."], ["N", "루스가 폴더를 열었다. 그리고 그대로 굳었다."], ["N", "크레용 그림이었다. 서툰 선. 강 위의 돌다리. 다리 끝의 두 개의 탑. 색깔이 조금 다른. 그리고 강가에 앉아 그림을 그리는 작은 사람."], ["U", "......이거."], ["L", "일곱 살 때 그린 거라고 들었습니다. 아버님 스케치북 보고 처음 따라 그린 거."], ["U", "...아버지 냉장고에 30년 붙어 있던 거예요. 나도 매번 봤어요. 아버지 집 갈 때마다. 근데 허리케인 때 없어진 줄 알았는데."], ["L", "진흙 속에서 찾았답니다. 아무한테도 말 안 하고 간직했답니다. 지난봄에 저한테 맡겼습니다. 곰팡이 열한 개, 찢어진 데 7센티미터."], ["N", "루스는 그림을 들어 빛에 비춰 보았다. 찢어진 자리가 보이지 않았다. 곰팡이 점도."], ["U", "......당신이 고쳤어요?"], ["L", "네. 손목 다친 뒤 첫 작업이었습니다. 한 달 걸렸습니다."], ["N", "루스가 고개를 들었다. 루카스의 오른손을 보았다. 손목의 흉터."], ["L", "어제 물으셨습니다. 그 사람을 위해 뭘 포기했냐고."], ["U", "...대답 안 해도 된다고 했잖아요."], ["L", "밤새 생각했습니다. 그래서 대답하러 왔습니다."], ["N", "루카스는 잠깐 말을 멈췄다. 짧은 말을 고르는 버릇이 목에 걸렸다. 그런데 이번엔 그것을 삼키지 않았다. 길게 하기로 했다. 밤새 그렇게 정했다."], ["L", "포기한 건, 없습니다. 어머님 말씀이 맞습니다. 저는 제 도시에, 제 일에, 제 집에 그대로 있습니다. 그 사람이 다 놓고 왔습니다."], ["U", "......"], ["L", "대신 버린 건 있습니다."], ["U", "뭘요?"], ["L", "미리 아파하는 버릇이요. 반쪽만 듣고 판결하는 버릇. 사람이 언젠가 떠날 거라고, 처음부터 그렇게 정해 두는 버릇. 열아홉 살 때부터 그렇게 살았습니다. 그게 덜 아파서요."], ["N", "루스는 아무 말도 하지 않았다. 홍차가 식어 가고 있었다."], ["L", "그 사람이 그걸 버리게 했습니다. 한 번은 제가 그 사람한테 다시 볼 일 없다고 했습니다. 그 사람은 끝까지 그 말을 지켰습니다. 그런데 다리 난간에 그림 한 장을 두고 갔습니다. 장갑만 있는 그림. 그 그림을 6주 동안 매일 봤습니다. 그리고 비행기를 탔습니다. 제 인생에서 처음으로, 누굴 쫓아서."], ["L", "올해 1월에 손목을 다쳤을 때는, 그 사람을 도쿄로 쫓아 보냈습니다. 동정이라고 했습니다. 그 사람은 매일 밤 전화했습니다. 제가 안 받아도. 나흘째 밤에 받았습니다. 그리고 처음으로 무섭다고 말했습니다. 누구한테도 해 본 적 없는 말이었습니다."], ["N", "루스의 손이 폴더 가장자리를 쥐고 있었다. 하얗게."], ["L", "저는 그 사람을 위해 아무것도 포기 안 했습니다. 그런데 그 사람 때문에, 저는 다른 사람이 됐습니다. 아버님 편지를 읽으면서 알았습니다. 아버님도 그러셨던 것 같습니다. 고향을 포기하신 게 아니라, 어머님 때문에 다른 사람이 되신 거."], ["L", "...이게 대답입니다. 길어서 죄송합니다."], ["N", "로비가 조용했다. 아침 손님 몇 명이 지나갔다. 루스는 오래 아무 말도 하지 않았다. 그리고 손수건을 꺼냈다. 이번에는 망설이지 않고."], ["U", "......아스카니엔 씨."], ["L", "네."], ["U", "길어서 죄송하다고 하지 마요."], ["L", "......"], ["U", "우리 아버지는 그 말을 61통에 나눠서 썼어요. 50년 동안. 당신은 그걸 5분 만에 했네요. 내 앞에서. 소리 내서."], ["N", "루스는 크레용 그림을 다시 폴더에 넣었다. 그리고 그것을 루카스 쪽으로 밀었다."], ["U", "이건 그 애한테 돌려줘요. 그 애 거니까."], ["L", "네."], ["U", "그리고 하나만."], ["L", "네."], ["U", "그 애가 당신을 '루카'라고 부르던데."], ["L", "...네."], ["U", "나도 그렇게 불러도 될까요?"], ["N", "루카스가 고개를 들었다. 루스는 손수건으로 눈가를 누르며, 아주 조금 웃고 있었다. 아들과 똑같은 웃음이었다. 곤란하게, 그러나 따뜻하게."], ["L", "......네."], ["U", "그리고 어제 홍차. 엘제 선생님이 주신 거. 맛있었어요."], ["L", "......"], ["N", "루카스의 귀 끝이 붉어졌다. 루스는 그것을 보고, 엘제 선생님 말이 맞았다고 생각했다."], ["U", "그럼 루카. 다리에 늦겠어요. 가 봐요. 그 애 기다려요."], ["N", "일곱 시 오십삼 분. 루카스는 호텔을 나와 다리로 뛰었다. 뛰는 것을 싫어하는 사람이. 다리 한가운데의 이젤 앞에 그가 서 있었다. 루카스를 보고 붓을 든 손을 흔들었다."], ["P", "루카! 2분 늦었어요. ㅎㅎ 처음이에요."], ["L", "......어머니 만나고 왔어."], ["P", "네? 아침에요? 왜요?"], ["N", "루카스는 대답 대신 난간에 손을 얹었다. 숨이 찼다. 그리고 그 숨 사이로, 아주 작게 웃었다."], ["L", "...'루카'라고 불러도 되냐고 하시더라."], ["N", "그가 붓을 떨어뜨렸다. 다리 위로, 남색이 튀었다."], ["H", "10장. 마흔 번째"], ["N", "그날 오후, 복원실. 루스는 두 걸음 떨어진 의자에 앉았다. 그런데 오늘은 의자를 조금 앞으로 끌었다. 반 걸음."], ["O", "...오늘은 가까이 앉으시네요."], ["U", "어제까지는 무서웠어요. 뭐가 나올지."], ["O", "오늘은요?"], ["U", "오늘은 다 듣고 싶어요. 끝까지."], ["N", "엘제 선생님이 루카스를 흘끗 보았다. 루카스는 장갑을 끼고 있었다. 귀 끝이 붉었다."], ["N", "1960년대. 루스가 열여섯, 열일곱 살이던 해. 마흔 번째 편지. 루카스가 봉투를 열고 첫 줄을 읽고, 루스를 보았다."], ["L", "...어머님 얘기입니다. 또."], ["U", "읽어 줘요."], ["L", "'마거릿. 오늘 루스가 나한테 소리를 질렀소. 미술 학교에 안 가겠다고. 아버지처럼 평생 아무 말도 안 하고 그림만 그리는 사람은 되기 싫다고.'"], ["N", "루스가 숨을 들이켰다. 그는 어머니를 돌아보았다."], ["L", "'나는 아무 말도 못 했소. 그 아이 말이 맞아서. 그 아이는 문을 쾅 닫고 나갔고, 나는 작업실로 들어갔소. 늘 그랬듯이.'"], ["L", "'그런데 마거릿, 나는 그날 밤 아무것도 그리지 못했소. 붓을 들면 그 아이 얼굴이 떠올랐소. 화가 나서 울던 얼굴. 그 얼굴을 그려 두려고 했는데, 손이 움직이지 않았소. 그 아이한테 미안하다고 말하지 못한 손으로, 그 아이를 그릴 수가 없었소.'"], ["L", "'내일은 말하겠소. 미안하다고. 네가 무엇이 되든 나는 네 편이라고. 그런데 마거릿, 나는 알고 있소. 내일도 못 할 거라는 걸. 그래서 여기 쓰오. 언젠가 그 아이가 이걸 읽을 날이 오기를. 독일어를 몰라도.'"], ["N", "복원실이 조용해졌다."], ["N", "루스는 의자에 앉은 채 움직이지 않았다. 손수건도 들지 않았다. 다만 작업대 위의 그 편지를 보고 있었다. 누렇게 바랜 종이 위의 필기체를."], ["U", "......나 그 다음 날 기억해."], ["P", "엄마..."], ["U", "아버지가 아침에 내 방 앞에 서 있었어. 한참. 문을 두드리려다가, 안 두드리고. 그리고 문 앞에 새 스케치북 한 권을 놓고 갔어. 아무 말도 없이."], ["N", "루스의 목소리가 떨렸다."], ["U", "나는 그거 열어 보지도 않고 버렸어. 화가 나서. 말 한마디 없이 물건만 주는 게."], ["N", "그가 어머니의 손을 잡았다. 루스는 그 손을 꽉 쥐었다."], ["U", "......그 사람은 그 말을 하려고 했던 거야. 스케치북으로. 나는 그걸 50년 동안 몰랐어."], ["N", "루카스는 편지를 내려놓았다. 그리고 낮게 말했다."], ["L", "...스케치북을 주신 건, 그림을 그려도 된다는 뜻이었을 겁니다. 그리고 안 그려도 된다는 뜻이기도 하고. 빈 스케치북이니까."], ["U", "......"], ["L", "빈 종이는, 뭘 그려도 되는 종이입니다. 복원가들은 그렇게 말합니다."], ["N", "루스가 루카스를 보았다. 그리고 처음으로, 소리 내어 울었다. 아버지는 한 번도 그렇게 울지 못했다. 딸은 울 수 있었다."], ["H", "11장. 예순한 번째"], ["N", "9월 20일. 아침 일곱 시 오십오 분. 옛 다리."], ["N", "다리 한가운데에 이젤이 서 있었다. 그 옆에 의자가 하나 놓여 있었다. 루스가 앉아 있었다. 무릎 위에 호두나무 상자를 올려놓고."], ["N", "상자 안에는 이제 한 통만 남아 있었다. 예순한 번째. 결혼 50주년, 1988년. 루스가 마지막 한 통은 이 다리 위에서 듣고 싶다고 했다."], ["N", "안개가 엷게 깔려 있었다. 강이 반쯤 보였다. 지나가는 사람들이 붉은 머리와, 은발의 여자와, 검은 머리의 남자를 돌아보았다. 루카스는 이번엔 신경 쓰지 않았다."], ["U", "...아버지가 여기 앉아서 그렸겠죠. 1934년에."], ["P", "강가에서요. 스케치북에 그 사람이 있었어요. 다리 아래, 강가에 혼자 앉은 사람."], ["U", "그리고 넌 다리 위에서 그리고."], ["P", "ㅎㅎ 네."], ["U", "...옆에 사람 세워 두고."], ["N", "루카스가 헛기침을 했다. 루스가 웃었다. 이번에는 숨기지 않고."], ["N", "루카스가 장갑을 꼈다. 마지막 봉투를 열었다. 편지지가 두 장이었다. 61통 중 가장 길었다. 글씨가 많이 떨렸다. 아우구스트는 그때 일흔여섯 살이었다."], ["L", "'마거릿. 50년이오.'"], ["L", "'나는 50년 동안 당신에게 말을 짧게 했소. 영어로는 늘 서툴렀고, 독일어로는 당신이 못 알아들었소. 그래서 나는 늘 짧게 말했소. 고맙소. 좋소. 먹었소. 잘 자오.'"], ["L", "'그 대신 이 편지들이 길었소. 60통. 이게 61번째요. 내가 당신에게 하지 못한 말을, 여기 다 썼소. 당신이 독일어를 모르니 안심하고 썼소. 비겁한 일이오. 알고 있소.'"], ["N", "루스의 손이 , "네."], ["U", "그리고 그 봉투. 열면 나한테도 알려 줘요."], ["L", "......네."], ["N", "루스는 출국장 안으로 걸어갔다. 돌아보지 않았다. 대신 보안 검색대 앞에서 딱 한 번 걸음을 멈췄다. 그리고 손을 들어 흔들었다. 아들에게. 그리고 그 옆의 사람에게."], ["N", "그날 밤, 두 사람의 집. 북쪽 벽 습도계 옆 선반에 호두나무 상자가 놓였다. 그 옆에 크레용 다리 그림이 액자에 들어가 걸렸다."], ["N", "그리고 루카스의 셔츠 가슴 주머니 안에는, 아직 열지 않은 크림색 봉투가 들어 있었다. 루카스는 그것을 매일 아침 셔츠를 갈아입을 때마다, 새 셔츠 주머니로 옮겼다."], ["N", "그는 그것을 보았다. 아무것도 묻지 않았다. 기다리는 것은, 그가 제일 잘하는 일이었다."]];

  const img=new Image();img.className='av';img.alt='';img.src=AV[who];
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;
  $('panel').replaceChildren();
  const c=document.createElement('div');c.className='cover';c.id='cover';
  c.innerHTML='<b>new take#4</b><span>하이델베르크, 말이 짧은 남자의 편지.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span>';
  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
</body>
</html>
