<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take#3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#17110c; --ink:#21180f; --pink:#8f7149; --pink-soft:#eadfc9;
  --face:#d8cbb3; --hi:#f4ecdc; --lo:#8c7b62; --paper:#f3ece0;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(214,180,120,.14),transparent 70%) no-repeat var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#ece2cd;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:#c4a676;margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #5e4630}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#6d5d4a;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630;
  box-shadow:inset -1px -1px 0 #5e4630,inset 1px 1px 0 #c9ad84;margin-top:6px}
.nar{align-self:stretch;background:#ebe2d2;border:1px dashed #b3a184;padding:8px 10px;font-size:13px;line-height:1.55;color:#4a3d30;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a8d7c;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630}
.btn:disabled{color:#8f826f;text-shadow:none;cursor:default}
.btn.main:disabled{background:#bfa888}
.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.hint{font-size:12px;color:#a39580;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
</style>
</head>

에 떨어졌다. 평행하지 않게. 루카스는 그것을 줍지 않았다."], ["M", "선배님? 무슨—"], ["L", "요나스. 그 양피지, 가습 텐트에서 꺼내. 지금. 20분 넘으면 안 돼."], ["M", "네? 네! 근데 선배님—"], ["N", "문이 닫혔다. 천천히가 아니었다. 쾅. 복원실의 습도계 바늘이 흔들렸다. 요나스는 그 바늘을 보며 생각했다. 지난 2월, 의자 긁히는 소리 이후로 이 방에서 이렇게 큰 소리가 난 건 처음이었다."], ["N", "대학병원 응급실. 루카스는 복도를 뛰고 있었다. 사람들이 돌아보았다. 루카스는 신경 쓰지 않았다. 뛰는 것을 싫어하는 사람이었다. 바람이 일면 먼지가 종이에 앉으니까. 그런데 지금은, 뛰고 있었다."], ["N", "맨 끝 처치실. 커튼이 반쯤 열려 있었다. 침대 위에 붉은 머리가 쏟아져 있었다. 젖은 채로. 오른팔에 부목이 대어져 있었다."], ["N", "그가 고개를 들었다. 루카스를 보았다. 그리고 웃었다. 곤란하게."], ["P", "......뛰지 마요, 루카. 병원이에요."], ["L", "......"], ["P", "ㅎㅎ 그 말 제가 해 보고 싶었어요. 맨날 듣기만 해서."], ["N", "루카스는 대답하지 않았다. 침대 옆에 섰다. 부목 댄 오른팔을 내려다보았다. 손가락이 퉁퉁 부어 있었다. 손등이 보랏빛이었다."], ["L", "......어떻게 된 거야."], ["P", "계단에서요. 미끄러졌어요. 캔버스 틀 들고 있었는데—"], ["L", "그걸 놓으면 되잖아."], ["P", "...할아버지 옆에 걸릴 거라서요."], ["N", "루카스의 입술이 굳게 다물렸다. 무언가를 말하려다가, 삼키는 얼굴이었다. 석 달 동안 그는 그 얼굴을 여러 번 보았다. 그리고 그 얼굴 다음에는 늘 아주 짧은 말이 나왔다."], ["L", "......바보."], ["P", "네. ㅎㅎ"], ["L", "웃지 마."], ["P", "루카가 와서요."], ["N", "커튼이 열리고 의사가 들어왔다. 엑스레이 사진을 들고 있었다."], ["N", "요골 원위부 골절. 그리고 검지와 중지 사이 손허리뼈에 금. 깁스 6주. 그 뒤 재활 최소 4주. 오른손으로 붓을 다시 쥐는 건, 빨라야 8월 말."], ["N", "전시는 9월 12일이었다. 그림은 다섯 점 중 두 점이 완성되어 있었다."], ["N", "그는 그 숫자를 듣고 잠깐 아무 말도 하지 않았다. 그러다 다시 웃었다. 루카스는 그 웃음을 알았다. 휘트니 개막식에서, 사람들에게 둘러싸여 웃던 그 웃음이었다."], ["P", "...괜찮아요. 왼손으로 하면 돼요. ㅎㅎ"], ["N", "루카스는 대답하지 않았다. 대신 그의 왼손을 잡았다. 차가웠다. 계단에서 비를 맞고 한 시간을 앉아 있었다고 했다. 구급차를 기다리면서. 캔버스 틀을 끌어안고."], ["N", "루카스는 그 차가운 왼손을, 병원을 나설 때까지 놓지 않았다."], ["H", "2장. 임시"], ["N", "그날 밤, 작업실 3층. 그는 소파에 앉아 깁스한 오른팔을 무릎 위에 올려놓고 있었다. 루카스는 그 앞에 서서 방을 둘러보았다."], ["N", "넓은 방이었다. 북향 창. 습도계 다섯 개. 이젤 세 개. 그리고 벽에 기대 세워진, 완성된 그림 두 점과 하얀 캔버스 세 개."], ["L", "...세 점 남았네."], ["P", "네. ㅎㅎ 왼손으로 하면 돼요."], ["L", "왼손으로 그려 본 적 있어?"], ["P", "......어릴 때요. 장난으로."], ["N", "루카스는 대답하지 않았다. 부엌으로 갔다. 냉장고를 열었다. 우유, 계란, 그래놀라 바. 그리고 먹다 남은 빵 반 덩이."], ["L", "저녁은."], ["P", "괜찮아요. 배 안 고파요."], ["L", "진통제 먹어야 돼. 빈속에 먹으면 안 돼."], ["P", "...아, 그렇구나."], ["N", "루카스는 계란을 꺼냈다. 프라이팬을 찾았다. 찾는 데 3분 걸렸다. 그가 소파에서 일어나려 하자, 루카스가 돌아보지도 않고 말했다."], ["L", "앉아."], ["P", "프라이팬 오른쪽 아래 찬장—"], ["L", "찾았어. 앉아."], ["N", "10분 뒤, 접시가 그의 앞에 놓였다. 스크램블드에그. 그리고 빵 두 쪽. 빵은 정확히 같은 두께로 잘려 있었다. 계란은, 조금 탔다."], ["P", "......루카가 요리하는 거 처음 봐요."], ["L", "요리 아니야. 계란 익힌 거야."], ["P", "ㅎㅎ 맛있어요."], ["L", "탔어."], ["P", "탄 데가 맛있어요."], ["N", "그는 왼손으로 포크를 쥐었다. 서툴렀다. 계란이 접시 밖으로 떨어졌다. 두 번. 세 번. 그는 웃으며 다시 시도했다. 루카스는 그 옆에 앉아 그것을 지켜보다가, 아무 말 없이 포크를 가져갔다."], ["P", "...루카?"], ["L", "입."], ["P", "네?"], ["L", "입 벌려."], ["N", "그가 눈을 크게 떴다. 루카스는 포크를 내민 채 그를 보고 있었다. 무표정이었다. 그런데 귀 끝이 이미 붉었다."], ["P", "......ㅎㅎ"], ["L", "웃지 말고."], ["N", "그는 입을 벌렸다. 루카스가 계란을 넣어 주었다. 정확하게. 핀셋으로 종이를 옮기듯이."], ["N", "접시가 다 비었을 때, 루카스는 진통제와 물컵을 그의 왼손에 쥐여 주었다. 그리고 부엌으로 가서 접시를 씻었다. 등을 돌린 채로 말했다."], ["L", "...오늘 여기서 잘게."], ["P", "네?"], ["L", "네가 밤에 물 마시러 일어났다가 또 넘어지면 안 되니까. 임시로."], ["P", "임시로요?"], ["L", "임시로. 깁스 풀 때까지."], ["N", "그는 대답하지 못했다. 소파에서 루카스의 등을 보았다. 접시를 씻는 등. 소매를 걷은 팔. 석 달 동안, 루카스는 한 번도 이 작업실에서 자고 간 적이 없었다. 늘 열한 시면 일어나서, 다리를 건너, 자기 집으로 갔다."], ["P", "......루카."], ["L", "왜."], ["P", "고마워요."], ["L", "임시라고 했어."], ["P", "ㅎㅎ 네. 임시로."], ["N", "그날 밤, 루카스는 소파에서 잤다. 그는 침대에서 몇 번이나 소파 쪽으로 오라고 했다. 루카스는 '네 팔 건드릴까 봐'라고 했다. 그는 그 말이 진짜 이유라는 것을 알았다. 그래서 더 이상 조르지 않았다."], ["N", "새벽 세 시. 그가 물을 마시러 일어났다. 거실로 나왔을 때, 소파의 루카스는 눈을 뜨고 있었다."], ["L", "...말하라니까. 일어날 때."], ["P", "자는 줄 알았어요."], ["L", "안 잤어."], ["P", "왜요?"], ["N", "루카스는 대답 대신 일어나서 물을 따라 주었다. 그리고 그가 다 마실 때까지 옆에 서 있었다. 컵을 받아 들고, 그를 침대까지 데려다주었다. 그리고 다시 소파로 돌아갔다."], ["N", "그는 침대에 누워 천장을 보았다. 깁스한 팔이 욱신거렸다. 그런데 이상하게, 하나도 아프지 않은 것 같았다."], ["H", "3장. 머리"], ["N", "다음 날 아침. 문제가 하나 생겼다."], ["P", "...루카."], ["L", "왜."], ["P", "머리를 못 묶겠어요."], ["N", "그는 욕실 거울 앞에 서 있었다. 무릎까지 오는 붉은 머리카락이 엉킨 채로 풀어져 있었다. 왼손으로 빗을 쥐고 있었는데, 빗이 머리카락 중간에 걸려서 꼼짝도 하지 않았다."], ["L", "......"], ["P", "평소엔 두 손으로 하거든요. 한 손으로 잡고, 한 손으로 묶고. 근데 이게... ㅎㅎ"], ["N", "루카스는 문간에 서서 그 광경을 한참 보았다. 빗은 머리카락 한가운데에 매달려 있었다. 그가 왼손으로 당길 때마다 더 깊이 엉켰다."], ["L", "멈춰."], ["P", "네?"], ["L", "당기지 마. 섬유 끊어져."], ["P", "섬유요? ㅎㅎ 머리카락인데요."], ["L", "똑같아."], ["N", "루카스는 그의 뒤에 섰다. 그리고 빗을, 아주 천천히, 엉킨 머리카락에서 빼냈다. 한 가닥씩. 핀셋으로 들러붙은 종이를 떼어 내듯이. 5분이 걸렸다."], ["P", "......와."], ["L", "앉아."], ["N", "그가 욕실 의자에 앉았다. 루카스는 그 뒤에 서서 빗질을 시작했다. 끝에서부터. 조금씩, 위로. 엉킨 데가 나오면 멈추고, 손가락으로 풀고, 다시."], ["N", "머리카락이 길었다. 아주 길었다. 루카스의 손이 정수리에서 끝까지 한 번 내려가는 데 한참 걸렸다. 그는 눈을 감고 있었다."], ["P", "...루카 손 좋아요."], ["L", "조용히 해."], ["P", "진짜예요. 미용실보다 좋아요."], ["L", "미용실 안 가잖아. 이 길이면."], ["P", "ㅎㅎ 그러네요."], ["N", "빗질이 끝났다. 붉은 머리카락이 매끈하게 흘러내렸다. 루카스는 그것을 손에 쥐고, 잠깐 멈췄다."], ["L", "...어떻게 묶어. 평소에."], ["P", "그냥 하나로요. 고무줄로."], ["L", "그럼 오후에 또 엉켜. 작업하면서."], ["P", "그럼 어떻게 해요?"], ["N", "루카스는 대답하지 않았다. 대신 머리카락을 세 갈래로 나눴다. 그리고 땋기 시작했다. 서툴렀다. 첫 번째는 엉망이었다. 풀었다. 두 번째도. 또 풀었다."], ["P", "루카, 땋을 줄 알아요?"], ["L", "몰라."], ["P", "그럼—"], ["L", "배우는 중이야."], ["N", "세 번째. 루카스는 그의 뒤통수를 내려다보며, 미간을 잔뜩 찌푸리고, 세 갈래를 하나씩 넘겼다. 오른쪽을 가운데로. 왼쪽을 가운데로. 오른쪽을 가운데로. 정확하게. 장인처럼."], ["N", "무릎까지 다 땋는 데 15분이 걸렸다. 끝을 고무줄로 묶었다. 루카스가 한 걸음 물러섰다."], ["N", "그는 거울을 보았다. 등 뒤로 굵은 붉은 땋은 머리가 하나 늘어져 있었다. 위는 조금 느슨했고, 아래로 갈수록 단단했다. 루카스가 중간쯤에서 요령을 터득했다는 증거였다."], ["P", "......"], ["L", "...별로면 풀어."], ["P", "안 풀어요."], ["L", "위쪽이 느슨해."], ["P", "안 풀어요. 절대."], ["N", "그날 오후, 그는 박물관 큐레이터와 회의를 했다. 큐레이터가 회의 내내 그의 땋은 머리를 힐끔거렸다. 그는 묻지도 않았는데 설명했다. '제 담당 복원가가 해 줬어요.'"], ["N", "큐레이터는 그 복원가가 누군지 묻지 않았다. 박물관 전시실의 습도를 2퍼센트 낮춰 달라고 했던 그 사람이라는 것을, 이미 알았으니까."], ["H", "4장. 세 갈래"], ["N", "일주일이 지났다. 루카스는 여전히 '임시로' 작업실 소파에서 자고 있었다. 칫솔이 하나 늘었다. 셔츠 세 벌이 옷장 한쪽에 걸렸다. 습도계 옆에 루카스의 손목시계가 놓이기 시작했다."], ["N", "아침마다 땋은 머리는 조금씩 나아졌다. 셋째 날엔 위쪽이 덜 느슨해졌다. 다섯째 날엔 15분이 10분이 되었다. 일곱째 날, 그는 거울을 보고 말했다."], ["P", "오늘 거 완벽해요."], ["L", "아직 멀었어. 오른쪽 세 번째 매듭이 1밀리 틀어졌어."], ["P", "그걸 어떻게 봐요? ㅎㅎ"], ["L", "보여."], ["N", "복원실. 루카스가 점심시간에 휴대폰으로 무언가를 보고 있었다. 요나스가 어깨 너머로 들여다보았다."], ["M", "...선배님. 그거 '피시테일 브레이드 초보자용'이에요?"], ["L", "......"], ["M", "선배님이 땋는 법을요?"], ["L", "양피지 제본 실 꼬는 법이랑 원리가 같아."], ["M", "양피지 제본은 머리카락이 아니잖아요."], ["L", "섬유는 섬유야."], ["N", "요나스는 웃음을 참으며 자리로 돌아갔다. 그리고 그날 오후, 루카스의 작업대 위에 아무 말 없이 고무줄 한 봉지를 놓고 갔다. 굵기별로 세 종류. 머리카락용."], ["N", "엘제 선생님은 그것을 보고 아무 말도 하지 않았다. 다만 다음 날, 루카스의 작업대 서랍에 낡은 책 한 권이 들어 있었다. '18세기 직물 매듭 기법 도해'. 엘제 선생님의 장서였다."], ["N", "그 주 금요일 밤. 다나에게서 영상통화가 왔다. 그는 왼손으로 휴대폰을 들고 소파에 앉았다. 루카스는 부엌에서 설거지를 하고 있었다."], ["D", "팔은?"], ["P", "괜찮아요. 안 아파요."], ["D", "거짓말. 얼굴이 아프다고 하는데."], ["P", "ㅎㅎ 조금요."], ["D", "박물관이랑 얘기했어. 전시, 내년 봄으로 미루자. 다들 이해할 거야. 손목이 부러졌는데."], ["N", "그의 얼굴에서 웃음이 사라졌다."], ["P", "...안 돼요."], ["D", "왜? 그림 세 점이 남았잖아. 손은 8월 말에나 쓸 수 있고."], ["P", "할아버지 드로잉이 9월에만 빌려진 거예요. 미국 소장자들한테서. 그 사람들이 내년에도 빌려준다는 보장 없어요. 이번이 아니면, 할아버지랑 같은 벽에 걸리는 거 다시는 못 할지도 몰라요."], ["D", "......"], ["P", "왼손으로 할게요. 할 수 있어요."], ["D", "너 왼손으로 연필도 제대로 못 쥐잖아."], ["P", "연습하면 돼요."], ["N", "부엌에서 접시 씻는 소리가 멈췄다. 그는 알아차리지 못했다."], ["D", "...그 사람은 뭐래?"], ["P", "루카요? 아직 얘기 안 했어요."], ["D", "왜?"], ["P", "걱정할까 봐요. 지금도 소파에서 자면서 새벽마다 깨요. 제가 물 마시러 일어날까 봐."], ["N", "다나는 화면 너머에서 한참 그를 보았다. 그리고 한숨을 쉬었다."], ["D", "너 또 혼자 다 하려고 그러지. 1년 동안 붓 못 잡았을 때처럼."], ["P", "그때랑 달라요."], ["D", "뭐가 달라."], ["P", "그땐 그리고 싶은 게 없었어요. 지금은 너무 많아요."], ["N", "통화가 끝났다. 그는 휴대폰을 내려놓고 부엌 쪽을 보았다. 루카스는 다시 접시를 씻고 있었다. 등을 돌린 채로. 아무것도 듣지 못한 것처럼."], ["N", "그날 밤, 루카스는 소파에서 오래 눈을 뜨고 있었다."], ["H", "5장. 새벽 세 시"], ["N", "열흘째 새벽. 루카스는 잠에서 깼다. 무언가 이상했다. 소리가 났다. 아주 작게. 사각, 사각."], ["N", "연필 소리가 아니었다. 붓 소리였다. 캔버스 위를 붓이 긁는 소리."], ["N", "루카스는 일어났다. 작업실 쪽 문 틈으로 불빛이 새어 나오고 있었다. 문을 열었다."], ["N", "그가 이젤 앞에 서 있었다. 왼손에 붓을 쥐고. 하얀 캔버스 중 하나에 남색이 칠해져 있었다. 그런데 그 남색은, 그의 그림이 아니었다. 선이 흔들렸다. 붓 자국이 들쑥날쑥했다. 물감이 덩어리져 흘러내리고 있었다."], ["N", "그리고 깁스한 오른팔이, 몸통에 붙어 있지 않았다. 캔버스 가장자리를 짚고 있었다. 균형을 잡으려고. 무게를 싣고서."], ["L", "......뭐 하는 거야."], ["N", "그가 돌아보았다. 들킨 얼굴이었다. 그리고 지친 얼굴이었다. 눈이 빨갰다."], ["P", "...루카. 깼어요?"], ["L", "팔. 왜 거기 짚고 있어."], ["P", "아, 이거... 왼손만 쓰면 중심이 안 잡혀서요."], ["L", "의사가 뭐라고 했어. 6주 동안 무게 싣지 말라고 했잖아."], ["P", "조금이에요."], ["L", "조금이 아니야. 지금 손가락 봐."], ["N", "깁스 밖으로 나온 손가락들이 다시 부어 있었다. 보랏빛이 짙어져 있었다. 그도 그것을 보았다. 그리고 숨기듯 팔을 등 뒤로 돌렸다."], ["P", "괜찮아요."], ["L", "며칠째야."], ["P", "......"], ["L", "며칠째냐고."], ["P", "...닷새요."], ["N", "루카스는 그 자리에 서 있었다. 닷새. 새벽마다 루카스는 깨어 있었다. 물 마시러 일어나는 소리를 기다리면서. 그런데 그는 물을 마시러 일어난 게 아니었다. 루카스가 다시 잠든 다음, 조용히, 이 방으로 온 것이었다."], ["L", "...그만해."], ["P", "안 돼요. 세 점 남았어요."], ["L", "그 그림, 지금 네 그림이 아니야. 너도 알잖아."], ["N", "그의 얼굴이 굳었다. 처음 보는 얼굴이었다. 루카스는 그 얼굴을 보면서도 멈출 수 없었다. 짧고 정확한 말이 계속 나왔다. 늘 그랬듯이."], ["L", "종이가 싫다고 하면 멈춰야 한다고 했잖아. 지금 네 손이 싫다고 하고 있어. 그런데 넌 계속 당기고 있어. 그럼 찢어져."], ["P", "......저는 종이가 아니에요."], ["N", "그의 목소리가 처음으로 커졌다. 루카스는 그 목소리를 처음 들었다. 석 달 동안, 아니, 서점 바닥에서 처음 만난 날부터 지금까지 한 번도."], ["P", "저는 종이가 아니에요, 루카. 기다리면 알아서 돌아오는 거 아니에요. 1년 동안 기다렸어요. 붓 들면 손이 안 움직였어요. 그때 무슨 생각했는지 알아요? 이대로 영영 못 그리면 어떡하지. 그거 하나였어요."], ["L", "......"], ["P", "이제 겨우 다시 그리는데. 할아버지 옆에 걸 그림인데. 또 손이 안 움직여요. 이번엔 진짜로요. 뼈가 부러져서요."], ["N", "그의 왼손에서 붓이 떨어졌다. 바닥에 남색이 튀었다."], ["P", "...무서워요. 또 1년 될까 봐. 그래서 그려야 돼요. 엉망이어도."], ["N", "루카스는 대답하지 못했다. 할 말이 없어서가 아니었다. 할 말이 너무 많아서, 그 중에 어느 것이 짧고 정확한지 고를 수가 없었다."], ["N", "그래서 루카스는 늘 하던 대로 했다. 아무 말도 하지 않았다."], ["N", "그리고 그 침묵이, 이번엔 다르게 읽혔다."], ["P", "......루카는 몰라요. 루카 손은 멀쩡하잖아요."], ["N", "그 말이 방 안에 떨어졌다. 그는 말하자마자 후회하는 얼굴이 되었다. 루카스는 그 말을 들었다. 그리고 아주 천천히, 돌아섰다."], ["L", "...얼음 가져올게. 손가락에 대."], ["N", "부엌으로 가는 발소리가 정확했다. 하나도 흐트러지지 않았다. 그는 그 정확함이 무엇을 뜻하는지 알았다. 12월의 그 아침, 다리를 건너던 발소리와 같았다."], ["H", "6장. 얼음"], ["N", "루카스는 얼음을 수건에 싸서 가져왔다. 그의 손가락 위에 올려 주었다. 그리고 바닥에 떨어진 붓을 주웠다. 남색이 튄 바닥을 닦았다. 한 마디도 하지 않았다."], ["N", "그는 소파에 앉아 그것을 보고 있었다. 사과하고 싶었다. 그런데 무슨 말로 해야 할지 몰랐다. '루카는 몰라요.' 그 말을 어떻게 주워 담는지."], ["P", "......루카."], ["L", "자. 아침에 병원 가."], ["P", "루카, 아까 그 말은—"], ["L", "자라고."], ["N", "루카스는 작업실 불을 껐다. 그리고 소파로 돌아가 누웠다. 그에게 등을 돌린 채로."], ["N", "그는 침대에 누웠다. 잠이 오지 않았다. 손가락이 욱신거렸다. 그것보다 다른 데가 더 아팠다."], ["N", "새벽 다섯 시. 거실에서 문이 열리고 닫히는 소리가 났다. 아주 조용히. 그는 일어나 거실로 나갔다."], ["N", "소파는 비어 있었다. 담요가 정확히 네 번 접혀 소파 끝에 놓여 있었다. 칫솔은 그대로 있었다. 셔츠도. 손목시계만 없었다."], ["N", "그리고 식탁 위에 메모가 한 장 있었다. 정확하고 짧은 글씨."], ["N", "'8시 병원. 택시 불렀음. 혼자 계단 내려가지 말 것. 택시 기사가 올라옴.'"], ["N", "그는 그 메모를 오래 보았다. '혼자 계단 내려가지 말 것.' 화가 났으면 이런 걸 쓰지 않았을 것이다. 그런데 화가 안 났으면, 새벽 다섯 시에 나가지도 않았을 것이다."], ["N", "그는 그 메모를 깁스 안쪽, 손목과 붕대 사이에 끼워 넣었다."], ["N", "아침 여덟 시. 고문헌 복원실. 엘제 선생님이 출근했을 때, 루카스는 이미 작업대 앞에 앉아 있었다. 아무것도 하지 않은 채로. 작업대 위에는 아무것도 놓여 있지 않았다."], ["O", "...몇 시에 왔니."], ["L", "다섯 시 반요."], ["O", "다리는?"], ["L", "안 건넜습니다. 아래쪽 다리로 왔습니다."], ["N", "엘제 선생님은 코트를 걸고, 루카스 옆 의자에 앉았다. 작업대에서 두 걸음 떨어진 의자. 그 사람이 뉴욕 복원실에서 늘 앉아 있던 거리였다."], ["O", "싸웠구나."], ["L", "...싸운 건 아닙니다."], ["O", "그럼?"], ["L", "그 사람이 '루카는 모른다'고 했습니다. '루카 손은 멀쩡하잖아요'라고."], ["O", "......"], ["L", "맞는 말입니다. 저는 모릅니다. 제 손은 멀쩡하니까요."], ["N", "엘제 선생님은 한참 동안 아무 말도 하지 않았다. 그러다 루카스의 손을 내려다보았다. 작업대 위에 놓인, 아무것도 쥐지 않은 손."], ["O", "루카스. 넌 이 손으로 15년 동안 남의 것을 고쳤어."], ["L", "......"], ["O", "백 년 된 편지, 이백 년 된 악보, 누군가의 할아버지 스케치북. 전부 남의 거야. 네가 그린 거 아니고, 네가 쓴 거 아니고. 그런데 넌 그걸 네 것처럼 다뤘지. 그게 복원가야."], ["L", "...그래서요."], ["O", "그래서, 그 사람 손이 지금 못 하는 걸 네 손이 대신 하면 안 되는 이유가 뭐니?"], ["N", "루카스가 고개를 들었다."], ["O", "복원가는 원작자가 아니야. 원작자의 손을 대신하는 사람이지. 그 사람이 1934년에 없어도, 그 사람 선을 돌려놓는 사람. 넌 그걸 매일 해."], ["L", "......제가 그림을 그립니까?"], ["O", "그리는 건 그 사람이 하고. 넌 손만 빌려줘. 그 사람이 말하는 대로. 물감 섞고, 바탕 칠하고, 그 사람이 '여기'라고 하면 거기에."], ["L", "저는 그림 못 그립니다."], ["O", "넌 하르트만도 못 그려. 그런데 하르트만 선은 돌려놓잖니."], ["N", "루카스는 대답하지 않았다. 작업대 위의 빈손을 보았다. 오랫동안."], ["O", "그리고 하나 더. '루카는 모른다'는 말. 그거 무서워서 한 말이야. 너 12월에 '다시 볼 일 없다'고 한 거랑 똑같은 말. 무서운 사람은 제일 아픈 데를 먼저 찔러. 너도 그랬잖니."], ["N", "루카스의 손가락이 아주 조금 움직였다. 그리고 멈췄다."], ["L", "......선생님."], ["O", "응."], ["L", "오늘 반차 쓰겠습니다."], ["O", "이유는?"], ["L", "......재료 구매입니다. 물감."], ["N", "엘제 선생님이 웃었다. 소리 내어. 요나스가 막 출근하다가 그 소리를 듣고 문간에서 멈췄다. 루카스는 이미 코트를 입고 있었다."], ["H", "7장. 손"], ["N", "오후 두 시. 작업실 문이 열렸다. 그는 소파에 앉아 있었다. 병원에서 돌아와 다시 감은 깁스가 무릎 위에 놓여 있었다. 문 소리에 고개를 들었다."], ["N", "루카스였다. 양손에 커다란 종이봉투를 들고 있었다. 화방 봉투였다."], ["P", "......루카."], ["L", "의사가 뭐래."], ["P", "...다행히 더 어긋나진 않았대요. 근데 일주일 더 늘어났어요. 7주."], ["L", "......"], ["P", "루카, 어젯밤에—"], ["L", "나중에."], ["N", "루카스는 봉투를 작업대 위에 내려놓았다. 하나씩 꺼냈다. 남색 물감. 흰색. 금색. 붓 여섯 자루, 크기별로. 팔레트 나이프. 앞치마. 그리고 마지막으로, 공책 한 권과 연필."], ["P", "...이게 다 뭐예요?"], ["L", "네가 뭐 쓰는지 몰라서 화방 주인한테 물어봤어. 네 이름 대니까 다 알더라."], ["P", "ㅎㅎ 그 사람 제 팬이에요."], ["L", "알아. 사인 받아 오라고 했어. 나중에."], ["N", "루카스는 앞치마를 둘렀다. 소매를 걷었다. 그리고 하얀 캔버스 하나를 이젤 위에 올렸다. 어젯밤 그가 엉망으로 칠한 것이 아니라, 새것을."], ["N", "그리고 그를 돌아보았다."], ["L", "말해."], ["P", "네?"], ["L", "뭐 그릴지. 어떻게 할지. 물감 몇 대 몇으로 섞는지. 바탕은 어떤 붓으로 칠하는지. 다 말해. 그대로 할게."], ["N", "그는 아무 말도 하지 못했다. 소파에 앉은 채로, 앞치마를 두른 루카스를 보았다. 그 정확한 손이, 붓을 들고 기다리고 있었다."], ["L", "나는 그림 못 그려. 근데 손은 있어. 네 손 대신 쓸 수 있는."], ["P", "......"], ["L", "복원가는 원래 남의 손 대신 하는 사람이야. 1934년 하르트만 손도 대신했어. 너 손 하나 못 할 거 없어."], ["N", "그의 눈가가 붉어졌다. 머리카락처럼. 그리고 땋은 머리처럼. 오늘 아침엔 루카스가 없어서, 머리는 풀어진 채 엉켜 있었다."], ["P", "...루카, 어젯밤에 제가 한 말—"], ["L", "들었어."], ["P", "미안해요. 그런 뜻 아니었어요. 무서워서—"], ["L", "알아. 엘제 선생님이 그러더라. 무서운 사람은 제일 아픈 데를 먼저 찌른다고. 나도 그랬잖아. 12월에."], ["N", "그는 소파에서 일어났다. 두 걸음. 루카스 앞에 섰다. 왼손을 뻗어, 앞치마를 두른 루카스를 끌어안았다. 깁스한 오른팔이 둘 사이에 끼었다. 어설펐다. 그래도 놓지 않았다."], ["P", "......고마워요."], ["L", "팔 조심해."], ["P", "안 놔요."], ["L", "...그럼 1분만."], ["N", "1분이 지났다. 2분이 지났다. 루카스는 세지 않았다."], ["N", "그리고 루카스가 먼저 몸을 뗐다. 그의 엉킨 머리를 보았다."], ["L", "그 전에 앉아. 머리부터 땋자. 붓 들면 엉켜."], ["H", "8장. 시끄럽게"], ["N", "첫날은 바탕칠이었다. 그는 소파에 앉아 지시했다. 루카스는 이젤 앞에 서서 그대로 했다."], ["P", "남색이랑 흰색, 8대 2요."], ["L", "8대 2. 무게로? 부피로?"], ["P", "...네?"], ["L", "무게로 할까, 부피로 할까."], ["P", "그냥... 눈대중으로요. ㅎㅎ"], ["L", "눈대중이 몇 그램이야."], ["N", "그는 소파에서 웃다가 깁스한 팔이 아파서 신음했다. 루카스는 그것을 보고 미간을 찌푸렸다. 그리고 주방에서 저울을 가져왔다. 물감을 정확히 그램 단위로 달았다. 남색 40그램, 흰색 10그램."], ["N", "섞인 물감은 완벽했다. 그가 말했던 색, 그 이상이었다."], ["P", "...와. 제가 섞은 것보다 더 정확해요."], ["L", "정확하게 해야지."], ["P", "근데 루카, 그림은 정확하면 재미없어요."], ["L", "무슨 소리야."], ["P", "해 보면 알아요. 바탕 칠해 봐요. 이 큰 붓으로."], ["N", "루카스가 붓을 들었다. 캔버스 왼쪽 위 모서리에 댔다. 그리고 아주 천천히, 일정한 압력으로, 수평으로 그었다. 1센티미터 간격으로. 다음 줄. 또 다음 줄."], ["N", "10분 뒤. 캔버스의 4분의 1이 칠해져 있었다. 완벽하게 균일한 남색. 붓 자국 하나 없이."], ["P", "......루카."], ["L", "왜."], ["P", "그거 벽 칠하는 거예요. ㅎㅎ"], ["L", "바탕 칠하라며."], ["P", "바탕도 그림이에요. 더 막 칠해요. 크게. 휙휙."], ["L", "휙휙이 뭐야."], ["P", "팔 전체로요. 손목 말고. 붓이 가고 싶은 데로."], ["L", "붓은 가고 싶은 데가 없어. 도구야."], ["N", "그가 소파에서 일어났다. 루카스 뒤에 섰다. 왼손으로 루카스의 오른팔을 잡았다. 팔꿈치 위를. 그리고 크게, 대각선으로, 휘둘렀다."], ["N", "붓이 캔버스를 가로질렀다. 남색이 튀었다. 루카스의 앞치마에, 뺨에, 그리고 그의 깁스에."], ["L", "......"], ["P", "이렇게요. ㅎㅎ"], ["L", "물감 튀었어."], ["P", "네. 원래 튀어요."], ["L", "복원실에선 물감 튀면 사고야."], ["P", "여긴 복원실 아니잖아요."], ["N", "루카스는 뺨에 튄 남색을 손등으로 닦았다. 더 번졌다. 그는 그것을 보고 웃음을 참았다. 실패했다."], ["L", "웃지 마."], ["P", "루카 얼굴에 바다가 생겼어요."], ["L", "......"], ["N", "루카스는 붓을 들었다. 그리고 그를 똑바로 보며, 붓 끝을 그의 코끝에 톡 댔다."], ["P", "......루카?"], ["L", "이제 너도 바다 생겼어."], ["N", "그는 1초 동안 굳었다가, 소리 내어 웃었다. 작업실이 울렸다. 루카스도 웃었다. 소리가 났다. 아주 분명하게. 관람차 앞의 그 소리보다 훨씬 크게."], ["N", "그날 바탕칠은 엉망이었다. 반은 균일하고, 반은 휙휙이었다. 그는 그것을 보고 말했다. '이거 좋아요. 이대로 써요.' 루카스는 반대했다. 그는 이겼다."], ["H", "9장. 3주"], ["N", "그 뒤로 3주가 지났다. 작업실의 하루는 정해진 순서로 흘러갔다."], ["N", "아침 일곱 시. 루카스가 머리를 땋았다. 이제 7분이면 됐다. 엘제 선생님의 매듭 도해집을 본 뒤로, 루카스는 매일 다른 방식으로 땋았다. 그는 매일 거울을 보며 오늘은 무슨 매듭인지 물었다. 루카스는 18세기 직물 이름을 댔다. 그는 하나도 못 알아들었다. 그래도 좋았다."], ["N", "일곱 시 오십오 분. 다리. 이젤은 없었다. 대신 두 사람이 난간에 나란히 기대어 섰다. 그는 왼손으로 작은 스케치북에 연필 선을 그었다. 엉망이었다. 그래도 매일 그었다. 루카스는 그것을 한 번도 놀리지 않았다."], ["N", "여덟 시 오십 분. 루카스 출근. 그는 박물관으로 가서 할아버지 드로잉 스무 점의 배치를 큐레이터와 의논했다."], ["N", "저녁 여섯 시. 루카스가 앞치마를 둘렀다. 그는 소파에 앉았다. 그리고 그림이 시작됐다."], ["P", "거기 금색 조금. 아니, 조금 더 왼쪽. 거기요. 아니, 거기 말고 거기."], ["L", "'거기'를 세 번 말했는데 세 군데가 다 달라."], ["P", "ㅎㅎ 그럼 그냥 루카가 좋은 데요."], ["L", "네 그림이야."], ["P", "이제 반은 루카 그림이에요."], ["N", "루카스는 대답하지 않았다. 붓을 들었다. 잠깐 망설였다. 그리고 금색을 찍었다. 그가 말한 세 군데 중 어디도 아닌, 네 번째 자리에."], ["N", "그는 그것을 보고 한참 아무 말도 하지 않았다. 그리고 낮게 말했다."], ["P", "...거기가 맞아요."], ["L", "......"], ["P", "제가 말 못 한 데예요. 거기."], ["N", "세 번째 그림이 끝난 것은 7월 마지막 주였다. 다리 위의 새벽. 안개. 그리고 난간 위에 나란히 놓인 두 개의 손. 하나는 장갑 낀 손. 하나는 깁스한 손."], ["N", "다나가 영상통화로 그 그림을 보았다. 오래 보았다. 그리고 말했다."], ["D", "...이거 누가 그렸어?"], ["P", "우리요."], ["D", "'우리'?"], ["P", "저는 말하고, 루카는 칠하고요."], ["D", "이게 네 그림 중에 제일 좋아. 알지?"], ["P", "...알아요."], ["N", "화면 너머에서 다나가 루카스를 찾았다. 루카스는 부엌에서 붓을 빨고 있었다. 다나가 화면 너머로 소리쳤다."], ["D", "아스카니엔 씨! 이 사람 다음 작품도 같이 하실 거죠?"], ["L", "...깁스 풀 때까지만입니다."], ["D", "그건 두고 봐야 알죠."], ["N", "루카스는 대답하지 않았다. 붓을 빨던 손에 남색이 남아 있었다. 3주 동안 매일 빨았는데도 손톱 밑의 남색은 지워지지 않았다. 요나스는 복원실에서 그것을 보고 아무 말도 하지 않았다. 엘제 선생님도. 다만 엘제 선생님은 이번 달 루카스의 작업 목록에서 습식 세척 작업을 슬쩍 빼 주었다."], ["H", "10장. 깁스"], ["N", "8월 4일. 대학병원 정형외과. 의사가 작은 전기톱으로 깁스를 잘랐다. 루카스는 진료실 구석에 서서 그 소리를 들었다. 미간이 잔뜩 찌푸려져 있었다."], ["N", "깁스가 벌어졌다. 7주 만에 그의 오른팔이 나왔다. 하얬다. 가늘어져 있었다. 왼팔보다 눈에 띄게. 손목은 뻣뻣하게 굳어 있었다."], ["P", "......이게 제 팔이에요?"], ["N", "의사가 웃으며 말했다. 뼈는 잘 붙었다고. 이제 재활이라고. 하루에 세 번, 손목 돌리기, 손가락 쥐었다 펴기, 공 쥐기. 무리하지 말 것. 아프면 멈출 것. 3주쯤 지나면 가벼운 붓은 쥘 수 있을 거라고."], ["N", "그는 고개를 끄덕였다. 그리고 손가락을 쥐어 보려고 했다. 손가락이 반쯤 구부러지다 멈췄다. 더 이상 움직이지 않았다."], ["P", "......"], ["N", "그가 웃었다. 곤란하게. 그런데 루카스는 그 웃음 아래에 있는 것을 보았다. 새벽 세 시, 이젤 앞에서 '무서워요'라고 하던 얼굴."], ["N", "그날 밤, 작업실. 그는 소파에 앉아 오른손을 내려다보고 있었다. 의사가 준 고무공을 쥐었다 폈다 했다. 쥐어지지 않았다. 반쯤에서 멈췄다. 몇 번을 해도."], ["P", "...7주 동안 안 썼다고 이렇게 되는구나."], ["L", "근육이 굳은 거야. 돌아와."], ["P", "그걸 어떻게 알아요?"], ["L", "...모르지. 의사는 아니니까."], ["N", "루카스는 그 옆에 앉았다. 그리고 그의 오른손을 가져갔다. 자기 두 손 위에 올려놓았다. 천천히."], ["P", "루카?"], ["L", "가만히 있어."], ["N", "루카스는 그의 손바닥을 엄지로 눌렀다. 아주 천천히. 손바닥 가운데에서 바깥으로. 손가락 마디를 하나씩. 손목 안쪽의 굳은 힘줄을. 물에 젖어 들러붙은 종이를 펴듯이. 섬유가 끊어지지 않을 만큼만."], ["N", "그는 숨을 멈췄다. 그리고 천천히 내쉬었다. 손가락에 조금씩 온기가 돌았다."], ["L", "...아프면 말해."], ["P", "안 아파요."], ["L", "진짜로 말해. 참지 말고."], ["P", "......조금 아파요. 엄지 아래쪽."], ["L", "여기?"], ["P", "네."], ["N", "루카스는 그 자리를 더 천천히 눌렀다. 압력을 반으로 줄였다. 그리고 계속했다."], ["L", "섬유는 대부분 남아 있어. 사라진 것처럼 보이는 것뿐이야. 천천히 펴면, 대부분 돌아와."], ["P", "......그거 코니아일랜드에서 한 말이에요."], ["L", "그때 맞았잖아. 지금도 맞아."], ["N", "30분 뒤. 루카스가 손을 놓았다. 그는 고무공을 다시 쥐었다. 손가락이 구부러졌다. 반을 지나서, 조금 더. 다 쥐어지지는 않았다. 그래도 아까보다 1센티미터 더."], ["P", "......루카."], ["L", "응."], ["P", "1센티 더 됐어요."], ["L", "봤어."], ["P", "내일도 해 줄 거예요?"], ["L", "하루 세 번이랬잖아. 아침, 점심, 저녁."], ["P", "점심엔 루카 출근하잖아요."], ["L", "점심시간에 올게."], ["P", "복원실에서 여기까지 15분인데요."], ["L", "뛰면 8분이야."], ["P", "...뛰지 마요. ㅎㅎ"], ["L", "이번엔 뛸 거야."], ["N", "그는 대답하지 못했다. 웃다가, 얼굴을 왼손으로 가렸다. 어깨가 떨렸다. 루카스는 그것을 보며 그의 오른손을 다시 가져갔다. 그리고 아무 말 없이, 두 번째 마사지를 시작했다."], ["H", "11장. 네 번째"], ["N", "8월 중순. 네 번째 그림이 시작되었다."], ["N", "이번엔 방식이 달라졌다. 그는 이제 가벼운 붓을 쥘 수 있었다. 아주 잠깐씩. 10분 그리면 손목이 떨렸다. 그러면 멈췄다. 루카스가 이어받았다. 손목이 쉬면, 다시 그가."], ["N", "두 사람은 번갈아 붓을 들었다. 한 사람이 멈추면 다른 사람이 움직이고, 다른 사람이 멈추면 한 사람이 움직이는. 뉴욕 지하 복원실에서 민디가 보았던 그 춤처럼. 다만 이번엔, 두 사람이 같은 캔버스 위에서 추고 있었다."], ["N", "어느 날 저녁, 그가 붓을 내려놓고 손목을 주무르며 캔버스를 보았다. 그리고 웃었다."], ["P", "...루카, 이거 봐요. 어디가 제 거고 어디가 루카 건지 모르겠어요."], ["L", "여기 왼쪽 위는 나야. 붓 자국이 일정해."], ["P", "ㅎㅎ 그럼 여기는요?"], ["L", "......그것도 나야."], ["P", "이건 휙휙인데요?"], ["L", "배웠어. 너한테."], ["N", "그는 루카스를 보았다. 앞치마는 남색과 금색 범벅이었다. 뺨에도 금색이 조금 묻어 있었다. 손톱 밑은 영영 지워지지 않을 것처럼 물들어 있었다. 지하 복원실의 그 사람과는 전혀 다른 모습이었다."], ["N", "그런데 붓을 쥔 손은 똑같았다. 정확하고, 조심스럽고, 다정한."], ["P", "...루카."], ["L", "왜."], ["P", "루카 손 그려도 돼요? 지금. 붓 쥔 거."], ["L", "그건 쉬는 손 아닌데."], ["P", "알아요."], ["N", "루카스는 잠깐 그를 보았다. 그리고 붓을 쥔 손을 캔버스 앞에서 멈추었다. 그대로."], ["L", "...그려."], ["N", "그는 왼손으로 연필을 쥐었다. 아직 서툰 왼손으로. 그리고 루카스의 일하는 손을 처음으로 그렸다. 그 선은 흔들렸다. 엉망이었다. 그런데 그가 그린 어떤 손보다 따뜻했다."], ["H", "12장. 다섯 번째"], ["N", "8월 마지막 주. 전시까지 2주. 마지막 다섯 번째 캔버스가 이젤 위에 올라갔다. 하얀 캔버스였다."], ["N", "그는 그 앞에 서서 오래 아무것도 하지 않았다. 루카스는 앞치마를 두르고 기다렸다."], ["L", "...뭐 그릴 거야."], ["P", "모르겠어요."], ["L", "네 개 그렸잖아. 다리, 안개, 손, 손. 다섯 번째는."], ["P", "......할아버지 드로잉 스무 점 중에 마지막 거 기억나요? 마거릿 초상."], ["L", "기억해. 내가 붙은 거 뗐잖아."], ["P", "그거 옆에 걸릴 거예요. 이 그림이."], ["N", "그는 캔버스를 보았다. 그리고 루카스를 보았다."], ["P", "할아버지는 '머물러도 된다는 걸 가르쳐 준 사람'을 그렸어요. 저도 그거 그리고 싶어요."], ["L", "......"], ["P", "근데 루카 얼굴은 다섯 번째가 아니에요. 이미 그렸으니까. 다리 위에서. 이번엔 다른 거 그리고 싶어요."], ["L", "뭘."], ["P", "우리요."], ["N", "루카스는 대답하지 않았다. 그는 붓을 들었다. 오른손으로. 손목이 아직 조금 떨렸다. 그는 루카스를 돌아보았다."], ["P", "루카, 손 줘요."], ["L", "...?"], ["P", "제 손 위에요. 루카 손을. 같이 그어요."], ["N", "루카스는 잠깐 그 손을 보았다. 붓을 쥔, 아직 가늘어진 오른손. 그리고 자기 오른손을 그 위에 겹쳤다. 붓을 쥔 그의 손을, 위에서 감싸듯이."], ["N", "뉴욕의 지하 복원실에서, 루카스는 그의 손목을 잡고 90년 된 종이 여백에 그 손가락을 내려놓아 주었다. 그때는 루카스가 이끌었다. 이번엔 둘 다 이끌지 않았다. 그냥, 같이 움직였다."], ["N", "붓이 캔버스에 닿았다. 남색. 한 번. 그의 손목이 떨렸다. 루카스의 손이 그 떨림을 받쳤다. 두 번. 세 번."], ["N", "그날 밤, 두 사람은 그 캔버스 앞에서 열 시간을 보냈다. 말은 거의 하지 않았다. 손만 움직였다. 그의 손이 지치면, 루카스의 손이 더 많이 움직였다. 루카스의 손이 망설이면, 그의 손이 방향을 잡았다."], ["N", "새벽 네 시. 붓이 멈췄다."], ["N", "두 개의 손이었다. 하나의 붓을 같이 쥔. 아래 손은 하얗고 가늘었고, 손목에 희미한 흉터가 있었다. 위 손은 손톱 밑이 남색으로 물들어 있었다. 배경은 남색이었다. 그리고 그 남색 위에, 아주 작은 금빛 하나."], ["P", "......제목 뭐로 할까요."], ["L", "네 그림이야. 네가 정해."], ["P", "우리 그림이에요."], ["N", "루카스는 오래 그 그림을 보았다. 그리고 낮게 말했다."], ["L", "......'임시'."], ["P", "네?"], ["L", "임시로 시작한 거니까. 깁스 풀 때까지만이라고."], ["N", "그는 그 말을 듣고 한참을 웃었다. 그리고 웃다가 멈추고, 루카스를 보았다."], ["P", "...근데 깁스 풀었잖아요. 3주 전에."], ["L", "......"], ["P", "루카 아직 여기 있어요."], ["L", "...재활 중이니까."], ["P", "재활도 다음 주에 끝나요."], ["L", "......"], ["N", "루카스는 대답하지 않았다. 대신 붓을 빨러 부엌으로 갔다. 등을 돌린 채로. 귀 끝이 붉었다."], ["N", "그는 캔버스 아래 구석에, 아주 작게 제목을 적었다. 오른손으로. 조금 떨리는 글씨로. 'Vorläufig' — 독일어로 '임시'. 루카스가 가르쳐 준 철자 그대로."], ["H", "13장. 같은 벽"], ["N", "9월 12일 저녁. 쿠어팔츠 박물관. 전시 '하르트만과 손자' 개막식."], ["N", "사람이 많았다. 그런데 휘트니 때만큼 시끄럽지는 않았다. 하이델베르크였다. 사람들은 속삭였다. 그리고 오래 보았다."], ["N", "전시실은 두 개의 벽으로 나뉘어 있었다. 왼쪽 벽에 하르트만의 드로잉 스무 점. 오른쪽 벽에 손자의 그림 다섯 점. 그리고 맨 끝에서, 두 벽이 만났다. 그 모서리에, 두 작품이 나란히 걸려 있었다."], ["N", "왼쪽은 마거릿의 초상. '머물러도 된다는 것을 가르쳐 준 마거릿에게.' 오른쪽은 하나의 붓을 쥔 두 손. 'Vorläufig'."], ["N", "그 모서리 앞에서 사람들이 가장 오래 머물렀다. 설명판에는 이렇게 적혀 있었다."], ["N", "'다섯 번째 작품은 작가가 오른손목 골절 이후 한 복원가와 함께 그렸다. 작가는 말하고, 복원가는 칠했다. 마지막 작품은 두 사람이 하나의 붓을 함께 쥐고 그렸다.'"], ["O", "...'임시'라니. 저 애답다."], ["N", "엘제 선생님이 모서리 앞에 서서 웃었다. 요나스가 그 옆에서 고개를 끄덕였다. 다나는 샴페인 잔을 들고 큐레이터와 이야기하고 있었다. 민디는 뉴욕에서 날아와, 휴대폰으로 그 그림을 백 장째 찍고 있었다."], ["N", "그리고 그 모서리에서 조금 떨어진 곳, 전시실 구석의 습도계 옆에, 루카스가 서 있었다. 검은 재킷. 손톱 밑은 여전히 남색이었다. 습도계를 보고 있었다. 50퍼센트."], ["P", "...루카, 습도 또 봐요?"], ["L", "52였어. 아까. 큐레이터한테 말했어."], ["P", "ㅎㅎ 오늘도요?"], ["L", "오늘이니까."], ["N", "그가 루카스 옆에 섰다. 어깨가 닿았다. 그는 오늘 머리를 루카스가 땋아 준 대로 하고 있었다. 18세기 플랑드르 레이스 매듭이라고 했다. 그는 여전히 그게 뭔지 몰랐다. 그래도 좋았다."], ["N", "박물관 관장이 작가를 단상으로 불렀다. 한마디 해 달라고. 그는 단상에 올라갔다. 사람들이 조용해졌다."], ["P", "...할아버지는 1936년에 이 도시를 떠났어요. 그리고 다시 돌아오지 못했어요. 그런데 오늘, 할아버지 그림이 여기 돌아왔어요. 그리고 저는 여기 살아요."], ["N", "박수가 쏟아졌다. 그는 그 박수가 가라앉기를 기다렸다. 그리고 전시실 구석, 습도계 옆을 보았다."], ["P", "이 전시는 제 손으로 다 못 그렸어요. 반은 다른 손이 그렸어요. 그 손은 원래 백 년 된 종이를 고치는 손이에요. 그 사람이 그랬어요. 섬유는 대부분 남아 있다고. 천천히 펴면, 대부분 돌아온다고."], ["N", "사람들이 그의 시선을 따라 돌아보았다. 루카스는 습도계에서 눈을 떼지 않았다. 귀 끝이 붉었다. 재킷 깃까지 붉었다."], ["P", "...그 말이 맞았어요. 대부분 돌아왔어요."], ["N", "그가 단상에서 내려왔다. 사람들이 그를 에워싸려 했다. 그는 그 사이를 빠져나와, 다시 습도계 옆으로 갔다. 루카스 옆으로."], ["L", "......그런 말 하지 마. 사람들 앞에서."], ["P", "ㅎㅎ 싫었어요?"], ["L", "......"], ["P", "루카."], ["L", "싫었으면 나갔어."], ["N" const $=id=>document.getElementById(id);
const KEY='new take3-progress';
const steps=STORY.filter(s=>s[0]!=='H').length;
let pos=0,shown=0;   // pos: STORY 인덱스, shown: 보여 준 장면 수(제목 제외)

(()=>{const c=$('heart').getContext('2d'),m=['.##.##.','#######','#######','.#####.','..###..','...#...'];
  c.fillStyle='#fff';m.forEach((r,y)=>[...r].forEach((ch,x)=>ch==='#'&&c.fillRect(x,y,1,1)));})();

function build(s){
  const k=s[0],t=s[1];
  if(k==='H'){const e=document.createElement('div');e.className='chap';e.textContent=t;return e;}
  if(k==='N'){const e=document.createElement('div');e.className='nar';e.textContent=t;return e;}
  const who=k==='L'?'me':({K:'k',M:'m',O:'o',D:'d',R:'r'}[k]||'p'),e=document.createElement('div');
  e.className='msg'+(who==='me'?' me':'');
  const img=new Image();img.className='av';img.alt='';img.src=AV[who];
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;
  $('panel').replaceChildren();
  const c=document.createElement('div');c.className='cover';c.id='cover';
  c.innerHTML='<b>new take#3</b><span>하이델베르크, 임시로 시작한 것.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span>';
  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
</body>
</html>
