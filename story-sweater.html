<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>출전 자격 없음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#1c2747; --ink:#141012; --navy:#27345e; --moss:#6b7a3a; --mustard:#d9a632; --pink:#e79bb4; --red:#c8102e;
  --pink-soft:#f6dfe6; --face:#e6dccb; --hi:#ffffff; --lo:#8c7b69; --paper:#fbf7ef;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:14px 14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%;position:relative;z-index:1}
.back{display:inline-block;align-self:flex-start;padding:4px 12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:700 13px/1.4 var(--body);text-decoration:none}
h1{color:#fff7e8;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--mustard);margin-top:6px}
/* 스웨터 무늬 띠: 남색 · 이끼 · 겨자 · 분홍 지그재그 · 빨강 한 줄 */
.knit{height:22px;background:
  linear-gradient(135deg,var(--pink) 25%,transparent 25%) 0 7px/12px 8px repeat-x,
  linear-gradient(225deg,var(--pink) 25%,transparent 25%) 0 7px/12px 8px repeat-x,
  linear-gradient(var(--mustard) 0 6px,var(--navy) 6px 15px,var(--moss) 15px 22px);position:relative}
.knit::after{content:"";position:absolute;left:28%;width:22px;top:9px;height:4px;background:var(--red)}
.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #f3ecdf}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #10162b;border-bottom:3px solid var(--mustard)}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px;align-items:center}
.cover b{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:-1px}
.cover span{font-size:13px;color:#5c5456;line-height:1.6}
.cover svg{width:120px;height:110px}
.chap{align-self:center;text-align:center;font-weight:800;font-size:12px;padding:4px 12px;background:var(--moss);color:#fff;text-shadow:1px 1px 0 #3c4520;
  box-shadow:inset -1px -1px 0 #3c4520,inset 1px 1px 0 #a7b46e,0 0 0 2px var(--mustard);margin-top:8px}
.tune{display:block;margin:6px auto 0;padding:2px 10px;border:2px solid var(--ink);background:var(--navy);color:#fff;font:700 11px/1.5 var(--body);cursor:pointer;text-shadow:none;border-radius:2px}
.tune:active{transform:translateY(1px)}
.tune:focus-visible{outline:2px dashed var(--mustard);outline-offset:2px}
.nar{align-self:stretch;background:#f3ece0;border:1px dashed #b9a78f;padding:8px 10px;font-size:13px;line-height:1.6;color:#4b4244;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.msg.p .bub{background:#fff;border-left:6px solid var(--navy)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a9294;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #f3ecdf}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--navy);color:#fff;text-shadow:1px 1px 0 #10162b;border-bottom:3px solid var(--mustard)}
.btn:disabled{color:#8a8484;text-shadow:none;cursor:default}
.btn.main:disabled{background:#7d84a0}
.btn:focus-visible{outline:2px dashed var(--mustard);outline-offset:3px}
.hint{font-size:12px;color:#cfd6ea;margin:0;text-align:center;word-break:keep-all}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html" onclick="if(history.length>1){history.back();return false}">← 목록으로</a>
  <h1>출전 자격 없음<small>단편 · 세 번째 겨울 · 21. Dezember</small></h1>
  <div class="win">
    <div class="bar">
      <canvas class="heart" id="heart" width="7" height="6"></canvas>
      <span class="ttl" id="ttl">🎄 어글리 스웨터 파티 (진짜로 함)</span>
      <span class="wbtn">_</span><span class="wbtn">□</span><span class="wbtn">×</span>
    </div>
    <div class="knit" aria-hidden="true"></div>
    <div class="menu"><span><u>파</u>일</span><span><u>편</u>집</span><span><u>보</u>기</span><span><u>대</u>화</span></div>
    <div class="panel" id="panel"></div>
    <div class="input"><div class="field">메시지를 입력하세요</div><div class="send">보내기</div></div>
    <div class="status"><span id="st1">● 온라인 · 하이델베르크</span><span id="st2">0 / 0</span></div>
  </div>
  <div class="ctrl">
    <button class="btn" id="reset">처음부터</button>
    <button class="btn main" id="next">시작</button>
  </div>
  <p class="hint" id="hint"></p>
</div>

const STORY=[["H", "프롤로그. 단체방"], ["N", "결혼하고 세 번째 겨울. 12월 첫째 주 저녁."], ["N", "그의 휴대폰이 연달아 울렸다. 작년 크리스마스에 요나스가 만든 단체방 '루스 여사님 수송 작전'이 아직 살아 있었다. 방 이름만 바뀌어 있었다. '🎄 어글리 스웨터 파티 (진짜로 함)'."], ["D", "올해는 뉴욕식으로 간다. 어글리 스웨터 파티."], ["D", "제일 못생긴 스웨터 입고 오는 사람이 1등. 상품 있음."], ["M", "저 이거 진짜 해 보고 싶었어요!!! 영화에서만 봤어요"], ["R", "저 하이델베르크 비행기표 끊었어요 ㅎㅎ 사진은 제가 찍을게요"], ["U", "뜨개바늘을 꺼냈어요."], ["O", "장소는 우리 집. 21일 토요일 저녁 일곱 시. 서로 스웨터는 당일까지 비밀."], ["D", "선생님 댁에서요?? 선생님 이런 거 하세요??"], ["O", "우리 집이 제일 넓어."], ["N", "그가 휴대폰을 들고 웃자, 소파 끝에서 책을 읽던 루카스가 고개를 들었다."], ["P", "루카, 단체방 봤어요? 21일에 엘제 선생님 댁에서 파티래요 ㅎㅎ"], ["L", "…무슨 파티."], ["P", "어글리 스웨터 파티요. 크리스마스에 일부러 제일 촌스러운 스웨터를 입고—"], ["L", "…그게 뭔데."], ["P", "미국에서 하는 거예요. 순록이랑 눈사람 막 붙어 있고, 반짝이도 달고, 그걸 서로 보고 웃는—"], ["L", "관심 없어."], ["N", "루카스는 다시 책으로 고개를 숙였다. 그날 밤 루카스는 단체방 알림을 껐다."], ["N", "파티가 뭔지는 그 자리에서 머릿속에서 지워졌다. '21일, 엘제 선생님 집'만 아주 희미하게 남았다."], ["N", "루카스에게는 그보다 중요한 게 따로 있었다. 서재 책상 맨 아래 서랍. 습도계가 붙은 종이 상자 안에, 반쯤 뜬 남색 몸판이 들어 있었다."], ["H", "1장. 아는 색"], ["N", "루카스는 10월부터 스웨터를 뜨고 있었다."], ["N", "작년 크리스마스에 손가락 구멍 여섯 개짜리 장갑을 뜬 뒤로, 뜨개질은 루카스의 손에 붙었다. 핀셋으로 0.1밀리를 다루는 손이었다. 코 하나 빠뜨리지 않았고, 단 하나 틀어지지 않았다."], ["N", "복원실 휴게실. 점심시간마다 루카스는 샌드위치 대신 바늘을 들었다. 요나스가 건너편에서 그걸 보고 있었다."], ["M", "선배님, 이제 저보다 잘하세요."], ["L", "알아."], ["M", "…근데 그 실요. 저번에 가격 들었는데요. 한 타래가 제 월세던데요."], ["L", "메리노에 캐시미어 30퍼센트야."], ["M", "그러니까 왜요…"], ["L", "피부에 닿는 거야."], ["M", "그리고 선배님 점심은요."], ["L", "…이따 먹어."], ["N", "요나스는 그 '이따'가 오지 않는다는 걸 알았다. 그래도 루카스의 얼굴을 보고는 아무 말도 하지 않았다. 바늘을 움직이는 동안 루카스의 입꼬리가 아주 조금 올라가 있었다. 본인은 모르는 것 같았다."], ["N", "치수는 잴 필요가 없었다. 매일 아침 단추 서른네 개를 채우는 손이었다. 어깨 너비도, 팔 길이도, 가슴 둘레도 손이 알고 있었다."], ["N", "소매는 1센티 길게. 붓을 들면 손목이 드러나니까. 목둘레는 넉넉하게. 땋은 머리가 걸리지 않게."], ["N", "문제는 색이었다."], ["N", "루카스는 '어울리는 색'을 몰랐다. 종이의 색이라면 알았다. 18세기 넝마 종이의 누런 기, 철분 잉크가 바래 가는 갈색. 하지만 무엇과 무엇이 어울리는지는 습도처럼 숫자로 오지 않았다."], ["N", "그래서 루카스는 아는 색으로 골랐다."], ["N", "몸판은 남색. 뉴욕 4층 작업실에서 그가 1년 만에 처음 딴 물감 뚜껑의 색."], ["N", "소매는 탁한 이끼색. 매일 아침 7시 55분, 옛 다리 아래로 흐르는 겨울 네카어 강의 색."], ["N", "어깨는 겨자색. 루스를 맞던 날 쥐고 있던 해바라기 다섯 송이의 색."], ["N", "가슴에는 분홍 지그재그 한 줄. 그리고 왼쪽 가슴, 심장 자리에 빨강 한 줄. 딱 한 군데만."], ["N", "한 색 한 색은 다 이유가 있었다. 다섯 색을 한 스웨터에 모으면 어떻게 보일지는, 루카스의 계산에 없었다."], ["N", "밤에는 서재 문을 닫고 떴다. 그는 루카스가 서재에서 무얼 하는지 묻지 않았다. 작년 크리스마스에 배웠다. 묻지 않고 기다리는 것도 선물이라는 걸."], ["N", "12월 19일 밤 열한 시. 마지막 코를 막았다."], ["N", "루카스는 다 뜬 스웨터를 책상 위에 펼쳐 놓고 오래 내려다보았다. 솔기를 손끝으로 따라가 보았다. 1밀리도 틀어지지 않았다. 손바닥으로 쓸어 보았다. 보들보들했다."], ["L", "……됐다."], ["N", "귀 끝이 붉어졌다. 혼자 있는데도."], ["H", "2장. 입어"], ["N", "12월 20일 아침."], ["N", "루카스는 단추 서른네 개를 다 채우고, 머리를 끝에서부터 빗어 세 갈래로 땋았다. 6분 30초. 그러고는 말없이 서재로 들어가더니, 무산성 중성지로 싼 꾸러미를 들고 나왔다. 리본은 세 갈래로 땋은 아마실이었다."], ["P", "어, 선물이에요? 아직 20일인데요 ㅎㅎ"], ["L", "…다 떠서. 기다리기 싫어."], ["N", "그가 아마실 매듭을 풀었다. 중성지가 열렸다."], ["N", "남색. 이끼색. 겨자색. 분홍 지그재그. 그리고 빨강 한 줄."], ["N", "그는 3초 동안 말이 없었다."], ["N", "그리고 머릿속에서 무언가가 딸깍 맞아떨어졌다. 단체방. 21일. 엘제 선생님 댁. 제일 못생긴 스웨터."], ["N", "관심 없다더니. 루카스가, 그 파티에 입고 가라고, 손으로 직접."], ["P", "루카…! 내일 파티용이죠? ㅎㅎ"], ["N", "루카스는 '파티'라는 말을 반쯤만 들었다. 내일. 엘제 선생님 집. 거기 입고 가겠다는 얘기 같았다. 입고 나가겠다는 것보다 좋은 대답은 없었다."], ["L", "…응. 입고 가."], ["P", "관심 없다면서요 ㅎㅎ 완전 신경 썼네요."], ["L", "…신경은 썼어."], ["N", "그는 그 자리에서 셔츠 위로 스웨터를 입었다. 목둘레를 지나갈 때 땋은 머리가 하나도 걸리지 않았다. 어깨가 맞았다. 소매 끝이 손목뼈 1센티 아래에서 멈췄다."], ["P", "와… 이거 왜 이렇게 부드러워요?"], ["L", "메리노에 캐시미어. 30퍼센트."], ["P", "진짜 맞춘 것 같아요. 어깨가 딱 맞아요."], ["L", "맞춘 거야."], ["N", "그는 거울 앞에서 한 바퀴 돌았다. 남색과 이끼색과 겨자색이 한꺼번에 돌았다. 화가의 눈이 그 조합 앞에서 잠깐 아득해졌다. 이 정도면."], ["P", "내일 저 1등 할 것 같아요 ㅎㅎ"], ["N", "루카스는 1등이 뭔지 묻지 않았다. 그가 거울 앞에서 웃고 있었다. 그거면 됐다."], ["N", "그날 루카스는 복원실에서 하루 종일 기분이 좋았다. 요나스가 핀셋을 바닥에 떨어뜨렸는데 아무 말도 하지 않았다. 요나스는 그게 더 무서웠다."], ["H", "3장. 엘제 선생님 댁"], ["N", "12월 21일 저녁 일곱 시. 대학 뒤편 언덕, 엘제 선생님의 집. 벽이란 벽은 전부 책이었고, 거실 한가운데 작은 트리가 서 있었다."], ["N", "다나는 빨간 코에 불이 들어오는 순록 스웨터. 민디는 트리용 전구를 스웨터 위에 칭칭 감았다. 요나스는 앞판에 주황색 고양이 얼굴을 세 개 바느질해 붙였다. 루스는 직접 뜬 스웨터 한가운데 칠면조 한 마리."], ["N", "엘제 선생님은 늘 입는 회색 카디건 위에 반짝이 줄 하나를 둘렀다."], ["O", "이게 내 최선이야."], ["D", "선생님 그건 반칙이에요!"], ["N", "그리고 그가 코트를 벗었다."], ["N", "거실이 1초 조용했다."], ["D", "…오 마이 갓."], ["R", "잠깐만요, 사진, 사진—"], ["N", "찰칵. 찰칵. 찰칵."], ["D", "이건 진짜다. 남색에 겨자에 이끼색…… 거기다 분홍 지그재그? 이걸 어떻게 한 몸에 넣어?"], ["R", "근데 핏 뭐예요? 어깨 진짜 예뻐요. 이런 모양은 어디서 샀어요?"], ["U", "…실이 좋네. 아주 좋아."], ["D", "핏은 명품인데 색이 대참사야! 이런 건 대체 어디서 구했어? ㅋㅋㅋ"], ["N", "다들 웃었다. 다나는 배를 잡았고, 민디는 소파에 쓰러졌다. 그도 같이 웃었다. 그러고는 자랑스럽게 가슴을 폈다."], ["P", "루카가 떠 준 거예요 ㅎㅎ"], ["D", "루카가?! 관심 없다던 루카가? 이 파티 때문에 이걸 떴다고?"], ["D", "루카, 너 이번에 진심이었구나. 올해 1등은 정해졌다!"], ["N", "웃음이 한 번 더 크게 터졌다."], ["N", "요나스만 웃지 않았다."], ["N", "요나스는 그 실을 알았다. 한 타래 값이 자기 월세인 실. 10월부터 석 달, 점심을 거르고 휴게실에서 바늘을 움직이던 손. 그때 선배님 입꼬리."], ["M", "저기, 다나 씨, 그거—"], ["N", "요나스가 현관 쪽을 보았다. 그리고 입을 다물었다."], ["N", "루카스는 현관 앞에 서 있었다. 코트도 아직 벗지 않은 채였다."], ["P", "저 이거 매년 입을 거예요. 루카가 저 입으라고 준 거니까요 ㅎㅎ 소중히요."], ["D", "매년 1등 하겠네!"], ["N", "다시 웃음이 터졌다. 루카스는 웃지 않았다. 대신 아주 천천히, 정확하게, 코트 단추를 하나씩 풀었다."], ["N", "화난 얼굴은 아니었다. 요나스는 차라리 화난 얼굴이었으면 했다."], ["H", "4장. 112쪽"], ["N", "파티는 계속됐다. 다나가 글뤼바인을 돌렸고, 민디는 순위표를 만들었고, 요나스는 떨어진 고양이 얼굴 하나를 다시 꿰맸다."], ["N", "루카스는 거실 구석, 책장 옆 1인용 의자에 앉았다. 손에 잡히는 대로 책 한 권을 뽑았다. 『18세기 프로이센 관청 서식 연구』. 아무 데나 펼쳤다."], ["N", "112쪽이었다. 루카스는 그 페이지를 넘기지 않았다."], ["N", "이번에는 반쪽만 들은 게 아니었다. 전부 들었다. 그래서 더 이상했다."], ["N", "아무도 나쁜 말을 하지 않았다. 그는 놀림받은 게 아니었다. 그는 자랑하고 있었다. 루카스가 떠 준 거라고. 매년 입겠다고. 진심으로."], ["N", "진심으로, 그걸 '제일 못생긴 스웨터'로."], ["N", "루카스 눈에는 예뻤다. 남색도, 강물 색도, 해바라기 색도. 하나씩 고를 때마다 그를 떠올렸다. 다 모으면 그가 될 줄 알았다."], ["N", "112쪽의 서식 표가 조금 흐려졌다. 루카스는 눈을 한 번 감았다 떴다."], ["N", "민디의 휴대폰이 또 울었다. 순위표 1등 칸에 다나가 크게 적었다. '루카 남편 (만장일치)'."], ["N", "루카스가 책을 덮었다. 의자에서 일어나 거실을 가로질렀다. 현관으로 가는 길에 그의 옆을 지나쳤다."], ["L", "…나 바람 좀."], ["P", "네? 루카, 코트는—"], ["N", "문이 닫혔다. 천천히. 소리가 거의 나지 않게."], ["N", "그는 닫힌 문을 보았다. 루카스는 문을 천천히 닫는 사람이었다. 화가 났을 때. 아니면—"], ["N", "구석 의자 위에 책이 엎어져 있었다. 그가 다가가 책을 들었다. 112쪽. 프로이센 관청 서식. 루카스가 저걸 30분 동안 읽었을 리 없었다."], ["N", "머릿속에서 다시 딸깍 소리가 났다. 이번엔 반대 방향으로."], ["N", "관심 없어. …그게 뭔데. …응, 입고 가. 맞춘 거야. 신경은 썼어."], ["N", "그리고 그 실. 캐시미어 30퍼센트. 루카스는 장난으로 그런 실을 사는 사람이 아니었다. 아끼는 것에만 습도계를 붙이는 사람이었다."], ["P", "……아."], ["M", "…그거, 선배님이 10월부터 뜨신 거예요. 점심 거르시고요."], ["N", "루스가 다가와 그의 소매를 잡았다. 그러고는 그의 왼쪽 가슴, 빨강 한 줄을 손가락으로 짚었다."], ["U", "이거 봤니. 빨강이 여기 한 군데만 있어. 심장 자리에."], ["U", "못생기게 뜨려는 사람은 이렇게 안 떠."], ["N", "그는 코트도 집지 않고 현관문을 열었다."], ["D", "야, 어디 가— 밖에 영하야!"], ["O", "둬."], ["H", "5장. 바람"], ["N", "엘제 선생님 집 앞 계단 아래, 가로등 하나. 영하 3도."], ["N", "루카스는 셔츠 바람으로 서 있었다. 찬 바람이 귀 끝을 때렸다. 이번엔 귀가 붉은 이유가 추위라서 다행이었다."], ["N", "이러면 안 됐다."], ["N", "그는 잘못한 게 없었다. 웃은 사람들도 잘못한 게 없었다. 파티가 뭔지 끝까지 듣지 않은 건 루카스였다. '관심 없어'로 자른 것도, '응'이라고 대답한 것도."], ["N", "이건 반쪽짜리야."], ["N", "열아홉 살에 반쪽 편지를 이별 편지라고 단정했던 사람. 1주년 전날 밤에도 반쪽만 듣고 판결했던 사람. 그 사람이 또 골목에 서서 판결을 내리려 하고 있었다."], ["N", "들어가서 그의 말을 들어야 했다. 그걸 아는데 발이 움직이지 않았다."], ["N", "문이 열렸다. 가로등 불빛 아래로 남색과 겨자색과 이끼색이 계단을 뛰어 내려왔다. 역시 코트도 없이."], ["N", "루카스의 어깨에서 무언가가 조금 내려앉았다. 찬 바람보다 먼저, 그 색이 보여서."], ["P", "루카……."], ["N", "그는 계단 마지막 칸에서 멈췄다. 두 걸음 거리. 눈가가 젖어 있었다. 바람 때문은 아니었다."], ["N", "루카스는 그 얼굴을 오래 보지 못했다. 시선이 그의 가슴께로 내려갔다. 빨강 한 줄."], ["L", "…나도 알아. 못생겼어."], ["P", "아니에요."], ["L", "다나가 대참사래."], ["P", "다나는 코에 불 들어오는 순록 입고 왔어요."], ["N", "루카스의 입꼬리가 아주 조금 움직였다가 멈췄다."], ["L", "…화난 거 아니야."], ["P", "알아요."], ["L", "너한테도, 아무한테도."], ["P", "네."], ["L", "너 놀림받은 거 아닌 것도 알아."], ["L", "…근데 너는 진짜로 그걸 내 선물로 생각했잖아. 못생긴 거, 파티용으로. 그래서 소중하다고."], ["L", "그게 더—"], ["N", "루카스는 말을 끝내지 못했다. '속상해'는 루카스가 한 번도 소리 내 본 적 없는 단어였다."], ["N", "그가 한 계단 내려왔다. 두 걸음이 한 걸음이 됐다."], ["P", "루카. 저 이제 말 끝까지 할게요. 중간에 들어가면 안 돼요."], ["L", "……"], ["P", "어제 이거 열었을 때, 저 3초 동안 말 못 했잖아요."], ["L", "…응."], ["P", "그 3초 동안 파티 생각만 했어요. 그래서 지금 다시 볼게요. 제대로요."], ["N", "그가 가로등 아래에서 자기 몸을 내려다보았다. 화가가 팔레트를 읽는 눈이었다."], ["P", "이 남색……. 4층 작업실이죠. 제가 1년 만에 처음 딴 물감."], ["N", "루카스가 고개를 들었다."], ["P", "소매는, 아침마다 다리 밑으로 흐르는 강. 겨울 강이요."], ["P", "겨자색은 해바라기. 엄마 오시던 날."], ["P", "분홍은…… 이건 모르겠어요."], ["N", "루카스의 손끝이 올라와 그의 뺨에 아주 잠깐 닿았다가 떨어졌다."], ["L", "…네가 웃을 때 여기."], ["P", "……빨강은 한 군데만."], ["L", "네가 하면 세 군데 있으니까."], ["N", "그가 웃었다. 젖은 눈으로."], ["P", "루카. 이거 못생긴 거 아니에요. 이건 그림이에요. 루카가 그린 거."], ["P", "저 평생 색을 예쁘게 섞는 법만 배웠어요. 근데 이런 건 몰랐어요. 하나도 안 어울리는데, 하나도 뺄 게 없는 거."], ["P", "매년 입겠다고 한 거, 그건 진짜예요. 파티용이라서가 아니라요. 루카가 저 입으라고 준 거니까. 그건 어제나 지금이나 똑같아요."], ["P", "대신 하나는 바꿀게요. 이거 1등 못 해요. 실격이에요."], ["L", "…왜."], ["P",   const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0&&$('cover'))$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]==='H'){curChap=chapKey(s[1]);continue;}
    shown++;break;
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;curChap=null;
  $('panel').innerHTML=COVER;
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
$('panel').innerHTML=COVER;
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();
})();
</script>

<script>
(function(){const c=document.getElementById('snow'),x=c.getContext('2d');let w,h,f=[];
function rs(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio}
rs();addEventListener('resize',rs);
for(let i=0;i<70;i++)f.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,s:.0004+Math.random()*.0009,d:Math.random()*6});
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(t){x.clearRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.75)';
for(const p of f){if(!still){p.y+=p.s;if(p.y>1.02){p.y=-.02;p.x=Math.random()}}
const px=(p.x+Math.sin(t/2400+p.d)*.01)*w,py=p.y*h;x.beginPath();x.arc(px,py,p.r*devicePixelRatio,0,7);x.fill()}
if(!still)requestAnimationFrame(draw)}
requestAnimationFrame(draw)})();
</script>
