<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take#7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#173a2a; --ink:#141012; --pink:#c8102e; --pink-soft:#d9eedc;
  --face:#e6dccb; --hi:#ffffff; --lo:#8c7b69; --paper:#fbf7ef;
  --gold:#e3c26f; --pine:#1e6b3a; --deep:#7f0a1d;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#fff7e8;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--gold);margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #f3ecdf}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 var(--deep);background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.10) 10px 20px);border-bottom:3px solid var(--gold)}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#5c5456;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--deep);
  box-shadow:inset -1px -1px 0 var(--deep),inset 1px 1px 0 #ff8a98,0 0 0 2px var(--gold);margin-top:6px}
.nar{align-self:stretch;background:#f3ece0;border:1px dashed #b9a78f;padding:8px 10px;font-size:13px;line-height:1.55;color:#4b4244;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a9294;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #f3ecdf}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--deep);background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.10) 10px 20px);border-bottom:3px solid var(--gold)}
.btn:disabled{color:#8a8484;text-shadow:none;cursor:default}
.btn.main:disabled{background:#d99aa3}
.btn:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
.hint{font-size:12px;color:#cfe0d2;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
.carol{display:inline-block;margin-top:6px;padding:3px 10px;border:2px solid #333;background:var(--pine);color:#fff;font-size:12px;text-decoration:none;font-weight:700;border-radius:2px}.carol:active{transform:translateY(1px)}#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.wrap{position:relative;z-index:1}</style>

"L", "......열 수 있어."], ["P", "정말요?"], ["L", "대부분은 돼. 종이가 붙은 지 90년이야. 습도를 천천히 올려서 섬유를 풀어야 해. 하루에 1밀리씩."], ["P", "얼마나 걸려요?"], ["L", "......일주일."], ["N", "그가 날짜를 셌다. 오늘은 15일이었다. 일주일이면 22일. 루스가 보스턴에서 오는 날은 23일이었다."], ["P", "루카. 엄마 오면 같이 열어요. 24일에. 할아버지가 편지 쓴 날에."], ["N", "루카스는 달력을 보았다. 작업 계획표를 머릿속에 펼쳤다. 그리고 고개를 끄덕였다."], ["L", "24일까지 열어 둘게. 읽는 건 같이."], ["P", "ㅎㅎ 약속이에요."], ["L", "......약속."], ["H", "2장. 하루에 1밀리"], ["N", "그 일주일 동안 루카스는 집에 늦게 들어왔다."], ["N", "엘제 선생님이 저녁 여덟 시에 복원실 불을 껐다. 루카스는 아홉 시에 다시 켰다. 엘제 선생님은 다음 날 아무 말도 하지 않았다. 그 대신 루카스의 작업대 옆에 접이식 의자를 하나 갖다 놓았다. 두 걸음 떨어진 자리에."], ["N", "저녁 아홉 시마다 그 의자에는 그가 앉아 있었다. 감자 수프를 담은 보온병을 들고."], ["P", "루카, 저녁 먹었어요?"], ["L", "......곧."], ["P", "'곧'은 안 먹었다는 뜻이에요."], ["L", "......"], ["N", "그가 보온병 뚜껑을 열었다. 루카스는 핀셋을 내려놓지 않았다. 그래서 그가 숟가락을 들었다. 루카스는 핀셋을 든 채 입만 벌렸다. 눈은 편지에서 떼지 않았다."], ["N", "다음 날 아침, 요나스가 복원실에 들어왔다가 그 장면을 기억해 냈다. 어젯밤 깜빡 잊은 휴대폰을 가지러 왔다가 문틈으로 본 장면이었다. 요나스는 그 이야기를 아무에게도 하지 않았다. 다만 그날 오후 루카스의 작업대 위에 숟가락 하나를 더 올려 두었다."], ["N", "요나스가 한 일은 그것 말고도 있었다. 사흘째 되는 날, 요나스는 복원실 한구석에 투명 비닐로 작은 텐트를 쳤다. 안에는 가습기 두 대와 습도계 세 개가 들어 있었다."], ["M", "선배님! 습도 텐트예요! 이 안에서 하시면 일정하게 유지돼요!"], ["L", "......"], ["M", "...별로예요?"], ["L", "습도계 하나가 2퍼센트 틀려."], ["M", "어, 어느 거요?"], ["L", "왼쪽."], ["N", "요나스가 왼쪽 습도계를 빼냈다. 루카스는 텐트 안으로 들어갔다. 다음 날부터 루카스는 그 텐트 안에서만 작업했다. 요나스는 그날 저녁 자취방에서 고양이 코덱스를 끌어안고 혼자 기뻐했다."], ["N", "편지는 하루에 1밀리씩 열렸다."], ["N", "나흘째에 봉투가 떨어졌다. 편지지는 두 장이었다. 두 장이 서로 붙어 있었다. 닷새째에 첫 장의 위쪽 절반이 드러났다. 루카스는 읽지 않았다. 글자가 보이는 쪽을 아래로 해서 중성지를 덮었다."], ["P", "......안 읽어요?"], ["L", "같이 읽기로 했잖아."], ["P", "루카는 독일어 다 읽을 수 있잖아요. 한 줄만 봐도—"], ["L", "약속이야."], ["N", "그는 두 걸음 떨어진 의자에서 루카스를 보았다. 텐트 안에서 핀셋을 쥔 손. 수술 흉터가 있는 그 손목. 처음 만났을 때는 저 손을 그려도 되냐고 물었다. 지금은 묻지 않고도 볼 수 있었다."], ["H", "3장. 결항"], ["N", "12월 22일 밤. 루카스가 마지막 장을 떼어 냈다. 예정보다 하루 빨랐다."], ["N", "그리고 그것을 보았다."], ["N", "두 번째 장의 아래쪽 절반이 없었다."], ["N", "찢어진 게 아니었다. 녹아 있었다. 90년 동안 마루 밑에 스며든 물이 종이 아래쪽을 천천히 먹어 들어간 것이었다. 남은 건 섬유 덩어리뿐이었다. 잉크는 한 글자도 남아 있지 않았다."], ["N", "루카스는 핀셋을 내려놓았다. 받침과 정확히 평행하게. 그리고 오래 앉아 있었다."], ["N", "반쪽짜리 편지."], ["N", "열아홉 살 때 본 그 편지가 떠올랐다. 이별 편지라고 단정했던 그 편지. 나머지 반쪽은 서고 한 칸 아래에 있었다. '봄에 돌아가겠소.' 그때는 나머지 반쪽이 있었다."], ["N", "이번에는 없었다."], ["N", "12월 23일 아침. 일이 하나 더 터졌다."], ["N", "일곱 시 오십오 분, 다리 위. 그의 휴대폰이 울렸다. 루스였다. 보스턴 공항이었다."], ["U", "......비행기가 프랑크푸르트에 못 내린대."], ["P", "네?"], ["U", "눈이 너무 와서. 파리로 돌린대요. 파리에서는 기차가 다 끊겼고."], ["P", "......"], ["U", "미안하다. 크리스마스 지나고 갈게."], ["P", "아니에요, 엄마! ㅎㅎ 괜찮아요. 조심히 오세요. 크리스마스는 내년에도 있잖아요."], ["N", "그는 웃으면서 통화를 끝냈다. 그리고 다시 붓을 들었다. 아무 일도 없었다는 듯이."], ["N", "루카스는 난간에 기대어 그것을 보았다."], ["N", "붓 끝이 캔버스에 닿지 않고 있었다. 그는 붓을 든 채 강만 보고 있었다. 하이델베르크 하늘은 맑았다. 눈은 프랑크푸르트에만 왔다. 겨우 100킬로미터 떨어진 곳에."], ["L", "......괜찮다는 거."], ["P", "네?"], ["L", "거짓말이지."], ["P", "......ㅎㅎ"], ["L", "웃지 말고."], ["N", "그는 붓을 내렸다. 웃음이 천천히 얼굴에서 빠져나갔다."], ["P", "......할아버지 편지요. 엄마랑 같이 읽고 싶었어요. 엄마가 할아버지 글씨 보는 얼굴, 그거 보고 싶었어요. 재작년에 마흔일곱 번째 편지 읽을 때처럼요."], ["N", "루카스는 대답하지 않았다. 대신 다른 말을 했다. 어젯밤부터 하지 못한 말이었다."], ["L", "......편지. 반쪽이야."], ["P", "......"], ["L", "두 번째 장 아래쪽이 없어. 물에 녹았어. 복원 못 해."], ["N", "둘 다 한동안 말이 없었다. 강물 소리만 들렸다."], ["P", "......루카는 괜찮아요?"], ["N", "루카스가 고개를 들었다. 그는 자기 일보다 루카스를 먼저 물었다. 늘 그랬다."], ["L", "......안 괜찮아."], ["P", "ㅎㅎ 그쵸."], ["L", "근데 반쪽으로 판결 안 내릴 거야. 이번엔."], ["P", "......"], ["L", "남은 반쪽만 읽을 거야. 거기 있는 만큼만."], ["N", "그가 손을 뻗었다. 장갑을 낀 왼손이었다. 손가락 구멍이 여섯 개인 그 장갑. 루카스의 손을 잡았다. 여섯 번째 구멍에 꽂혀 있던 붓이 루카스의 손등에 닿았다."], ["H", "4장. 다나의 렌터카"], ["N", "12월 23일 오후 세 시. 그의 휴대폰이 울렸다. 다나였다."], ["D", "나 파리야!"], ["P", "다나? 왜 파리에—"], ["D", "고객 만나러 왔다가 눈 때문에 발 묶였어! 근데 방금 공항에서 누구 만났는지 알아? 루스! 너희 엄마!"], ["P", "......엄마요?"], ["D", "기차도 없고 비행기도 없대. 그래서 차 빌렸어."], ["P", "......네?"], ["D", "지금 출발해! 루스 옆에 앉혔어! 내비 찍으니까 여섯 시간이래! 내일 저녁엔 도착해!"], ["U", "다나, 운전 중엔 전화하지 마세요."], ["D", "스피커예요! 스피커!"], ["N", "그는 휴대폰을 든 채 서 있었다. 작업실 창밖은 맑았다. 그는 웃고 있었다. 이번엔 진짜였다."], ["N", "그날 밤부터 다나는 한 시간마다 단체 메시지를 보냈다. 요나스가 만든 방이었다. 이름은 '루스 여사님 수송 작전'."], ["N", "밤 아홉 시, 다나: '랭스 통과! 샴페인 동네! 안 마심!'"], ["N", "밤 열한 시, 다나: '눈 와. 앞이 안 보여. 루스가 와이퍼를 켜는 법을 알려 줌. 나 15년째 운전하는데.'"], ["N", "자정, 다나: '휴게소에서 하룻밤. 루스는 차에서 잔대. 나는 못 자. 루스가 코를 안 골아서 무서워.'"], ["N", "새벽 두 시, 다나: '사실 나 혼자 깨 있는 게 무서운 거였어.'"], ["N", "새벽 두 시 일 분, 루카스: '주무십시오, 다나 씨.'"], ["N", "새벽 두 시 일 분, 다나: '루카??? 너 왜 깨 있어???'"], ["N", "루카스는 대답하지 않았다. 텐트 안에서 사라진 반쪽을 생각하고 있었다. 섬유 덩어리를 현미경 밑에 놓고 또 보고, 또 보았다. 잉크는 없었다. 정말로 하나도."], ["N", "12월 24일 오전 열 시, 다나: '로렌 지방. 소 세 마리가 도로를 막음. 루스가 내려서 소한테 말 걸었음. 소가 비킴. 이게 뭐임.'"], ["N", "오전 열 시 이 분, 요나스: '여사님 최고 ㅠㅠ'"], ["N", "오전 열 시 삼 분, 그: 'ㅎㅎ 엄마 원래 그래요. 할아버지 닮아서요.'"], ["N", "오후 두 시, 다나: '국경 넘음. 독일 아우토반 속도 제한 없다며!!!'"], ["N", "오후 두 시 일 분, 루스: '눈이 와요, 다나.'"], ["N", "오후 두 시 이 분, 다나: '...네.'"], ["H", "5장. 거울"], ["N", "12월 24일 오후 네 시. 고문헌 복원실."], ["N", "루카스는 마지막으로 양철 상자를 정리하고 있었다. 편지는 중성지 사이에 넣어 두었다. 스케치도 마찬가지였다. 텅 빈 다리를 그린 그 스케치."], ["N", "스케치를 뒤집어 보관함에 넣으려던 순간, 루카스가 멈췄다."], ["N", "스케치 뒷면에 무언가가 있었다."], ["N", "처음엔 얼룩인 줄 알았다. 갈색의 희미한 선들. 습기에 번진 자국. 그런데 선에 규칙이 있었다. 기울기가 같았다. 간격도 같았다. 획이 끝나는 곳마다 아주 작은 갈고리가 있었다."], ["N", "필기체였다. 거꾸로 된."], ["N", "루카스는 숨을 멈췄다. 그는 이 현상을 알았다. 15년 동안 수십 번 본 것이었다. 잉크가 마르기 전에 종이 두 장이 오래 맞닿아 있으면, 한쪽 잉크가 반대쪽 종이에 거울처럼 옮겨 묻는다. 복원가들은 그것을 '압흔'이라고 불렀다. 독일어로는 Abklatsch."], ["N", "90년 동안 양철 상자 안에서 편지 두 번째 장과 스케치가 맞닿아 있었다. 아래쪽이 물에 녹기 전에, 잉크는 이미 옆 종이로 건너가 있었다."], ["N", "사라진 반쪽은 사라지지 않았다. 옆에 있었다."], ["L", "......요나스."], ["N", "목소리가 이상했다. 요나스가 고개를 들었다. 선배님의 목소리가 떨리는 걸 요나스는 처음 들었다."], ["M", "선배님?"], ["L", "거울."], ["M", "네?"], ["L", "거울 가져와. 손거울. 지금."], ["N", "요나스가 뛰었다. 복원실에서 뛰는 건 금지였다. 루카스는 아무 말도 하지 않았다. 엘제 선생님이 자기 가방에서 손거울을 꺼내 요나스에게 던졌다. 요나스가 받았다. 15년 만에 처음 보는 엘제 선생님의 투구였다."], ["N", "루카스는 스케치 뒷면에 손거울을 비스듬히 세웠다. 갈색 선들이 거울 속에서 바로 섰다. 희미했다. 군데군데 끊겨 있었다. 하지만 읽을 수 있었다."], ["N", "세 줄이었다."], ["N", "루카스는 그것을 읽었다. 한 번. 두 번. 세 번째에 눈을 감았다."], ["N", "그리고 거울을 내려놓았다. 받침과 평행하게."], ["O", "......뭐라고 쓰여 있니."], ["L", "......같이 읽기로 했습니다."], ["N", "엘제 선생님은 더 묻지 않았다. 대신 복원실 불을 껐다. 오후 네 시 반이었다."], ["O", "가. 크리스마스이브야."], ["H", "6장. 자정의 종소리"], ["N", "12월 24일 밤 열한 시 사십 분. 옛 다리."], ["N", "눈이 오기 시작했다. 하이델베르크에서 크리스마스에 눈이 오는 일은 드물었다. 그는 다리 한가운데서 하늘을 올려다보았다. 장갑 낀 손바닥 위에 눈송이가 내려앉았다."], ["P", "......루카, 눈 와요."], ["L", "응."], ["P", "프랑크푸르트 눈이 따라왔나 봐요."], ["L", "......엄마 따라온 거야."], ["N", "그가 루카스를 보았다. 루카스는 그것을 말해 놓고 귀 끝이 붉어졌다. '엄마'. 루카스가 루스를 그렇게 부른 건 처음이었다. 루카스 자신도 몰랐다는 얼굴이었다."], ["N", "밤 열한 시 오십이 분. 다리 북쪽 끝, 강변 도로에 헤드라이트가 보였다. 눈을 뒤집어쓴 작은 렌터카였다. 앞 범퍼에 지푸라기가 붙어 있었다. 로렌 지방의 소 때문이었다."], ["N", "차가 멈췄다. 운전석 문이 열렸다. 하이힐이 눈 위에 빠졌다."], ["D", "도착!!! 도착했어!!! 여섯 시간이라며!!! 서른 시간 걸렸어!!!"], ["N", "조수석 문이 천천히 열렸다. 회색 코트를 입은 작은 여자가 내렸다. 등이 꼿꼿했다. 서른 시간을 오는 동안 한 번도 구부러지지 않은 등이었다."], ["P", "......엄마."], ["N", "그가 뛰었다. 다리 위에서 뛰는 그를 루카스는 처음 보았다. 땋은 머리가 등에서 튀었다. 풀리지 않았다. 그는 몸을 굽혀 루스를 안았다. 루스의 얼굴이 아들의 코트에 파묻혀 보이지 않았다."], ["U", "......늦었니."], ["P", "아니요. 딱 맞아요."], ["N", "루스가 아들의 품에서 고개를 들었다. 그리고 루카스를 보았다. 두 걸음 뒤에 서 있는 루카스를."], ["U", "......루카."], ["L", "......오셨습니까."], ["U", "소한테 길을 물어봤어요."], ["L", "......들었습니다."], ["N", "다나가 렌터카에 기대어 울고 있었다. 요나스가 어디선가 나타나 다나에게 보온병을 건넸다. 요나스는 '루스 여사님 수송 작전' 방이 '도착'으로 바뀌는 순간 자취방에서 뛰어나왔다. 고양이 코덱스를 안은 채로."], ["N", "자정."], ["N", "구시가지 쪽 성령 교회에서 종이 울리기 시작했다. 하나, 둘, 셋. 크리스마스였다."], ["N", "루카스가 코트 안주머니에서 중성지 봉투 하나를 꺼냈다. 그 안에 편지 두 장과 스케치 한 장과 손거울 하나가 들어 있었다."], ["L", "......지금 읽어도 됩니까."], ["N", "루스가 고개를 끄덕였다. 그도 고개를 끄덕였다. 다나는 울면서 끄덕였다. 요나스는 끄덕이다가 코덱스를 놓칠 뻔했다."], ["H", "7장. 돌아오는 사람에게"], ["N", "가로등 불빛 아래. 눈이 내리고 있었다. 루카스는 편지를 펼쳤다. 독일어로 한 문장을 읽고, 영어로 한 문장을 옮겼다. 2년 전 루스의 호텔 방에서 그랬던 것처럼. 이번에는 그가 그 사이사이에 독일어 문장을 작게, 서툴게 따라 읽었다."], ["L", "'1935년 12월 24일. 하이델베르크.'"], ["L", "'돌아오는 사람에게.'"], ["L", "'나는 봄이 오기 전에 이 도시를 떠난다. 아마 돌아오지 못할 것이다. 그래서 이 편지를 마루 밑에 둔다.'"], ["L", "'언젠가 내 이름을 가진 누군가가, 이 도시로 돌아온다면. 그 사람에게 부탁이 하나 있다.'"], ["N", "루스의 손이 아들의 코트 소매를 쥐었다."], ["L", "'옛 다리에 서 보아라. 아침에. 해가 산 위로 올라오기 직전, 강이 금색이 되기 바로 전에.'"], ["L", "'나는 이 겨울 내내 매일 아침 그 시간에 거기 서 있었다. 그림을 그렸다. 다리 위에 아무도 그려 넣지 않았다. 기다릴 사람이 없었으니까.'"], ["N", "그가 숨을 들이켰다. 텅 빈 다리. 스케치 속의 그 다리."], ["L", "'네게는 있기를 바란다.'"], ["N", "루카스는 거기서 첫 장을 내렸다. 두 번째 장을 들었다. 위쪽 절반만 남은 장이었다."], ["L", "'나는 이곳에서 머무는 법을 배우지 못했다. 늘 먼저 떠났다. 붙잡아 달라는 말을 할 줄 몰라서, 붙잡히기 전에 떠났다.'"], ["L", "'그러니 돌아오는 사람아. 그 다리에서 누군가를 만나거든—'"], ["N", "거기서 종이가 끝났다. 녹아 버린 아래쪽. 섬유 덩어리."], ["N", "루카스는 편지를 내렸다. 스케치를 뒤집었다. 손거울을 꺼냈다. 다들 숨을 죽였다. 그는 그 손거울을 처음 보았다. 그게 왜 거기 있는지 몰랐다."], ["L", "......나머지 반쪽은 여기 있습니다."], ["P", "......네?"], ["L", "90년 동안 옆에 붙어 있었어. 잉크가 옮겨 묻었어. 거꾸로."], ["N", "루카스가 스케치 뒷면에 거울을 세웠다. 가로등 불빛이 거울에 비쳤다. 갈색의 희미한 선들이 바로 섰다."], ["N", "루카스는 그것을 읽지 않았다. 대신 거울을 그에게 내밀었다."], ["L", "......네가 읽어."], ["P", "저 독일어 아직—"], ["L", "읽을 수 있어. 쉬운 말이야."], ["N", "그가 거울을 받았다. 장갑 낀 손이 조금 떨렸다. 여섯 번째 구멍에 꽂힌 붓도 같이 떨렸다. 그는 거울 속의 글자를 한 자 한 자 소리 내어 읽었다. 서툰 발음으로."], ["P", "'...dann geh diesmal nicht fort.'"], ["L", "......이번에는 떠나지 마라."], ["P", "'Tu, was ich nicht konnte.'"], ["L", "......내가 못 한 것을, 네가 해라."], ["N", "그리고 마지막 줄이었다. 한 단어. 그 아래 서명."], ["N", "그는 그 단어를 알았다. 독일어를 배우기 전부터 알았다. 할아버지가 할머니에게 반지를 주면서 한 말이었다. 청혼하던 그 아침, 이 다리 위에서 반지와 함께 오간 말이었다."], ["P", "......'Bleib.'"], ["N", "눈이 거울 위에 내려앉았다. 녹았다."], ["N", "아무도 말하지 않았다. 성령 교회의 종소리가 마지막 한 번을 울리고 멈췄다."], ["N", "루스가 먼저 입을 열었다. 아주 작게."], ["U", "......아버지는 기다릴 사람이 없다고 쓰셨네요."], ["P", "......"], ["U", "그다음 해에 어머니를 만나셨어요. 뉴욕에서. 아버지는 그 뒤로 50년 동안 한 번도 먼저 떠나지 않으셨어요."], ["N", "루스가 아들을 보았다. 그리고 그 옆의 루카스를 보았다."], ["U", "......그 다리에서 누군가를 만났네요. 돌아온 사람이."], ["N", "그는 대답하지 못했다. 거울을 쥔 채 울고 있었다. 소리 없이. 웃는 얼굴로."], ["N", "루카스가 한 걸음 다가왔다. 두 걸음이 아니라 한 걸음. 그의 손에서 거울을 받아 들고, 코트 주머니에 넣었다. 그리고 그의 장갑 낀 손을 잡았다."], ["L", "......너."], ["P", "......네."], ["L", "여기 있어서."], ["N", "루카스가 말을 멈췄다. 1935년의 편지 첫 장에도, 2년 전 루스의 호텔 방에서 읽은 예순한 통의 편지에도 거의 언제나 마지막 줄에 있던 말이었다. 아우구스트가 마거릿에게 50년 동안 쓴 말."], ["L", "......다행이야."], ["N", "그가 웃음을 터뜨렸다. 울면서. 눈송이가 붉은 머리 위에 하얗게 쌓이고 있었다."], ["P", "ㅎㅎ 할아버지. 저 안 떠났어요. 머물렀어요."], ["N", "그것은 독일어로 한 단어였다. 그는 그것을 알고 있었다. 결혼 서류에 적었던 단어였다."], ["P", "......Geblieben."], ["H", "에필로그. 일곱 시 오십오 분"], ["N", "12월 25일 아침. 하이델베르크는 하얬다."], ["N", "일곱 시. 두 사람의 집. 욕실 거울 앞. 단추 서른네 개. 빗. 세 갈래. 장갑. 그리고 새로 생긴 순서가 하나 더 있었다. 루카스가 거실 탁자 위 호두나무 상자를 열어 습도계를 확인하는 것."], ["N", "상자 안에는 이제 세 묶음이 들어 있었다. 아우구스트가 마거릿에게 쓴 61통. 루카스가 그에게 쓴 61통. 그리고 중성지 봉투 하나. 1935년 12월 24일. 돌아오는 사람에게."], ["N", "습도계는 일곱 개가 되었다. 50퍼센트."], ["N", "일곱 시 오십오 분. 옛 다리."], ["N", "이젤이 서 있었다. 그 옆 난간에 function ui(){

function addOne(smooth){

    const s=STORY[pos++];

(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
