<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take#5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#17110c; --ink:#21180f; --pink:#8f7149; --pink-soft:#eadfc9;
  --face:#d8cbb3; --hi:#f4ecdc; --lo:#8c7b62; --paper:#f3ece0;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(214,180,120,.14),transparent 70%) no-repeat var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#ece2cd;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:#c4a676;margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #5e4630}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#6d5d4a;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630;
  box-shadow:inset -1px -1px 0 #5e4630,inset 1px 1px 0 #c9ad84;margin-top:6px}
.nar{align-self:stretch;background:#ebe2d2;border:1px dashed #b3a184;padding:8px 10px;font-size:13px;line-height:1.55;color:#4a3d30;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a8d7c;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630}
.btn:disabled{color:#8f826f;text-shadow:none;cursor:default}
.btn.main:disabled{background:#bfa888}
.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.hint{font-size:12px;color:#a39580;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
</style>
</head>

"], ["L", "......네."], ["N", "그날 오후, 요나스가 코덱스 작업대로 돌아왔다. 루카스를 힐끔거렸다. 루카스는 그를 보지 않은 채, 요나스의 작업대 위에 새 핀셋 한 자루를 놓았다. 루카스가 아끼는 일본제였다."], ["M", "...선배님? 이거 선배님 거잖아요."], ["L", "빌려주는 거야. 곰팡이 대신."], ["N", "요나스는 그 핀셋을 들고 한참 서 있었다. 그리고 아주 작게, 루카스에게 들리지 않게 중얼거렸다."], ["M", "...말하고 싶다. 진짜 말하고 싶다."], ["H", "3장. 맨 아래 서랍, 다른 쪽"], ["N", "목요일 저녁 일곱 시. 도서관 근처 골목 끝 빵집. 창가 자리."], ["M", "자, 다시요. 'Ich bleibe.'"], ["P", "이히... 블라이베."], ["M", "'블라이베'가 아니라 '블라이-베'요. 끝을 살짝 올려요."], ["P", "블라이-베?"], ["M", "네! 좋아요. 무슨 뜻이죠?"], ["P", "'나는 머문다.' ㅎㅎ"], ["M", "정답. 그럼 'Bleib'는?"], ["P", "'머물러.' 명령형."], ["M", "완벽해요."], ["N", "요나스는 공책에 동그라미를 쳤다. 그리고 한숨을 쉬었다. 깊게."], ["P", "...왜요? 제가 틀렸어요?"], ["M", "아뇨. 선배님 때문에요. 오늘 저 지하 3층 곰팡이 제거로 보내질 뻔했어요. 3주짜리."], ["P", "네? 왜요?"], ["M", "모르겠어요. 근데 엘제 선생님이 저를 보시는 눈빛이... 뭔가 아시는 것 같았어요. 그리고 선배님이 저한테 자기 핀셋을 빌려줬어요. 일본제. 선배님이 제일 아끼는 거."], ["P", "......"], ["M", "그 핀셋 빌려주는 거, 선배님이 미안할 때 하는 거예요. 저 2년 동안 딱 두 번 봤어요."], ["N", "그는 창밖을 보았다. 골목 모퉁이. 아무도 없었다."], ["P", "...혹시 루카가 우리 봤을까요?"], ["M", "모르죠. 근데 선배님이면, 봤어도 말 안 해요. 대신 곰팡이를 시켜요."], ["P", "ㅎㅎ 그러네요."], ["N", "그는 웃었다. 그런데 웃음이 오래가지 않았다. 공책을 내려다보았다. 반년 치 독일어가 빼곡했다. 처음엔 알파벳도 서툴던 글씨가, 이제는 문장이 되어 있었다."], ["N", "시작은 작년 9월이었다. 루스가 떠난 다음 날. 호두나무 상자 앞에서."], ["N", "61통의 편지. 루카스의 목소리로 들은, 할아버지의 말. 그는 그게 좋았다. 너무 좋았다. 그런데 그날 밤, 상자를 보다가 생각했다. 할머니는 이걸 평생 직접 못 읽었구나. 남의 목소리로 들을 수밖에 없었구나."], ["N", "그리고 또 하나. 루카스는 언젠가, 아마도, 무언가를 쓸 것이다. 할아버지처럼. 말로 못 하는 걸. 그리고 그게 독일어라면."], ["N", "그는 그걸 남의 목소리로 듣고 싶지 않았다. 자기 눈으로 읽고 싶었다."], ["N", "그래서 요나스를 찾아갔다. 아무한테도 말하지 말아 달라고. 특히 루카스한테. 요나스는 '선배님한테 비밀 만들면 저 평생 곰팡이 제거예요'라고 했다. 그리고 수락했다."], ["M", "...근데요. 언제까지 숨기실 거예요? 선배님 지금 이상해요. 저 진짜 3주 곰팡이 갈 뻔했다니까요."], ["P", "조금만요. 할아버지 편지, 제 힘으로 한 통이라도 읽을 수 있을 때까지요."], ["M", "지금 몇 통 읽으세요?"], ["P", "......첫 번째 거 반이요. 사전 찾으면서."], ["M", "61통인데."], ["P", "ㅎㅎ 알아요."], ["N", "요나스는 공책을 덮었다. 그리고 진지한 얼굴로 그를 보았다."], ["M", "하나만 말할게요. 이건 비밀 아니니까."], ["P", "네."], ["M", "선배님도 요즘 야근해요. 매일 밤. 근데 코덱스 작업이 아니에요. 복원실 불이 켜져 있는데, 작업대 위에 고문서가 없어요."], ["P", "......그럼 뭐가 있는데요?"], ["M", "모르겠어요. 선배님이 제가 들어가면 뭘 덮어요. 그리고 엘제 선생님은 알고 계신 것 같아요. 저만 몰라요. 저만."], ["N", "그는 아무 말도 하지 못했다. 공책 위에 연필을 내려놓았다. 정확히, 테이블과 평행하게. 루카스에게서 배운 버릇이었다."], ["H", "4장. 런던"], ["N", "2월 셋째 주 토요일. 그는 집에서 박스 테이프를 찾고 있었다. 뉴욕에서 민디가 보낸 소포를 다시 보내야 했다."], ["N", "거실 서랍. 없었다. 부엌 서랍. 없었다. 루카스의 책상 서랍."], ["N", "맨 위 칸에, 테이프는 없었다. 대신 편지 한 통이 있었다. 두꺼운 크림색 종이. 레터헤드가 인쇄되어 있었다. 'The British Library, London.'"], ["N", "그는 그걸 열지 않으려고 했다. 그런데 봉투는 이미 열려 있었다. 그리고 첫 줄이 보였다. 영어로."], ["N", "'친애하는 아스카니엔 박사님. 대영도서관 보존과학부 수석 복원가 직위를 제안드립니다.'"], ["N", "그는 그 자리에 서 있었다. 편지 날짜를 보았다. 1월 20일. 한 달 전이었다."], ["N", "그는 편지를 다시 서랍에 넣었다. 정확히 원래 있던 각도로. 서랍을 닫았다. 그리고 거실 소파에 앉아, 한참 동안 아무것도 하지 않았다."], ["N", "대영도서관. 수석 복원가. 그는 미술계 사람이었지만 그게 무슨 뜻인지는 알았다. 루카스 같은 사람에게, 그건 평생 한 번 올까 말까 한 자리였다."], ["N", "그리고 루카스는, 한 달 동안 그 얘기를 하지 않았다."], ["N", "그는 1월의 도쿄를 떠올렸다. 루카스가 그를 보내던 아침. '네가 안 가면, 나는 매년 생각할 거야. 내가 저 사람 거 하나 망쳤구나.'"], ["N", "그리고 매일 밤 야근. 작업대 위에 고문서가 없는. 무언가를 덮는."], ["N", "그는 결론을 내렸다. 반쪽만 보고. 루카스에게 배운 버릇은, 좋은 것만 있는 게 아니었다."], ["N", "그날 저녁. 루카스가 돌아왔다. 코트를 벗었다. 그는 소파에서 일어나 그 앞에 섰다."], ["P", "루카."], ["L", "응."], ["P", "런던 가요."], ["N", "루카스가 코트를 건 채 멈췄다."], ["L", "......뭐?"], ["P", "대영도서관. 편지 봤어요. 테이프 찾다가. 미안해요. 열려 있어서."], ["L", "......"], ["P", "가요. 수석 복원가잖아요. 루카가 저한테 도쿄 가라고 했을 때처럼, 저도 할 거예요. 루카 거 망치는 사람 되기 싫어요."], ["L", "......"], ["P", "저는 작업실 또 옮기면 돼요. 런던도 좋아요. 다나가 좋아할 거예요. 아니면, 루카가 혼자 가고 싶으면—"], ["L", "거절했어."], ["N", "그가 멈췄다."], ["P", "......네?"], ["L", "거절했어. 1월 말에. 편지 받고 일주일 만에."], ["P", "......왜요?"], ["L", "갈 생각 없으니까."], ["P", "그럼 왜 말 안 했어요?"], ["L", "갈 생각이 없었으니까. 말할 게 없었어."], ["N", "두 사람 사이가 조용해졌다. 루카스는 코트 주머니에서 손을 빼지 않고 있었다. 그 안에 무언가를 쥐고 있었다. 그는 그것을 보지 못했다."], ["P", "...그럼 매일 밤 야근은요? 요나스가 그러던데, 작업대에 고문서가 없대요. 루카가 뭘 덮는대요."], ["N", "루카스의 얼굴이 굳었다. 아주 잠깐. 그리고 천천히, 다른 얼굴이 되었다."], ["L", "...요나스가 그래?"], ["P", "네."], ["L", "언제?"], ["P", "......"], ["L", "화요일? 아니면 목요일?"], ["N", "그가 입을 다물었다. 이번엔 그가 들킨 얼굴이었다."], ["L", "빵집. 골목 끝. 창가 자리. 2주 전 화요일. 요나스가 네 손등을 연필로 쳤어."], ["P", "......봤어요?"], ["L", "봤어."], ["P", "그래서 요나스 곰팡이 보냈어요?"], ["L", "곰팡이가 많아서 그런 거야."], ["P", "ㅎㅎ 루카."], ["L", "웃지 마."], ["N", "그는 웃음을 멈췄다. 그리고 루카스를 보았다. 루카스는 질투하고 있었다. 그가 처음 보는 루카스였다. 귀 끝이 붉은데, 부끄러워서가 아니라 화가 나서."], ["P", "...화요일 목요일에 뭐 하는지 말하면, 루카도 야근 때 뭐 하는지 말해 줄 거예요?"], ["L", "......"], ["P", "그럼 저도 못 해요."], ["L", "......그럼 나도 못 해."], ["N", "두 사람은 마주 보고 서 있었다. 둘 다 비밀이 있었다. 둘 다 그걸 알았다. 그리고 둘 다, 상대 비밀이 무엇인지 몰랐다."], ["N", "그날 밤, 두 사람은 같은 침대에서 잤다. 등을 맞대고. 그런데 새벽 세 시쯤, 그가 잠결에 돌아누워 루카스의 허리에 팔을 감았다. 루카스는 깨어 있었다. 그 팔을 빼지 않았다."], ["N", "그리고 그가 잠결에 중얼거렸다. 아주 작게. 루카스는 그 말을 들었다."], ["P", "......이히 블라이-베."], ["N", "루카스는 숨을 멈췄다. 독일어였다. 서툰 발음의. '나는 머문다.'"], ["N", "루카스는 그 말이 어디서 왔는지 몰랐다. 밤새 천장을 보며 생각했다. 그리고 아침이 될 무렵, 아주 천천히, 반쪽이 아닌 나머지 반쪽이 맞춰지기 시작했다."], ["H", "5장. 나머지 반쪽"], ["N", "월요일 아침. 고문헌 복원실. 요나스가 출근하자마자 루카스가 그의 작업대 앞에 섰다."], ["L", "요나스."], ["M", "네, 선배님! 곰팡이요? 저 준비됐어요. 마스크도 챙겨 왔어요."], ["L", "곰팡이 아니야."], ["M", "...그럼요?"], ["N", "루카스는 요나스를 내려다보았다. 오래. 요나스는 그 시선 아래서 점점 작아졌다."], ["L", "'블라이-베'."], ["M", "......!"], ["L", "끝을 살짝 올리라고 가르쳤지."], ["N", "요나스의 얼굴이 하얘졌다. 그리고 빨개졌다. 그리고 다시 하얘졌다."], ["M", "서, 선배님, 그게, 저는 아무것도—"], ["L", "말하지 마."], ["M", "...네?"], ["L", "말하지 말라고. 아무것도. 그 사람이 뭘 하는지, 왜 하는지, 언제까지 하는지. 나한테 하나도 말하지 마."], ["M", "......"], ["L", "모르는 척할 거야. 그 사람이 직접 말할 때까지."], ["N", "요나스는 입을 벌린 채 루카스를 보았다. 그리고 천천히, 아주 천천히, 웃기 시작했다."], ["M", "...선배님, 진짜 변했어요."], ["L", "무슨 소리야."], ["M", "2년 전 선배님이었으면, 반쪽 듣고 판결 내렸을 거예요. 저 지금쯤 지하 3층에 있었을 거예요."], ["L", "......곰팡이 갈래?"], ["M", "아뇨! 아뇨, 안 갈래요."], ["N", "요나스는 자기 작업대로 돌아갔다. 그리고 루카스가 빌려준 일본제 핀셋을 집어 들었다가, 다시 루카스 작업대 위에 놓았다."], ["M", "돌려드릴게요. 이제 미안하실 일 없잖아요."], ["L", "......가져. 선물이야."], ["M", "...네?"], ["L", "그 사람 가르쳐 준 거. 수업료."], ["N", "요나스는 그 핀셋을 두 손으로 들고 한참 서 있었다. 엘제 선생님이 반대편 작업대에서 고개를 숙인 채 어깨를 떨고 있었다."], ["H", "6장. 두 어른"], ["N", "같은 날 밤 열 시. 엘제 선생님의 휴대폰이 울렸다. 뉴욕 번호. 영상통화였다."], ["D", "...엘제 선생님? 다나 쿠퍼예요. 그 사람 갤러리스트. 늦은 시간 죄송해요."], ["O", "괜찮아요. 무슨 일이죠?"], ["D", "저 지금 미칠 것 같아서요. 누구한테라도 말해야 할 것 같아서."], ["O", "......혹시 3월 2일 얘기인가요?"], ["N", "화면 너머의 다나가 굳었다."], ["D", "...선생님도 아세요?"], ["O", "어느 쪽을요?"], ["D", "어느 쪽이라니... 설마 둘 다요?"], ["O", "둘 다라니요?"], ["N", "두 사람은 화면을 사이에 두고 몇 초 동안 서로를 보았다. 그리고 다나가 먼저, 조심스럽게 말했다."], ["D", "...그 애가 3월 2일 아침에 다리에서 뭘 하려고 해요. 독일어로. 반년 동안 요나스한테 배운 거로. 할아버지 편지 한 통을 직접 읽어 주겠대요. 그 사람한테. 그게... 그 애 나름의, 그러니까..."], ["O", "......"], ["D", "선생님 쪽은요?"], ["O", "...루카스가 3월 2일에 다리에서 뭘 하려고 해요. 편지로. 독일어로. 그 사람한테. 자기가 쓴 거. 지금 마흔 통 넘었어요. 그리고 셔츠 주머니에 넉 달째 봉투 하나를 넣고 다녀요."], ["N", "다나가 화면 너머에서 입을 손으로 막았다."], ["D", "......같은 날. 같은 장소. 같은 시간."], ["O", "일곱 시 오십오 분."], ["D", "그리고 둘 다 상대가 뭘 하는지 몰라요?"], ["O", "루카스는 반쯤 알아요. 요나스가 들켰어요. 근데 모르는 척한대요."], ["D", "그 애는 하나도 몰라요. 루카가 야근하는 게 런던 때문인 줄 알다가, 거절했다는 얘기 듣고 더 헷갈려해요."], ["N", "두 사람은 다시 몇 초 동안 서로를 보았다. 그리고 동시에, 웃음이 터졌다. 엘제 선생님은 안경을 벗어 눈가를 닦았다. 다나는 소파에 쓰러졌다."], ["D", "...말해 줄까요? 서로한테?"], ["O", "아니요."], ["D", "그렇죠. 아니죠."], ["O", "그 애는 15년 동안 미리 다 알고, 미리 아파하고, 미리 끝냈어요. 이번 한 번은 모르는 채로 다리에 서게 해 주고 싶어요."], ["D", "그 애도요. 그 애는 평생 남들이 다 알고 있는 사람이었어요. 이번엔, 그 사람 하나만 놀라게 해 주고 싶대요."], ["O", "그럼 우리는."], ["D", "입 다물고. 비행기 표 끊고."], ["O", "...오시게요?"], ["D", "당연하죠. 민디도 데려가요. 그 애 휴대폰 압수하고. 사진은 찍으면 안 되니까."], ["O", "다리 끝에서 보면 되겠네요. 안 들키게."], ["D", "선생님, 그 사람 어머니는요? 루스 씨?"], ["O", "...그건 루카스가 직접 할 거예요. 봉투가 그분 거니까."], ["N", "통화가 끝났다. 엘제 선생님은 휴대폰을 내려놓고 한참 창밖을 보았다. 그리고 서랍에서 오래된 사진 한 장을 꺼냈다. 루카스가 열아홉 살 때 처음 복원한 반쪽짜리 편지를, 서고에서 찾아온 나머지 반쪽과 나란히 놓고 찍은 사진."], ["N", "'...그러니 기다려 주시오. 봄에 돌아가겠소.'"], ["N", "엘제 선생님은 그것을 오래 보았다. 3월 2일. 봄이었다."], ["H", "7장. 예순한 번째"], ["N", "2월 마지막 주. 루카스의 서랍 맨 아래 칸에는 편지가 예순 통 들어 있었다."], ["N", "숫자는 처음에 정하지 않았다. 그런데 쉰 통을 넘기면서 알았다. 61통이 될 거라는 걸. 아우구스트처럼. 흉내 내려는 게 아니었다. 그냥, 그 숫자가 맞는 것 같았다. 할 말이 거기까지 있었다."], ["N", "예순 통의 편지에는 많은 것이 들어 있었다."], ["N", "서점 바닥에서 처음 본 붉은 머리. 그때 다시 볼 일 없다고 한 게 거짓말이었다는 것. 복원실 의자에 앉은 사람이 신경 쓰여서 집중이 안 됐다는 것. 그게 사실 좋았다는 것."], ["N", "코니아일랜드에서 길을 잃었을 때 연락처 맨 위의 이름을 누른 이유. 맨 위에 있었던 이유."], ["N", "12월의 그 아침 '다시 볼 일 없습니다'라고 하고 다리를 건너면서, 주머니 속 장갑을 얼마나 세게 쥐었는지. 장갑 그림을 6주 동안 매일 아침 몇 분씩 보았는지. 정확히 4분."], ["N", "도쿄로 보내던 날, 현관에서 '잘 가'라고 하고 문이 닫힌 뒤, 그 자리에 20분을 서 있었다는 것."], ["N", "단추 서른네 개. 일부러 천천히 채운다는 것."], ["N", "그리고 다른 것들. 아주 작은 것들. 그가 붓을 씻을 때 콧노래를 부른다는 것. 그 노래가 늘 같은 노래라는 것. 루카스는 그 노래 제목을 모르지만, 이제 다 외웠다는 것."], ["N", "예순 통. 루카스는 그걸 쓰는 데 두 달이 걸렸다. 15년 동안 한 말보다 많은 말이었다."], ["N", "그런데 예순한 번째가 써지지 않았다."], ["N", "밤 열한 시. 루카스는 빈 편지지 앞에 앉아 있었다. 만년필 뚜껑을 열었다가 닫았다. 열었다가 닫았다. 사흘째였다."], ["N", "아우구스트의 예순한 번째는 결혼 50주년의 편지였다. '나는 이 나라에 머문 게 아니오. 당신에게 머문 거요.' 루카스는 그 문장을 수십 번 소리 내어 읽었다. 그래서 그 문장을 쓸 수 없었다. 그건 아우구스트의 말이었다."], ["N", "자기 말이 필요했다. 가장 짧고, 가장 정확한. 그런데 이번엔, 짧기만 해서는 안 되는."], ["N", "휴대폰이 울렸다. 보스턴 번호. 루스였다."], ["U", "...루카? 늦은 시간이죠. 미안해요."], ["L", "아닙니다. 아직 복원실입니다."], ["U", "그 애가 그러더라. 요즘 매일 야근한다고. 걱정하던데. 런던 때문이냐고 나한테 물어봤어요."], ["L", "......"], ["U", "런던 때문이에요?"], ["L", "아닙니다. 거절했습니다."], ["U", "그럼?"], ["N", "루카스는 빈 편지지를 내려다보았다. 그리고 셔츠 가슴 주머니에 손을 얹었다. 크림색 봉투. 그 안의 작고 단단한 것 두 개."], ["L", "......어머님."], ["U", "네."], ["L", "봉투. 3월 2일에 열 겁니다."], ["N", "전화 너머가 조용해졌다. 아주 오래."], ["U", "......그래요."], ["L", "먼저 말씀드려야 할 것 같았습니다. 어머님 어머니 거니까."], ["U", "......"], ["L", "그리고 하나 여쭤봐도 되겠습니까."], ["U", "...네."], ["L", "아버님이 어머님 어머니께 반지를 드릴 때, 뭐라고 하셨는지 아십니까."], ["N", "루스는 대답하지 않았다. 대신 무언가를 꺼내는 소리가 들렸다. 종이가 펼쳐지는 소리."], ["U", "...어머니가 돌아가시기 전에 나한테 말해 준 적 있어요. 그 사람이 반지를 줄 때 딱 한 마디 했대요. 독일어로. 어머니는 그게 무슨 뜻인지 몰랐는데, 표정 보고 알았대요."], ["L", "......뭐라고 하셨습니까."], ["U", "'Bleib.'"], ["N", "루카스는 숨을 멈췄다."], ["U", "무슨 뜻이에요, 루카?"], ["L", "......'머물러'."], ["U", "......"], ["L", "명령형입니다. 아주 짧은."], ["N", "전화 너머에서 루스가 웃었다. 울음 섞인 웃음이었다."], ["U", "...그 사람답네요. 한 단어."], ["L", "네."], ["U", "루카는요? 루카는 뭐라고 할 거예요?"], ["N", "루카스는 빈 편지지를 보았다. 그리고 만년필을 들었다."], ["L", "......지금 쓰는 중입니다."], ["U", "ㅎㅎ 그래요. 그럼 끊을게요. 다 쓰면, 그 애가 읽기 전에 나한테 말해 주지 마요. 나도 나중에 그 애한테 들을래요."], ["L", "...네."], ["N", "전화가 끊겼다. 루카스는 예순한 번째 편지지 맨 위에 날짜를 썼다. 3월 2일. 그리고 첫 줄을 썼다."], ["N", "한 시간 뒤. 편지지에는 아주 짧은 글이 적혀 있었다. 예순 통 중 가장 짧았다. 아우구스트의 예순한 번째보다도."], ["N", "루카스는 그것을 접어 봉투에 넣었다. 그리고 예순 통 위에 올렸다. 서랍을 닫았다."], ["N", "복원실 불을 껐다. 다리를 건너 집으로 갔다. 현관문을 열자 그가 소파에서 졸다가 깼다. 무릎 위에 공책이 펼쳐져 있었다. 그가 황급히 그것을 덮었다."], ["P", "...루카! 왔어요? 늦었네요."], ["L", "응."], ["P", "야근 끝났어요?"], ["L", "......응. 끝났어."], ["N", "그는 루카스의 얼굴을 보았다. 무언가 달라져 있었다. 피곤한데, 가벼운 얼굴. 무언가를 다 끝낸 사람의 얼굴. 12월의 그 얼굴과는 정반대의."], ["P", "......무슨 좋은 일 있어요?"], ["L", "아직."], ["P", "'아직'?"], ["L", "3월 2일."], ["N", "그가 숨을 멈췄다. 공책을 쥔 손에 힘이 들어갔다. 3월 2일. 그날은 그도—"], ["P", "......그날 뭐 있어요?"], ["L", "그날 일곱 시 오십오 분에 다리."], ["P", "...매일 가잖아요."], ["L", "그날은 늦지 마."], ["N", "루카스는 그 말만 하고 욕실로 들어갔다. 그는 소파에 앉은 채 공책을 내려다보았다. 공책 맨 마지막 장에, 반년 동안 연습한 독일어 문장이 적혀 있었다. 할아버지의 첫 번째 편지. 그가 직접 옮겨 적고, 사전을 찾고, 발음을 표시한."], ["N", "그리고 그 아래, 그가 직접 쓴 한 줄. 반년 걸려서 겨우 쓸 수 있게 된 독일어 한 문장."], ["N", "그는 그 페이지를 오래 보았다. 그리고 생각했다. 3월 2일. 루카도. 설마."], ["H", "8장. 3월 1일"], ["N", "3월 1일. 하루 종일 두 사람은 이상했다."], ["N", "아침. 루카스가 그의 셔츠 단추를 채웠다. 서른네 개. 5분 10초 걸렸다. 손이 떨려서가 아니었다. 맨 아래 단추에서, 두 사람이 동시에 웃음을 터뜨렸기 때문이었다. 이유는 둘 다 말하지 않았다."], ["N", "복원실. 루카스는 코덱스 금박 작업을 했다. 정확했다. 요나스는 그 옆에서 계속 시계를 보았다. 엘제 선생님은 오후 세 시에 '오늘은 일찍 들어가라'고 했다. 루카스는 들어가지 않았다. 호두나무 상자 하나를 더 만들었다. 중성지로 안을 대고. 예순한 통이 들어갈 크기로."], ["N", "작업실. 그는 하루 종일 붓을 들지 않았다. 대신 공책을 소리 내어 읽었다. 다나가 영상통화로 들었다. '발음 좋아.' '아니야, 끝 다시.' '그만 연습해, 목 쉬겠다.'"], ["N", "저녁. 프랑크푸르트 공항. 다나와 민디가 입국장으로 나왔다. 민디의 휴대폰은 다나의 가방 안에 있었다. 엘제 선생님과 요나스가 마중을 나왔다. 네 사람은 서로를 보고 아무 말 없이 고개를 끄덕였다."], ["N", "밤. 두 사람의 집. 둘 다 잠을 자지 못했다. 등을 맞대고 누워서, 각자 천장과 벽을 보았다."], ["P", "...루카, 자요?"], ["L", "아니."], ["P", "저도요."], ["L", "......알아."], ["P", "내일 일곱 시 오십오 분."], ["L", "응."], ["P", "늦지 마요."], ["L", "그거 내가 한 말이야."], ["P", "ㅎㅎ 알아요."], ["N", "새벽 세 시. 그가 잠결에, 혹은 잠들지 않은 채로 돌아누웠다. 루카스의 등에 이마를 댔다. 루카스는 그 무게를 느꼈다. 그리고 아주 작게, 그가 들을 수 있을 만큼만, 말했다."], ["L", "......내일, 끝까지 들을게."], ["N", "그는 대답하지 않았다. 그런데 루카스의 등에 닿은 이마가, 아주 조금 끄덕였다."], ["H", "9장. 일곱 시 오십오 분"], ["N", "3월 2일. 하이델베르크. 아침 일곱 시 오십 분."], ["N", "안개가 엷게 깔려 있었다. 강이 반쯤 보였다. 옛 다리 한가운데에는 이젤이 없었다. 처음으로."], ["N", "그는 다리 한가운데에 서 있었다. 흰 리넨 셔츠. 단추 서른네 개. 오늘 아침 루카스가 채운. 그리고 품에는 공책 한 권. 그리고 아우구스트의 호두나무 상자에서 꺼낸, 첫 번째 편지."], ["N", "다리 끝, 성 쪽 탑 아래. 네 사람이 숨어 있었다. 다나, 민디, 엘제 선생님, 요나스. 민디는 손을 꼭 쥐고 있었다. 휴대폰이 없어서 손이 허전하다고 했다. 요나스는 일본제 핀셋을 주머니 속에서 만지작거리고 있었다."], ["N", "일곱 시 오십삼 분. 다리 반대편 끝에서, 검은 머리의 남자가 걸어왔다. 검은 코트. 그리고 두 손에, 새 호두나무 상자를 안고 있었다. 중성지로 안을 댄."], ["N", "루카스는 다리 한가운데까지 걸어왔다. 그의 앞에 섰다. 두 걸음 떨어져서."], ["N", "그는 루카스의 손에 들린 상자를 보았다. 루카스는 그의 손에 들린 공책과 편지를 보았다. 둘 다 아무 말도 하지 않았다. 몇 초 동안."], ["P", "......루카."], ["L", "......응."], ["P", "그 상자."], ["L", "네 거야."], ["N", "루카스가 상자를 내밀었다. 그는 공책과 편지를 겨드랑이에 끼고, 두 손으로 상자를 받았다. 무거웠다. 뚜껑을 열었다."], ["N", "편지 봉투들이 날짜순으로 빼곡히 서 있었다. 하얀 봉투. 남색 잉크. 루카스의 정확한 글씨. 맨 앞 봉투에 숫자가 적혀 있었다. '1'. 맨 뒤 봉투에도. '61'."], ["P", "......"], ["L", "독일어야."], ["P", "......"], ["L", "독일어 배우면 읽어."], ["N", "루카스의 목소리는 정확했다. 그런데 귀 끝이 붉었다. 목까지. 코트 깃까지."], ["N", "그는 상자를 내려다보았다. 61통. 아우구스트처럼. 그리고 고개를 들었다. 루카스를 보았다. 그의 눈가가 붉어지고 있었다. 머리카락처럼."], ["P", "...루카."], ["L", "응."], ["P", "지금 읽어도 돼요?"], ["N", "루카스가 멈췄다."], ["L", "......뭐?"], ["N", "그는 대답 대신 상자에서 첫 번째 봉투를 꺼냈다. 조심스럽게. 루카스에게 배운 대로, 봉투 가장자리가 찢어지지 않도록. 편지지를 펼쳤다. 그리고 숨을 한 번 고르고, 소리 내어 읽기 시작했다."], ["P", "'Für dich. Das ist der erste.'"], ["N", "서툰 발음이었다. 끝이 조금 올라갔다. 요나스가 가르쳐 준 대로."], ["P", "'너에게. 이건 첫 번째야.'"], ["N", "루카스는 그 자리에 굳었다."], ["P", "'Ich weiß nicht, wie man so etwas schreibt...' ...'이런 걸 어떻게 쓰는지 모르겠어. 15년 동안 남의 편지만 고쳤어. 내 편지는 한 번도 안 써 봤어.'"], ["N", "그는 계속 읽었다. 천천히. 단어 하나하나를 손가락으로 짚어 가며. 틀리면 다시. 모르는 단어가 나오면 잠깐 멈췄다가, 공책을 펼쳐 찾아보고, 다시."], ["N", "루카스는 아무 말도 하지 못했다. 그 서툰 독일어가, 자기가 쓴 문장을 한 단어씩 되짚어 오고 있었다. 2주 전 화요일, 빵집 창가. 요나스의 연필. '블라이-베.' 루카스가 반쯤 맞춰 둔 반쪽이, 지금 나머지 반쪽과 붙고 있었다."], ["N", "첫 번째 편지가 끝났다. 그가 편지지를 내렸다. 숨이 차 있었다. 다리를 뛰어 건넌 사람처럼."], ["P", "......반년 걸렸어요."], ["L", "......"], ["P", "화요일, 목요일. 요나스한테. 할아버지 편지 직접 읽고 싶어서 시작했어요. 할머니는 평생 남의 목소리로만 들었잖아요."], ["P", "그리고... 루카가 언젠가 뭘 쓸 것 같았어요. 할아버지처럼. 독일어로. 그때 남의 목소리로 듣고 싶지 않았어요. 제 눈으로 읽고 싶었어요."], ["N", "루카스의 입술이 떨렸다. 처음이었다. 핀셋을 든 손은 떨려도, 입술이 떨린 적은 없었다."], ["L", "......61통이야. 다 읽으려면."], ["P", "ㅎㅎ 알아요. 오늘 다 못 읽어요. 사전 찾으면서 하면 한 통에 한 시간 걸려요."], ["L", "그럼."], ["P", "매일 한 통씩 읽을게요. 소리 내서. 루카 앞에서. 두 달."], ["L", "......"], ["P", "아니, 그거 말고. 다 읽고 나서도 계속 읽을게요. 처음부터 다시. 평생."], ["N", "다리 끝에서 민디가 다나의 팔을 꽉 잡았다. 다나는 하늘을 보고 있었다. 엘제 선생님은 안경을 벗었다. 요나스는 핀셋을 너무 세게 쥐어서 손바닥에 자국이 남았다."], ["N", "그가 상자에서 맨 마지막 봉투를 꺼냈다. '61'."], ["P", "...이것도 지금 읽어도 돼요?"], ["L", "......그건."], ["P", "네."], ["L", "그건 짧아."], ["N", "그가 봉투를 열었다. 편지지가 한 장. 그리고 그 한 장에, 아주 짧은 글이 적혀 있었다. 예순한 통 중 가장 짧은."], ["N", "그는 그것을 보았다. 처음엔 눈으로. 단어 하나하나를. 반년 동안 배운 독일어로. 그리고 그 단어들이 무슨 뜻인지 알아차리는 순간, 숨을 멈췄다."], ["P", "......"], ["L", "...읽어."], ["P", "......'Ich bin hier. Jeden Morgen um fünf vor acht. Auch morgen. Auch danach.'"], ["P", "'나 여기 있어. 매일 아침 일곱 시 오십오 분에. 내일도. 그 다음에도.'"], ["N", "그의 목소리가 갈라졌다. 그래도 멈추지 않았다."], ["P", "'Also — heirate mich.'"], ["N", "안개 속에서 강물 소리가 들렸다."], ["P", "......'그러니까, 결혼하자.'"], ["N", "그는 편지를 든 채 서 있었다. 읽은 문장을 다시 보았다. 몇 번이고. 혹시 자기가 잘못 읽었을까 봐. 반년 배운 독일어가 틀렸을까 봐."], ["N", "루카스가 셔츠 가슴 주머니에 손을 넣었다. 다섯 달 동안 매일 아침 옮겨 담은 크림색 봉투. 꺼냈다. 그리고 처음으로, 열었다."], ["N", "안에서 반지 두 개가 나왔다. 오래된 금반지. 둘 다 닳아서 얇았다. 하나는 크고, 하나는 작았다. 그리고 작은 쪽지 한 장. 마거릿의 떨리는 필기체였다."], ["N", "루카스가 쪽지를 읽었다. 영어였다. 소리 내어."], ["L", "'아우구스트는 반지를 줄 때 딱 한 마디 했어요. Bleib. 머물러. 당신은 몇 마디일까요? 길어도 괜찮아요. 아니, 길었으면 좋겠어요. — 마거릿.'"], ["N", "그는 울고 있었다. 소리 없이. 할아버지처럼. 그리고 어머니처럼. 그런데 웃고도 있었다. 자기 자신처럼."], ["L", "......몇 마디냐고 하시네."], ["P", "......"], ["L", "61통."], ["N", "루카스는 큰 반지를 집어 들었다. 그의 왼손을 잡았다. 붓을 쥐는 손. 물감 자국이 군데군데 남은. 루카스가 처음 서점 바닥에서 본 손."], ["L", "......대답."], ["P", "......네?"], ["L", "대답 해. 지금은 짧게 해도 돼."], ["N", "그는 루카스를 보았다. 그리고 공책을 펼쳤다. 맨 마지막 장. 반년 동안 할아버지 편지를 옮겨 적은 그 아래, 자기가 직접 쓴 단 한 줄."], ["N", "그는 그것을 읽지 않았다. 외우고 있었다. 반년 동안 매일."], ["P", "......Ich bleibe."], ["N", "끝이 살짝 올라갔다."], ["P", "Bei dir. Für immer."], ["N", "'나는 머문다. 너에게. 영원히.'"], ["N", "루카스가 반지를 끼웠다. 그의 왼손 네 번째 손가락에. 아우구스트의 반지는 조금 컸다. 루카스는 그것을 보고 미간을 찌푸렸다. 내일 금속 공방에 가서 맞춰야겠다고, 0.5밀리미터. 그는 그 얼굴을 보고 울다가 웃음을 터뜨렸다."], ["P", "...루카, 지금 사이즈 계산해요?"], ["L", "......0.5밀리 커."], ["P", "ㅎㅎ 그거 지금 중요해요?"], ["L", "중요해. 빠지면 안 되잖아."], ["N", "그가 작은 반지를 집어 들었다. 마거릿의 반지. 루카스의 오른손을 잡았다. 흉터가 있는 손목. 다시 정확해진 손. 그 손 네 번째 손가락에, 반지를 끼웠다. 독일에서는 결혼반지를 오른손에 낀다. 그는 그것을 요나스에게 배웠다. 화요일인가, 목요일에."], ["N", "딱 맞았다. 0.1밀리미터도 틀리지 않고."], ["L", "......"], ["P", "ㅎㅎ 할머니가 루카 손 사이즈 알았나 봐요."], ["L", "......이건 우연이야."], ["P", const $=id=>document.getElementById(id);
const KEY='new take5-progress';
const steps=STORY.filter(s=>s[0]!=='H').length;
let pos=0,shown=0;   // pos: STORY 인덱스, shown: 보여 준 장면 수(제목 제외)

(()=>{const c=$('heart').getContext('2d'),m=['.##.##.','#######','#######','.#####.','..###..','...#...'];
  c.fillStyle='#fff';m.forEach((r,y)=>[...r].forEach((ch,x)=>ch==='#'&&c.fillRect(x,y,1,1)));})();

function build(s){
  const k=s[0],t=s[1];
  if(k==='H'){const e=document.createElement('div');e.className='chap';e.textContent=t;return e;}
  if(k==='N'){const e=document.createElement('div');e.className='nar';e.textContent=t;return e;}
  const who=k==='L'?'me':({K:'k',M:'m',O:'o',D:'d',R:'r',G:'g',U:'u'}[k]||'p'),e=document.createElement('div');
  e.className='msg'+(who==='me'?' me':'');
  const img=new Image();img.className='av';img.alt='';img.src=AV[who];
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;
  $('panel').replaceChildren();
  const c=document.createElement('div');c.className='cover';c.id='cover';
  c.innerHTML='<b>new take#5</b><span>하이델베르크, 예순한 통의 대답.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span>';
  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
</body>
</html>
