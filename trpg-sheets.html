   ["반쪽 듣기 (약점)","듣기·심리학이 성공해도 정보의 절반만 듣고 결론을 내려요. 나머지 반쪽이 공개되면 이성 0/1."],
   ["코트보다 습도계","새 방에 들어가면 행동을 쓰지 않고 공기·습도에 관찰력 판정을 한 번 해요."],
  ],
  scen:"이번 시나리오에서 루카스는 검은 상자를 쓴 조력자, 오브젝트 헤드예요. 상자에는 짧은 문장만 떠요. 원래도 말이 짧은 사람이라 잘 어울려요."
 }
};

const OB={
 luka:`<details><summary>시나리오 배역 수치 (스포일러 · 오브젝트 헤드 버전)</summary>
 <p>정신력 80 → 60 (니알라토텝의 화신에게 20을 바침). 마력 최대 12, 현재 7 (주문 ‘흐릿한 기억’ 2회로 5 소모). 이성 최대 60, 현재 57. 지능 85+9 (생체 컴퓨터 링크). 신체재생(50% 확률로 체력 1 회복). 주문: 흐릿한 기억 · 요그 소토스의 주먹. 사격(전기총) 55, 크툴루 신화 25.</p>
 <p>맨얼굴을 보면 이성 1/1D5를 잃어요. 상자 출력문은 짧게. 처음 출력은 “HELLO, MY DEAR.”</p></details>`,
 him:`<details><summary>시나리오 배역 메모 (스포일러)</summary>
 <p>시작할 때 소지품은 없어요(장갑도 스케치북도 없음, 환자복 한 벌). 머리는 땋여 있지 않아요. 기억은 이름·나이·칼을 든 낯선 사람까지. 추천 기능은 관찰력·듣기·근접전(격투)·회피이고, 과학(천문학)은 기본치예요.</p></details>`
};

const el=document.getElementById('sheet');
let showAll=false,cur='him';
const h=v=>Math.floor(v/2), f=v=>Math.floor(v/5);

function render(k){
 const d=DATA[k], S=Object.fromEntries(d.stats.map(s=>[s[1],s[2]]));
 const hp=Math.floor((S.CON+S.SIZ)/10), mp=Math.floor(S.POW/5), dodge=h(S.DEX);
 const raised={}; d.skills.forEach(s=>raised[s[0]]=s);
 let rows=d.skills.map(s=>{const v=s[1]+s[2]+s[3];
   return `<tr class="up"><td>${s[0]}<span class="tag ${s[4]}">${s[4]==='occ'?'직업':'관심'}</span></td><td class="n big">${v}</td><td class="n">${h(v)}</td><td class="n">${f(v)}</td><td class="note">${s[5]}</td></tr>`}).join('');
 rows+=`<tr class="up"><td>${d.native[0]}<span class="tag">교육</span></td><td class="n big">${d.native[1]}</td><td class="n">${h(d.native[1])}</td><td class="n">${f(d.native[1])}</td><td class="note">모국어 기본치 = 교육</td></tr>`;
 rows+=`<tr class="up"><td>회피<span class="tag">민첩½</span></td><td class="n big">${dodge}</td><td class="n">${h(dodge)}</td><td class="n">${f(dodge)}</td><td class="note">${k==='him'?'키가 커서 피하는 쪽보다 받는 쪽':'작고 빠름'}</td></tr>`;
 if(showAll){
   const base=Object.keys(BASE).filter(n=>!Object.keys(raised).some(r=>r.startsWith(n.replace(/\(.*\)/,''))&&r===n)).sort((a,b)=>a.localeCompare(b,'ko'));
   rows+=base.map(n=>{const v=BASE[n];return `<tr><td>${n}</td><td class="n">${v}</td><td class="n">${h(v)}</td><td class="n">${f(v)}</td><td class="note">기본치</td></tr>`}).join('');
 }
 const occUsed=d.skills.reduce((a,s)=>a+s[2],0), intUsed=d.skills.reduce((a,s)=>a+s[3],0);
 el.innerHTML=`
 <div class="top"><div><p class="name">${d.name}</p><span class="role">${d.role}</span><p class="quote">${d.quote}</p></div><span class="stamp">${d.stamp}</span></div>
 <div class="prof">${d.prof.map(p=>`<div><b>${p[0]}</b>${p[1]}</div>`).join('')}</div>
 <section><h2>특성치 <small>보통 / 어려움 / 대단함</small></h2>
  <div class="stats">${d.stats.map(s=>`<div class="stat"><span class="k">${s[0]}<i>${s[1]}</i></span><span class="v">${s[2]}</span><span class="hf">${h(s[2])} · ${f(s[2])}</span><span class="why">${s[3]}</span></div>`).join('')}</div></section>
 <section><h2>파생 수치</h2>
  <div class="derived">
   <div class="der"><b>체력</b><span>${hp}</span></div>
   <div class="der"><b>마력</b><span>${mp}</span></div>
   <div class="der"><b>이성</b><span>${S.POW}</span></div>
   <div class="der"><b>행운</b><span>${S.LUK}</span></div>
   <div class="der"><b>이동력</b><span>${d.move}</span></div>
   <div class="der"><b>피해 보너스 · 체구</b><span>${d.db} · ${d.build}</span></div>
   <div class="der"><b>회피</b><span>${dodge}</span></div>
  </div></section>
 <section><h2>기능</h2>
  <div class="pts"><span>${d.occ}</span><span>직업 ${occUsed}/${d.occTotal}</span><span>관심(지능×2) ${intUsed}/${d.intTotal}</span><span>남은 점수 0</span></div>
  <div class="tblwrap"><table><thead><tr><th>기능</th><th>보통</th><th>½</th><th>⅕</th><th>메모</th></tr></thead><tbody>${rows}</tbody></table></div>
  <button class="toggle" id="tg">${showAll?'올린 기능만 보기':'기본치까지 전체 보기'}</button></section>
 <section><h2>무기</h2>
  <div class="tblwrap"><table><thead><tr><th>무기</th><th>보통</th><th>½</th><th>⅕</th><th>피해</th></tr></thead><tbody>
   <tr><td>맨손</td><td class="n">${raised['근접전(격투)']?25+raised['근접전(격투)'][3]:25}</td><td class="n">${h(raised['근접전(격투)']?40:25)}</td><td class="n">${f(raised['근접전(격투)']?40:25)}</td><td>1D3${d.db==='0'?'':' + '+d.db}</td></tr>
  </tbody></table></div></section>
 <div class="two">
  <div class="box"><h3>소지품</h3><ul>${d.gear.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="box"><h3>신념</h3><ul>${d.belief.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="box"><h3>중요한 사람</h3><ul>${d.people.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="box"><h3>특징</h3><ul>${d.traits.map(x=>`<li>${x}</li>`).join('')}</ul></div>
 </div>
 <section><h2>오리지널 특수기능 <small>하우스룰</small></h2>
  <div class="specials">${d.specials.map(s=>`<div class="special"><b>${s[0]}</b><p>${s[1]}</p></div>`).join('')}</div></section>
 <section><h2>이번 배역 — 〈네게 헬리오트로프를〉</h2><p style="margin:0 0 10px">${d.scen}</p>${OB[k]}</section>`;
 document.getElementById('tg').onclick=()=>{showAll=!showAll;render(cur)};
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
 cur=b.dataset.k;render(cur);
});
render('him');
</script>

<script src="backnav.js" defer></script>
</body>
</html>
