<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take middle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#17110c; --ink:#21180f; --pink:#8f7149; --pink-soft:#eadfc9;
  --face:#d8cbb3; --hi:#f4ecdc; --lo:#8c7b62; --paper:#f3ece0;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(214,180,120,.14),transparent 70%) no-repeat var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#ece2cd;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:#c4a676;margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #5e4630}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#6d5d4a;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630;
  box-shadow:inset -1px -1px 0 #5e4630,inset 1px 1px 0 #c9ad84;margin-top:6px}
.nar{align-self:stretch;background:#ebe2d2;border:1px dashed #b3a184;padding:8px 10px;font-size:13px;line-height:1.55;color:#4a3d30;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a8d7c;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630}
.btn:disabled{color:#8f826f;text-shadow:none;cursor:default}
.btn.main:disabled{background:#bfa888}
.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.hint{font-size:12px;color:#a39580;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
</style>
</head>

    <div class="panel" id="panel">

</div>

const STORY=[["H", "프롤로그"], ["N", "8월 말, 하이델베르크. 그의 작업실, 옛 다리에서 걸어서 7분 거리 건물 3층."], ["N", "루카스의 손목 나사는 이제 비가 오기 전날에만 조금 욱신거렸다. 단추 서른네 개는 4분이면 채웠다. 일부러 천천히 채우는 날에는 5분."], ["N", "그날 저녁, 루카스는 작업실 소파에 앉아 있었다. 그는 이젤 앞에 서 있었다. 그리고 루카스는 그것을 세 번째로 보았다. 붉은 머리카락 끝이 팔레트에 닿는 것을."], ["L", "...머리."], ["P", "네?"], ["L", "팔레트에 들어갔어. 또."], ["N", "그가 돌아보았다. 무릎까지 오는 머리카락 끝이 남색과 금색으로 얼룩져 있었다. 그는 그것을 손가락으로 집어 보고 웃었다."], ["P", "ㅎㅎ 오늘만 세 번째예요."], ["L", "네 번째야."], ["P", "세어요?"], ["L", "보이니까."], ["N", "그는 머리카락 끝을 한참 내려다보았다. 그리고 아무렇지 않은 목소리로 말했다."], ["P", "...자를까 봐요."], ["N", "루카스가 읽던 책에서 눈을 들었다."], ["P", "엄마 다음 주에 오시잖아요. 엄마는 늘 그랬거든요. 단정하게 하라고. 화가가 머리를 물감에 담그고 다니면 어떡하냐고. ㅎㅎ 이참에 어깨까지만."], ["L", "......"], ["P", "어때요?"], ["L", "...네 머리야."], ["N", "루카스는 다시 책으로 눈을 내렸다. 같은 줄을 세 번 읽었다. 페이지를 넘기지 않았다."], ["N", "그는 그것을 보지 못했다. 다시 붓을 들었다. 머리카락 끝이 다섯 번째로 팔레트에 닿았다."], ["H", "1장. 해바라기"], ["N", "9월 첫째 주 토요일. 하이델베르크 중앙역."], ["N", "루카스는 해바라기 한 다발을 들고 있었다. 다섯 송이. 꽃집 주인이 일곱 송이를 권했는데, 루카스가 다섯으로 줄였다. 홀수가 좋다고 해서 일곱이었다. 루카스는 일곱은 너무 많아 보인다고 했다."], ["N", "그는 그 옆에서 루카스의 손을 보았다. 해바라기 줄기를 쥔 손가락이 하얬다. 너무 세게 쥐어서."], ["P", "...루카, 줄기 부러지겠어요."], ["L", "안 부러져."], ["P", "손가락이 하얘요."], ["L", "원래 하얘."], ["N", "기차가 들어왔다. 내리는 사람들 사이로, 회색 코트를 입은 작은 여자가 보였다. 일흔이 넘었는데 등이 꼿꼿했다. 짧게 자른 은발. 손에는 작은 가방 하나와, 그보다 더 소중하게 든 나무 상자 하나."], ["U", "...오래 기다렸니."], ["P", "엄마! 아니요, 방금 왔어요."], ["N", "그가 몸을 굽혀 어머니를 안았다. 루스는 그 품에서 아들의 머리카락을 한 줌 쥐어 보았다. 그리고 미간을 아주 조금 찌푸렸다."], ["U", "또 물감 묻혔구나."], ["P", "ㅎㅎ 자르려고요. 곧."], ["U", "그래."], ["N", "루스가 아들에게서 떨어져, 그 옆의 검은 머리 남자를 보았다. 해바라기를 쥔 하얀 손가락을. 오래."], ["L", "...처음 뵙겠습니다. 루카스 아스카니엔입니다."], ["N", "루카스가 해바라기를 내밀었다. 루스는 그것을 받았다. 그리고 아무 말 없이 한 번 고개를 끄덕였다. 그것이 전부였다."], ["N", "나중에, 아주 나중에 루스는 그날 얘기를 했다. 해바라기 줄기를 쥔 그 하얀 손가락을 보고, 그 애 아버지 같은 사람인 줄 알았다고. 3년 동안 매주 해바라기를 들고 오던 사람."], ["N", "그날 루카스는 그 말을 듣지 못했다. 그날 루카스가 들은 건, 호텔로 가는 택시 안에서 루스가 한 단 한마디였다."], ["U", "상자는 당신이 들어요. 손이 정확하다고 들었어요."], ["H", "2장. 호두나무 상자"], ["N", "상자는 호두나무였다. 모서리가 닳아 둥글었다. 경첩은 황동. 안에는 편지가 61통 들어 있었다. 독일어로."], ["N", "아우구스트 하르트만이 50년 동안 마거릿에게 쓴 편지였다. 마거릿은 끝내 독일어를 배우지 못했다. 아우구스트는 끝내 그것을 영어로 옮기지 않았다."], ["U", "어머니는 이걸 평생 침대 옆에 두셨어요. 읽지도 못하면서. 가끔 꺼내서 글씨를 손가락으로 따라 그리셨어요."], ["N", "루스의 호텔 방. 창가 탁자. 우유를 넣은 홍차 세 잔. 루스는 차를 한 모금 마시고, 루카스를 보았다."], ["U", "읽어 줄 수 있어요?"], ["L", "......제가요?"], ["U", "그 애는 독일어를 못 하고, 나도 못 해요. 그리고 이 도시에서 이 종이를 제일 조심해서 만질 사람이 당신이라고 들었어요."], ["N", "그가 옆에서 어머니를 보았다. 처음 듣는 얘기였다. 루스는 아들을 보지 않았다."], ["L", "...다나 씨가 그랬습니까."], ["U", "엘제라는 분이요. 편지로 물어봤어요."], ["N", "루카스는 대답하지 않았다. 대신 일어나서 세면대로 갔다. 손목까지, 비누 두 번. 돌아와서 앉았다. 상자를 열었다. 첫 번째 봉투를 꺼냈다. 핀셋 없이, 손끝으로, 가장자리만."], ["N", "그리고 읽기 시작했다. 독일어로 한 문장. 그다음 영어로 한 문장. 천천히."], ["N", "그날부터 엿새 동안, 매일 저녁 루스의 호텔 방에서 루카스는 편지를 읽었다. 하루에 열 통 남짓. 아우구스트의 말을, 자기 목소리로."], ["N", "말이 짧은 남자였다. 아우구스트는. 편지는 대부분 다섯 줄을 넘지 않았다. 날씨. 그림. 마당의 사과나무. 그리고 마지막 줄은 거의 언제나 같았다. 당신이 오늘도 거기 있어서 다행이오."], ["N", "그는 매일 저녁 소파 끝에 앉아 그것을 들었다. 무릎에 손을 얹고. 두 걸음 떨어진 의자에 앉던 그 자세로."], ["H", "3장. 빗"], ["N", "나흘째 저녁. 편지를 다 읽은 뒤였다. 루스가 차를 새로 따랐다. 그리고 창밖의 강을 보며, 혼잣말처럼 말했다."], ["U", "...어머니가 마지막 몇 년은 손을 떠셨어요."], ["P", "......"], ["U", "파킨슨이었어요. 숟가락을 못 들었고, 단추를 못 채웠고. 그리고 머리를 못 빗었어요. 어머니 머리가 길었거든요. 허리까지. 평생 한 번도 짧게 자른 적이 없었어요."], ["N", "루카스가 찻잔을 내려놓았다. 받침과 정확히 맞게."], ["U", "그래서 아버지가 빗겨 드렸어요. 매일 아침. 아무 말 없이. 끝에서부터, 조금씩, 위로. 나는 열 살 무렵에 그걸 문틈으로 봤어요. 아버지가 말을 한마디도 안 하는데, 그게 하나도 이상하지 않았어요."], ["P", "......할아버지가요?"], ["U", "그 사람은 그런 사람이었어요. 말 대신 손을 쓰는."], ["N", "루스가 루카스를 보았다. 루카스는 루스를 보지 않았다. 찻잔을 보고 있었다."], ["U", "...당신도 그런 사람이라고 들었어요."], ["N", "루카스의 귀 끝이 붉어졌다. 그는 그것을 보았다. 루스도 보았다. 아무도 그것에 대해 말하지 않았다."], ["N", "그날 밤, 다리를 건너 집으로 돌아오는 길. 그가 머리카락 끝을 만지작거리며 말했다."], ["P", "엄마 가시기 전에 자르려고 했는데. ㅎㅎ 미용실 예약해 놨어요. 목요일."], ["L", "......"], ["P", "루카?"], ["L", "...목요일."], ["N", "루카스는 그 말만 했다. 그리고 집에 도착할 때까지 아무 말도 하지 않았다. 계단 쉰두 개를 다 오를 때까지."], ["H", "4장. 마흔일곱 번째"], ["N", "닷새째 저녁. 마흔일곱 번째 편지. 날짜는 아우구스트의 일흔여덟 번째 생일 즈음이었다."], ["N", "루카스는 봉투를 열고, 편지지를 펼쳤다. 다른 편지들보다 길었다. 열두 줄. 루카스는 첫 줄을 독일어로 읽었다. 그리고 영어로 옮기려다, 멈췄다."], ["U", "...왜요?"], ["L", "아닙니다."], ["N", "루카스는 다시 읽기 시작했다. 영어로."], ["L", "'마거릿. 오늘도 당신 머리를 세 갈래로 땋는 데 실패했소. 당신은 웃었지만, 나는 웃지 않았소.'"], ["N", "루스가 찻잔을 든 채 멈췄다."], ["L", "'당신 손이 떨리기 시작한 뒤로, 나는 빗질은 배웠소. 그러나 땋는 것은 아직 못 하오. 당신은 평생 아침마다 땋았는데. 그래서 오늘 시내의 직조공을 찾아갔소. 일흔여덟 살 먹은 남자가 일흔 살 먹은 직조공에게 세 가닥 실을 엮는 법을 배우겠다고 하니, 그 사람도 웃었소.'"], ["L", "'실은 머리카락보다 정직하오. 엉키면 엉킨 자리가 보이오. 머리카락은 다 엉킨 뒤에야 보이오. 그래서 실로 먼저 배우겠소. 당신 머리는 실보다 귀하니까.'"], ["N", "루카스는 거기서 한 번 멈췄다. 숨을 고르는 것처럼. 그리고 마지막 두 줄을 읽었다."], ["L", "'자르자고 하지 마시오. 내가 매일 땋을 테니. 그러니 거기 있어 주시오.'"], ["N", "방 안이 조용해졌다."], ["N", "루스는 한참 아무 말도 하지 않았다. 그러다 아주 작게 말했다."], ["U", "...그건 몰랐어요."], ["P", "엄마?"], ["U", "직조공한테 배우신 건. 나는 어느 날부터 어머니 머리가 땋아져 있는 것만 봤어요. 처음엔 엉망이었는데, 나중엔 어머니가 직접 한 것보다 예뻤어요. 나는 그걸 그냥, 아버지가 원래 손재주가 좋아서 그런 줄 알았어요."], ["N", "루스가 찻잔을 내려놓았다. 손이 아주 조금 떨렸다. 일흔이 넘은 손이었다."], ["U", "...배우셨구나. 그 나이에."], ["N", "그는 어머니의 손을 잡았다. 그리고 루카스를 보았다. 루카스는 편지지를 내려다보고 있었다. 영어로 옮긴 그 마지막 줄을. '자르자고 하지 마시오.'"], ["N", "그는 그것을 오래 보았다. 루카스가 편지를 읽을 때 한 번 멈췄던 이유를, 그제야 알 것 같았다."], ["H", "5장. 세 갈래"], ["N", "목요일 아침, 일곱 시. 두 사람의 집. 욕실 거울 앞."], ["N", "루카스는 그의 셔츠 단추를 채우고 있었다. 서른네 개. 그날은 3분 50초. 평소보다 빨랐다. 맨 아래 단추를 채우자마자 루카스가 말했다."], ["L", "앉아."], ["P", "네?"], ["L", "의자. 앉아."], ["N", "그가 욕실 의자에 앉았다. 루카스가 그 뒤에 섰다. 손에는 빗이 들려 있었다. 언제 샀는지 그는 몰랐다. 나무 빗이었다. 살이 넓은."], ["P", "...루카? 저 오늘 열한 시에 미용실—"], ["L", "취소해."], ["P", "......"], ["L", "자르지 마."], ["N", "그는 거울 속의 루카스를 보았다. 루카스는 그를 보지 않았다. 머리카락 끝을 보고 있었다. 남색과 금색 얼룩이 남은."], ["L", "...묶어 줄게. 매일. 물감에 안 닿게."], ["P", "......"], ["L", "그러니까 자르지 마."], ["N", "그것은 마흔일곱 번째 편지의 마지막 줄과 거의 같은 말이었다. 다만 '거기 있어 주시오'가 빠져 있었다. 그는 그 빠진 말을 들었다. 들리지 않는 쪽의 말을."], ["P", "......ㅎㅎ 네."], ["N", "루카스가 빗질을 시작했다. 끝에서부터. 조금씩, 위로. 엉킨 데가 나오면 멈추고, 손가락으로 풀고, 다시. 젖은 종이에서 들러붙은 섬유를 떼어 내듯이. 무릎까지 다 빗는 데 12분이 걸렸다."], ["N", "그리고 루카스는 머리카락을 세 갈래로 나눴다."], ["N", "첫 번째 시도. 손바닥 하나 길이쯤 땋다가 가운데 갈래가 빠져나왔다. 풀었다."], ["N", "두 번째 시도. 위쪽은 느슨하고 아래쪽은 너무 단단해서, 땋은 머리가 S자로 휘었다. 풀었다."], ["N", "세 번째 시도. 허리쯤에서 왼쪽 갈래와 오른쪽 갈래가 뒤바뀌었다. 루카스가 미간을 찌푸렸다. 깊게."], ["P", "ㅎㅎ 루카, 땋을 줄 알아요?"], ["L", "몰라."], ["P", "그럼—"], ["L", "배우는 중이야."], ["N", "네 번째 시도에서 루카스는 무릎까지 다 땋았다. 고무줄로 끝을 묶었다. 한 걸음 물러섰다."], ["N", "그는 거울을 보았다. 등 뒤로 굵은 붉은 땋은 머리가 늘어져 있었다. 위쪽은 헐렁했고, 중간에 한 번 굵기가 바뀌었고, 아래쪽은 정확했다. 루카스가 허리쯤에서 요령을 터득했다는 증거였다."], ["L", "...별로면 풀어."], ["P", "안 풀어요."], ["L", "위쪽이 느슨해. 그리고 허리에서 한 번 틀어졌어."], ["P", "안 풀어요. 절대."], ["N", "그날 열한 시, 그는 미용실에 전화해서 예약을 취소했다. 미용사가 이유를 물었다. 그는 대답했다."], ["P", "담당자가 바뀌었어요. ㅎㅎ"], ["H", "6장. 섬유는 섬유야"], ["N", "같은 날 점심. 고문헌 복원실."], ["N", "요나스가 점심을 먹고 돌아왔을 때, 루카스의 작업대 위에는 양피지가 없었다. 대신 제본용 아마실이 세 가닥 놓여 있었다. 한쪽 끝이 집게로 작업대에 고정된 채. 루카스가 그것을 땋고 있었다. 풀었다. 다시 땋았다."], ["M", "...선배님. 그거 뭐 하시는 거예요?"], ["L", "제본 실 꼬는 연습."], ["M", "제본 실은 꼬지 땋지 않잖아요."], ["L", "......"], ["M", "그리고 그거 세 가닥이잖아요. 제본 실은 두 가닥으로 꼬고요."], ["L", "요나스."], ["M", "네."], ["L", "지하 3층."], ["M", "아뇨! 아뇨, 저 아무것도 안 봤어요."], ["N", "요나스가 자기 작업대로 도망갔다. 그리고 휴대폰을 꺼내 무언가를 검색했다. 5분 뒤, 루카스의 작업대 끝에 휴대폰이 슬쩍 밀려 왔다. 화면에는 동영상이 떠 있었다. '긴 머리 세 갈래 땋기, 초보자용.'"], ["L", "......"], ["M", "...그냥 참고하시라고요. 제본에."], ["N", "루카스는 휴대폰을 밀어 돌려보냈다. 그리고 30초 뒤, 다시 끌어왔다."], ["N", "반대편 작업대에서 엘제 선생님이 그것을 보고 있었다. 아무 말도 하지 않았다. 오후 세 시, 엘제 선생님이 서고에 다녀왔다. 그리고 루카스의 작업대 위에 낡은 책 한 권을 아무 말 없이 내려놓았다."], ["N", "가죽 장정이 반쯤 벗겨진 책이었다. 제목은 독일어로, '18세기 직물 매듭 기법 도해'."], ["L", "...선생님."], ["O", "직물 보존과에서 폐기하려던 거야. 습도 맞춰서 보관해."], ["L", "이건—"], ["O", "머리카락은 섬유야. 실보다 약하고, 실보다 탄성이 있지. 실로 먼저 익히고, 머리로 넘어가. 그게 순서야."], ["N", "루카스가 고개를 들었다. 엘제 선생님은 이미 자기 작업대로 돌아가 있었다."], ["L", "......누가 말했습니까."], ["O", "아무도. 네 작업대에 아마실 세 가닥이 있는데, 제본은 두 가닥이고. 그리고 오늘 아침에 그 사람이 복원실 앞을 지나갔어. 등에 땋은 머리를 하고. 위쪽이 느슨하더라."], ["L", "......"], ["O", "허리에서 한 번 틀어졌고."], ["N", "요나스가 작업대 뒤에서 숨을 들이켰다. 웃음을 참는 소리였다. 루카스는 아무도 보지 않고 도해집의 첫 장을 펼쳤다."], ["N", "그날 밤부터 루카스의 저녁 일정이 하나 늘었다. 루스의 호텔에서 편지를 읽고 돌아와, 거실 탁자에서 도해집을 펼쳐 놓고 아마실 세 가닥을 땋는 것. 30분. 매일."], ["N", "그는 소파에서 그것을 보았다. 미간을 찌푸리고, 세 가닥을 하나씩 넘기는 얼굴. 핀셋을 들 때와 똑같은 얼굴이었다."], ["P", "...루카, 그거 꼭 해야 돼요? 제 머리로 연습하면 되잖아요."], ["L", "안 돼."], ["P", "왜요?"], ["L", "실은 엉키면 엉킨 데가 보여. 머리카락은 다 엉킨 다음에 보여."], ["P", "......그거 할아버지 편지에 있던 말이잖아요."], ["L", "맞는 말이니까."], ["N", "루카스는 고개를 들지 않았다. 세 번째 매듭을 묶었다. 그리고 아주 작게 덧붙였다."], ["L", "...네 머리는 실보다 귀하니까."], ["N", "그는 대답하지 못했다. 소파 쿠션에 얼굴을 묻었다. 어깨가 떨렸다. 루카스는 그것을 보지 않은 척하며 네 번째 매듭을 묶었다. 귀 끝이 붉었다."], ["H", "7장. 로비"], ["N", "엿새째 저녁. 마지막 편지들을 읽는 날이었다."], ["N", "그날 아침의 땋은 머리는, 위쪽이 더 이상 느슨하지 않았다. 허리에서 틀어지지도 않았다. 7분이 걸렸다. 첫날의 절반."], ["N", "루스의 호텔 로비. 엘리베이터 앞에서 루스가 기다리고 있었다. 그가 먼저 다가가 어머니를 안았다. 루스는 아들의 등 뒤로 늘어진 땋은 머리를 보았다. 그리고 손을 뻗어, 그것을 끝까지 한 번 쓸어 내렸다."], ["U", "......자른다더니."], ["P", "ㅎㅎ 누가 매일 묶어 준대서요."], ["N", "루스가 루카스를 보았다. 루카스는 로비의 습도계를 보고 있었다. 호텔 로비에 습도계가 있을 리 없었다. 루카스는 벽에 걸린 시계를 보고 있었다."], ["U", "...세 번째 매듭부터 단단하네요."], ["L", "......첫날은 다섯 번째부터였습니다."], ["N", "루스가 웃었다. 소리 없이. 그 애와 똑같은 웃음이었다. 그리고 루카스 앞으로 한 걸음 다가섰다."], ["U", "하나 물어봐도 될까요."], ["L", "...네."], ["U", "루카라고 불러도 될까요. 그 애가 그렇게 부르던데."], ["N", "루카스가 멈췄다. 로비가 조용했다. 아니, 조용하지 않았다. 사람들이 오가고, 카트가 굴러가고, 프런트에서 전화가 울렸다. 루카스에게만 조용했다."], ["N", "대답이 나오는 데 한참 걸렸다."], ["L", "......네."], ["N", "그것밖에 나오지 않았다."], ["N", "그날 저녁 마지막 열네 통을 다 읽고, 호텔을 나서서, 루카스는 다리로 뛰었다. 뛰는 걸 싫어하는 사람이었다. 바람이 일면 먼지가 종이에 앉으니까. 그런데 뛰었다. 그가 그 뒤를 따라 뛰었다. 땋은 머리가 등에서 튀었다. 풀리지 않았다."], ["N", "다리 한가운데에서 루카스가 멈췄다. 숨이 차서 웃고 있었다."], ["P", "...루카, 왜 뛰어요? ㅎㅎ 뛰지 말라면서요."], ["L", "......몰라."], ["P", "숨차서 웃는 거예요?"], ["L", "...응."], ["N", "아니었다. 그는 그것을 알았다. 내 이름을 그렇게 불러 주는 사람이 하나 늘어서. 그래서 웃는 얼굴이었다."], ["N", "그는 그 얼굴을 그리고 싶었다. 그날은 스케치북이 없었다. 그래서 오래 보기만 했다. 외워 두려고."], ["H", "에필로그"], ["N", "루스가 보스턴으로 돌아가는 날 아침. 프랑크푸르트 공항."], ["N", "출국장 앞에서 루스는 루카스에게 크림색 봉투 하나를 건넸다. 작고 단단한 것이 두 개 든 봉투였다. 루스는 그것이 무엇인지 말하지 않았다. 다만 '어머니 거예요'라고만 했다. 루카스는 묻지 않았다. 봉투를 셔츠 가슴 주머니에 넣었다. 단추 위에."], ["N", "그리고 루스는 아들을 안았다. 오래. 아들의 땋은 머리를 다시 한 번 끝까지 쓸어 내렸다."], ["U", "...아버지보다 낫네요."], ["P", "ㅎㅎ 할아버지보다요?"], ["U", "아버지는 1년 걸렸어요. 이렇게 되기까지."], ["N", "루스가 루카스를 돌아보았다."], ["U", "루카는 일주일이네요."], ["L", "......아직 멀었습니다. 오른쪽 세 번째 매듭이 1밀리 틀어졌습니다."], ["U", "그건 아버지도 그랬어요. 평생."], ["N", "루스가 출국장으로 들어갔다. 한 번도 돌아보지 않았다. 그러다 보안 검색대 앞에서, 딱 한 번 멈췄다. 돌아보지는 않았다. 그는 그것을 보고 웃었다. 1년 전 JFK에서, 루카스도 그렇게 멈췄다고 들었으니까."], ["N", "다음 날 아침 일곱 시. 두 사람의 집. 욕실 거울 앞."], ["N", "먼저 단추. 서른네 개. 맨 위부터. 그다음 의자. 빗. 끝에서부터, 조금씩, 위로. 그다음 세 갈래."], ["N", "거실 탁자 위에는 도해집이 펼쳐져 있었다. 습도계 옆에. 51퍼 const $=id=>document.getElementById(id);
const KEY='new take middle-progress';
const steps=STORY.filter(s=>s[0]!=='H').length;
let pos=0,shown=0;   // pos: STORY 인덱스, shown: 보여 준 장면 수(제목 제외)

(()=>{const c=$('heart').getContext('2d'),m=['.##.##.','#######','#######','.#####.','..###..','...#...'];
  c.fillStyle='#fff';m.forEach((r,y)=>[...r].forEach((ch,x)=>ch==='#'&&c.fillRect(x,y,1,1)));})();

function build(s){
  const k=s[0],t=s[1];
  if(k==='H'){const e=document.createElement('div');e.className='chap';e.textContent=t;return e;}
  if(k==='N'){const e=document.createElement('div');e.className='nar';e.textContent=t;return e;}
  const who=k==='L'?'me':({K:'k',M:'m',O:'o',D:'d',R:'r',G:'g',U:'u'}[k]||'p'),e=document.createElement('div');
  e.className='msg'+(who==='me'?' me':'');
  const img=new Image();img.className='av';img.alt='';img.src=AV[who];
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;
  $('panel').replaceChildren();
  const c=document.createElement('div');c.className='cover';c.id='cover';
  c.innerHTML='<b>new take middle</b><span>하이델베르크, 세 갈래로 엮은 것.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span>';
  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
