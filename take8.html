<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take#8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#17110c; --ink:#21180f; --pink:#8f7149; --pink-soft:#eadfc9;
  --face:#d8cbb3; --hi:#f4ecdc; --lo:#8c7b62; --paper:#f3ece0;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(214,180,120,.14),transparent 70%) no-repeat var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#ece2cd;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:#c4a676;margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #5e4630}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#6d5d4a;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630;
  box-shadow:inset -1px -1px 0 #5e4630,inset 1px 1px 0 #c9ad84;margin-top:6px}
.nar{align-self:stretch;background:#ebe2d2;border:1px dashed #b3a184;padding:8px 10px;font-size:13px;line-height:1.55;color:#4a3d30;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.pic{margin:2px 0;align-self:center;width:100%;max-width:420px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;padding:5px}
.pic img{display:block;width:100%;height:auto}
.nar,.chap,.pic{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a8d7c;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630}
.btn:disabled{color:#8f826f;text-shadow:none;cursor:default}
.btn.main:disabled{background:#bfa888}
.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.hint{font-size:12px;color:#a39580;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
</style>
</head>

const STORY=[["H", "프롤로그. 일요일 아침의 전화"], ["N", "결혼하고 네 번째 가을. 11월 첫째 일요일, 아침 일곱 시."], ["N", "일요일은 쉬는 날이었다. 붓도 핀셋도 메일도 금지. 그래서 휴대폰은 거실 탁자 위에 엎어져 있었고, 그게 세 번째로 울리고 나서야 그가 이불 밖으로 손을 뻗었다."], ["N", "세 번 거는 사람은 급한 사람이었다. 다나가 아니었다. 보스턴, 루스의 옆집 번호였다."], ["P", "네, 저예요. ……네?"], ["N", "루카스는 그 '네?'에서 눈을 떴다. 그의 목소리가 그렇게 높아지는 걸 들은 건 1주년 전날 밤 이후 처음이었다."], ["N", "루스가 정원에서 넘어졌다고 했다. 해바라기 마른 대를 정리하다가. 고관절이 부러졌고, 오늘 수술이라고 했다."], ["P", "……네. 네. 바로 갈게요. 고맙습니다."], ["N", "전화를 끊은 그는 한참 동안 휴대폰을 쥔 채 침대 끝에 앉아 있었다. 발은 늘 그렇듯 침대 밖으로 나와 있었다."], ["L", "……보스턴."], ["P", "……네. 엄마가요."], ["L", "……가자."], ["N", "루카스는 이미 일어나 있었다. 셔츠 단추를 채우는 손이 평소보다 빨랐다. 그게 이상했다. 루카스는 셔츠 단추를 빨리 채우는 사람이 아니었다."], ["P", "루카, 잠깐만요."], ["L", "……"], ["P", "지금 복원실에 시편집 텐트 쳐 놨잖아요. 하루에 1밀리씩 펴는 거."], ["L", "……요나스한테 맡기면 돼."], ["P", "그거 요나스가 하면 루카 밤새 못 자잖아요."], ["L", "……"], ["N", "사실이었다. 습도 텐트 안의 종이는 사흘째 반쯤 열려 있었고, 지금 손을 떼면 다시 닫히는 종이였다."], ["P", "제가 먼저 갈게요. 수술 끝나고 상황 보고, 바로 전화할게요. 루카는 그거 끝나면 와요. ……이건 같이 정한 거예요. 맞죠?"], ["N", "그는 '같이'라는 말에 힘을 줬다. 혼자 정하지 않으려고. 1주년 아침에 한 약속이었다. 다음엔 물어. 나도 물을게."], ["L", "……열흘."], ["P", "ㅎㅎ 네?"], ["L", "……열흘이면 다 펴져. 그다음 날 갈게."], ["P", "네. 열흘이요."], ["N", "루카스는 그날 아침, 그의 머리를 땋았다. 공항 가는 차 안에서 풀리지 않게, 평소보다 한 번 더 단단하게. 6분 12초 신기록 날보다 빨리 끝났다. 손이 계속 빨랐다."], ["N", "프랑크푸르트 공항. 출국장 앞에서 그가 돌아봤다."], ["P", "다녀올게요, 루카."], ["L", "……전화해."], ["P", "매일 할게요ㅎㅎ"], ["N", "그 약속은, 사흘째부터 지켜지지 않았다."], ["H", "1장. 보조 침대"], ["N", "보스턴, 매사추세츠 종합병원. 정형외과 병동 7층."], ["N", "수술은 잘 끝났다. 그런데 사흘째 밤, 루스에게 열이 올랐다. 폐렴이었다. 일흔이 넘은 몸에 고관절 수술 뒤에 오는 폐렴은 흔하다고, 의사는 흔하다는 말을 세 번 했다. 세 번 하는 말은 급한 말이었다."], ["N", "루스는 중환자실로 내려갔다가 닷새 만에 다시 올라왔다. 그동안 그는 대기실 의자에서 잤고, 올라온 뒤로는 병실 창가의 보조 침대에서 잤다. 보조 침대는 그에게 머리 하나만큼 짧았다. 발이 늘 밖으로 나왔다. 집 침대에서처럼. 다만 여기엔 그 발을 이불 안으로 밀어 넣어 주는 사람이 없었다."], ["U", "……너 또 안 잤구나."], ["P", "잤어요ㅎㅎ 엄마 코 고는 소리 들으면서요."], ["U", "나는 코 안 골아."], ["P", "고세요. 아주 조금요. 아빠도 그렇게 말했잖아요."], ["N", "루스는 웃으려다 기침을 했다. 그는 등을 받쳐 주고 물을 건넸다. 빨대를 꽂은 물. 루카스가 복원실에서 핀셋 들고 있을 때 수프를 떠먹여 주던 손이었다. 손은 아는 일을 했다."], ["U", "루카는?"], ["P", "……일하고 있어요. 텐트 친 종이가 있어서요. 다음 주에 와요."], ["U", "전화는 해?"], ["P", "그럼요."], ["N", "거짓말은 아니었다. 전화는 왔다. 하루에 두 번, 아침 7시 55분 하이델베르크 시간에 한 번, 저녁에 한 번. 보스턴으로는 새벽 1시 55분과 오후였다. 루카스는 시차를 계산해서 거는 사람이 아니었다. 7시 55분은 7시 55분이었다."], ["N", "그는 첫 사흘은 받았다. 나흘째에는 중환자실 앞에서 못 받았다. 닷새째에는 받을 수 있었는데, 받지 않았다."], ["N", "화면에 '루카'가 떠 있는 동안 그는 휴대폰을 엎었다. 진동이 멎을 때까지. 그리고 메시지를 보냈다. '엄마 자요. 저도 괜찮아요ㅎ 나중에 전화할게요.'"], ["N", "나중은 오지 않았다."], ["H", "2장. 보내지 않음"], ["N", "엿새째 새벽 세 시. 병실의 불은 꺼져 있었고 루스의 숨소리는 고르게 낮았다. 모니터의 초록 숫자만 깜빡였다."], ["N", "그는 이어폰을 끼고, 휴대폰의 음성 메모 앱을 열었다. 녹음 버튼을 눌렀다. 아주 작게, 이불 속에 입을 묻고."], ["P", "(음성 메모 · 루카에게 · 보내지 않음 · 01) ……루카. 지금 하이델베르크 아홉 시죠. 출근했겠네요. 습도 봤어요? 50이에요?"], ["P", "(음성 메모 · 01) ……전화 안 받아서 미안해요. 받으면 울 것 같아서요. 루카가 \"……괜찮아?\" 하면, 저 진짜로 울 것 같아서요."], ["N", "정지 버튼. 저장. 제목은 자동으로 '새 녹음'이 되었다. 그는 그걸 '루카에게 (보내지 않음) 01'로 바꿨다."], ["N", "다음 날 새벽에는 02가 생겼다. 그다음 날엔 03, 04."], ["P", "(음성 메모 · 04) ……오늘 의사 선생님이 엄마 손 보고 그러셨어요. 회복이 느리다고. 나이가 있으시니까요, 하고. ……저는 그 말을 끝까지 못 들었어요. 루카가 하던 거 있잖아요. 반쪽만 듣는 거. 저도 했어요. 나머지 반쪽 무서워서요."], ["P", "(음성 메모 · 07) ……머리가 엉켰어요. 루카가 안 땋아 주니까요. 혼자 땋으려고 했는데 세 갈래가 안 돼요. 손이 두 개밖에 없어서요. ……루카는 어떻게 했어요? 루카도 손 두 개잖아요."], ["P", "(음성 메모 · 07) ……자를까 생각했어요. 병원 앞에 미용실 있어요. 들어가려다가 그냥 나왔어요. 루카가 \"……네 머리야\"라고 할 것 같아서요. 근데 루카가 안 자르는 게 더 좋아할 것 같아서요. ……제가 아직 루카 거고 싶은가 봐요. 머리까지."], ["N", "열흘째 되던 날, 루카스에게서 메시지가 왔다. 짧았다."], ["L", "……다 폈어. 내일 비행기."], ["N", "그는 그 메시지를 오래 봤다. 읽음 표시가 떴다. 그리고 그는 답장을 썼다."], ["P", "루카 오지 마요. 엄마 괜찮아지고 있어요. 11시간 싫어하잖아요ㅎ 제가 곧 갈게요."], ["N", "보내고 나서야 알았다. '곧'이 언제인지 자기도 몰랐다. 그리고 그건 같이 정한 게 아니었다. 혼자 정한 거였다. 또."], ["P", "(음성 메모 · 11) ……방금 루카한테 오지 말라고 했어요. 거짓말이에요. 와 줬으면 좋겠어요. 근데 오면 안 될 것 같아요."], ["P", "(음성 메모 · 11) ……루카는 확실한 사람이잖아요. 0.1밀리도 안 틀리는 사람. 습도 49면 49라고 하는 사람. 근데 저는 지금 엄마 열이 몇 도인지도 간호사 선생님한테 세 번 물어봐야 알아요. 아무것도 확실한 게 없어요. ……루카 옆에 서 있을 사람이, 이런 사람이면 안 될 것 같아요."], ["P", "(음성 메모 · 14) ……오늘 낮에 잠깐, 아주 잠깐, 우리가 헤어지면 루카는 편하겠다는 생각을 했어요."], ["P", "(음성 메모 · 14) ……1분도 안 돼요. 진짜예요. 생각하자마자 너무 무서워서 화장실 가서 세수했어요. 세 번이요."], ["P", "(음성 메모 · 14) ……근데 했어요. 그 생각. 그래서 루카 전화를 더 못 받겠어요."], ["N", "그날 저녁, 부재중 전화가 14통으로 늘어 있었다."], ["H", "3장. 열네 통"], ["N", "하이델베르크, 대학 도서관 고문헌 복원실. 같은 날 오후."], ["N", "루카스는 작업대 앞에 앉아 있었다. 시편집은 다 펴져서 이미 압착기 아래 들어가 있었다. 할 일이 없는 작업대였다. 그런데 루카스는 핀셋을 들고 있었다. 수평으로, 아무것도 안 집은 채로."], ["M", "선배님…… 그 핀셋, 사십 분째 그 각도예요."], ["L", "……알아."], ["M", "내일 비행기 아니셨어요?"], ["L", "……오지 말래."], ["M", "네?"], ["N", "루카스는 휴대폰을 작업대 위에 놓았다. 화면을 위로 해서. 그건 루카스가 남에게 보여 주는 방식이었다. 요나스는 그 화면을 봤다. '루카 오지 마요. 엄마 괜찮아지고 있어요. 11시간 싫어하잖아요ㅎ 제가 곧 갈게요.'"], ["M", "……이거, 괜찮다는 거 아니에요?"], ["L", "……'ㅎ'가 하나야."], ["M", "……네?"], ["L", "……걔는 괜찮으면 두 개 써."], ["N", "요나스는 입을 다물었다. 지하 3층 얘기가 나오지 않는 것만으로 이 상황이 얼마나 나쁜지 알 수 있었다."], ["N", "루카스는 수첩을 펴서 요나스 쪽으로 밀었다. 습도 기록 다음 장에, 날짜별로 줄이 그어져 있었다."], ["N", "'1일. 통화 2. 목소리 — 정상. / 2일. 통화 2. 목소리 — 낮음. / 3일. 통화 1. 37초. / 4일. 통화 0. 메시지 1. / 5일. 통화 0. 메시지 1. ㅎ 1개. / … / 10일. 통화 0. 부재중 누적 14.'"], ["N", "그 아래에, 한 줄이 더 있었다. 볼펜이 종이를 조금 눌러 판 자국이 있었다."], ["N", "'판정 보류. 반쪽만 있음.'"], ["M", "……선배님, 판정 안 하셨어요?"], ["L", "……안 해."], ["M", "예전엔 이 정도면 바로—"], ["L", "……'다시 볼 일 없습니다.' 했겠지."], ["N", "요나스는 대답하지 못했다. 그 말은 복원실 사람이면 다 알았다."], ["L", "……반쪽이잖아. 나머지는 거기 있어."], ["N", "그때 루카스의 휴대폰이 울렸다. 세 번째에 받았다. 다나였다. 뉴욕에서, 새벽 다섯 시에."], ["D", "루카, 나야. 세 번 걸었어. 급하다는 뜻이야."], ["L", "……알아요."], ["D", "걔 내 전화도 안 받아. 근데 루스 병원 간호사실에 내 친구 딸이 있거든. 들었어. 걔 열흘째 병실에서 자. 집엔 샤워하러만 가. 밥은 병원 자판기. 그리고 머리가— 루카, 걔 머리 꼴이 말이 아니래."], ["L", "……"], ["D", "내가 걔 열아홉 살 때부터 봤어. 걔는 무너질 때 땅을 파. 아무한테도 안 보이게, 혼자. 허리케인 때도 그랬어. 1년 동안 붓 못 잡을 때. 그때는 그 구덩이에서 꺼내 줄 사람이 없었어."], ["L", "……"], ["D", "지금은 있잖아."], ["N", "루카스는 대답하지 않았다. 다나는 이제 그 침묵을 기다릴 줄 알았다. 오 초. 칠 초."], ["L", "……주소 보내 주세요. 루스 집."], ["D", "벌써 보냈어. 문자 확인해."], ["N", "전화를 끊자 엘제 선생님이 작업대 옆에 서 있었다. 언제부터였는지 몰랐다. 선생님은 늘 그랬다."], ["O", "압착기는 내가 볼게. 사흘이야, 그거."], ["L", "……선생님."], ["O", "가."], ["L", "……"], ["O", "말이 짧은 남자들은 꼭 그래. 와 달라는 말을 오지 말라고 해. 너도 그랬잖아."], ["N", "루카스의 귀 끝이 붉어졌다. 3초. 엘제 선생님은 그걸 보고도 못 본 척, 루카스의 작업대 위 핀셋을 수평으로 바로 놓아 주었다."], ["N", "그날 밤, 루카스는 프랑크푸르트발 보스턴행 편도표를 끊었다. 11시간 10분. 결제 버튼 앞에서 손가락이 한 번 멈췄다. 비행기가 싫어서가 아니었다. 그에게 묻지 않고 가는 거라서."], ["N", "그리고 눌렀다. 이번엔 묻지 않기로 했다. 물으면 그는 또 '오지 마요ㅎ'라고 할 테니까. 'ㅎ' 하나로."], ["H", "4장. 소파 끝"], ["N", "보스턴, 루스의 집. 사흘 뒤 밤 열한 시 사십 분."], ["N", "그는 병원에서 돌아와 현관문을 열고 불을 켜지 않았다. 켜면 집이 비어 있다는 게 보일 것 같아서."], ["N", "코트를 벗지 않았다. 신발도 반쯤만 벗었다. 그대로 거실로 가서 소파 끝에 걸터앉았다. 엉덩이만 겨우 걸친 채로. 누우면 잠들 것 같았고, 잠들면 병원에서 전화가 올 것 같았다. 둘 다 무서웠다."], ["N", "휴대폰은 무릎 위에 엎어져 있었다. 부재중 전화가 열네 통에서 멈춰 있었다. 사흘째 더 늘지 않았다. 그게 더 무서웠다. 루카가 이제 안 거나 봐."], ["N", "땋지 못한 머리는 소파 팔걸이를 넘어 바닥까지 흘러내려 있었다. 엉킨 데가 셀 수 없었다. 아우구스트의 편지에 그런 말이 있었다. 실은 엉키면 엉킨 자리가 보이는데, 머리카락은 다 엉킨 뒤에야 보인다고."], ["P", "(음성 메모 · 19) ……루카. 오늘 엄마가 처음으로 혼자 일어나 앉았어요. 물리치료 선생님이 박수 쳤어요. 저도 쳤어요. ……근데 제일 먼저 루카한테 말하고 싶었는데, 루카한테 말할 자격이 없는 것 같아서 여기다 말해요."], ["P", "(음성 메모 · 19) ……보고 싶어요. 이건 보내야 하는데. 보내야 하는데—"], ["N", "노크 소리가 났다."], ["N", "두 번. 똑, 똑. 정확한 간격으로. 세게도 약하게도 아니게."], ["N", "그는 고개를 들었다. 이 시간에 올 사람은 없었다. 옆집 할머니라면 초인종을 눌렀을 것이다. 그는 녹음을 끄는 것도 잊고, 일어나 현관으로 갔다. 문을 열었다."], ["N", "찬 공기가 먼저 들어왔다."], ["N", "11월 보스턴의 밤공기였다. 차갑고, 바싹 말라 있었다. 그 안에 기내의 건조한 냄새가 섞여 있었고, 그 맨 끝에, 아주 희미하게."], ["N", "시더우드."], ["N", "열흘 넘게 병원 소독약 냄새만 맡던 코에, 처음으로 집 냄새가 들어왔다."], ["N", "그리고 그다음에야, 눈이 그 냄새의 주인을 봤다."], ["N", "검은 머리. 그의 턱께에 닿는 시선. 구겨진 코트. 루카스의 코트가 구겨져 있었다. 구김 자국 하나도 그냥 두지 않는 사람이. 손에는 작은 여행 가방 하나. 그리고 코트 주머니에서, 습도계 모서리가 삐죽 나와 있었다. 싸구려 하얀 플라스틱. 전자식도 바늘식도 아니었다."], ["N", "그는 1초쯤 가만히 봤다. 그리고 아주 부드럽게, 거의 다정하게 말했다."], ["P", "……너무 보고 싶으니까 헛게 보이네."], ["N", "그러고는 문을 천천히 닫기 시작했다. 헛게 보이면 닫는 게 맞으니까. 믿었다가 아니면, 그땐 정말 무너질 것 같았으니까."], ["N", "문틈에 손이 끼었다. 오른손. 손목에 흉터가 있는 손."], ["L", "……헛거 아니야."], ["N", "문이 멈췄다."], ["N", "그 순간 그는 현관 옆 거울을 봤다. 문틈으로 들어온 가로등 불빛이 거울에 비친 자기 얼굴을 비췄다."], ["N", "다크서클이 턱까지 내려와 있었다. 머리는 새 둥지 같았다. 사흘째 입은 어글리 스웨터의 팔꿈치에는 물감 자국 옆에 병원 커피 얼룩이 새로 생겨 있었다. 수염은 깎지 않은 지 나흘이었다."], ["P", "……루카 보지 마요!!!"], ["N", "그는 두 손으로 얼굴을 가렸다. 엉킨 머리가 커튼처럼 앞으로 쏟아졌다. 그 사이로, 손가락 틈으로, 빼꼼."], ["N", "루카스는 문을 다 열고 들어와, 등 뒤로 문을 닫았다. 천천히. 화났을 때처럼이 아니라, 찬 공기가 더 들어오지 않게."], ["N", "그는 손가락 사이로 웅얼거리기 시작했다. 한번 터지자 멈춰지지 않았다."], ["P", "……전화 못 받은 거, 바빠서 아니에요. 거짓말이에요."], ["L", "……"], ["P", "……혼자 땅 판 거예요. 루카는 확실한 사람인데 저는 하나도 확실한 게 없어서. 엄마 열이 몇 도인지도 세 번 물어봐야 알고. 그래서, 루카 옆에 서 있으면 안 될 것 같아서."], ["L", "……"], ["P", "……그리고, 아주 잠깐, 헤어져야 하나 생각했어요. 진짜 잠깐이요. 1분도 안 돼요. 세수 세 번 했어요."], ["L", "……"], ["P", "……그 생각 지금 반성하고 있어요. 방금, 루카 냄새 맡자마자 쓰레기통에 넣었어요. 뚜껑도 닫았어요."], ["P", "……나 루카 없으면 안 돼요."], ["N", "루카스는 그 긴 말을 처음부터 끝까지 들었다. 중간에 끊지 않았다. 반쪽에서 판정하지 않았다. 열아홉 살 때 반쪽짜리 편지를 이별 편지라고 단정했던 사람이, 이번에는 마지막 문장이 나올 때까지 숨도 크게 쉬지 않았다."], ["L", "……알아."], ["P", "……뭐를요."], ["L", "……전부."], ["N", "그는 손가락 사이로 루카스를 봤다. 루카스는 설명하지 않았다. 'ㅎ'가 하나였다는 것도, 수첩에 '판정 보류'라고 적어 둔 것도, 다나의 전화도. 그냥 '전부'였다."], ["L", "……그리고 하나 틀렸어."], ["P", "……네?"], ["L", "……엄마는 내 엄마이기도 해."], ["L", "……나도 챙길 권리 있어. 너 혼자 하는 거 아니야."], ["N", "그 말에 그의 어깨가 무너졌다. 손이 얼굴에서 내려오려다 다시 올라갔다. 이 얼굴로 루카를 볼 수는 없었다."], ["L", "……얼굴 보여 줘."], ["P", "……안 돼요. 진짜 안 돼요. 저 지금 원본 훼손이에요."], ["N", "루카스는 잠깐 그를 봤다. 그리고 눈을 감았다."], ["L", "……나 눈 감았어."], ["P", "……?"], ["L", "……손 내려도 돼."], ["N", "그는 손가락 틈으로 확인했다. 정말 감겨 있었다. 속눈썹이 떨리지도 않았다. 루카스는 감은 눈으로 그를 향해 서 있었다. 그는 아주 조심스럽게 손을 내렸다."], ["N", "루카스가 손을 들었다. 눈을 감은 채로. 복원가의 손이었다. 0.1밀리를 읽는 손이 그의 얼굴을 읽었다. 광대뼈, 나흘 자란 수염, 푹 꺼진 눈 밑, 마른 입술. 엉킨 머리카락 한 움큼."], ["L", "……3주 치네."], ["P", "……"], ["L", "……머리는 내일 풀게. 오늘은 자."], ["N", "그는 이번엔 얼굴을 가리지 못했다. 눈물이 먼저 나왔다. 그는 루카스의 코트에 이마를 박았다. 구겨진 코트가 더 구겨졌다. 루카스는 말리지 않았다."], ["P", "……반품 안 돼요."], ["L", "……뭐."], ["P", "……루카가 제 발로 왔으니까 반품 안 돼요. 개봉했어요. 이미 울었어요."], ["L", "……반품 안 해."], ["P", "……영수증도 없잖아요."], ["L", "……있어. 항공권. 편도야."], ["N", "루카스의 귀 끝이 붉어졌다. 이번엔 3초가 아니었다. 그는 그걸 못 봤다. 루카스의 어깨에 얼굴을 묻고 있었으니까. 대신 루카스의 어깨가 점점 축축해지는 건 둘 다 느꼈다. 습도계 없이도 알 수 있었다. 어깨 부근 상대습도, 100퍼센트."], ["N", "루카스는 코트를 벗지 않았다. 벗으면 그가 떨어질 테니까."], ["P", "……진짜 루카예요? 헛거 아니죠?"], ["N", "루카스는 한 손으로 그의 등을 안은 채, 다른 손으로 주머니에서 습도계를 꺼냈다. 5천 원짜리 플라스틱 습도계였다. 그의 작업실 창틀에서 34와 67과 70 사이를 제멋대로 오가던 것. 루카스는 출국하던 날 아침 그 작업실에 들러 창틀에서 그걸 떼어 왔다. 공항에서부터, 비행기 안 열한 시간 내내 쥐고 온 것이었다."], ["L", "……현관 습도 54야."], ["P", "……?"], ["L", "……헛거면 습도가 안 나와."], ["N", "그는 울다가 웃었다. 코맹맹이 소리로, 크게. 사흘 만에 처음 웃는 거였다. 루카스는 그 소리를 들으며 아주 작게 숨을 내쉬었다. 비행기 안에서 열한 시간 동안 참았던 숨이었다."], ["P", "……그거, 제 작업실 거잖아요."], ["L", "……응."], ["P", "……틀린 숫자 말하는 애요. 54도 틀렸을 거예요."], ["L", "……알아. 그래도 숫자는 나와."], ["L", "……헛거는 틀린 숫자도 안 나와."], ["H", "5장. 소파"], ["P", "……침대 가야 하는데."], ["L", "……응."], ["P", "……못 걷겠어요."], ["L", "……알아."], ["N", "열흘 넘게 보조 침대와 대기실 의자에서 잔 다리였다. 울다 지쳐서 완전히 풀려 버렸다. 루카스는 그를 업지 않았다. 업는 건 안 됐다. 대신 어깨를 빌려줬다. 스물여섯 번째 계단에서처럼."], ["L", "……여기서 쉬어."], ["N", "소파까지 열 걸음. 거기서 멈췄다. 침대는 2층이었고, 오늘 밤 그 계단은 쉰두 개보다 길어 보였다."], ["N", "루스의 소파는 둘이 눕기엔 모자랐다. 그는 거기 길게 누워 루카스를 위로 끌어당겼다. 긴 다리는 팔걸이 밖으로 나갔고, 엉킨 붉은 머리는 바닥까지 쏟아졌다. 루카스는 코트를 입은 채로 그 위에 얹혔다."], ["N", "똑바로 누워 반듯하게 자는 사람이었다. 그날 밤 루카스는 반듯하기를 포기했다. 그의 가슴팍에 옆으로 구겨진 채, 그의 심장 소리를 귀 바로 아래에 두고."], ["P", "……루카 코트 다 젖었어요."], ["L", "……빨면 돼."], ["P", "……구겨졌어요."], ["L", "……다리면 돼."], ["P", "……저는요?"], ["L", "……너는 안 빨려. 안 다려져. 그러니까 내가 왔지."], ["N", "그는 루카스의 코트 주머니를 봤다. 하얀 플라스틱 모서리가 아직 거기 있었다. 그는 한참 그걸 보다가, 루카스의 머리 위에 대고 작게 말했다."], ["P", "……저는 5천 원짜리예요. 틀린 숫자 말하는."], ["L", "……맞아."], ["P", "……루카는 정확한 걸 좋아하잖아요."], ["L", "……그래서 보정하는 거야."], ["P", "……"], ["L", "……네가 '괜찮아요'라고 하면 +18이야. 3년 동안 쟀어."], ["P", "……"], ["L", "……'괜찮아요'는 안 괜찮다는 뜻이고, '조금 피곤해요'는 많이 피곤하다는 뜻이야. 'ㅎ' 하나는 많이 안 괜찮다는 뜻이고."], ["L", "……나는 네 오차를 알아. 그러면 너는 정확한 거야."], ["N", "그는 숨을 멈췄다. 정확하다는 건 틀리지 않는 게 아니었다. 오차를 아는 거였다. 그가 정직하지 않은 게 아니라, 오차가 일정한 사람이라는 걸, 루카스는 3년 동안 수첩 맨 뒷장에서 이미 계산해 두었다."], ["N", "루카스가 사랑한 건 틀리지 않는 사람이 아니었다. 자기가 보정할 수 있는 사람이었다. 5천 원짜리 습도계를 그의 작업실 창틀에 그대로 두고, 수요일 열한 시마다 몰래 와서 포스트잇을 붙여 두던 것처럼. 버리지 않고. 고치지도 않고. 다만 읽는 법을 배워서."], ["P", "……그럼 루카는 저 버리면 안 돼요. 3년 치 보정값 아깝잖아요."], ["L", "……그러니까. 반품 안 한다고 했잖아."], ["N", "그는 대답 대신 루카스를 한 번 더 꽉 끌어안았다. 그리고 그대로, 3주 만에 처음으로, 한 번도 깨지 않고 잠들었다."], ["N", "새벽 세 시. 루카스는 늘 그렇듯 깨어 있었다."], ["N", "그의 팔이 허리에 감겨 있었다. 이번엔 돌아누울 필요가 없었다. 처음부터 안겨 있었으니까."], ["N", "루카스는 그 팔 위에 손을 얹고 맥박을 셌다. 이 집에서도, 제일 정직한 소리였다. 수첩에 적지는 않았다. 수첩은 코트 안주머니에 있었고, 코트는 그의 눈물로 아직 축축했다."], ["N", "대신 머릿속으로 적었다. 반듯하게."], ["N", "'도착. 대상 상태: 초췌, 머리 엉킴, 스웨터 오염. 본인 진술: 반성함. 판정: 보존 상태 양호. (원본.)'"], ["H", "6장. 끝에서부터, 조금씩, 위로"], ["N", "알람이 세 번 울렸다. 면회 시간 때문에 맞춰 둔 것이었다. 그는 세 번째에 눈을 떴다. 늘 그랬다."], ["N", "그리고 1초 굳었다. 가슴 위에 검은 머리가 있었다."], ["N", "그는 아주 조심스럽게 손가락을 뻗어서, 루카스의 귀를 톡 눌러 봤다."], ["L", "……습도 54라고 했잖아."], ["P", "ㅎㅎ 확인했어요ㅎㅎ"], ["N", "'ㅎ'가 두 개였다. 루카스는 눈을 감은 채로 그걸 셌다."], ["N", "아침은 루카스가 했다. 루스의 부엌에서, 처음 보는 프라이팬으로. 계란이 탔다."], ["L", "……탔어."], ["P", "탄 데가 맛있어요."], ["N", "그리고 욕실. 루스의 욕실 거울은 하이델베르크 집 거울보다 높았다. 루카스가 의자를 가져왔다. 그를 앉혔다."], ["N", "3주 치 엉킨 머리였다. 루카스는 나무 빗을 꺼냈다. 살이 넓은 그 빗을 여행 가방에 넣어 왔다. 갈아입을 셔츠는 두 벌밖에 안 넣었으면서."], ["N", "끝에서부터. 조금씩. 위로. 아우구스트가 마거릿의 머리를 빗기던 순서였다. 엉킨 자리 하나하나를 손가락으로 먼저 풀고, 빗은 그다음이었다. 핀셋으로 붙은 종이 두 장을 떼는 것처럼."], ["P", "……오래 걸리죠."], ["L", "……응."], ["P", "……미안해요."], ["L", "……미안할 거 없어. 엉킨 자리가 보이잖아."], ["N", "실은 머리카락보다 정직하오. 엉키면 엉킨 자리가 보이오. 그는 그 편지를 기억했다. 루카스가 그 문장을 떠올리고 있다는 것도 알았다."], ["N", "빗질에 사십 분이 걸렸다. 땋는 데 7분 3초. 일부러 천천히 하는 날의 기록이었다. 마지막 매듭을 묶고 나서 루카스는 땋은 끝을 그의 손에 쥐여 주었다."], ["P", "……루카."], ["L", "……"], ["P", "……병원, 같이 가 줄 수 있어요?"], ["N", "그는 묻기 전에 한참 망설였다. 그리고 물었다. 혼자 정하지 않고. 다음엔 물어. 그 약속을, 3주 늦게 지켰다."], ["L", "……그러려고 왔어."], ["H", "7장. 해바라기 한 송이"], ["N", "매사추세츠 종합병원 1층 로비, 꽃집. 루카스는 해바라기를 찾았다. 11월이었다. 한 송이밖에 없었다."], ["N", "다섯 송이가 아니라 한 송이였다. 처음 루스를 맞이하던 날엔 다섯 송이였다. 루카스는 엘리베이터 안에서 그 한 송이의 줄기 각도를 계속 맞췄다. 수평으로, 수직으로, 다시 수평으로."], ["P", "한 송이도 예뻐요ㅎㅎ"], ["L", "……모자라."], ["P", "엄마는 그런 거 안 세요."], ["L", "……세실 거야. 너네 집 사람들은 다 세."], ["N", "7층 병실. 루스는 침대를 반쯤 세우고 창밖을 보고 있었다. 머리는 단정히 빗겨 있었다. 간호사가 해 준 거였다."], ["N", "루스가 먼저 알아봤다. 그보다 루카스를. 문가에 선 작은 검은 머리를."], ["U", "……루카."], ["L", "……네."], ["U", "비행기 싫어하잖아요."], ["L", "……네."], ["U", "열한 시간이잖아요."], ["L", "……열한 시간 십 분이요."], ["N", "루스가 웃었다. 이번엔 기침을 안 했다."], ["U", "그래도 왔네요."], ["L", "……엄마가 아프시니까요."], ["N", "병실이 조용해졌다. 그는 문가에 서서 숨을 멈췄다. 루카스가 루스를 '엄마'라고 부른 건 두 번째였다. 첫 번째는 성령 교회 종소리 속, 자정의 다리 위였다. 그때는 그가 옆에 있었다. 이번에도 옆에 있었다. 이번에는 루카스가 그를 데려온 거였다. 거꾸로."], ["N", "루스는 해바라기를 받아 들고, 한 송이라는 걸 한 번 봤다. 세는 사람이었다."], ["U", "한 송이네."], ["L", "……하나밖에 없었습니다."], ["U", "아버지도 그랬어요. 한겨울에는 한 송이. 어디서 구했는지 모르겠는데 꼭 한 송이."], ["N", "루스는 그를 봤다. 땋은 머리를. 세 번째 매듭부터 단단한 그 머리를."], ["N", "루카스는 여행 가방을 열었다. 수첩을 꺼내려다 손이 멈췄다. 대신 코트 주머니에서 그 하얀 플라스틱을 꺼냈다. 그리고 병실 창틀, 루스의 침대에서 제일 잘 보이는 자리에 그걸 반듯하게 세웠다. 모서리를 창틀과 평행하게 const $=id=>document.getElementById(id);
const KEY='new take8-progress';
const steps=STORY.filter(s=>s[0]!=='H').length;
let pos=0,shown=0;   // pos: STORY 인덱스, shown: 보여 준 장면 수(제목 제외)

(()=>{const c=$('heart').getContext('2d'),m=['.##.##.','#######','#######','.#####.','..###..','...#...'];
  c.fillStyle='#fff';m.forEach((r,y)=>[...r].forEach((ch,x)=>ch==='#'&&c.fillRect(x,y,1,1)));})();

function build(s){
  const k=s[0],t=s[1];
  if(k==='H'){const e=document.createElement('div');e.className='chap';e.textContent=t;const c=null;if(c){const a=document.createElement('a');a.className='carol';a.target='_blank';a.rel='noopener';a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(CAROL[c][1]);const ct=CAROL[c][0].replace(/ · (\d장까지|끝까지)$/,'');a.onclick=function(ev){if(window.bgmPlay){ev.preventDefault();window.bgmPlay(CAROLID[c],ct);}};a.textContent='♪ '+CAROL[c][0];e.appendChild(document.createElement('br'));e.appendChild(a);}return e;}
  if(k==='N'){const e=document.createElement('div');e.className='nar';e.textContent=t;return e;}
  const who=k==='L'?'me':({K:'k',M:'m',O:'o',D:'d',R:'r',G:'g',U:'u'}[k]||'p'),e=document.createElement('div');
  e.className='msg'+(who==='me'?' me':'');
  const img=new Image();img.className='av';img.alt='';img.src=AV[who];
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;
  $('panel').replaceChildren();
  const c=document.createElement('div');c.className='cover';c.id='cover';
  c.innerHTML='<b>new take#8</b><span>보스턴, 보내지 않은 것들.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span>';
  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
