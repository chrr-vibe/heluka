<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take#3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#17110c; --ink:#21180f; --pink:#8f7149; --pink-soft:#eadfc9;
  --face:#d8cbb3; --hi:#f4ecdc; --lo:#8c7b62; --paper:#f3ece0;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(214,180,120,.14),transparent 70%) no-repeat var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#ece2cd;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:#c4a676;margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #5e4630}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#6d5d4a;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630;
  box-shadow:inset -1px -1px 0 #5e4630,inset 1px 1px 0 #c9ad84;margin-top:6px}
.nar{align-self:stretch;background:#ebe2d2;border:1px dashed #b3a184;padding:8px 10px;font-size:13px;line-height:1.55;color:#4a3d30;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a8d7c;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630}
.btn:disabled{color:#8f826f;text-shadow:none;cursor:default}
.btn.main:disabled{background:#bfa888}
.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.hint{font-size:12px;color:#a39580;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
</style>
</head>

은 탄 계란. 그리고 빵. 빵은 썰지 못해서 손으로 뜯은 것이었다."], ["L", "...먹어."], ["P", "루카는요?"], ["L", "나도 먹어."], ["N", "두 사람은 마주 앉았다. 루카스는 왼손으로 포크를 쥐었다. 계란이 접시 밖으로 떨어졌다. 다시. 또 떨어졌다. 루카스의 미간이 점점 깊어졌다."], ["N", "그는 자기 접시를 보며 먹는 척했다. 루카스를 보지 않으려고 애썼다. 보면, 손을 뻗을 것 같았다."], ["N", "네 번째로 계란이 떨어졌을 때, 루카스가 포크를 내려놓았다. 소리가 컸다."], ["L", "......배 안 고파."], ["P", "루카."], ["L", "안 고프다고."], ["N", "루카스가 일어섰다. 침실로 들어갔다. 문이 닫혔다. 쾅이 아니었다. 아주 천천히, 조용히. 그것이 더 아팠다."], ["N", "그는 식탁에 혼자 앉아 있었다. 루카스의 접시를 보았다. 반도 먹지 않은 계란. 손으로 뜯은 빵."], ["N", "30분 뒤. 그는 침실 문을 두드렸다. 대답이 없었다. 조용히 문을 열었다."], ["N", "루카스는 침대 끝에 앉아 있었다. 셔츠 단추를 풀려고 하고 있었다. 왼손으로. 맨 위 단추 하나를 푸는 데 몇 분째 실패하고 있었다."], ["N", "그는 문간에 서서 그것을 보았다. 그리고 아주 조용히 말했다."], ["P", "...도와줘도 돼요?"], ["L", "......"], ["P", "단추만요. 다른 건 안 할게요."], ["N", "루카스는 대답하지 않았다. 단추를 쥔 왼손이 멈췄다. 그리고 아주 천천히, 손을 내렸다."], ["N", "그것이 대답이었다. 그는 침대 앞에 무릎을 꿇었다. 단추를 하나씩 풀었다. 위에서부터. 루카스는 그의 정수리를 내려다보고 있었다. 붉은 머리카락이 바닥에 쏟아져 있었다."], ["L", "......한심하지."], ["P", "네?"], ["L", "단추 하나 못 풀어. 5백 년 된 종이는 0.1밀리로 뗐는데."], ["P", "안 한심해요."], ["L", "한심해."], ["P", "안 한심해요. 루카는 책을 지킨 거예요. 그 대신 손을 다친 거고요. 그건 한심한 게 아니에요."], ["N", "마지막 단추가 풀렸다. 그는 고개를 들었다. 루카스가 그를 내려다보고 있었다. 눈가가 아주 조금 붉었다. 그런데 울지는 않았다. 루카스는 그런 사람이었다."], ["L", "......계란, 미안."], ["P", "ㅎㅎ 맛있었어요."], ["L", "탔어."], ["P", "탄 데가 맛있어요."], ["N", "루카스는 대답하지 않았다. 대신 그의 머리에 왼손을 얹었다. 서툴게. 쓰다듬는 것인지 누르는 것인지 알 수 없는 손이었다. 그는 그 손 아래에서 가만히 있었다."], ["H", "3장. 코덱스"], ["N", "일주일 뒤. 루카스는 복원실에 출근했다. 깁스를 한 채로."], ["O", "...왜 왔니. 병가 6주 냈잖아."], ["L", "손은 못 써도 눈은 씁니다. 상태 기록, 보고서, 요나스 감독. 할 수 있는 거 합니다."], ["N", "엘제 선생님은 루카스를 한참 보았다. 그리고 한숨을 쉬었다. 거절할 수 없다는 것을 15년 경험으로 알았다."], ["N", "그런데 그날 오후, 엘제 선생님이 루카스를 자기 사무실로 불렀다. 창도 없는 작은 방. 책상 위에 서류 한 묶음이 놓여 있었다."], ["O", "코덱스 건이야."], ["N", "루카스는 그 서류를 알았다. 대학 도서관에서 가장 오래된 필사본. 14세기 연가집. 올해 봄부터 2년간 대대적인 복원이 예정되어 있었다. 복원실 전체가 1년을 준비한 프로젝트. 그리고 책임 복원가는, 루카스였다."], ["O", "3월에 시작해야 돼. 연구 재단 일정 때문에 미룰 수 없어."], ["L", "......"], ["O", "네 손이 3월에 돌아올지, 아무도 몰라. 의사도 모르고. 너도 모르고."], ["L", "...압니다."], ["O", "그래서 책임자를 바꿔야 할 것 같다."], ["L", "......누구로요."], ["O", "요나스."], ["N", "루카스는 대답하지 않았다. 엘제 선생님은 그 침묵을 기다렸다. 15년 동안 그랬듯이."], ["L", "......당연합니다."], ["O", "루카스."], ["L", "요나스는 잘할 겁니다. 제가 가르쳤으니까. 손도 좋습니다. 제 첫해보다 낫습니다."], ["O", "그런 얘길 하려는 게 아니야."], ["L", "그럼 무슨 얘깁니까. 결정하셨잖습니까. 맞는 결정입니다."], ["N", "목소리가 정확했다. 너무 정확했다. 엘제 선생님은 그 정확함이 무엇을 뜻하는지 알았다."], ["O", "...요나스한테는 내가 말할게."], ["L", "제가 하겠습니다. 감독은 제가 하니까요."], ["N", "루카스는 일어나서 사무실을 나갔다. 문을 천천히 닫았다. 습도가 흔들리지 않도록."], ["N", "그날 저녁, 그는 루카스의 집 부엌에서 수프를 끓이고 있었다. 그가 할 줄 아는 몇 안 되는 요리였다. 하이델베르크에 와서 배운 것."], ["N", "현관문이 열렸다. 루카스가 들어왔다. 코트를 벗지 못해서 반쯤 걸친 채로."], ["P", "루카, 왔어요? 수프 거의—"], ["N", "루카스는 대답하지 않고 부엌으로 왔다. 찬장을 열었다. 왼손으로 컵을 꺼냈다. 물을 따르려 했다."], ["N", "컵이 미끄러졌다. 바닥에 떨어졌다. 깨졌다."], ["N", "루카스는 그 자리에 서서 깨진 컵을 내려다보았다. 움직이지 않았다. 그가 국자를 내려놓고 다가왔다."], ["P", "괜찮아요? 다친 데—"], ["L", "코덱스. 요나스한테 갔어."], ["N", "그가 멈췄다."], ["L", "15년 동안 그 책 하나 보려고 일했어. 열아홉 살 때 엘제 선생님이 처음 보여 줬어. 언젠가 네가 고칠 거라고."], ["P", "......루카."], ["L", "당연한 결정이야. 나라도 그렇게 했어."], ["N", "루카스는 쪼그려 앉아 깨진 컵 조각을 왼손으로 주우려 했다. 그가 그 손목을 잡았다."], ["P", "하지 마요. 베여요."], ["L", "놔."], ["P", "안 놔요. 왼손까지 다치면 어떡해요."], ["N", "루카스가 그를 올려다보았다. 처음으로, 다친 뒤 처음으로, 화난 얼굴이었다."], ["L", "그럼 뭐 해. 이 손으로 뭘 해. 컵도 못 잡는데."], ["N", "그는 대답하지 못했다. 대신 루카스를 일으켜 세웠다. 그리고 끌어안았다. 깁스한 팔이 둘 사이에 끼었다. 루카스는 밀어내지 않았다. 그렇다고 안기지도 않았다. 그냥, 서 있었다."], ["N", "수프가 끓어 넘치는 소리가 났다. 두 사람 다 움직이지 않았다."], ["H", "4장. 도쿄"], ["N", "2주가 지났다. 그는 루카스의 집에서 지내고 있었다. 작업실에는 가지 않았다. 이젤은 다리 위에도, 작업실에도 서 있지 않았다."], ["N", "아침마다 그가 루카스의 셔츠 단추를 채웠다. 저녁마다 풀었다. 루카스는 그것을 허락했다. 다른 것은 거의 허락하지 않았다. 밥은 왼손으로 먹었다. 계단은 혼자 내려갔다. 머리는 감겨 달라고 하지 않고 비닐을 씌운 채 혼자 감았다. 30분이 걸렸다."], ["N", "그리고 루카스는 매일 복원실에 출근했다. 요나스 옆에 앉아서, 코덱스 준비 작업을 감독했다. 정확한 목소리로. 손은 무릎 위에 올려놓은 채."], ["N", "목요일 밤. 루카스가 먼저 잠든 뒤, 그는 거실에서 다나와 통화를 했다. 목소리를 최대한 낮춰서."], ["D", "...그래서, 도쿄는?"], ["P", "안 가요."], ["D", "3월 1일 개막이야. 모리 미술관. 3년 전부터 잡혀 있던 거야. 너 개막식 안 오면 일본 쪽에서 난리 나."], ["P", "다나가 대신 가 주면 안 돼요?"], ["D", "작가 없는 개막식이 어딨어! 2주만 있으면 돼."], ["P", "그 2주가 안 돼요. 루카 혼자 못 둬요."], ["D", "그 사람이 너보고 있어 달래?"], ["P", "......아뇨."], ["D", "그럼?"], ["P", "말 안 해도 알아요. 단추 하나 못 채워요."], ["N", "침실 문이 아주 조금 열려 있었다. 그는 그것을 보지 못했다."], ["N", "다음 날 아침. 그는 평소처럼 루카스의 셔츠 단추를 채우려고 침실로 들어갔다. 루카스는 이미 셔츠를 입고 있었다. 단추가 채워져 있었다. 하나씩 엇갈린 채로."], ["P", "...루카? 혼자 했어요?"], ["L", "응."], ["P", "단추 하나씩 밀렸어요. 제가 다시—"], ["L", "됐어."], ["N", "루카스가 돌아섰다. 그를 보았다. 그 얼굴을 그는 알았다. 12월의 그 아침, 호텔 앞에서 보았던 얼굴. 무언가를 이미 끝내 버린 얼굴."], ["L", "도쿄 가."], ["P", "......들었어요?"], ["L", "목소리 낮추는 법 좀 배워. 다나 씨처럼 크진 않은데, 이 집 벽 얇아."], ["P", "루카, 그건—"], ["L", "3년 전부터 잡혀 있던 거라며. 모리 미술관. 그걸 왜 나 때문에 안 가."], ["P", "루카 때문이 아니라, 제가 안 가고 싶은 거예요."], ["L", "거짓말."], ["N", "루카스의 목소리가 날카로웠다. 그가 처음 듣는 날카로움이었다. 서점에서 사람들에게 '조용히 해 주세요'라고 할 때보다도."], ["L", "단추 하나 못 채운다고. 혼자 못 둔다고. 다 들었어."], ["P", "......"], ["L", "나 그런 거 제일 싫어. 누가 나 때문에 자기 걸 포기하는 거. 그거 동정이야."], ["N", "그의 얼굴에서 핏기가 빠졌다."], ["P", "......동정이요?"], ["L", "아니면 뭔데."], ["P", "루카는 제가 동정으로 사람 옆에 있는 사람 같아요?"], ["N", "두 사람 사이가 조용해졌다. 루카스는 대답하지 않았다. 대답할 수 없었다. 그 질문이 옳다는 것을 알았으니까. 그런데 알면서도, 멈출 수 없었다."], ["L", "...가. 도쿄."], ["P", "루카."], ["L", "2주잖아. 2주 동안 나 혼자 살 수 있어. 단추는 엇갈려도 셔츠는 입어져. 계란은 타도 먹을 수 있어. 그러니까 가."], ["P", "......"], ["L", "네가 안 가면, 나는 3월 1일마다 생각할 거야. 내가 저 사람 거 하나 망쳤구나. 매년."], ["N", "그는 그 말을 오래 들었다. 그리고 천천히 고개를 숙였다."], ["P", "...알았어요. 갈게요."], ["N", "루카스는 그 대답을 들었다. 원하던 대답이었다. 그런데 이상하게, 가슴 어딘가가 내려앉았다."], ["P", "대신 하나만요."], ["L", "......뭐."], ["P", "매일 밤 전화할게요. 받기 싫으면 안 받아도 돼요. 근데 저는 걸 거예요. 매일."], ["N", "루카스는 대답하지 않았다. 대신 엇갈린 단추를 내려다보았다. 그가 손을 뻗었다. 루카스는 피하지 않았다. 그는 단추를 하나씩 풀고, 다시 채웠다. 제자리에. 위에서부터 아래까지."], ["N", "마지막 단추를 채우고 나서, 그는 루카스의 셔츠 깃을 정리해 주었다. 그리고 아무 말 없이 침실을 나갔다."], ["N", "2월 20일. 그가 프랑크푸르트 공항으로 떠났다. 루카스는 배웅하지 않았다. 현관에서 '잘 가'라고만 했다. 그는 '2주예요. 딱 2주'라고 했다. 문이 닫혔다."], ["N", "루카스는 현관에 한참 서 있었다. 집이 갑자기 너무 조용했다. 그가 오기 전에도 이 집은 늘 이만큼 조용했다. 그런데 루카스는 그 사실을 기억해 낼 수가 없었다."], ["H", "5장. 혼자"], ["N", "첫째 날 밤. 휴대폰이 울렸다. 밤 열한 시. 도쿄는 아침 일곱 시였다."], ["N", "루카스는 화면을 보았다. 받지 않았다. 신호가 끊겼다."], ["N", "메시지가 왔다."], ["P", "도착했어요. 호텔 창문에서 탑이 보여요. 루카는 밥 먹었어요?"], ["N", "루카스는 답장하지 않았다. 부엌에 서 있었다. 저녁은 먹지 않았다. 냉장고 안에 그가 떠나기 전에 만들어 둔 수프가 여섯 통 들어 있었다. 통마다 날짜가 적혀 있었다. 그의 글씨로. '월요일', '화요일', '수요일'."], ["N", "루카스는 '월요일' 통을 꺼냈다. 왼손으로 뚜껑을 열려고 했다. 열리지 않았다. 너무 꽉 닫혀 있었다. 무릎 사이에 끼우고 돌렸다. 열렸다. 10분이 걸렸다."], ["N", "수프는 데우지 않고 먹었다. 차가웠다. 그래도 다 먹었다."], ["N", "둘째 날 밤. 휴대폰이 울렸다. 받지 않았다."], ["P", "오늘 설치 끝났어요. 큐레이터분이 루카 같아요. 액자 수평 1밀리 틀어진 거 잡아내셨어요. ㅎㅎ"], ["N", "셋째 날. 받지 않았다."], ["P", "오늘 비 와요. 하이델베르크도 와요? 계단 조심해요. 52개."], ["N", "넷째 날 저녁. 요나스가 루카스의 집에 왔다. 손에 장바구니를 들고."], ["M", "...그분이 부탁하셨어요. 사흘에 한 번 들러 달라고. 냉장고 확인해 달라고."], ["L", "......그 사람이 너한테 연락했어?"], ["M", "매일요. 선배님 전화 안 받으신다고. 그래서 저한테 물어보세요. 오늘 출근하셨냐, 점심 드셨냐, 깁스 괜찮냐."], ["L", "......"], ["M", "선배님. 제가 이런 말 하면 곰팡이 제거 평생 해야 되는 거 아는데요."], ["L", "해."], ["M", "...그분, 도쿄에서 개막 준비하면서 하루에 세 시간 자신대요. 다나 씨가 그랬어요. 빨리 끝내고 돌아오려고."], ["N", "루카스는 대답하지 않았다. 요나스는 냉장고에 장 본 것들을 넣었다. 수프 통이 네 개 남아 있었다. '금요일', '토요일', '일요일', '월요일'. 요나스는 그것을 보고 아무 말도 하지 않았다."], ["N", "그날 밤 열한 시. 휴대폰이 울렸다."], ["N", "루카스는 화면을 오래 보았다. 신호가 세 번 울렸다. 네 번. 다섯 번."], ["N", "여섯 번째에, 루카스가 받았다."], ["H", "6장. 여덟 시간"], ["P", "......루카?"], ["N", "그의 목소리가 놀라 있었다. 받을 거라고 생각하지 않았던 목소리였다. 뒤로 무언가 웅성거리는 소리가 들렸다. 도쿄는 아침 일곱 시였다."], ["L", "......응."], ["P", "받았네요. ㅎㅎ"], ["L", "요나스가 왔었어."], ["P", "아... 미안해요. 제가 부탁했어요."], ["L", "알아."], ["N", "침묵이 흘렀다. 그는 그 침묵을 깨지 않았다. 기다렸다. 서점 바닥에서처럼. 복원실 의자에서처럼."], ["L", "......하루에 세 시간 잔다며."], ["P", "누가 그래요?"], ["L", "다나 씨."], ["P", "...ㅎㅎ 다들 말이 많네요."], ["L", "자. 좀."], ["P", "루카는요? 잠은 자요?"], ["N", "루카스는 대답하지 않았다. 침대에 누워 천장을 보고 있었다. 오른팔의 깁스가 무거웠다. 그리고 침대가 넓었다. 2주 전까지는 넓은 줄 몰랐다."], ["L", "...아니."], ["P", "왜요? 손 아파요?"], ["L", "아니."], ["P", "그럼요?"], ["N", "루카스는 오래 대답하지 않았다. 그는 끊지 않았다. 신호 너머에서 그의 숨소리가 들렸다. 그것만 들렸다."], ["N", "그리고 루카스는, 얼굴을 볼 수 없어서였는지, 바다 건너 여덟 시간의 거리 때문이었는지, 처음으로 짧지 않은 말을 했다."], ["L", "......무서워."], ["N", "그의 숨소리가 멈췄다."], ["L", "손이 안 돌아올까 봐. 코덱스는 요나스가 하고, 나는 옆에서 말로만 하고. 그게 1년이 되고, 2년이 되고. 그러다 나는 복원가가 아니라, 복원가였던 사람이 될까 봐."], ["P", "......"], ["L", "그래서 너 보내고 싶었어. 네가 옆에 있으면, 내가 단추 못 채우는 거 매일 보잖아. 그게 싫었어. 네 앞에서 그런 사람이 되는 게."], ["N", "목소리가 흔들렸다. 루카스는 그것을 숨기지 않았다. 숨길 힘이 없었다. 깁스를 한 지 6주째 되는 밤이었다."], ["L", "동정이라고 한 거, 미안. 그거 아닌 거 알았어. 처음부터."], ["P", "......루카."], ["L", "응."], ["P", "그거 알아요? 저 1년 동안 붓 못 잡았을 때, 루카가 그랬어요. 추운 게 아니라 조용해진 거라고. 그 둘은 다르다고."], ["L", "......"], ["P", "루카도 지금 그래요. 복원가가 아니게 된 게 아니라, 조용해진 거예요. 손이 잠깐."], ["L", "...그건 그림 얘기였어."], ["P", "똑같아요. 섬유는 섬유라면서요."], ["N", "루카스가 웃었다. 소리가 났다. 아주 작게. 우는 것 같은 웃음이었다."], ["P", "...방금 웃었어요?"], ["L", "바람 소리야."], ["P", "ㅎㅎ 하이델베르크에 지금 바람 불어요?"], ["L", "불어."], ["P", "거짓말."], ["L", "......응."], ["N", "두 사람은 그날 밤, 한 시간을 더 통화했다. 대부분은 아무 말도 하지 않았다. 그냥 신호 너머의 숨소리만 들었다. 루카스는 그 소리를 들으며 처음으로, 2주 만에 처음으로, 잠이 들었다."], ["N", "그는 루카스가 잠든 것을 숨소리로 알았다. 그래도 끊지 않았다. 도쿄의 아침 여덟 시. 개막 준비 회의에 30분 늦었다. 다나는 아무 말도 하지 않았다."], ["H", "7장. 단추"], ["N", "3월 4일. 그가 돌아왔다. 2주에서 이틀 모자란 날이었다. 개막식만 마치고 다음 날 첫 비행기를 탔다고 했다."], ["N", "현관문이 열렸을 때, 루카스는 거실 소파에 앉아 있었다. 셔츠를 입고 있었다. 단추가 채워져 있었다. 이번에는, 하나도 밀리지 않고."], ["P", "......루카."], ["L", "왔어."], ["P", "단추."], ["L", "연습했어. 열흘 동안. 하루에 백 번."], ["N", "그는 캐리어를 현관에 내버려 두고 소파로 왔다. 루카스 앞에 무릎을 꿇었다. 단추를 하나씩 보았다. 위에서부터 아래까지. 정확했다."], ["P", "...왼손으로요?"], ["L", "응. 오른손은 아직 깁스."], ["N", "그가 루카스를 올려다보았다. 눈가가 붉었다. 머리카락처럼."], ["P", "저 오는데 이거 보여 주려고 기다렸어요?"], ["L", "......아침부터 입고 있었어."], ["P", "ㅎㅎ 지금 저녁 일곱 시예요."], ["L", "알아."], ["N", "그는 아무 말도 하지 못하고 루카스를 끌어안았다. 이번에는 루카스도, 왼팔로 그를 마주 안았다. 서툴게. 그런데 단단하게."], ["N", "그리고 그가 캐리어에서 꺼낸 것이 있었다. 도쿄의 오래된 옷가게에서 샀다는 셔츠였다. 흰색 리넨. 앞단추가 스물네 개였다. 작은 자개 단추. 소매에도 각각 다섯 개씩."], ["L", "......이게 뭐야."], ["P", "재활 도구예요. 물리치료사가 그랬다면서요. 손가락 작은 근육 쓰는 게 제일 좋다고. 단추 채우기, 구슬 꿰기."], ["L", "그래서 단추 서른네 개짜리를 샀어?"], ["P", "ㅎㅎ 제가 입을 거예요. 루카는 채워 주기만 해요. 매일 아침. 깁스 풀면 오른손으로."], ["N", "루카스는 그 셔츠를 내려다보았다. 자개 단추가 불빛에 반짝였다. 아주 작았다. 핀셋으로 집는 금박 조각만큼."], ["L", "......바보."], ["P", "네. ㅎㅎ"], ["L", "웃지 마."], ["P", "루카가 와 줘서요. 아, 아니다. 제가 온 거구나."], ["N", "3월 15일. 깁스를 풀었다. 8주 만에 루카스의 오른손이 나왔다. 하얬다. 가늘어져 있었다. 손목에 수술 자국이 작게 남아 있었다."], ["N", "다음 날 아침. 그는 흰 리넨 셔츠를 입고 루카스 앞에 섰다. 단추 서른네 개가 모두 풀려 있었다."], ["P", "오늘부터예요."], ["N", "루카스는 오른손을 들었다. 맨 위 단추를 집으려 했다. 엄지와 검지로. 손가락이 떨렸다. 단추가 미끄러졌다. 다시. 또 미끄러졌다."], ["N", "첫 번째 단추를 채우는 데 4분이 걸렸다. 그는 그동안 한 번도 움직이지 않았다. 한 번도 '괜찮아요'라고 하지 않았다. 그냥 서서, 기다렸다."], ["N", "서른네 개를 다 채우는 데 한 시간 십 분이 걸렸다. 루카스는 출근에 늦었다. 엘제 선생님은 아무 말도 하지 않았다."], ["N", "둘째 날은 오십 분. 일주일째는 삼십 분. 이주째는 십오 분."], ["N", "매일 아침, 그는 같은 셔츠를 입었다. 리넨이 조금씩 부드러워졌다. 단추 구멍이 조금씩 헐거워졌다. 루카스의 손가락이 조금씩 덜 떨렸다."], ["N", "그리고 매일 아침, 마지막 단추를 채우고 나면 루카스는 그의 셔츠 깃을 정리해 주었다. 그가 그날 엇갈린 단추를 다시 채워 주었던 것처럼."], ["H", "8장. 금박"], ["N", "4월 초. 물리치료사가 말했다. 이제 가벼운 작업은 시작해도 된다고. 무리하지 말고, 떨리면 멈추라고."], ["N", "루카스는 그날 오후 복원실 작업대 앞에 섰다. 석 달 만이었다. 요나스와 엘제 선생님이 반대편 작업대에서 일하는 척하며 숨을 죽이고 있었다."], ["N", "루카스는 연습용 종이를 꺼냈다. 버려도 되는 19세기 장부 한 장. 그리고 금박 한 장. 손톱만 한 크기. 바람만 불어도 날아가는."], ["N", "핀셋을 들었다. 오른손으로."], ["N", "금박 가장자리에 핀셋 끝을 댔다. 손가락이 떨렸다. 아주 조금. 루카스는 숨을 멈췄다. 떨림이 멈추기를 기다렸다. 멈추지 않았다."], ["N", "금박을 들어 올렸다. 1센티미터. 2센티미터. 장부 위로 옮겼다. 그리고 내려놓으려는 순간, 손목 안쪽이 찌릿했다. 수술 자국 바로 아래."], ["N", "핀셋이 미끄러졌다. 금박이 접혔다. 반으로. 그리고 구겨졌다."], ["N", "복원실이 조용해졌다."], ["N", "루카스는 구겨진 금박을 내려다보았다. 다시 핀셋을 들었다. 새 금박. 다시. 또 접혔다. 세 번째. 네 번째. 다섯 번째에는 금박을 들어 올리지도 못했다."], ["O", "...루카스. 오늘은 거기까지."], ["L", "한 번만 더."], ["O", "루카스."], ["L", "한 번만."], ["N", "여섯 번째. 핀셋 끝이 장부 종이에 닿았다. 그리고 종이를 긁었다. 19세기 종이 위에, 가느다란 흠집이 생겼다."], ["N", "버려도 되는 종이였다. 연습용이었다. 그런데 루카스는 그 흠집을 보고, 핀셋을 내려놓았다. 아주 천천히. 작업대와 평행하게."], ["N", "그리고 아무 말 없이 코트를 들고 복원실을 나갔다. 문을 천천히 닫았다."], ["M", "...선생님. 따라가야 하는 거 아니에요?"], ["O", "아니. 우리가 아니야."], ["N", "엘제 선생님은 휴대폰을 꺼냈다. 짧은 메시지를 보냈다. 그리고 구겨진 금박 다섯 장을 하나씩 모아, 작은 봉투에 넣었다. 버리지 않았다."], ["N", "저녁 일곱 시. 루카스의 집. 그가 계단 52개를 뛰어 올라왔다. 현관문은 잠겨 있지 않았다."], ["N", "거실은 어두웠다. 불이 하나도 켜져 있지 않았다. 루카스는 북쪽 벽 앞에 서 있었다. 장갑만 그려진 다리 그림 앞에. 습도계 옆에."], ["P", "...루카."], ["L", "엘제 선생님이 연락했지."], ["P", "네."], ["L", "...금박 하나 못 옮겨."], ["N", "목소리가 갈라져 있었다. 그는 그 목소리를 처음 들었다. 6주째 밤의 통화에서도 이렇지는 않았다."], ["L", "열아홉 살 때 첫날 했던 거야. 금박 옮기기. 엘제 선생님이 그때 그랬어. 넌 손이 정확하다고. 타고났다고. 15년 동안 그 말 하나로 버텼어."], ["P", "......"], ["L", "근데 오늘 여섯 번 실패했어. 연습용 종이에 흠집 냈어. 5백 년 된 거였으면, 그건 끝이야. 다시 못 돌려놔."], ["N", "그가 다가왔다. 루카스 뒤에 섰다. 루카스는 돌아보지 않았다. 어깨가 떨리고 있었다."], ["L", "대부분이라며. 의사가. 대부분 돌아온다고."], ["P", "......네."], ["L", "대부분으론 안 된다고 했잖아."], ["N", "그리고 루카스는, 처음으로 울었다."], ["N", "소리는 거의 없었다. 어깨만 떨렸다. 왼손으로 얼굴을 가렸다. 오른손은 몸 옆에 늘어뜨린 채. 수술 자국이 있는 그 손을 숨기듯이."], ["N", "그는 아무 말도 하지 않았다. '괜찮아요'도, '돌아올 거예요'도. 그 말들이 지금 아무 소용 없다는 것을 알았다. 1년 동안 붓을 못 잡았을 때, 그 말을 수백 번 들었으니까."], ["N", "대신 그는 루카스를 뒤에서 끌어안았다. 그리고 루카스의 오른손을, 자기 두 손으로 감쌌다. 숨기지 못하게."], ["P", "......이 손이요."], ["L", "......"], ["P", "제가 처음 그린 손이에요. 뉴욕 복원실에서. 쉬는 손 서른 장. 휘트니에 걸린 거."], ["L", "......"], ["P", "그 손이 오늘 금박 여섯 장을 구겼어요. 근데 저는요, 그 손이 핀셋을 들었다는 게 더 대단해요. 석 달 만에. 무서운데도."], ["N", "루카스의 어깨가 더 크게 떨렸다. 그는 그 손을 놓지 않았다."], ["P", "그리고 루카, 하나 틀렸어요."], ["L", "......뭐가."], ["P", "대부분이면 안 된다고 했잖아요. 근데 루카가 저한테 그랬어요. 대부분은 돌아온다고. 그 말 듣고 저 1년 만에 붓 들었어요. 그 말이 저한테는 전부였어요."], ["N", "어두운 거실. 북쪽 벽의 그림 속, 다리 난간에 놓인 장갑. 습도계 바늘이 아주 조금 떨렸다. 두 사람이 숨 쉬는 만큼."], ["N", "루카스는 한참 뒤에야 울음을 그쳤다. 그리고 그의 팔 안에서, 아주 낮게 말했다."], ["L", "......내일 또 할 거야. 금박."], ["P", "네."], ["L", "또 구기면."], ["P", "그럼 모레 또 해요. ㅎㅎ"], ["L", "...그거 내 말이야. 종이가 괜찮다고 할 때 다시 하면 된다는 거."], ["P", "알아요. 루카한테 배웠어요."], ["H", "9장. 첫 의뢰"], ["N", "일주일 뒤. 일요일 아침. 그가 커다란 서류 봉투 하나를 들고 식탁 앞에 앉았다. 루카스는 그의 리넨 셔츠 단추를 막 다 채운 참이었다. 12분."], ["P", "루카. 의뢰가 하나 있어요."], ["L", "개인 의뢰는 안 받아."], ["P", "ㅎㅎ 알아요. 근데 이건 좀 특별해요."], ["N", "그가 봉투를 열었다. 안에서 종이 한 장이 나왔다. 오래된 도화지였다. 누렇게 바래 있었다. 그리고 물에 젖었다 마른 흔적이 있었다. 가장자리가 울어 있었고, 군데군데 곰팡이 점이 있었다. 반쯤 찢어져 있었다."], ["N", "그림이었다. 크레용과 연필. 서툰 선. 강 위의 돌다리. 다리 끝의 두 개의 탑. 그리고 강가에 앉아 그림을 그리는 작은 사람."], ["L", "......이거."], ["P", "제가 일곱 살 때 그린 거예요. 할아버지 스케치북 보고 처음 따라 그린 거. 할아버지가 냉장고에 30년 동안 붙여 놨었어요."], ["L", "......"], ["P", "허리케인 때 작업실에 있었어요. 스케치북이랑 같이. 근데 그날 저는 스케치북만 들고 나왔어요. 이건 못 챙겼어요. 물 빠지고 나서 진흙 속에서 찾았어요. 다나도 몰라요. 루카한테도 말 안 했어요."], ["L", "왜."], ["P", "...그때 루카는 할아버지 거 고치고 있었잖아요. 그게 더 중요했어요. 이건 그냥 애가 그린 거니까."], ["N", "루카스는 그 종이를 내려다보았다. 오래. 손을 대지 않고. 눈으로만. 곰팡이 점의 위치를 세었다. 열한 개. 찢어진 길이를 쟀다. 7센티미터. 크레용의 왁스가 물에 번진 정도를 보았다."], ["L", "......이건 그냥 애가 그린 게 아니야."], ["P", "네?"], ["L", "네 첫 그림이야. 하르트만 스케치북이 네 할아버지 거면, 이건 네 거야. 네가 화가가 된 첫날."], ["N", "그가 아무 말도 하지 못했다."], ["L", "...시간 오래 걸려. 크레용은 까다로워. 왁스가 물이랑 안 섞여서, 습식 처리가 안 돼. 하나하나 손으로 해야 돼."], ["P", "......네."], ["L", "그리고 지금 내 손은, 금박 하나 겨우 옮겨."], ["P", "알아요."], ["L", "그런데도 맡길 거야?"], ["P", "루카 말고는 안 맡겨요. 다른 사람이 하는 건 싫어요."], ["N", "루카스는 그를 보았다. 그는 웃고 있었다. 기다리는 얼굴로. 서점 바닥에서처럼."], ["L", "......조건이 있어."], ["P", "ㅎㅎ 네."], ["L", "매일 와. 복원실. 작업하는 동안."], ["P", "네?"], ["L", "두 걸음 떨어진 의자에서. 손 씻고. 조용히."], ["N", "그의 얼굴이 천천히, 환하게 풀렸다."], ["P", "...그거 뉴욕에서 제가 했던 거잖아요."], ["L", "그때랑 똑같이. 하나만 달라."], ["P", "뭐가요?"], ["L", "그땐 내가 너 신경 쓰였어. 이번엔... 내 손이 떨릴 때, 네가 거기 있었으면 좋겠어."], ["P", "떨리면 뭐 하면 돼요?"], ["L", "......그냥 보고 있어. 그거면 돼."], ["H", "10장. 두 걸음, 다시"], ["N", "월요일 오후 세 시. 고문헌 복원실 문에 노크 소리가 났다. 아주 조심스러운 노크였다."], ["O", "들어와요. 손은요?"], ["P", "씻었어요. 손목까지, 비누 두 번."], ["N", "그는 작업대에서 정확히 두 걸음 떨어진 의자에 앉았다. 무릎 위에 손을 얹었다. 작은 스케치북도, 연필도 들고 오지 않았다. 오늘은 그리러 온 게 아니었다."], ["N", "요나스가 반대편 작업대에서 엘제 선생님에게 속삭였다."], ["M", "...선생님, 저거 뉴욕 때 그거죠? 민디 씨가 말한."], ["O", "그래."], ["M", "근데 왜 선배님이 앉으라고 했어요? 그땐 선배님이 신경 쓰인다고 싫어했다면서요."], ["O", "그때는 몰랐던 거지. 누가 두 걸음 떨어져서 기다려 주는 게, 손을 붙잡아 주는 것보다 더 큰 거라는 걸."], ["N", "루카스는 작업대 앞에 섰다. 일곱 살짜리가 그린 다리 그림이 확대경 아래 펼쳐져 있었다. 핀셋을 들었다. 오른손으로."], ["N", "첫날은 곰팡이 점 하나를 지웠다. 세 시간이 걸렸다. 손이 떨릴 때마다 멈췄다. 핀셋을 내려놓고, 손목을 주무르고, 숨을 고르고. 그리고 의자 쪽을 보았다."], ["N", "그는 거기 있었다. 아무 말도 하지 않고. 루카스와 눈이 마주치면, 아주 작게 웃었다. 그게 다였다."], ["N", "루카스는 다시 핀셋을 들었다."], ["N", "둘째 날은 곰팡이 점 두 개. 셋째 날은 세 개. 일주일째, 열한 개의 점이 모두 사라졌다."], ["N", "그 다음은 찢어진 7센티미터였다. 일본 종이를 머리카락보다 가늘게 찢어, 아교를 바르고, 찢어진 틈 사이에 하나씩 놓는 일. 한 올이 0.3밀리미터. 루카스가 열아홉 살 때 엘제 선생님에게 처음 배운 기술이었다."], ["N", "첫 번째 올을 놓으려는 순간, 손이 떨렸다. 루카스는 멈췄다. 핀셋 끝이 종이 위 1밀리미터에서 정지해 있었다. 떨림이 핀셋 끝까지 전해져, 아주 작게 흔들렸다."], ["N", "복원실이 조용해졌다. 요나스가 숨을 멈췄다. 엘제 선생님도."], ["N", "루카스는 의자 쪽을 보지 않았다. 대신 낮게 말했다."], ["L", "......말해 봐."], ["P", "네?"], ["L", "아무 말이나. 아무거나."], ["N", "그는 잠깐 당황했다. 그리고 아주 조용히, 천천히 말하기 시작했다."], ["P", "...일곱 살 때요. 할아버지 무릎에 앉아서 이거 그렸어요. 크레용이 부러져서 울었어요. 할아버지가 부러진 크레용을 반으로 나눠 주면서 그랬어요. 이제 두 개 생겼다고."], ["N", "루카스의 숨이 조금 느려졌다."], ["P", "다리 끝에 탑 두 개 있잖아요. 그거 부러진 크레용 두 개로 그린 거예요. 하나씩. 그래서 탑 색깔이 조금 달라요."], ["N", "핀셋 끝의 흔들림이, 조금 작아졌다."], ["P", "그리고 강가에 앉은 사람. 할아버지가 그랬어요. 그거 할아버지 아니냐고. 저는 아니라고 했어요. 저라고 했어요. 언젠가 제가 저 다리에 가서 그림 그릴 거라고."], ["N", "루카스가 숨을 내쉬었다. 길게. 그리고 핀셋을 내렸다."], ["N", "일본 종이 한 올이 찢어진 틈 위에 놓였다. 정확히. 0.3밀리미터. 흔들리지 않고."], ["N", "복원실에서 누군가 숨을 크게 내쉬었다. 요나스였다. 엘제 선생님은 아무 소리도 내지 않았다. 다만 안경을 벗어 눈가를 닦았다."], ["N", "루카스는 핀셋을 작업대와 평행하게 내려놓았다. 그리고 그제서야, 의자 쪽을 보았다."], ["L", "......계속해."], ["P", "네?"], ["L", "얘기. 계속해. 아직 일흔 올 남았어."], ["N", "그가 웃었다. 소리 내어. 그리고 계속 말했다. 일곱 살의 할아버지 집, 냉장고 문, 크레용 냄새, 할머니 마거릿이 구워 주던 사과 파이. 루카스는 그 목소리를 들으며 한 올, 또 한 올을 놓았다."], ["N", "그날 저녁까지, 스무 올이 놓였다. 떨린 것은 세 번이었다. 세 번 모두, 그의 목소리가 그 떨림을 멈추게 했다."], ["H", "11장. 코덱스, 다시"], ["N", "4월 말. 일곱 살의 다리 그림이 완성되었다. 곰팡이 점 0개. 찢어진 틈은 일흔한 올의 일본 종이로 메워져, 빛에 비춰 보아도 거의 보이지 않았다."], ["N", "루카스는 그것을 중성지 폴더에 넣어 그에게 건넸다. 그는 폴더를 열고 오래 들여다보았다. 그리고 아무 말 없이, 루카스의 오른손을 잡았다. 손바닥에, 손목의 수술 자국에, 아주 조심스럽게 입을 맞췄다."], ["L", "......복원실이야."], ["P", "알아요."], ["L", "요나스 보고 있어."], ["M", "안 봤어요! 아무것도 안 봤어요!"], ["N", "엘제 선생님이 웃었다. 그리고 그날 오후, 루카스를 다시 사무실로 불렀다."], ["O", "코덱스 건이다."], ["L", "...요나스 잘하고 있습니다. 준비 작업 순조롭습니다."], ["O", "알아. 그런데 요나스가 오늘 아침에 나한테 왔어."], ["L", "......?"], ["O", "책임자 자리를 공동으로 해 달래. 너랑 같이. 자기 혼자는 2년 못 버틴다고. 14세기 금박이 들어간 페이지가 서른두 장인데, 그건 네 손이 아니면 안 된대."], ["N", "루카스는 대답하지 못했다."], ["O", "내가 물었지. 루카스 손이 그때까지 돌아올지 모르는데 괜찮냐고. 요나스가 뭐라고 했는지 아니?"], ["L", "......"], ["O", "'선배님 손은 이미 돌아오고 있어요. 제가 매일 봤어요. 그리고 안 돌아와도요, 선배님 눈은 돌아올 필요가 없잖아요. 처음부터 거기 있었으니까.'"], ["N", "엘제 선생님이 서류를 루카스 쪽으로 밀었다. 책임 복원가 란에 이름이 두 개 적혀 있었다. 요나스. 그리고 루카스 아스카니엔."], ["O", "금박 서른두 장은 가을부터야. 그때까지 손 만들어 와."], ["L", "......네."], ["O", "그리고 루카스."], ["L", "네."], ["O", "너 지난 석 달 동안 많이 변했다."], ["L", "...손이 다쳐서 그렇습니다."], ["O", "아니. 다치기 전부터. 그 붉은 머리가 다리에 서기 시작한 뒤로."], ["N", "루카스는 대답하지 않았다. 귀 끝이 붉었다. 엘제 선생님은 그것을 보고, 15년 동안 본 적 없는 얼굴이라고 생각했다."], ["H", "12장. 서른네 개"], ["N", "5월 첫 일요일. 루카스의 집. 아침 일곱 시."], ["N", "그는 흰 리넨 셔츠를 입고 거울 앞에 서 있었다. 석 달 동안 매일 입은 셔츠였다. 리넨은 이제 아주 부드러워져 있었다. 단추 구멍 몇 개는 실이 풀려, 루카스가 왼손으로 다시 꿰매 준 자국이 있었다."], ["N", "루카스가 그 앞에 섰다. 오른손을 들었다. 맨 위 단추부터."], ["N", "하나. 둘. 셋. 손가락이 떨리지 않았다. 열. 스물. 서른. 소매의 다섯 개, 또 다섯   c.fillStyle='#fff';m.forEach((r,y)=>[...r].forEach((ch,x)=>ch==='#'&&c.fillRect(x,y,1,1)));})();

function build(s){
  const k=s[0],t=s[1];
  if(k==='H'){const e=document.createElement('div');e.className='chap';e.textContent=t;return e;}
  if(k==='N'){const e=document.createElement('div');e.className='nar';e.textContent=t;return e;}
  const who=k==='L'?'me':({K:'k',M:'m',O:'o',D:'d',R:'r'}[k]||'p'),e=document.createElement('div');
  e.className='msg'+(who==='me'?' me':'');
  const img=new Image();img.className='av';img.alt='';img.src=AV[who];
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;
  $('panel').replaceChildren();
  const c=document.createElement('div');c.className='cover';c.id='cover';
  c.innerHTML='<b>new take#3</b><span>하이델베르크, 서른네 개의 단추.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span>';
  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
</body>
</html>
