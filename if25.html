<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>만약, 스물다섯</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#17110c; --ink:#21180f; --pink:#8f7149; --pink-soft:#eadfc9;
  --face:#d8cbb3; --hi:#f4ecdc; --lo:#8c7b62; --paper:#f3ece0;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(ellipse 80% 45% at 50% 0%,rgba(214,180,120,.14),transparent 70%) no-repeat var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#ece2cd;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:#c4a676;margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 #5e4630}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#6d5d4a;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630;
  box-shadow:inset -1px -1px 0 #5e4630,inset 1px 1px 0 #c9ad84;margin-top:6px}
.nar{align-self:stretch;background:#ebe2d2;border:1px dashed #b3a184;padding:8px 10px;font-size:13px;line-height:1.55;color:#4a3d30;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.pic{margin:2px 0;align-self:center;width:100%;max-width:420px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;padding:5px}
.pic img{display:block;width:100%;height:auto}
.nar,.chap,.pic{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a8d7c;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #efe6d6}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 #5e4630}
.btn:disabled{color:#8f826f;text-shadow:none;cursor:default}
.btn.main:disabled{background:#bfa888}
.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
.hint{font-size:12px;color:#a39580;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
</style>
</head>

<div class="wrap">
  <a href="index.html#chron" onclick="if(history.length>1){history.back();return false}" style="display:inline-block;margin:0 0 10px;padding:4px 12px;border:2px solid #141012;background:#fff;color:#141012;font:700 13px/1.4 sans-serif;text-decoration:none">← 목록으로</a>
  <h1>IF · 스물다섯<small>Lesesaal · Both</small></h1>
  <div class="win">
    <div class="bar">
      <canvas class="heart" id="heart" width="7" height="6"></canvas>
      <span class="ttl" id="ttl">IF · 스물다섯</span>
      <span class="wbtn">_</span><span class="wbtn">□</span><span class="wbtn">×</span>
    </div>
    <div class="menu"><span><u>파</u>일</span><span><u>편</u>집</span><span><u>보</u>기</span><span><u>대</u>화</span></div>
    <div class="panel" id="panel">
      <div class="cover" id="cover"><b>IF · 스물다섯</b><span>만약 둘이 스물다섯에 만났다면.<br>열람실, 흑? 분홍?, 그리고 8시 55분.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span></div>
    </div>
    <div class="input"><div class="field">메시지를 입력하세요</div><div class="send">보내기</div></div>
    <div class="status"><span id="st1">● 온라인</span><span id="st2">0 / 0</span></div>
  </div>
  <div class="ctrl">
    <button class="btn" id="reset">처음부터</button>
    <button class="btn main" id="next">시작</button>
  </div>
  <p class="hint" id="hint">버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.</p>
</div>

const STORY=[["H", "프롤로그. 숨는 곳 아닙니다"], ["N", "스물다섯. 둘 다 스물다섯이었던 어느 해의 늦여름."], ["N", "그는 '붉은 연작' 첫 개인전이 생각보다 너무 잘된 직후였다. 기사가 나고, 모르는 사람들이 작업실 앞까지 찾아오고, 고백하는 사람들은 하나같이 \"당신 빨강이 좋아요\"로 시작했다."], ["N", "아직 그걸 웃으며 넘기는 법을 몰랐다. 그래서 다나 몰래 석 달짜리 레지던시를 잡고 도망쳤다. 할아버지 아우구스트의 고향, 하이델베르크로. 여기서는 아무도 자기를 모를 테니까."], ["N", "루카스는 복원실 6년차였다. 손은 이미 정확했고, 마음은 열아홉 살 때 반쪽짜리 편지에서 크게 한 번 틀린 채 굳어 있었다. 그래서 사람을 반쪽만 보고 빨리 판결했다. 틀리는 게 무서워서 더 빨리."], ["N", "도착하고 나흘째, 대학 도서관. 미국 관광객 둘이 그 붉은 머리를 알아보고 따라왔다. 그는 처음 보이는 문으로 뛰어 들어가 서가 사이에 쪼그려 앉았다. 희귀본 열람실이었다."], ["N", "무릎까지 오는 머리가 바닥에 다 쏟아져 있었다. 그 위로 그림자가 졌다. 검은 머리, 회색 셔츠, 남색 카디건. 사서 조교 명찰. 그리고 그 사람이 그를 내려다보며 말했다."], ["L", "……여긴 희귀본 열람실입니다."], ["P", "아, 저, 잠깐만요, 밖에 사람이—"], ["L", "……숨는 곳 아닙니다. 나가십시오."], ["N", "그는 나갔다. 나가자마자 관광객들에게 잡혀 사진을 열두 장 찍혔다."], ["N", "루카스는 문 안쪽에서 그 셔터 소리를 다 들었다. 아주 조금 미안했다. 그리고 그 미안함도 금방 판결해 버렸다. 시끄러운 사람이다. 끝."], ["H", "1장. 흑? 분홍?"], ["N", "그는 머리를 굴렸다. 숨으면 안 된다는 거지, 있으면 안 된다는 건 아니잖아."], ["N", "다음 날 그는 이용증을 만들었다. 할아버지 시대 하이델베르크 신문 축쇄본을 신청하고, 창가 자리에 앉아 진짜로 읽었다."], ["N", "열람실은 완벽했다. 조용히 해야 하니까 누가 따라 들어와도 말을 못 걸었다. 사진은 금지라 휴대폰도 못 꺼냈다. 그는 석 달 만에 처음으로 숨을 편하게 쉬었다."], ["N", "첫날 그가 볼펜을 꺼내자 대출 데스크에서 한마디가 날아왔다."], ["L", "……볼펜은 반입 안 됩니다. 연필만."], ["P", "아, 네! 죄송해요."], ["N", "그 뒤로 그는 연필만 썼다. 루카스의 머릿속에서 그는 '문제없는 이용자'로 분류되었다. 그리고 루카스는 신경을 껐다. 완전히."], ["N", "문제는 그가 신경을 못 끈다는 거였다."], ["N", "대출 데스크 안쪽의 그 사람은 전부 무채색이었다. 검은 머리를 한 올도 안 흐트러지게 넘기고, 피부는 종이처럼 하얗고, 셔츠는 회색, 카디건은 남색인지 검정인지 모를 색."], ["N", "의자에 등을 기대는 걸 한 번도 못 봤다. 책장을 넘길 때는 엄지 끝으로 모서리만 잡았다. 뭐든 정해진 각도로만 하는, 엄청 고지식하고 딱딱해 보이는 사람이었다."], ["N", "그런데 눈이 분홍색이었다."], ["N", "그게 미치도록 신경 쓰였다. 화가라서, 색 하나가 어긋나 있으면 견디지 못했다. 저 사람의 팔레트에는 그 색이 들어갈 자리가 없는데, 거기 있었다."], ["N", "그는 석 달 내내 혼자 진지하게 고민했다. 저 사람은 흑색인 사람일까, 분홍색인 사람일까."], ["N", "스케치북 귀퉁이에 '흑? 분홍?'이라고 적었다. 무채색 얼굴을 그려 놓고 눈 자리만 비워 둔 그림이 한 장씩 늘었다. 칠할 수가 없어서."], ["N", "루카스는 그걸 전혀 몰랐다. 남의 시선은 귀신같이 잡아내는 사람이었는데, 이 사람의 시선은 조용해서 감지기가 울리지 않았다."], ["H", "2장. 지갑"], ["N", "석 달 중 딱 가운데쯤, 대학 구내식당."], ["N", "그는 배가 너무 고파서 쟁반을 꽉 채웠다. 수프, 감자, 고기, 디저트까지. 계산대 앞에서 주머니를 뒤졌다. 지갑이 없었다."], ["N", "카드도 현금도 없었다. 아는 독일어는 \"Entschuldigung\" 하나였다. 계산원은 독일어로 뭐라고 하고, 뒤에 줄은 길어지고, 붉은 머리 때문에 다들 쳐다보고, 그는 쟁반을 든 채 얼굴이 머리색이 됐다."], ["N", "바로 뒤에 루카스가 서 있었다. 이 상황이 하나도 궁금하지 않았다. 다만 기다리는 게 싫었다. 줄이 막힌 게 싫고, 점심시간이 줄어드는 게 싫고, 사람들이 웅성거리는 게 제일 싫었다."], ["N", "루카스가 아무 말 없이 앞으로 나와 카드를 내밀었다."], ["L", "……두 사람 거 같이 계산합니다."], ["N", "그를 쳐다보지도 않았다. 자기 쟁반을 들고 그대로 가 버렸다. 쟁반에는 빵 하나와 물 한 잔뿐이었다."], ["N", "그는 쟁반을 든 채 0.5초 생각했다. 이건 기회다. 흑인지 분홍인지, 석 달 만에 처음으로 확인할 수 있는."], ["N", "그는 따라가서 구석 테이블 맞은편에 쟁반을 내려놓았다."], ["P", "갚을게요! 연락처 주세요."], ["L", "……안 갚으셔도 됩니다."], ["P", "갚아야죠! 번호요."], ["N", "루카스가 냅킨에 무언가를 적어 밀어 주었다. 그가 신나서 들여다보았다. 계좌번호였다."], ["L", "……이리로 보내십시오."], ["P", "이건 돈만 보낼 수 있잖아요. 고맙다는 말은 못 하잖아요."], ["L", "……안 하셔도 됩니다."], ["N", "여기서 그가 처음으로 수를 썼다. 스물다섯이라 여유는 없었는데, 이건 본능이었다."], ["P", "그럼 내일 열람실에서 할게요. 감사 인사요. 크게."], ["N", "루카스의 손이 멈췄다. 열람실에서. 크게. 그 두 단어가 루카스에게는 협박이었다."], ["N", "루카스가 처음으로 그를 정면으로 보았다. 3초쯤. 그리고 계좌번호 밑에 숫자를 하나 더 적었다."], ["L", "……열람실에서 말 걸지 마십시오."], ["P", "네!"], ["H", "3장. 식사 중에는"], ["N", "번호를 받았으니 그는 일어날 생각이 없었다. 그대로 앉아서 먹었다."], ["L", "……같이 먹는다고 한 적 없습니다."], ["P", "자리가 없어서요ㅎ"], ["N", "식당에는 빈자리가 반이었다. 루카스는 주위를 한 번 둘러보았고, 아무 말도 하지 않았다. 일어나는 것도 귀찮을 만큼 무관심했다."], ["N", "그는 신이 나서 떠들었다. 지갑을 어디서 흘렸는지 추리하고, 수프 맛을 평가하고, 독일 감자는 왜 이렇게 맛있냐고 묻고, 이름을 물었다. 루카스는 대답하지 않았다. 그는 목에 걸린 직원증에서 'L. Askanien'을 읽었다."], ["P", "루카스 씨! 맞죠? 저희 할아버지도 하이델베르크 분이었는데요, 1936년에—"], ["L", "……식사 중에는 조용히 해 주십시오."], ["N", "칼같이 끊었다. 높낮이 하나 없이. 스물다섯의 루카스는 돌려 말하는 법이 없었다."], ["N", "그는 입을 다물었다. 진짜로 조용히 먹었다. 대신 이제 눈치 볼 필요 없이 대놓고 맞은편을 보았다."], ["N", "구내식당 창으로 낮 햇빛이 들어왔다. 열람실 형광등 아래서는 애매했던 색이, 그 빛 아래서는 확실했다. 분홍이었다. 아주 연한, 해 뜨기 직전 하늘 같은 분홍."], ["N", "너무 빤히 보았다. 이번엔 루카스도 알아챘다. 소리 없는 시선이라도 30센티 앞에서는 잡혔다. 루카스가 미간을 찌푸리고 그를 노려보았다. 그 순간 분홍 눈이 차갑고 어두워졌다. 거의 검정으로."], ["N", "그는 숟가락을 든 채 생각했다."], ["N", "아. 둘 다구나."], ["H", "4장. 한 줄짜리 대답"], ["N", "그날 저녁 그는 돈을 보내고, 메시지도 보냈다."], ["P", "오늘 정말 고마웠어요!! 덕분에 살았어요ㅎㅎ 감자 진짜 맛있었어요. 루카스 씨는 빵만 드시던데 그걸로 배불러요?"], ["N", "다음 날 아침에 답장이 왔다."], ["L", "입금 확인했습니다."], ["N", "끝이었다. 질문에는 답이 없었다."], ["N", "그 뒤로 그가 뭘 보내도 답은 왔다. 전부 한 줄이었다."], ["P", "내일 비 온대요! 우산 있어요?"], ["L", "네."], ["P", "독일 사람들은 저녁에 빵만 먹어요?"], ["L", "아니요."], ["P", "하이델베르크에서 제일 맛있는 빵집 어디예요?"], ["L", "모릅니다."], ["P", "열람실 내일도 열어요?"], ["L", "월요일은 휴관입니다."], ["N", "그는 그 한 줄짜리 답장을 스케치북 뒷장에 차곡차곡 옮겨 적었다. 그게 대화라고 생각하면서."], ["N", "열람실에서는 약속대로 한 마디도 걸지 않았다. 대신 반납대에 책을 돌려줄 때마다 책갈피 자리에 쪽지를 끼웠다. '오늘 창가 햇빛 좋았어요.' '연필 다 닳았어요.' '감자 또 먹었어요.'"], ["N", "루카스는 그 쪽지를 그대로 빼서 버렸다. 읽고 나서."], ["N", "한 번도 읽지 않고 버린 적은 없었다. 그건 루카스 본인만 알았다."], ["H", "5장. 비 오는 날"], ["N", "레지던시가 끝나기 일주일 전, 비가 왔다."], ["N", "그는 열람실 창가에 스케치북을 두고 나갔다. 창이 아주 조금 열려 있었다. 다음 날 와 보니 스케치북이 없었다."], ["N", "그는 잃어버린 줄 알았다. 그리고 그냥 체념했다. 없어진 건 찾지 않는 사람이었다. 붙잡으면 안 되는 거라고 생각하는 사람이었다."], ["N", "사실은 루카스가 가져갔다. 젖은 종이를 그냥 지나치지 못하는 사람이라서."], ["N", "그날 밤 복원실. 루카스는 스케치북을 한 장씩 떼어 압지 사이에 넣고 말렸다. 그 안에 그림이 있었다."], ["N", "빨강이 하나도 없었다. 연필로만 그린 옛 다리, 빵집 창문, 열람실 서가. 사람은 아무도 없었다. 일부러 사람만 빼고 그린 그림들이라는 게 루카스 눈에 보였다."], ["N", "루카스는 처음으로 판결을 멈췄다. 이 사람도 시선이 싫은 사람이구나."], ["N", "그리고 마지막 몇 장에서 손이 멈췄다."], ["N", "무채색 얼굴이었다. 검은 머리, 하얀 피부, 회색 옷깃. 같은 얼굴이 여러 장. 전부 눈 자리만 비어 있었다. 그리고 맨 마지막 장에만 눈이 칠해져 있었다. 분홍. 가장자리를 진한 검정으로 두른."], ["N", "귀퉁이에 연필로 작게. '흑? 분홍?' 그 아래 다른 날의 글씨로. '둘 다.'"], ["N", "루카스는 그게 자기라는 걸 바로 알았다. 그리고 알았다는 것까지, 같이 접어서 치워 버렸다."], ["N", "스케치북은 이틀 뒤 레지던시 우편함으로 돌아갔다. 중성지에 싸서. 쪽지는 없었다."], ["N", "그는 누가 그랬는지 짐작이 갔다. 확인할 용기는 없었다. 확인했다가 아니라고 하면 무너질 것 같았다. 스물다섯의 그는 아직 여유가 없었다."], ["H", "6장. 그냥 떠남"], ["N", "떠나는 날 아침, 그는 공항 가는 길에 옛 다리를 한 번 건넜다. 아무도 없었다. 그 시간은 아직 아무 의미도 없는 시간이었다."], ["N", "루카스는 그 시간에 복원실에서 핀셋을 들고 있었다. 그가 오늘 떠난다는 걸 알면서, 일부러."], ["N", "비행기에서 그가 마지막 메시지를 보냈다."], ["P", "석 달 동안 고마웠어요. 열람실 덕분에 숨 쉬었어요ㅎㅎ"], ["N", "답장은 오지 않았다. 루카스는 그 메시지를 읽었다. 지우지도 않았다. '네.'보다 긴 말을 할 줄 몰라서였다. 루카스는 할 말이 없어서라고 생각했다."], ["H", "7장. 1년"], ["N", "그가 떠난 뒤 루카스는 아무렇지 않았다. 적어도 본인은 그렇게 생각했다."], ["N", "이상한 버릇이 생겼다. 반납대에 책이 들어오면 책장 사이를 한 번 훑었다. 쪽지가 끼워져 있을 리 없는데."], ["N", "맞은편 창가 자리에 다른 사람이 앉으면 이유 없이 기분이 나빴다. 구내식당에서 빵을 사다가 감자 앞에서 1초 멈췄다."], ["N", "그리고 거울을 볼 때마다 눈이 먼저 보였다. 자기 눈 색 같은 건 신경 써 본 적도 없던 사람이었다."], ["N", "그 무채색 얼굴. 가장자리가 너무 진한 분홍 눈. 루카스는 그 그림을 1년 동안 한 번도 떠올리지 않았다. 떠올리지 않았다고 생각했다."], ["H", "8장. Both"], ["N", "이듬해 가을, 루카스는 뉴욕에 일주일짜리 연수를 갔다. 진짜 일 때문이었다. 가 볼 곳 목록에 그 사람 이름은 없었다. 일부러 안 적었다."], ["N", "첫날 오후, 비가 왔다. 첼시를 걷다 우산이 뒤집혀서 처마 밑으로 피했다. 갤러리 입구였다."], ["N", "포스터. '붉은 연작' 두 번째 개인전. 오늘 저녁 오프닝."], ["N", "돌아서려다 비 때문에 못 돌아섰다. 오프닝 전이라 사람이 별로 없었다. 루카스는 들어갔다."], ["N", "첫 방부터 끝까지 빨강이었다. 그렇게 빨강이 많은 공간에 있어 본 적이 없어서 숨이 막혔다. 빨리 지나가려고 걷다가, 마지막 작은 방에서 멈췄다."], ["N", "거기만 연필화였다. 열람실 서가. 빵집 창문. 비 오는 옛 다리. 1년 전, 복원실에서 밤새 말린 그 그림들."], ["N", "그리고 벽 한가운데 한 점. 무채색 얼굴, 분홍 눈, 검은 테두리."], ["N", "제목 카드. 'Both.' 그 옆에 붉은 스티커. 비매품."], ["N", "루카스가 그 앞에 서 있는 동안 오프닝 시간이 되었다. 문이 열리고 사람이 쏟아졌다. 기자, 카메라, 플래시."], ["N", "다들 화가를 찾다가, 그 그림 앞에 선 사람을 보았다. 무채색 옷, 검은 머리, 분홍 눈. 그림과 똑같은 얼굴이 그림 앞에 서 있었다."], ["N", "웅성거림이 커졌다. 카메라가 올라갔다. 루카스는 그 자리에 굳었다. 세상에서 제일 싫어하는 것들이 한꺼번에 몰려왔다. 도망갈 길이 없었다."], ["N", "그때 시야가 붉게 가려졌다."], ["N", "그가 루카스 앞에 등을 돌리고 서 있었다. 키가 크고 머리가 무릎까지 오니까, 카메라 쪽에서는 붉은 커튼밖에 보이지 않았다."], ["N", "1년 전 열람실에서 루카스가 해 주지 않았던 일을, 그가 해 주고 있었다."], ["P", "여긴 희귀본 열람실 아니라서요. 숨어도 돼요ㅎㅎ"], ["N", "뒤를 돌아보지 않은 채였다. 루카스는 아무 말도 못 했다. 그 등 뒤에서 처음으로, 남이 막아 주는 쪽에 서 보았다."], ["D", "자자, 화가는 이따 인사드릴게요! 저쪽 방부터 보세요! 샴페인 저쪽!"], ["N", "짧은 은발에 하이힐. 목소리가 큰 여자가 사람들을 다른 방으로 몰고 나갔다. 나가면서 붉은 머리 뒤의 검은 머리를 한 번 흘끔 보았고, 아무것도 묻지 않았다."], ["H", "9장. 가장자리"], ["N", "둘만 남았다. 그가 돌아섰다. 1년 만이었다. 무슨 말을 해야 할지 모르는 얼굴이었다."], ["N", "루카스가 먼저 입을 열었다. 그림을 보면서."], ["L", "……가장자리가 너무 진합니다."], ["P", "네?"], ["L", "……눈. 테두리. 그렇게까지 검지 않습니다."], ["N", "원본을 감정하는 복원가의 목소리였다. 그가 웃음을 터뜨렸다. 오프닝 날 갤러리에서 제일 큰 소리로."], ["P", "그럼 직접 봐야겠네요. 다시 그리게요."], ["L", "……안 됩니다."], ["P", "밥은요? 이번엔 제가 살게요. 지갑 있어요ㅎㅎ"], ["N", "루카스가 1초 생각했다. 1년 동안 무의식에 접어 두었던 것이, 거기서 펴졌다."], ["L", "……식사 중에는 조용히 하십시오."], ["N", "거절이 아니었다. 조건이었다. 그는 그걸 바로 알아들었다."], ["H", "10장. 일주일의 저녁"], ["N", "그날부터 연수가 끝날 때까지 일주일 내내, 둘은 저녁을 같이 먹었다."], ["N", "루카스의 조건은 분명했다. 검증된 곳. 위생 등급 A, 메뉴판이 깔끔한 곳, 의자가 흔들리지 않는 곳."], ["L", "……어디로 갑니까."], ["P", "제가 제일 좋아하는 데요ㅎㅎ 뉴욕 사람만 아는 데!"], ["N", "루카스는 그걸 숨겨진 비스트로쯤으로 들었다. 반쪽만 들은 것이었다."], ["N", "첫날. 웨스트 4번가 모퉁이 핫도그 수레. 의자가 없었다. 위생 등급 같은 건 붙어 있지도 않았다. 그는 자랑스럽게 두 개를 시켰다. 머스터드 듬뿍, 볶은 양파 듬뿍."], ["N", "루카스는 핫도그를 받아 들고 3초 동안 보았다. 냅킨으로 손잡이 부분을 감쌌다. 서서 한입 먹었다. 아무 말도 하지 않았다."], ["N", "이 사람, 생각보다 미식가가 아니구나. 루카스는 그날 처음 조금 후회했다. 그래도 \"다른 데로 갑시다\"는 하지 않았다. 한번 정한 걸 중간에 무르는 사람이 아니었다."], ["N", "둘째 날. 1달러짜리 피자. 접시는 종이 한 장. 루카스가 종이를 두 장 겹쳐 받았다."], ["P", "뉴욕에선 이렇게 반으로 접어서 먹어요ㅎㅎ"], ["N", "루카스가 반으로 접었다. 정확하게 반으로, 가장자리를 맞춰서. 기름 한 방울 흘리지 않았다. 그가 감탄했다. 그날 루카스는 피자를 다 먹었다."], ["N", "셋째 날. 다이너. 드디어 의자가 있었다. 그가 시킨 건 팬케이크 세 장에 시럽 듬뿍, 그 위에 휘핑크림. 저녁으로. 루카스는 계란 프라이 두 개와 토스트. 가장자리가 조금 탔다."], ["N", "루카스가 탄 부분을 포크로 떼어 내려는데—"], ["P", "탄 데가 맛있어요."], ["L", "……탄 건 탄 겁니다."], ["N", "그가 허락도 없이 탄 데만 떼어 갔다. 루카스는 막으려다 말았다. 그 사람이 진짜 맛있게 먹어서."], ["N", "이날부터 \"식사 중에는 조용히\"가 느슨해졌다. 끊기까지 걸리는 시간이 길어졌다. 첫날은 10초. 셋째 날은 2분."], ["N", "넷째 날. 아침 베이글. 루카스는 원래 아침을 안 먹는 사람이었는데, 거절할 말을 찾다가 못 찾았다. 그는 크림치즈를 세 종류 시켜 다 맛보라고 내밀었다. 루카스는 플레인만 먹었다. 그는 시무룩했고, 다음 날 또 세 종류를 시켰다."], ["N", "다섯째 날. 차이나타운 만두 가게. 다섯 개에 2달러. 플라스틱 의자가 흔들렸다. 루카스가 앉자마자 의자 다리를 확인했다."], ["N", "그가 냅킨을 접어 짧은 다리 밑에 끼워 주었다. 의자가 흔들리지 않았다."], ["N", "루카스는 그걸 내려다보았다. 이 사람은 미식가는 아닌데, 흔들리는 의자는 고칠 줄 아는구나."], ["N", "그날 루카스는 만두를 열 개 먹었다."], ["L", "……배가 고팠습니다."], ["N", "귀 끝이 빨갰다."], ["N", "여섯째 날. 이번엔 루카스가 골랐다. 위생 등급 A, 리뷰 4.8점, 조용한 프렌치 비스트로. 그런데 그가 메뉴판을 보고 당황했다. 모르는 단어투성이에, 가격은 핫도그 서른 개 값."], ["N", "그는 내색하지 않고 웃었다. 그 웃음이, 1년 전 구내식당 계산대 앞의 웃음이었다. 루카스는 그걸 알아보았다."], ["L", "……제가 고른 곳이니까요."], ["N", "이번에도 루카스가 계산했다. 그날 처음으로 루카스는 생각했다. 핫도그가 더 나았나."], ["N", "일곱째 날. 연수 마지막 날 저녁."], ["L", "……오늘은 어디."], ["P", "루카스 씨 마지막 날인데 좋은 데 가야죠. 어제 같은 데요."], ["L", "……첫날 거기."], ["P", "……핫도그요?"], ["L", "……의자 없는 데."], ["N", "웨스트 4번가 모퉁이. 핫도그 두 개. 루카스는 이번엔 냅킨으로 감싸지 않았다. 그리고 머스터드를 조금 더 달라고 했다."], ["N", "그가 너무 웃어서 핫도그를 떨어뜨릴 뻔했다."], ["L", "……식사 중에는 조용히."], ["P", "네ㅎㅎ"], ["N", "이번엔 루카스도 아주 조금 웃고 있었다. 가로등 아래서 그 눈은 분홍이었다. 테두리는 하나도 진하지 않았다."], ["N", "하이델베르크로 돌아간 루카스의 수첩에는 이렇게 적혀 있었다."], ["N", "'뉴욕. 7일. 핫도그 2. 피자 1. 팬케이크 0(안 먹음). 계란 2(탄 데 뺏김). 베이글 4(플레인). 만두 10. 비스트로 1(비쌈. 그쪽 불편해함). 맛: 대부분 보통. 다음: 또.'"], ["N", "'다음: 또.' 루카스는 자기가 그걸 왜 적었는지 몰랐다. 지우지도 않았다."], ["H", "11장. 상사병"], ["N", "루카스가 떠난 다음 날부터, 그는 좀 이상해졌다."], ["N", "첫째 날. 'Both'를 다시 이젤에 올렸다. 테두리를 고치려고. 이제 알았으니까. 가로등 아래서는 하나도 진하지 않았다. 그런데 한 시간 동안 아무것도 못 칠했다. 얼마나 연하게 칠해야 하는지 손이 정하지 못했다. 팔레트에 분홍을 열네 가지 섞어 놓고 그날은 끝났다."], ["N", "둘째 날. 빨강이 안 칠해졌다. 다음 연작 마감이 코앞인데, 손이 자꾸 연한 분홍 쪽으로 갔다."], ["N", "셋째 날. 웨스트 4번가 모퉁이를 지나다 핫도그를 두 개 샀다. 하나를 다 먹고 나서야, 남은 하나를 누구 주려고 샀는지 깨달았다. 결국 다 먹었다. 머스터드를 조금 더 달라고 하면서."], ["N", "넷째 날. 메시지 창을 열었다."], ["P", "잘 도착했어요?"], ["N", "지웠다. 사흘 전에 도착했으니까."], ["P", "핫도그 먹었어요ㅎㅎ"], ["N", "지웠다. 그래서 뭐 어쩌라고."], ["P", "보고 싶"], ["N", "손가락이 멈췄다. 그는 휴대폰을 엎어 놓고 바닥에 누웠다."], ["N", "다섯째 날. 다나가 지하 작업실에 내려왔다. 빨강 위를 긁어낸 자국, 바닥의 분홍 열네 가지, 이젤 위의 'Both'."], ["D", "너 요즘 왜 그래?"], ["P", "모르겠어요. 아픈 것 같아요."], ["D", "어디가?"], ["P", "……그냥, 다요. 밥도 맛없고, 잠도 안 오고, 빨강도 안 칠해지고. 근데 열은 없어요."], ["N", "다나는 그를 한참 보다가 'Both'를 보고, 다시 그를 보았다. 다 알았지만 말해 주지 않았다. 직접 알아야 하는 거라서."], ["D", "병원 가 봐. 근데 아마 처방전은 안 나올 거다."], ["N", "그날 밤 그는 침대에 누워 검색했다. 밥맛 없음. 불면. 특정 색만 생각남."], ["N", "맨 위에 뜬 단어를 보고 휴대폰을 떨어뜨렸다. 얼굴 위로."], ["N", "상사병."], ["N", "고백은 많이 받아 봤다. 다들 빨강을 좋아한 사람들이라 웃으며 넘겼다. 자기가 누군가를 먼저 이렇게 생각해 본 적은 한 번도 없었다. 스물다섯이 되도록."], ["N", "핫도그 두 개. 흔들리는 의자 밑의 냅킨. 탄 계란을 뺏어 먹을 때 막지 않던 포크. 10초에서 2분이 된 \"식사 중에는 조용히\". 머스터드를 더 달라던 목소리. 가로등 아래서 하나도 진하지 않던 테두리."], ["N", "그는 이불을 머리끝까지 뒤집어썼다. 붉은 머리가 이불 밖으로 다 삐져나왔다."], ["P", "……이게 그거구나."], ["N", "다음 날 아침, 'Both'의 테두리를 고쳤다. 한 번에. 손이 망설이지 않았다. 전날 밤에 이름을 붙였으니까. 연하게, 아주 연하게. 해 뜨기 직전 하늘처럼."], ["N", "그리고 세 시간 동안 메시지를 썼다. 보낸 건 한 줄이었다."], ["P", "루카스 씨, 거기 지금 몇 도예요?"], ["N", "답장은 다음 날 아침에 왔다."], ["L", "열람실은 21도입니다. 습도 50."], ["N", "날씨를 물었는데 열람실 온도를 알려 주는 사람이었다. 그게 무슨 뜻인지, 그는 이번엔 알아들었다. 웃다가 울 뻔했다."], ["H", "12장. 47분 12초"], ["N", "두 번째 개인전 마지막 날. 'Both'는 끝까지 팔지 않았다. 비매품 스티커는 그가 직접 붙였다."], ["N", "다나가 클로징 파티를 크게 열었다. 그는 원래 술이 세지 않았다. 그날은 사람들이 \"축하해!\" 하며 잔을 내밀 때마다 받았다. 온도 얘기 다음으로 한 줄도 더 못 보낸 게 답답해서."], ["N", "새벽 한 시 반. 다나가 택시를 잡으러 간 사이, 그는 갤러리 앞 계단에 주저앉았다. 붉은 머리가 계단 세 칸에 걸쳐 쏟아져 있었다. 휴대폰을 꺼냈다."], ["N", "뉴욕은 새벽 1시 55분. 하이델베르크는 아침 7시 55분. 그는 그런 계산 같은 건 하지 않았다. 그냥 그 이름을 눌렀다."], ["N", "루카스는 출근길, 옛 다리 한가운데였다. 그가 전화를 건 건 처음이었다. 루카스는 3초 고민하고, 받았다."], ["L", "……여보세요."], ["P", "루카스 씨이이이—"], ["N", "루카스가 휴대폰을 귀에서 뗐다. 목소리가 너무 컸다. 발음이 다 녹아 있었다."], ["P", "잘 지냈어요? 잘 지냈어요? 루카스 씨 잘 지냈어요?"], ["L", "……네."], ["P", "'Both'요, 안 팔았어요. 엄청 큰 돈 부른 사람 있었는데 안 팔았어요. 루카스 씨 눈이니까요. 루카스 씨 눈은 팔면 안 되잖아요."], ["L", "……술 드셨습니까."], ["P", "조금요."], ["L", "……많이 드셨습니다."], ["P", "네, 많이요ㅎㅎㅎㅎㅎ"], ["N", "ㅎ이 다섯 개였다. 루카스는 그걸 셌다."], ["N", "그다음 15분은 하나도 정리되지 않았다. 핫도그를 두 개 샀는데 하나가 남았다. 다 먹었다. 머스터드 더 달라고 했다, 루카스 씨가 그랬으니까. 분홍을 열네 가지 섞었는데 결국 열다섯 번째로 칠했다. 빨강이 안 칠해진다. 다나가 병원 가 보라는데 처방전이 안 나온대요."], ["N", "출근 시간은 이미 지나 있었다. 복원실에 늦는 건 6년 동안 처음이었다. 루카스는 끊지 않았다."], ["N", "반쪽만 듣고 판결해서 끊는 게 루카스의 버릇이었다. 이 통화는 반쪽이 어딘지도 알 수 없었다. 너무 시끄러워서, 끝까지 들을 수밖에 없었다."], ["N", "그러다 수화기 너머가 갑자기 조용해졌다. 코를 훌쩍이는 소리."], ["P", "……루카스 씨, 저 상사병이래요."], ["N", "루카스가 숨을 멈췄다."], ["P", "처음이에요. 이런 거. 고백은 많이 받아 봤는데, 다 빨강 좋다는 사람들이었거든요. 근데 루카스 씨는 빨강 싫어하잖아요. 갤러리에서 숨 막혀 하는 거 봤어요."], ["P", "그래서 좋아요. 아니, 그래서 좋은 게 아니라, 그냥 좋아요. 루카스 씨가 좋아요. 흑색이든 분홍색이든 다 좋아요. 둘 다라서 좋아요."], ["N", "딸꾹질 한 번."], ["P", "……근데 이거 지금 말하면 안 되는 거죠. 저 지금 엄청 취했잖아요. 최악이죠. 진짜 최악이에요. 내일 기억 안 날 거예요. 루카스 씨는 다 기억할 거잖아요. 정확하니까."], ["N", "하이힐 소리가 다가왔다."], ["D", "야, 너 누구랑 통화— 루카스? 루카스 씨예요? 아 미치겠네. 미안해요, 얘 지금 사람 아니에요. 제가 데려갈게요."], ["N", "다나가 전화를 뺏으려는 순간, 그가 마지막으로 소리쳤다. 첼시의 새벽 길거리 전체에 울리게."], ["P", "루카스 씨, 좋아해요!!!! 식사 중 아니니까 크게 말해도 되죠!!!!"], ["N", "통화가 끊겼다. 47분 12초."], ["N", "루카스는 휴대폰을 든 채 옛 다리 위에 서 있었다. 강바람이 불었다. 귀 끝이 빨갰다. 목덜미까지. 3초가 아니라 3분째였다."], ["N", "주위를 둘러보았다. 다리 위엔 아무도 없었다. 다행이었다. 그런데 다행인데 이상하게 아쉬웠다. 누가 들었으면 좋았을 것 같기도 해서. 루카스는 그 생각에 깜짝 놀랐다."], ["N", "그날 루카스는 복원실에 40분 늦었다. 엘제 선생님이 시계를 한 번 보고, 루카스의 귀를 한 번 보고, 아무 말도 하지 않았다."], ["N", "뉴욕, 오후 세 시. 그는 깨질 것 같은 머리로 휴대폰을 보았다. 통화 기록 맨 위. '루카스 씨 47:12'."], ["N", "기억이 하나씩 돌아왔다. 핫도그. 분홍 열네 가지. 상사병. 둘 다라서 좋아요. 그리고 마지막 고함."], ["N", "그는 이불 속에서 소리 없이 비명을 질렀다. 메시지가 하나 와 있었다. 하이델베르크 시간으로 그날 저녁에 온 것이었다."], ["L", "잘 들어갔습니까."], ["L", "다음엔 맨정신으로 다시 하십시오. 그때 대답합니다."], ["N", "'거절합니다'가 아니었다. '그때 대답합니다'였다. 그 사람은 하지 않을 말은 쓰지 않는 사람이었다."], ["N", "그는 다나에게 전화를 걸었다. 한 번에 안 받아서, 세 번."], ["P", "다나, 저 프랑크푸르트 가야 돼요."], ["D", "……지금?"], ["P", "맨정신으로요."], ["N", "이번엔 세 시간 고민하지 않았다. 결제 버튼을 눌렀다."], ["H", "13장. 8시 55분"], ["N", "그날 루카스는 일이 하나도 손에 잡히지 않았다."], ["N", "아침부터 핀셋이 1밀리씩 어긋났다. 47분 12초가 귀에서 나가지 않았다. 반쪽이 아니라 전부가."], ["N", "할 일을 저녁까지 끝내지 못했다. 6년 동안 거의 하지 않던 야근이었다. 엘제 선생님은 퇴근하면서 접이식 의자를 하나 펴 놓고 갔다."], ["O", "의자 둔다. 쓰든가 말든가."], ["N", "저녁 8시 55분. 루카스는 복원실 불을 끄고 나왔다. 집에 가려면 옛 다리를 건너야 했다. 가로등이 다리 위에 노란 점을 일정하게 찍어 놓았다."], ["N", "다리 중간쯤에서, 반대편 끝에서 무언가가 달려왔다."], ["N", "빨간색이었다. 가로등 하나를 지날 때마다 확 타오르는 빨강. 캐리어 바퀴가 돌바닥에서 덜덜덜 울렸다. 무릎까지 오는 머리가 바람에 다 풀려 뒤로 흩날렸다."], ["N", "루카스는 1초 만에 알았다. 이 도시에 저런 머리는 하나밖에 없었다."], ["N", "그가 다리 중간에서 루카스를 발견하고 멈췄다. 숨을 몰아쉬었다. 공항에서 기차로, 역에서 여기까지 달려온 숨이었다."], ["N", "캐리어 손잡이를 놓았다. 그리고 양손을 들어 입가에 모았다."], ["N", "소리치려는 거였다. 다리 한가운데서. 루카스를 향해."], ["N", "루카스는 그 자리에 우뚝 섰다. 한 걸음도 움직이지 않았다. 그리고 노려보았다. 가로등 아래서 분홍 눈이 아주 진해졌다. 테두리까지, 거의 검정으로."], ["N", "그가 그 눈을 보았다. 입가에 모은 손이 멈췄다."], ["N", "시그널을 받은 것이었다. 열람실에서 한 번, 구내식당에서 한 번, 뉴욕에서 일주일. 그 사이에 배웠다. 저 눈이 저렇게 진해지면, 안 된다는 뜻이라는 걸."], ["N", "그가 슬쩍 양손을 내렸다. 그리고 뛰지 않았다."], ["N", "대신 걸어왔다. 키가 크니까 한 걸음이 컸다. 성큼, 성큼. 캐리어는 다리 한가운데 그대로 둔 채. 가로등 세 개를 지나는 동안 루카스는 한 번도 눈을 피하지 않았다."], ["N", "지척이었다. 그의 숨이 아직 가빴다. 루카스가 먼저 입을 열었다. 아주 정확한 목소리로."], ["L", "……크게 하지 않아야 할 말을 크게 하는 건 질색입니다."], ["N", "그가 눈을 크게 떴다. 한 번 끔뻑. 두 번 끔뻑. 어제 새벽 갤러리 앞 계단이 생각났다."], ["N", "다리 위가 조용했다. 강물 소리만 들렸다."], ["N", "그가 고개를 숙였다. 많이. 허리까지 굽혀야 했다. 풀린 붉은 머리가 루카스의 어깨 위로 쏟아졌다. 루카스는 그 머리카락이 코트에 닿는 걸 막지 않았다."], ["N", "그의 입술이 루카스의 귀 바로 옆에 왔다. 숨결이 닿을 만큼. 이번엔 술 냄새 하나 없이."], ["P", "……좋아해요. 루카스 씨."], ["N", "47분 12초를, 한 문장으로."], ["N", "루카스는 바로 대답하지 않았다. 그 말이 다 끝날 때까지 기다렸다. 반쪽 말고, 끝까지. 귀 끝이 빨개지고, 목덜미까지 번지고, 3초가 지났다."], ["N", "그러고는 루카스가 그의 코트 깃을 잡았다. 그가 몸을 펴지 못하게."], ["L", "……그대로 계십시오."], ["N", "그가 숙인 채로 굳었다. 이번엔 루카스가 그의 귀에 대고 말했다. 까치발을 아주 조금 들고."], ["L", "……대답합니다."], ["N", "1초."], ["L", "……저는, 그쪽이 신경 쓰입니다."], ["N", "딱 그만큼이었다. 루카스에게 '좋아한다'는 말은 아직 너무 컸다. 그래서 자기가 아는 말 중에 제일 정확한 걸 골랐다."], ["N", "1년 동안 반납대 책장 사이를 훑게 한 것. 맞은편 창가 자리에 다른 사람이 앉으면 기분이 나빠지게 한 것. 거울 앞에서 눈부터 보게 한 것. 남의 일에는 신경을 끄는 데 1초도 안 걸리는 사람이, 그것 하나만은 끄지 못했다. 루카스는 그걸 신경 쓰인다는 말로밖에 부를 줄 몰랐다."], ["N", "그는 그 말을 거절로 듣지 않았다. 열람실에서 석 달 동안, 이 사람이 무엇에든 신경을 꺼 버리는 걸 옆에서 봐 왔으니까. 그런 사람이 다른 누구도 아닌 '그쪽'이라고 했다."], ["P", "……그거, 저한테는 '네'예요."], ["N", "루카스는 고치지 않았다. 정확한 사람은 틀린 말을 그냥 두지 않았다. 그러니까 그건, 맞는 말이었다."], ["N", "그가 숙인 채로 웃었다. 소리는 내지 않았다. 대신 어깨가 떨렸다. 울 것 같은 숨을 한 번 쉬었다. 루카스는 코트 깃을 놓지 않았다."], ["N", "한참 뒤에야 루카스가 말했다."], ["L", "……밥은 드셨습니까."], ["P", "……기내식이요ㅎㅎ"], ["L", "……그건 밥이 아닙니다."], ["N", "루카스가 코트 깃을 놓고 다리 한가운데로 걸어갔다. 쓰러져 있던 캐리어를 세우고, 손잡이를 반듯하게 접어 그쪽으로 밀어 주었다."], ["L", "……식사 중에는 조용히 하십시오."], ["N", "같이 먹자는 뜻이었다. 그는 이번에도 바로 알아들었다."], ["N", "둘이 다리를 건넌 시간은 9시 정각이었다."], ["H", "에필로그. 수장고 메모"], ["N", "이건 어디까지나, 만약의 이야기."], ["N", "진짜 그 두 사람은 그보다 몇 해 더 지나서, 뉴욕 헌책방 희귀본 코너 바닥에서 만났다. 그날의 루카스는 말없이 등으로 가려 주었다."], ["N", "스물다섯의 루카스는 가려 주지 않았고, 그래서 1년이 더 걸렸다."], ["N", "그래도 결국, 다리 위였다. 7시 55분보다 먼저 8시 55분이 있었다는 것만 다를 뿐."]];
const $=id=>document.getElementById(id);
const KEY='if25-progress';
const steps=STORY.filter(s=>s[0]!=='H').length;
let pos=0,shown=0;   // pos: STORY 인덱스, shown: 보여 준 장면 수(제목 제외)

(()=>{const c=$('heart').getContext('2d'),m=['.##.##.','#######','#######','.#####.','..###..','...#...'];
  c.fillStyle='#fff';m.forEach((r,y)=>[...r].forEach((ch,x)=>ch==='#'&&c.fillRect(x,y,1,1)));})();

function build(s){
  const k=s[0],t=s[1];
  if(k==='H'){const e=document.createElement('div');e.className='chap';e.textContent=t;const c=null;if(c){const a=document.createElement('a');a.className='carol';a.target='_blank';a.rel='noopener';a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(CAROL[c][1]);const ct=CAROL[c][0].replace(/ · (\d장까지|끝까지)$/,'');a.onclick=function(ev){if(window.bgmPlay){ev.preventDefault();window.bgmPlay(CAROLID[c],ct);}};a.textContent='♪ '+CAROL[c][0];e.appendChild(document.createElement('br'));e.appendChild(a);}return e;}
  if(k==='N'){const e=document.createElement('div');e.className='nar';e.textContent=t;return e;}
  const who=k==='L'?'me':({K:'k',M:'m',O:'o',D:'d',R:'r',G:'g',U:'u'}[k]||'p'),e=document.createElement('div');
  e.className='msg'+(who==='me'?' me':'');
  const img=new Image();img.className='av';img.alt='';img.src=AV[who];
  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}
  ui();
}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='정말요?';setTimeout(()=>{armed=false;$('reset').textContent='처음부터';},2500);return;}
  armed=false;$('reset').textContent='처음부터';
  pos=0;shown=0;
  $('panel').replaceChildren();
  const c=document.createElement('div');c.className='cover';c.id='cover';
  c.innerHTML='<b>IF · 스물다섯</b><span>만약 둘이 스물다섯에 만났다면.<br>열람실, 흑? 분홍?, 그리고 8시 55분.<br><br>아래 <strong>시작</strong>을 누르면 이야기가 시작돼요.</span>';
  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
