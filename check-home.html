<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동거 생활 체크리스트</title>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}*{box-sizing:border-box}</style>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Cinzel:wght@400;600&display=swap">
<style>
/* Layout: three checklist sheets (집 / 습관 A / 습관 B); chips for options, two check columns for 루카·그 */
:root{
  --paper:#17110c; --sheet:#21180f; --ink:#ece2cd; --muted:#a39580; --rule:rgba(196,166,118,.26);
  --navy:#d4b27a; --red:#d9826a; --navySoft:rgba(212,178,122,.13); --redSoft:rgba(217,130,106,.15); --onAcc:#17110c;
  --acc:var(--navy); --accSoft:var(--navySoft);
  --f-display:"Nanum Myeongjo","Noto Serif KR",serif;
  --f-body:"Nanum Myeongjo","Noto Serif KR",serif;
  --f-mono:"Cinzel","Times New Roman",serif;
  color-scheme:dark;
}
body{background:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(214,180,120,.12),transparent 70%) no-repeat var(--paper)!important}
.back{display:inline-block;align-self:flex-start;padding:4px 14px;border:1px solid rgba(196,166,118,.5);border-radius:20px;color:#e6d6b2;font:700 13px/1.4 "Nanum Myeongjo",serif;text-decoration:none}
.back:hover,.back:focus-visible{background:rgba(196,166,118,.15);outline:none}
.card{box-shadow:0 0 0 5px rgba(196,166,118,.04),0 20px 40px rgba(0,0,0,.35)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--muted)}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,5vw,2rem);margin:2px 0 0;text-wrap:balance}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;font-weight:600;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg-l i{background:var(--navy)} .lg-h i{background:var(--red)} .lg-s i{background:var(--ink)}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:20px clamp(16px,4vw,30px)}
.card>h2{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0 0 4px}
.card>p{margin:0 0 12px;color:var(--muted);font-size:.85rem}
h3{font-family:var(--f-body);font-size:.78rem;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:16px 0 4px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}

.opt{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:center}
.opt .k{font-size:.85rem;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{font-size:.85rem;padding:3px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--sheet);font-weight:600}
.who{display:flex;flex-direction:column;gap:5px;min-width:0}
.who .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .tag{font-family:var(--f-mono);font-size:.68rem;width:28px;flex:none}
.tag.l{color:var(--navy)} .tag.h{color:var(--red)}
.chip.l.on{background:var(--navy);border-color:var(--navy);color:var(--onAcc)}
.chip.h.on{background:var(--red);border-color:var(--red);color:var(--onAcc)}

.chk{display:grid;grid-template-columns:1fr 44px 44px;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:center}
.chk.hd{border-bottom:1.5px solid var(--ink);padding-top:14px}
.chk.hd span{font-family:var(--f-display);font-weight:800;text-align:center;font-size:.95rem}
.chk.hd .l{color:var(--navy)} .chk.hd .h{color:var(--red)}
.chk .s{font-size:.9rem;min-width:0}
.box{width:20px;height:20px;border:1.5px solid var(--rule);border-radius:4px;justify-self:center;display:grid;place-items:center;font-size:.8rem;line-height:1}
.box.l.on{background:var(--navy);border-color:var(--navy);color:var(--onAcc)}
.box.h.on{background:var(--red);border-color:var(--red);color:var(--onAcc)}

footer{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
@media (max-width:560px){.opt{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <a class="back" href="index.html#ledger">← 목록으로</a>
  <header>
    <div class="mono">세계관 B · 이런 거까지… 알아야겠어?</div>
    <h1>동거 생활 체크리스트</h1>
    <div class="legend"><span class="lg-s"><i></i>집</span><span class="lg-l"><i></i>루카</span><span class="lg-h"><i></i>그</span></div>
  </header>
  <section class="card" id="house"><h2>구조</h2><p>낱낱이 파헤치는 집</p></section>
  <section class="card" id="habA"><h2>개인 습관 A</h2><p>해당하면 체크</p></section>
  <section class="card" id="habB"><h2>개인 습관 B</h2><p>각자 하나씩</p></section>
  <footer><span>원본 체크리스트 · @pattapattamaam</span><span>항목 이름은 원본을 따라 옮겼어요</span></footer>
</div>

<script>
/* 구조: [제목, [[항목명, [옵션...], [선택 인덱스...]], ...]] */
const H=[
 ["집",[

  ["이동",["엘리베이터","계단","그 외"],[1]],
  ["층",["3층","반지하","옥탑방"],[0]],
  ["방",["방 2개","원룸","복층"],[0]],
  ["잠자리",["침대 2개 이상","침대 1개","이부자리"],[1]],
  ["욕실",["욕실 2개 이상","욕실 1개","욕실 없음"],[1]],
  ["그 외 공간",["베란다","창고","다락방"],[1]]
 ]],
 ["거실",[
  ["물건",["필요한 것만","점점 늘어남","잘못 사 옴"],[1]],
  ["",["쇼파","TV","게임기"],[0]],
  ["",["방석","스피커","롤스크린"],[]],
  ["",["커튼","탁자","의자"],[0,1,2]],
  ["",["가습기","화분","러그"],[0,2]],
  ["",["간접 조명","서랍장","액자"],[0,1,2]],
  ["",["이불","상패","인형"],[0]]
 ]],
 ["부엌",[
  ["",["냉장고","식기세척기","에어프라이어"],[0]],
  ["",["오븐","전자레인지","밥솥"],[0,1]],
  ["",["가스레인지","인덕션","커피 머신"],[0]],
  ["",["고무장갑","앞치마","화분"],[0,1]]
 ]],
 ["냉장고",[
  ["",["비어있음","물","과채류"],[1,2]],
  ["",["신선육","레토르트","먹다 남은 음식"],[0,2]],
  ["",["장류","김치","음료"],[2]],
  ["",["영양제","채소즙","정체를 알 수 없음"],[]]
 ]],
 ["욕실",[
  ["",["샤워실","슬리퍼","욕조"],[0,1,2]],
  ["",["샤워가운","칫솔컵","오리"],[1]]
 ]],
 ["방",[
  ["",["암막 커튼","커튼","블라인드"],[0]],
  ["",["침대","이부자리","의자"],[0,2]],
  ["",["컴퓨터","노트북","탭(패드)"],[1]],
  ["",["협탁","탁자","서랍장"],[0,2]],
  ["옷",["리빙박스","옷장","행거"],[1]],
  ["문구",["책","문제집","만화책"],[0]],
  ["",["사진","액자","포스터"],[1]],
  ["음악",["비디오, CD","기타","드럼"],[]],
  ["",["마이크","헤드셋","라디오"],[]],
  ["스포츠",["농구공","축구공","야구배트"],[]],
  ["기타",["러그","슬리퍼","가습기"],[0,1,2]],
  ["",["화분","쿠션","담요"],[1,2]],
  ["",["양초","간접 조명","게임기"],[1]],
  ["",["인형","피규어","텀블러"],[]],
  ["",["달력","간식","쓰레기"],[0,1]]
 ]],
 ["야외 (베란다, 옥상)",[
  ["",["관상용 식물","재배용 식물","빨랫줄"],[]],

 ]],
 ["창고, 다락방",[

];
/* 습관 A: 선택형 [항목, 옵션, 루카, 그] / 체크형 [문장, 루카, 그] */
const A1=[
 ["인사 (다녀올게 · 다녀왔어)",["인사 꼭 함","사람 있을 때만","인사 안 함"],0,0],
 ["인사 받기",["얼굴 보고","목소리로만","무시"],1,0]
];
const A2=[
 ["생활",[
  ["상대의 귀가를 기다린다",1,1],["상대를 배웅한다",1,1],["주로 장을 본다",0,1],["주로 요리를 한다",0,1],
  ["주로 냉장고를 채운다",0,1],["주로 요리를 먹는다",1,0],["요리보다 배달을 시킨다",0,0],["요리보다 나가서 먹는다",0,0],
  ["밥은 가능한 같이 먹어야 한다",1,1],["먹고 바로 설거지를 한다",1,0],["설거지는 한 번에 몰아서 한다",0,1],["설거지할 때 고무장갑을 낀다",1,0]
 ]],
 ["잠과 옷",[
  ["잘 때는 파자마를 입는다",1,0],["잠귀가 밝다",1,0],["더 일찍 잠이 든다",0,1],["더 늦게 일어난다",0,1],
  ["발소리를 내는 편이다",0,1],["일어나서 이불 정리를 한다",1,0],["잘 때 간접 조명을 켜 둔다",0,0],["잘 때 모든 빛을 차단한다",1,0],
  ["외출복으로는 침대에 눕지 않는다",1,0],["필요할 때 바로 침대에 눕는다",0,1],["입은 옷을 바로 정리한다",1,0],["입은 옷을 던져 둔다",0,1],
  ["혼자 있는 시간을 좋아한다",1,0]
 ]],
 ["온도와 욕실",[
  ["추우면 겉옷을 입는다",1,1],["추우면 보일러를 튼다",1,0],["더울 땐 일단 선풍기를 튼다",0,1],["더울 땐 일단 에어컨을 튼다",0,0],
  ["씻는 시간이 길다",0,1],["욕실 슬리퍼를 신는다",1,0],["머리를 자연 건조한다",1,0],["머리는 드라이기로 말린다",0,1]
 ]],
 ["청소와 주말",[
  ["청소는 틈틈이 매일 한다",1,0],["청소는 날 잡고 한 번에 한다",0,1],["나는 분리수거를 한다",0,1],["나는 빨래를 한다",1,0],
  ["나는 욕실 청소를 한다",1,0],["나는 바닥 청소를 한다",1,1],["나는 에어컨 청소를 한다",0,0],["나는 전구 교체를 한다",0,1],
  ["좀 더 큰 방을 사용한다",0,1],["주말에는 함께 시간을 보내는 게 좋다",1,1],["주말에도 각자 시간을 보내는 게 좋다",0,0],

 ]]

 ["부엌",[

  ["식사량",["많이 먹음","평균","적게 먹음"],2,0],
  ["꼭 먹어야 하는 식사",["아침","점심","저녁"],0,2],

  ["제품",["아무거나 사용","올인원","향, 브랜드 따짐"],1,0],

  ["세안",["양치모 엉망","양치컵 사용","아저씨 세수"],1,2],
  ["샤워",["샤워 짧게","샤워 길게","탕 목욕"],0,1],

  ["",["비어있음","복잡함","화려함"],0,1],
