<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>new take#6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
:root{
  --desk:#173a2a; --ink:#141012; --pink:#c8102e; --pink-soft:#d9eedc;
  --face:#e6dccb; --hi:#ffffff; --lo:#8c7b69; --paper:#fbf7ef;
  --gold:#e3c26f; --pine:#1e6b3a; --deep:#7f0a1d;
  --display:"Noto Serif KR","Times New Roman",serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{color:#fff7e8;font-family:var(--display);font-weight:900;font-size:clamp(28px,8vw,38px);letter-spacing:-.5px;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--gold);margin-top:6px}

.win{background:var(--face);padding:3px;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #f3ecdf}
.bar{background:var(--pink);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 8px;font-weight:800;font-size:15px;text-shadow:1px 1px 0 var(--deep);background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.10) 10px 20px);border-bottom:3px solid var(--gold)}
.bar .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:16px;height:14px;flex:none;image-rendering:pixelated}
.wbtn{width:20px;height:18px;background:var(--face);color:var(--ink);font:700 11px/16px var(--body);text-align:center;text-shadow:none;
  box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.menu{display:flex;gap:14px;font-size:13px;padding:4px 8px 3px}
.menu u{text-decoration:none;border-bottom:1px solid currentColor}
.panel{margin:2px 4px 4px;background:var(--paper);height:min(64vh,540px);min-height:320px;overflow-y:auto;overscroll-behavior:contain;
  padding:14px 10px 18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
  box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi),inset 3px 3px 0 var(--ink)}
.cover{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;padding:10px}
.cover b{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-1px}
.cover span{font-size:13px;color:#5c5456;line-height:1.6}
.chap{align-self:center;font-weight:800;font-size:12px;padding:3px 12px;background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--deep);
  box-shadow:inset -1px -1px 0 var(--deep),inset 1px 1px 0 #ff8a98,0 0 0 2px var(--gold);margin-top:6px}
.nar{align-self:stretch;background:#f3ece0;border:1px dashed #b9a78f;padding:8px 10px;font-size:13px;line-height:1.55;color:#4b4244;text-align:center;word-break:keep-all}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:100%;animation:pop .2s ease-out}
.msg.me{flex-direction:row-reverse}
.av{width:44px;height:44px;flex:none;border:2px solid var(--ink);background:#fff;object-fit:cover;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:74%}
.me .col{align-items:flex-end}
.name{font-size:12px;font-weight:800}
.bub{padding:8px 11px;border:2px solid var(--ink);background:#fff;font-size:14.5px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;box-shadow:3px 3px 0 var(--ink)}
.me .bub{background:var(--pink-soft)}
.nar,.chap{animation:pop .2s ease-out}
.input{display:flex;gap:6px;margin:0 4px 4px}
.field{flex:1;min-width:0;background:#fff;font-size:13px;color:#9a9294;padding:7px 8px;box-shadow:inset 2px 2px 0 var(--lo),inset -2px -2px 0 var(--hi)}
.send{font-size:13px;font-weight:800;padding:0 12px;display:flex;align-items:center;box-shadow:inset -1px -1px 0 var(--ink),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo)}
.status{display:flex;gap:4px;margin:0 4px 1px;font-size:11px}
.status span{padding:2px 6px;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st1{flex:1}#st2{min-width:96px;text-align:right}
.ctrl{display:flex;gap:10px}
.btn{flex:1;padding:13px 8px;background:var(--face);border:0;font:800 16px var(--body);color:var(--ink);cursor:pointer;
  box-shadow:inset -2px -2px 0 var(--ink),inset 2px 2px 0 var(--hi),inset -4px -4px 0 var(--lo),inset 4px 4px 0 #f3ecdf}
.btn:active{box-shadow:inset 2px 2px 0 var(--ink),inset -2px -2px 0 var(--hi),inset 4px 4px 0 var(--lo)}
.btn.main{flex:2;background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--deep);background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.10) 10px 20px);border-bottom:3px solid var(--gold)}
.btn:disabled{color:#8a8484;text-shadow:none;cursor:default}
.btn.main:disabled{background:#d99aa3}
.btn:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
.hint{font-size:12px;color:#cfe0d2;margin:0;text-align:center}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.msg,.nar,.chap{animation:none}.panel{scroll-behavior:auto}}
.carol{display:inline-block;margin-top:6px;padding:3px 10px;border:2px solid #333;background:var(--pine);color:#fff;font-size:12px;text-decoration:none;font-weight:700;border-radius:2px}.carol:active{transform:translateY(1px)}#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.wrap{position:relative;z-index:1}</style>

, ["P", "ㅎㅎ 작업실에서 좀 오래 있었어요."], ["N", "루카스는 대답하지 않았다. 대신 그의 코트를 보았다. 소파 팔걸이에 걸쳐진 검은 코트. 그 위에 주황색 털이 붙어 있었다. 길이 2센티미터. 끝이 살짝 말린 것."], ["N", "루카스는 그 털을 알았다. 매일 아침 복원실 입구에서 요나스의 스웨터에 테이프 롤러를 굴리며 떼어 내는 털이었다. 코덱스의 털."], ["N", "작업실에는 고양이가 없었다."], ["L", "......"], ["P", "루카? 왜요?"], ["L", "아무 일도 없어."], ["N", "그는 그 말을 들었다. 그리고 루카스의 목소리가 아주 조금 더 정확해졌다는 것도 들었다."], ["N", "하지만 그는 그 순간 다른 것을 보고 있었다. 책을 쥔 루카스의 손끝. 붉게 짓눌린 작은 자국들. 검지와 엄지에 하나씩, 둘씩."], ["N", "그는 그 자국을 알지 못했다. 그래서 가장 나쁜 쪽으로 생각했다. 손목이었다. 나사가 박힌 그 손목이 또 아픈데, 루카스가 말을 안 하는 거라고."], ["N", "그날 밤, 두 사람은 같은 침대에 누워 서로 다른 걱정을 했다."], ["N", "루카스는 생각했다. 요나스의 집. 매일 저녁. 고양이 털. 그리고 그가 요즘 뭔가를 숨기고 있다는 것."], ["N", "그는 생각했다. 손끝. 자국. 그리고 루카스가 요즘 뭔가를 숨기고 있다는 것."], ["N", "새벽 두 시. 루카스가 잠든 걸 확인한 그는 아주 조심스럽게 루카스의 오른손을 들어 올렸다. 창밖 가로등 불빛에 손가락을 하나하나 비춰 보았다."], ["N", "새벽 세 시. 그가 잠든 걸 확인한 루카스는 아주 조심스럽게 그의 코트 주머니를 뒤졌다. 나온 건 영수증 한 장이었다. 고양이 사료. 2.49유로."], ["N", "둘 다 서로가 그러는 걸 몰랐다."], ["N", "12월 10일. 루카스는 반쪽을 하나 더 들었다."], ["N", "저녁 아홉 시. '습도계를 사러 간다'며 집을 나선 루카스는 요나스의 자취방 건물 앞을 지나갔다. 하이델베르크의 습도계 가게는 그 방향이 아니었다."], ["N", "2층 창문이 조금 열려 있었다. 거기서 그의 목소리가 흘러나왔다."], ["P", "...루카한테는 절대 말하면 안 돼요. 24일까지만요. ㅎㅎ 그날 다 알게 될 거예요."], ["N", "루카스는 그 자리에 섰다. 반쪽짜리 문장이 머릿속에서 판결문으로 바뀌는 데 3초가 걸렸다."], ["N", "24일. 다 알게 된다. 요나스. 비밀. 사람들."], ["N", "파티였다."], ["N", "깜짝 파티. 사람이 많고, 시끄럽고, 누군가 사진을 찍고, 누군가 '서프라이즈!'라고 소리를 지르는 것. 루카스가 이 세상에서 세 번째로 싫어하는 것이었다. 첫 번째는 시선이고 두 번째는 카메라였다. 깜짝 파티에는 그 셋이 다 있었다."], ["H", "4장. 지하 3층"], ["N", "12월 11일, 아침 여덟 시 반. 복원실."], ["N", "루카스는 요나스의 작업대 앞에 섰다. 테이프 롤러를 들고. 요나스는 반사적으로 스웨터를 내밀었다."], ["L", "요나스."], ["M", "네, 선배님."], ["L", "24일 저녁에 몇 명 와."], ["M", "......네?"], ["L", "숫자만 말해."], ["M", "아무도 안 와요!"], ["L", "다섯? 열?"], ["M", "진짜 아무도요!"], ["N", "루카스는 롤러를 한 번 굴렸다. 주황색 털이 한 줄 딸려 나왔다."], ["L", "지하 3층."], ["M", "선배님!!"], ["L", "19세기 교구 기록. 곰팡이 상자 일곱 개."], ["N", "요나스는 지하 3층으로 내려갔다. 그날도, 그다음 날도. 마스크를 쓰고 붓으로 포자를 털어 내면서 요나스는 생각했다. 말하면 안 된다. 선배님 비밀도, 선배님 남편 비밀도. 둘 다 맹세했다. 오른손으로."], ["N", "그런데 그날 오후에는 그가 복원실에 왔다. 도시락을 들고. 루카스가 회의에 간 사이 그는 지하 3층까지 요나스를 찾아 내려왔다."], ["P", "요나스. 루카 손목 괜찮아요?"], ["M", "......네?"], ["P", "요즘 손끝이 빨개요. 자국이 있어요. 혹시 복원실에서 무리하는 거 아니에요?"], ["M", "그, 그건...... 아니, 손목은 괜찮아요! 손목은 완전히! 손끝은 그게..."], ["P", "손끝은 뭐요?"], ["M", "......곰팡이요."], ["P", "곰팡이요?!"], ["M", "아니요! 곰팡이 아니에요! 손끝은 진짜 괜찮아요! 선배님은 완전히, 백 퍼센트, 대부분 괜찮아요!"], ["P", "대부분이요?"], ["N", "요나스는 마스크 안에서 울고 싶었다."], ["N", "12월 13일. 요나스가 지하 3층에 내려간 지 사흘째 되는 날, 엘제 선생님이 루카스의 작업대 앞에 섰다."], ["O", "루카스."], ["L", "네."], ["O", "요나스 그만 내려보내."], ["L", "......숫자를 안 말합니다."], ["O", "말할 숫자가 없으니까."], ["L", "......"], ["O", "걔 지금 비밀을 두 개 들고 있어."], ["N", "루카스가 고개를 들었다."], ["L", "...두 개."], ["O", "하나는 네 거잖아. 곰팡이 상자에 든 거."], ["L", "......그럼 다른 하나는."], ["O", "그건 네 남편 거고."], ["N", "엘제 선생님은 돌아서서 자기 작업대로 갔다. 가다가 한 번 멈췄다. 돌아보지는 않았다."], ["O", "저녁마다 요나스네서 노래 소리가 난다더라. 옆집 사람이 우리 도서관 열람실 사서야. 독일어 발음이 엉망인데 목소리는 좋대."], ["N", "루카스는 오래 앉아 있었다. 귀 끝이 천천히 붉어졌다. 목덜미까지."], ["L", "......또 반쪽이었네."], ["N", "그날 오후 요나스는 지하 3층에서 올라왔다. 작업대 위에 따뜻한 감자 수프 한 통이 놓여 있었다. 뚜껑에 루카스의 글씨로 쪽지가 붙어 있었다. '미안. 바닥은 조금 탔어.'"], ["N", "요나스는 그것을 다 먹었다. 탄 데까지."], ["H", "5장. 다나 상륙"], ["N", "12월 20일. 하이델베르크 중앙역."], ["N", "다나 쿠퍼가 도착했다. 은발, 하이힐, 그리고 캐리어 세 개. 그중 두 개가 선물이었다."], ["D", "메리 크리스마스! 루카! 아, 아니지. 독일이니까 프로헤... 프로헤 뭐였지?"], ["L", "Frohe Weihnachten."], ["D", "그거! 루카, 살 빠졌어요? 아니다, 요나스가 빠졌네. 요나스, 너 왜 이렇게 핼쑥해?"], ["M", "......비밀을 두 개 들고 있으면 살이 빠져요."], ["D", "응?"], ["L", "요나스."], ["M", "아무것도 아니에요!"], ["N", "다나가 이 상황을 파악하는 데는 정확히 한 시간이 걸렸다."], ["N", "저녁 식사 자리였다. 그가 화장실에 간 사이 루카스가 휴대폰으로 장갑 사이즈를 검색하는 걸 다나가 보았다. 루카스가 계산하러 간 사이 그가 휴대폰으로 'Stille Nacht 발음'을 검색하는 걸 다나가 보았다."], ["N", "다나는 와인을 한 모금 마셨다. 그리고 요나스를 보았다. 요나스는 다나를 보았다. 둘 사이에 긴 침묵이 흘렀다."], ["D", "......너 진짜 고생했구나."], ["M", "네."], ["N", "그리고 다나는 그 뒤로 세 번이나 비밀을 터뜨릴 뻔했다."], ["D", "그래서 루카, 크리스마스 선물은 장—"], ["N", "요나스가 탁자 밑에서 다나의 발을 찼다."], ["D", "아야! 아, 장... 장, 장보기! 장보기는 다 했어요?"], ["N", "10분 뒤."], ["D", "그건 그렇고 너 요즘 노—"], ["N", "요나스가 반대쪽에서 다시 찼다."], ["D", "노...... 노을! 하이델베르크 노을 예쁘지!"], ["P", "ㅎㅎ 다나, 지금 밤 아홉 시예요."], ["D", "요나스, 왜 자꾸 차!"], ["M", "다리에 쥐가 나서요!"], ["N", "루카스는 아무 말도 하지 않았다. 그는 아무것도 눈치채지 못한 얼굴로 감자를 먹었다. 둘 다 연기가 서툴렀다. 그리고 둘 다 상대가 서툰 건 눈치채지 못했다."], ["N", "12월 22일. 일이 터졌다."], ["N", "그가 감기에 걸렸다. 요나스의 옆집 사람이 또 벽을 두드리는 바람에 창문을 열고 노래 연습을 한 탓이었다. 12월 하이델베르크의 밤바람이 그대로 들어왔다."], ["P", "...루카, 저 괜찮아요. 콜록."], ["L", "안 괜찮아."], ["P", "목소리만 조금...... 콜록."], ["N", "루카스는 습도계부터 보았다. 침실 습도 42퍼센트. 가습기 눈금을 두 칸 올렸다. 그다음 체온계를 가져왔다. 그다음 감자 수프를 끓였다. 바닥은 조금 탔다."], ["N", "그날 밤 루카스는 그가 잠들 때까지 침대 옆 의자에 앉아 있었다. 두 걸음 떨어진 그 거리였다. 그리고 그가 잠든 뒤, 거실 불을 하나만 켜고 곰팡이 상자를 열었다."], ["N", "오른쪽 장갑은 다 떠 두었다. 왼쪽 장갑은 손등까지 떴다. 이틀 남았다."], ["N", "루카스는 새벽 네 시까지 떴다. 하품을 참으며. 손가락 구멍을 하나 뜨고, 하나 더 뜨고, 하나 더."], ["N", "새벽 네 시의 루카스는 정확하지 않았다. 그것을 루카스만 몰랐다."], ["H", "6장. 저녁 일곱 시 오십오 분"], ["N", "12월 24일. 크리스마스이브."], ["N", "아침에 그가 쪽지를 남겼다. 탁자 위, 습도계 옆에. 목소리가 아직 갈라져서 말 대신 쓴 것이었다."], ["N", "'오늘 저녁 일곱 시 오십오 분. 다리. 아침 말고 저녁이에요. ㅎㅎ'"], ["N", "루카스는 그 쪽지를 오래 보았다. 그리고 공책 사이에 끼웠다."], ["N", "저녁 일곱 시 사십 분. 마르크트플라츠의 크리스마스 시장을 지나 다리로 가는 길."], ["N", "시장은 2년 전과 같았다. 글뤼바인 냄새, 구운 아몬드 냄새, 사람들. 그리고 구석의 작은 판화 노점. 폭스링을 열두 개 팔았던 그 노점이었다. 판화가 노인이 루카스를 알아보았다."], ["N", "노인은 아무 말 없이 판화 하나를 내밀었다. 다리 위에 서 있는 두 사람. 하나는 아주 크고, 하나는 조금 작았다. 큰 쪽의 머리카락만 붉은색이었다."], ["L", "......이건."], ["N", "노인은 어깨를 으쓱했다. 작년 겨울, 다리 위에서 보았다는 뜻이었다. 루카스는 지갑을 꺼냈다. 노인은 고개를 저었다. 루카스는 판화를 코트 안주머니에 넣었다. 선물 상자 옆에."], ["N", "선물 상자는 무산성 중성지로 포장되어 있었다. 복원실에서 고문서를 쌀 때 쓰는 종이였다. 리본 대신 제본용 아마실을 감았다. 세 가닥으로 땋아서."], ["N", "저녁 일곱 시 오십삼 분. 다리 한가운데."], ["N", "가로등 아래 그가 서 있었다. 이젤은 없었다. 코트 깃을 세우고, 땋은 머리를 등 뒤로 늘어뜨리고. 맨손이었다. 붉게 튼 그 손이었다."], ["N", "다리 남쪽 탑 앞, 다리 원숭이 청동상 뒤에 그림자 두 개가 숨어 있었다. 하나는 은발에 하이힐이었고, 하나는 주황색 털이 묻은 스웨터를 입고 있었다. 둘 다 숨는 데 소질이 없었다."], ["D", "(속삭임) 요나스, 내 발 밟았어."], ["M", "(속삭임) 다나 씨가 제 목도리 밟았어요."], ["N", "루카스는 그들을 보았다. 그는 보지 못했다. 루카스는 못 본 척했다."], ["P", "루카."], ["L", "...목소리."], ["P", "ㅎㅎ 반쯤 돌아왔어요. 반만 들어 줘요."], ["L", "......"], ["P", "제가 먼저 할게요. 선물."], ["N", "그가 숨을 들이켰다. 차가운 공기가 들어가 기침이 날 뻔했다. 참았다. 그리고 노래를 시작했다."], ["P", "Stille Nacht, heilige Nacht..."], ["N", "목소리가 갈라졌다. '하일리게'에서. 그는 웃지 않았다. 멈추지도 않았다."], ["P", "Alles schläft, einsam wacht..."], ["N", "발음은 엉망이었다. '나흐트'는 너무 긁혔고, '바흐트'는 너무 부드러웠다. 요나스가 원숭이 동상 뒤에서 눈을 꼭 감았다. 그 발음을 고치는 데 3주를 썼다. 다 고치지 못했다."], ["N", "그런데 목소리가 낮았다. 요나스의 자취방에서 옆집 때문에 낮추었던 그 목소리였다. 크게 부를 때보다 훨씬 좋았던 그 목소리."], ["N", "루카스는 움직이지 않았다. 숨도 쉬지 않는 것 같았다."], ["N", "1절이 끝났다. 그가 숨을 골랐다. 목이 아파서 2절은 무리였다."], ["P", "......여기까지예요. 2절은 내년에요."], ["N", "그리고 그 순간, 루카스가 입을 열었다."], ["L", "......'하일리게'."], ["P", "네?"], ["L", "'ㅎ'은 약하게. 숨처럼."], ["P", "ㅎㅎ 지금 발음 지적해요?"], ["L", "하일리게."], ["P", "하일리게."], ["L", "......응."], ["N", "그다음에 루카스가 한 일은 아무도 예상하지 못했다. 그도, 요나스도, 다나도."], ["N", "루카스가 2절을 불렀다."], ["N", "작게. 그에게만 들리게. 정확한 발음으로. 열아홉 살에 교회 성가대를 그만둔 뒤로 한 번도 부르지 않은 노래였다. 루카스의 목소리는 그보다 높고 가늘었다. 그리고 떨렸다."], ["N", "그는 노래를 들으며 가만히 서 있었다. 눈이 내리기 시작했다. 땋은 머리 위에, 루카스의 검은 머리 위에. 원숭이 동상 뒤에서 다나가 코를 크게 풀었다. 요나스가 다나의 입을 막았다."], ["N", "2절이 끝났다. 루카스는 그를 보지 않았다. 귀 끝이 이미 목덜미까지 붉었다."], ["L", "......2절은 내 거야. 내년에도."], ["P", "......"], ["L", "그러니까 1절만 연습해."], ["N", "그는 대답하지 못했다. 그래서 웃었다. 웃으면서 눈가가 붉어졌다."], ["H", "7장. 대부분은 장갑"], ["L", "......내 차례."], ["N", "루카스가 코트 안주머니에서 상자를 꺼냈다. 무산성 중성지. 세 갈래로 땋은 아마실 리본."], ["P", "ㅎㅎ 포장이 고문서 같아요."], ["L", "습기 차면 안 되니까."], ["N", "그가 리본을 풀었다. 종이를 펼쳤다. 그 안에 남색 털실 장갑 한 켤레가 있었다. 손가락 끝이 터 있는 장갑이었다."], ["N", "그가 장갑을 들어 올렸다. 오른쪽 장갑은 완벽했다. 코 하나하나의 크기가 같았고, 손가락 구멍 다섯 개가 정확한 간격으로 나 있었다."], ["N", "왼쪽 장갑은 조금 달랐다. 손목 쪽은 너무 단단했고, 손등 쪽은 갑자기 느슨해졌다가 다시 단단해졌다. 그리고 손가락 구멍이 여섯 개였다."], ["P", "......"], ["L", "......"], ["N", "그가 왼쪽 장갑을 꼈다. 손가락 다섯 개가 각자 구멍을 찾아 들어갔다. 새끼손가락 옆에 구멍 하나가 남았다. 텅 빈 채로."], ["P", "......루카."], ["L", "......새벽 네 시에 떴어."], ["P", "ㅎㅎ 하나 남아요."], ["L", "......대부분은 장갑이야."], ["N", "원숭이 동상 뒤에서 요나스가 무릎을 꿇었다. 그 여섯 번째 구멍을 3주 동안 걱정했다. 선배님 손이 피곤해 보이던 그 새벽에 말렸어야 했다."], ["N", "그는 장갑 낀 손을 한참 들여다보았다. 그러다 코트 주머니에 손을 넣었다. 그가 늘 가지고 다니는 것이 있었다. 몽당 붓 한 자루."], ["N", "그는 붓을 여섯 번째 구멍에 꽂았다. 딱 맞았다."], ["P", "전부 장갑이에요. 붓꽂이까지 있는."], ["L", "......그건 의도한 거야."], ["P", "ㅎㅎ 정말요?"], ["L", "......아니."], ["N", "그가 웃음을 터뜨렸다. 목이 아파서 기침이 섞였다. 루카스가 미간을 찌푸리며 자기 목도리를 풀어 그의 목에 감았다. 그 큰 사람의 목에 루카스의 목도리는 한 바퀴밖에 감기지 않았다."], ["P", "루카. 손 봐도 돼요?"], ["L", ".. const KEY='new take6-progress';
const steps=STORY.filter(s=>s[0]!=='H').length;

function build(s){

  if(k==='N'){const e=document.createElement('div');e.className='nar';e.textContent=t;return e;}
  const who=k==='L'?'me':({K:'k',M:'m',O:'o',D:'d',R:'r',G:'g',U:'u'}[k]||'p'),e=document.createElement('div');

  const col=document.createElement('div');col.className='col';
  const nm=document.createElement('div');nm.className='name';nm.textContent=NAME[who];
  const b=document.createElement('div');b.className='bub';b.textContent=t;
  col.append(nm,b);e.append(img,col);return e;
}
function ui(){
  $('st2').textContent=shown+' / '+steps;
  const done=shown>=steps;
  $('next').textContent=shown===0?'시작':(done?'끝':'다음');
  $('next').disabled=done;
  $('reset').disabled=shown===0;
  $('hint').textContent=done?'끝까지 읽었어요. 위로 스크롤해서 다시 볼 수 있어요.':'버튼을 누를 때마다 한 장면씩 나와요. 끝까지 보면 위로 스크롤해서 다시 볼 수 있어요.';
}
function addOne(smooth){
  const p=$('panel');
  if(pos===0)$('cover').remove();
  while(pos<STORY.length){
    const s=STORY[pos++];
    p.append(build(s));
    if(s[0]!=='H'){shown++;break;}   // 장 제목은 다음 장면과 함께 나옴
  }
  p.scrollTo({top:p.scrollHeight,behavior:smooth?'smooth':'auto'});
  try{localStorage.setItem(KEY,String(shown));}catch(e){}

}
$('next').onclick=()=>{ if(shown<steps) addOne(true); };
let armed=false;

  $('panel').append(c);
  try{localStorage.removeItem(KEY);}catch(e){}
  ui();
};
document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter'||e.key==='ArrowRight')&&document.activeElement===document.body&&!$('next').disabled){e.preventDefault();$('next').click();}
});
// 이어 보기
(()=>{let n=0;try{n=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  if(n>0){while(shown<Math.min(n,steps))addOne(false);$('panel').scrollTop=$('panel').scrollHeight;}
  ui();})();
</script>
