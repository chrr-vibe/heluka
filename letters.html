<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>루카스의 편지 61통</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;800&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the walnut box. 61 envelopes in a grid on top, the opened letter laid on paper below. */
:root{
  color-scheme:dark;
  --wall:#1c1512; --wall-2:#251c18; --walnut:#3b2a1f; --walnut-hi:#5a4130;
  --paper:#f2e9da; --ink:#2b211b; --ink-soft:#6d5d50;
  --muted:#a9998a; --line:#4a3a30; --gold:#c9a15a; --crimson:#b43a2f;
  --display:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--wall);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 56px;display:grid;gap:28px}
.back{justify-self:start;font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.back:hover{color:var(--gold)}
header{display:grid;gap:8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,44px);line-height:1.2;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:15px;max-width:38em}

.box{background:linear-gradient(160deg,var(--walnut-hi),var(--walnut) 40%,#2a1d15);padding:14px;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,220,160,.12)}
.box-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:#d9c3a3;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.env{appearance:none;border:0;cursor:pointer;aspect-ratio:4/3;background:#e6d8c2;color:var(--ink);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;position:relative;border-radius:1px;
  background-image:linear-gradient(155deg,transparent 49%,rgba(0,0,0,.10) 50%,transparent 51%),linear-gradient(25deg,transparent 49%,rgba(0,0,0,.10) 50%,transparent 51%)}
.env:hover{background-color:#fff6e6}
.env:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.env.read{background-color:#bfae95;color:#4a3d34}
.env.on{background-color:var(--crimson);color:#fff;background-image:none}
.env.last{box-shadow:inset 0 0 0 2px var(--gold)}

.letter{background:var(--paper);color:var(--ink);padding:clamp(22px,5vw,44px);box-shadow:0 18px 40px rgba(0,0,0,.5);display:grid;gap:18px;position:relative;min-height:320px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(120,90,60,.10) 33px 34px)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-soft);border-bottom:1px solid rgba(43,33,27,.18);padding-bottom:10px}
.meta b{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink)}
.body{font-size:17px;line-height:2;white-space:pre-line;min-width:0;overflow-wrap:anywhere}
.sig{justify-self:end;font-family:var(--display);font-size:18px}
.note{font-family:var(--mono);font-size:11px;color:var(--ink-soft);justify-self:end;margin-top:-10px}
.letter.final .body{font-family:var(--display);font-size:clamp(20px,4.4vw,26px);line-height:1.9;text-align:center}
.letter.final .sig{justify-self:center}

.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nav button{appearance:none;cursor:pointer;background:transparent;color:var(--paper);border:1px solid var(--line);padding:10px 14px;font-family:var(--body);font-size:15px}
.nav button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#prev{justify-self:start}#next{justify-self:end}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.letter{animation:lay .35s ease-out}}
@keyframes lay{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html#box" onclick="if(history.length>1){history.back();return false}">← 목록으로</a>
  <header>
    <div class="eyebrow">Walnut box · 1월 9일 – 3월 2일</div>
    <h1>루카스의 편지 61통</h1>
    <p class="lede">아우구스트의 편지를 다 읽은 겨울, 루카스가 두 달 동안 몰래 쓴 편지. 원래는 독일어로, 그가 못 읽는 말로 쓴 것들이에요. 1번부터 9번까지는 '루카스', 10번부터는 '루카'라고 서명했어요.</p>
  </header>

  <section class="box" aria-label="편지 상자">
    <div class="box-head"><span>호두나무 상자 · 습도 50%</span><span id="readCount">0 / 61 읽음</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <article class="letter" id="letter" aria-live="polite"></article>

  <div class="nav">
    <button id="prev" type="button">← 앞 편지</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">다음 편지 →</button>
  </div>
</div>
<script>
const LETTERS=[{"n": 1, "d": "1월 9일", "t": "너에게. 이건 첫 번째야.\n이런 걸 어떻게 쓰는지 모르겠어. 15년 동안 남의 편지만 고쳤어. 내 편지는 한 번도 안 써 봤어.\n첫 줄 쓰고 한 시간 동안 아무것도 못 썼어. 만년필 잉크가 펜촉에서 말랐어. 그래서 지금 두 번째 줄은 잉크를 다시 찍고 쓰는 거야.\n뭘 써야 할지 몰라서, 오늘은 여기까지만. 첫 번째니까.", "s": "루카스"}, {"n": 2, "d": "1월 11일", "t": "왜 쓰는지부터 말할게.\n네 어머니가 두고 간 호두나무 상자. 61통. 나는 그걸 다 소리 내서 읽었어. 아우구스트의 말을, 내 목소리로.\n다 읽고 나서 알았어. 나는 남의 말은 그렇게 오래, 그렇게 정확하게 대신 해 줄 수 있으면서, 내 말은 한 줄도 해 본 적이 없다는 거.\n그래서 써. 독일어로. 네가 못 읽는 말로. 아우구스트처럼 비겁하게. 그래도 쓰는 게 안 쓰는 것보단 나을 것 같아서.", "s": "루카스"}, {"n": 3, "d": "1월 13일", "t": "서점 얘기.\n희귀본 코너 바닥에 쪼그려 앉아 있는데 네가 모퉁이를 돌아 들어왔어. 처음 본 건 머리카락이었어. 붉은 게 바닥까지 끌리고 있었어. 먼지 묻을 텐데, 그게 첫 생각이었어.\n두 번째 생각은, 저렇게 큰 사람이 저렇게 곤란한 얼굴을 할 수도 있구나.\n\"앉으세요\"라고 한 건 숨겨 주려고 한 게 맞아. 시끄러워서 그런 거라고 했지만.\n그리고 \"다시 볼 일 없습니다.\" 그건 거짓말이었어. 그땐 몰랐지만, 지금은 알아.", "s": "루카스"}, {"n": 4, "d": "1월 15일", "t": "네가 그날 물었지. 그 책 왜 쓰다듬었냐고. 아파 보였냐고.\n그런 걸 물어본 사람은 네가 처음이었어. 다들 책은 그냥 물건이라고 생각해. 너는 아프냐고 물었어.\n그날 밤 호텔에서 그 질문이 계속 생각났어. 이상한 사람이라고 생각했어. 그리고, 정확한 사람이라고.", "s": "루카스"}, {"n": 5, "d": "1월 16일", "t": "다음 날 아침 복원실 문이 열리고 네가 들어왔을 때.\n나는 핀셋을 작업대에 평행하게 내려놨지. 너는 그게 침착해 보였을 거야.\n사실은 손이 떨려서 내려놓은 거야. 핀셋 끝이 흔들리는 게 보일까 봐.\n15년 동안 작업대 앞에서 손이 떨린 건 그때가 처음이었어. 이유는 그땐 몰랐어. 네 얼굴 보고 놀라서인 줄 알았어.", "s": "루카스"}, {"n": 6, "d": "1월 18일", "t": "손 씻으라고 한 거.\n정말 종이 때문이었어. 그건 거짓말 아니야. 90년 된 종이였어.\n그런데 네가 아무 말 없이 세면대로 가서 손목까지, 비누 두 번, 그대로 하는 걸 보고 좀 놀랐어. 유명한 사람이 그렇게 순순히 하는 거 처음 봤어. 그땐 네가 유명한 줄도 몰랐지만.\n그리고 정확히 두 걸음 떨어진 의자에 앉았지. 무릎에 손 얹고. 혼날 준비 하는 애처럼.\n그 모습이 좀 웃겼어. 웃지는 않았어.", "s": "루카스"}, {"n": 7, "d": "1월 20일", "t": "두 걸음 떨어진 의자.\n첫 사흘은 네가 거기 있는 걸 무시하려고 했어. 실패했어.\n사람이 그렇게 조용할 수 있다는 게 신경 쓰였어. 숨소리도 안 들렸어. 그런데 고개를 들면 늘 거기 있었어.\n신경 쓰였다고 했지. 맞아. 그런데 그게 싫었던 게 아니야. 좋았어. 그 말을 그때는 못 했어. 지금 써.", "s": "루카스"}, {"n": 8, "d": "1월 22일", "t": "손난로 열 개랑 털장갑.\n메모에 '쉬는 시간에만요'라고 써 있었지. 민디한테 오후까지만 두라고 했어.\n사실 민디가 나가자마자 장갑은 주머니에 넣었어. 손난로는 점심 전에 두 개 뜯었어.\n네가 오후에 와서 그걸 보고 웃음을 참던 거, 다 봤어. 의자에서 어깨가 떨리고 있었어.\n그 장갑 아직 있어. 오른쪽 엄지에 구멍 났는데, 내가 꿰맸어.", "s": "루카스"}, {"n": 9, "d": "1월 24일", "t": "스케치북 첫 장이 떨어진 날.\n다리 그림이 나왔을 때, 나는 너한테 \"이리 오십시오\"라고 했지. 두 걸음.\n일주일 동안 그 거리를 지키라고 한 건 나였는데, 그걸 깬 것도 나였어.\n그리고 7년 전에 그 다리를 매일 건넜다고 말했지. 출근길이라고.\n그날 밤 생각했어. 7년 전 그 다리 위에서 그림 그리는 붉은 머리를 내가 정말 못 봤을까. 아마 고개를 안 들었겠지. 나는 늘 그랬으니까.\n이제는 매일 아침 고개를 들어.", "s": "루카스"}, {"n": 10, "d": "1월 25일", "t": "다나 씨가 문을 열고 들어온 날.\n네가 누군지 알았을 때 나는 화난 게 아니었어. 당황했어. 그 차이는 크다고 했지.\n그리고 하나 더. 너는 숨긴 게 아니었어. 그냥 거기서 쉬고 있었던 거야. 아무도 다음 작품을 묻지 않는 방에서.\n나도 그 방이 그런 방이라서 좋았어. 아무도 나한테 말을 안 거니까.\n같은 이유로 거기 있었던 거야, 우리 둘 다.", "s": "루카"}, {"n": 11, "d": "1월 27일", "t": "요나스랑 영상통화한 날 밤.\n요나스가 내 귀가 빨갛다고 했어. 아니라고 했지.\n빨갰어. 노트북 화면에 네 그림이 떠 있었거든. 그리고 진흙 계단에 앉아서 스케치북 안고 있던 네 사진.\n그 사진 보고 처음 알았어. 네가 \"그림이야 다시 그리면 되니까\"라고 한 게 거짓말이었다는 걸.\n그 사진은 아직 내 노트북에 있어. 저장해 뒀어. 이건 말 안 할 거야. 여기만 써.", "s": "루카"}, {"n": 12, "d": "1월 29일", "t": "쉬는 손.\n\"쉬는 손만 그리라\"고 조건을 걸었지.\n사흘째부터 나는 주걱을 전보다 자주 내려놓았어. 일부러. 장갑 벗고 작업대 끝에 손을 올려놓고 오래 있었어.\n연필 소리가 끊기지 않고 오래 이어지는 게 좋았어.\n그 주에 작업 진도가 이틀 늦어졌어. 엘제 선생님한테는 종이가 까다로웠다고 했어. 종이 탓 아니었어.", "s": "루카"}, {"n": 13, "d": "1월 31일", "t": "코니아일랜드.\n항구를 찾다가 놀이공원에 간 건 정말 실수였어. 그건 믿어 줘.\n그런데 배터리 4퍼센트일 때 연락처 맨 위의 이름을 누른 건 실수가 아니었어.\n네 이름이 왜 맨 위에 있었냐면, 즐겨찾기에 넣어 놨거든. 복원실에서 연락처 받은 날 바로.\n엘제 선생님보다 위에 있어. 선생님은 이거 모르셔.", "s": "루카"}, {"n": 14, "d": "2월 3일", "t": "오늘 아침 네 셔츠 단추를 채우다가, 맨 아래 단추에서 손이 멈췄어. 떨려서가 아니야. 네가 웃어서.\n단추 하나 남았는데 왜 웃냐고 물었더니, 네가 그랬지. 루카가 채우는 거 보는 게 좋아서.\n그 말에 나는 대답 안 했어. 대신 여기 쓸게.\n나도 그래. 네가 거울 보고 웃는 거 보려고 매일 아침 일부러 천천히 채워. 3분 20초 걸릴 수 있는데 4분 걸려. 너 모르지.", "s": "루카"}, {"n": 15, "d": "2월 3일", "t": "코니아일랜드에서 돌아오는 지하철.\n나 잠든 거 아니었어. 처음 10분은 진짜 졸았는데, 네 어깨에 머리가 닿는 순간 깼어.\n그 다음 50분은 자는 척했어. 네가 한 번도 안 움직이는 게 느껴졌어. 숨도 조심해서 쉬는 것 같았어.\n역 두 개 지나친 것도 알았어. 말 안 했어.\n그때 처음으로, 내릴 역이 안 왔으면 좋겠다고 생각했어.", "s": "루카"}, {"n": 16, "d": "2월 4일", "t": "4층 작업실, 남색 물감 뚜껑을 딴 날.\n네 손이 떨리는 걸 보고 \"천천히 하십시오\"라고 했지. 종이가 괜찮다고 할 때 다시 하면 된다고.\n그거 너한테만 한 말 아니었어. 나한테도 한 말이었어.\n그날 소파에 앉아서, 남색이 하얀 천 위로 번지는 걸 보면서, 나도 뭔가가 천천히 번지는 걸 느꼈어. 그게 뭔지 이름 붙이는 데 오래 걸렸어.", "s": "루카"}, {"n": 17, "d": "2월 5일", "t": "마거릿의 마지막 장.\n네 손목을 잡고 손가락을 여백에 내려놓아 줬을 때.\n너는 울고 있어서 몰랐겠지만, 그때 내 손도 떨렸어. 종이 때문이 아니라 네 손목이 생각보다 차가워서.\n그리고 네 머리카락이 작업대에 쏟아지지 않게 붙잡았지. 그거 종이 때문이라고 할 수도 있었는데, 그냥 붙잡고 싶었어.\n'머물러도 된다는 것을 가르쳐 준 마거릿에게.' 그 문장을 읽을 때, 나는 네 할아버지가 부러웠어.", "s": "루카"}, {"n": 18, "d": "2월 5일", "t": "옥상에서 '아직'이라고 한 거.\n그날 네가 '루카'라고 불러도 되냐고 물었을 때, 사실 한 번 불러 봤으면 좋겠다고 생각했어. 어떻게 들리는지.\n그런데 '아직'이 먼저 나왔어. 그게 버릇이야. 좋은 걸 미뤄 두는 버릇. 먼저 받으면 잃을 것 같아서.\n'얼마나 자주 보느냐에 달렸다'고 한 거, 그건 진심이었어. 자주 보자는 뜻이었어. 그렇게밖에 말을 못 했어.", "s": "루카"}, {"n": 19, "d": "2월 5일", "t": "JFK 공항.\n보안 검색대 앞에서 한 번 멈췄지. 너 봤지.\n돌아보려고 멈춘 거야. 돌아보면 못 들어갈 것 같아서 안 돌아봤어.\n비행기 안에서 스케치북 마지막 장을 열한 시간 동안 세 번 열어 봤어. 내가 그렇게 웃는 얼굴이라는 거, 믿기지 않았어.\n옆자리 사람이 그림 잘 그린다고 했어. 내가 그린 거 아니라고 했어. 누가 그렸냐고 해서, 대답 못 했어.", "s": "루카"}, {"n": 20, "d": "2월 6일", "t": "하이델베르크, 처음 다리에서 만난 아침.\n여덟 시라고 했는데 네가 일곱 시 반부터 서 있었다는 거, 나중에 다리 끝 빵집 주인한테 들었어.\n나는 그날 일곱 시 사십 분부터 다리 끝 모퉁이에 서 있었어. 15분 동안. 나가지 못하고.\n그러니까 둘 다 일찍 왔던 거야. 너만 모르는 비밀.", "s": "루카"}, {"n": 21, "d": "2월 7일", "t": "매일 아침 5분.\n요나스가 그랬지. 5분보다 길어지면 익숙해질까 봐 무서운 거냐고.\n맞아. 정확히 그거였어.\n익숙해지면, 없어졌을 때 그 자리가 보이니까. 5분이면 없어져도 5분만큼만 비니까.\n지금은 아무도 5분을 안 세. 그게 무서운지 물으면, 아직 조금 무서워. 근데 그것보다 좋아.", "s": "루카"}, {"n": 22, "d": "2월 7일", "t": "크리스마스 시장.\n네가 경비비로 구운 아몬드를 사 줬지. 그게 그 시장에서 내가 유일하게 좋아하는 거라고 말 안 했어.\n그런데 너 알고 있었지. 그 다음 주에 작업실 갔더니 아몬드 한 봉지가 탁자에 있었어. 아무 말도 없이.\n그 봉지 다 먹었어. 하루 만에. 이것도 말 안 했어.", "s": "루카"}, {"n": 23, "d": "2월 7일", "t": "잡지 기사.\n사진 찍혔을 때 다른 다리로 돌아간 거, 너 때문이 아니었어.\n나 때문이었어. 사람들이 쳐다보는 게 싫어서. 그런데 그 다음엔, 그 사진 속 내가 너무 너 쪽을 보고 있어서 싫었어. 들킨 것 같아서.\n너는 손 흔든 걸 사과했지. 사과할 일 아니었어. 그 메시지에 '알겠습니다' 한 마디만 보낸 거, 내가 사과할 일이야.", "s": "루카"}, {"n": 24, "d": "2월 8일", "t": "도서관 3층 복도.\n다나 씨랑 너 얘기하는 거 들었을 때, 나는 '돌아가야죠'까지 듣고 돌아섰어.\n그날 보고서를 구겼어. 15년 동안 종이를 구긴 건 그게 처음이야. 요나스가 다리미로 펴 줬어. 약하게.\n그 보고서 아직 있어. 구김 자국이 조금 남았어. 버리지 않았어. 내가 반쪽만 들은 날의 증거라서.", "s": "루카"}, {"n": 25, "d": "2월 9일", "t": "\"다시 볼 일 없습니다.\"\n그 말 하고 다리를 건너면서, 주머니 속 장갑을 쥐었어. 너무 세게 쥐어서 손톱 자국이 손바닥에 남았어. 저녁까지.\n습관처럼 난간에 손이 가려는 걸 주머니에 넣어서 막았어.\n서점에서는 그 말이 틀렸지. 그날 아침엔 네가 맞는 말로 들었을까 봐 무서웠어. 너는 웃지 않았어. 그 얼굴은 아직도 가끔 꿈에 나와.", "s": "루카"}, {"n": 26, "d": "2월 9일", "t": "스케치북 상자.\n요나스가 말했지. 여덟 번째 상자라고. 맞아.\n일곱 번 실패했어. 모서리가 1밀리씩 틀어졌어. 중성지 접는 데 20분이면 되는데 세 시간 걸렸어.\n버릴 거면 그냥 버렸을 거라고 요나스가 했다며. 그것도 맞아.\n나는 그걸 돌려보낸 게 아니라, 맡긴 거였어. 내가 그걸 갖고 있으면 안 될 것 같아서. 그런데 아무 데나 둘 수도 없어서.", "s": "루카"}, {"n": 27, "d": "2월 9일", "t": "1월 15일.\n난간 위에 비닐로 싼 캔버스. 장갑만 있는 다리.\n'다리에 없는 사람은 그릴 수가 없어서, 장갑만 그렸어요.'\n그 자리에서 전화를 걸었어. 세 번 울리고 끊었어.\n네가 받으면 '가지 마'라고 할 것 같았어. 그 말은 내가 할 수 있는 말이 아니라고 생각했어. 그런데 '잘 가'는 더 못 하겠고.\n그래서 끊었어. 그날 출근 30분 늦었어.", "s": "루카"}, {"n": 28, "d": "2월 10일", "t": "장갑 그림을 거실 북쪽 벽에 걸었어. 습도계 옆에.\n6주 동안 매일 아침 봤어. 정확히 4분. 커피 대신 물 한 잔 마시는 동안.\n4분인 이유는, 5분은 너랑 다리에 있던 시간이라서. 그거보다 짧게 보려고.\n그런데 이상하지. 4분 보고 나면 하루 종일 그 그림이 눈에 남았어. 5분보다 길게.", "s": "루카"}, {"n": 29, "d": "2월 11일", "t": "폭스링 열두 개.\n밤마다 서랍에서 꺼내서 하나씩 지웠어. 개인 의뢰는 안 받는다고 했는데.\n하루에 하나. 열두 개면 열이틀이면 되는데, 한 달 걸렸어. 일부러 천천히 했어. 다 지우면 그 판화를 더 꺼낼 이유가 없어질까 봐.\n마지막 하나 지운 날 밤, 비행기 표를 샀어. 그건 폭스링 때문이 아니라 요나스가 보여 준 기사 때문이었다고 했지. 반은 맞아.", "s": "루카"}, {"n": 30, "d": "2월 11일", "t": "휘트니 개막식.\n여섯 번째 다리 그림 앞에서 5분 서 있었어. 난간에 손 얹은 그림이랑 같은 자세로.\n일부러 그런 거야. 네가 보면 알아볼까 봐. 알아봐 줬으면 해서.\n네가 돌아봤을 때, 나는 도망가고 싶었어. 진짜로. 출구가 어딘지 봤어.\n그런데 네가 샴페인 잔을 남한테 쥐여 주고 '실례합니다' 한마디 없이 사람들을 헤치고 오는 걸 봤어. 그 정중한 사람이.\n그래서 못 도망갔어.", "s": "루카"}, {"n": 31, "d": "2월 11일", "t": "'응'.\n네가 '루카'라고 불렀을 때 나온 거.\n그거 연습한 거 아니야. 비행기에서 할 말은 많이 연습했어. 끝까지 안 듣는 건 저라는 거, 그건 연습했어.\n그런데 '응'은 연습 안 했어. 그냥 나왔어. 나도 놀랐어.\n나온 다음에 무를 수가 없어서, 그 뒤로 계속 반말을 하고 있는 거야. 지금 이 편지도.", "s": "루카"}, {"n": 32, "d": "2월 12일", "t": "수장고에서 본 얼굴 그림.\n네가 그랬지. 루카는 말이랑 얼굴이 자주 다르다고.\n맞아. 인정할게. 그날 다리 끝에서 '일곱 시 반부터 서 있으라고는 안 했다'고 할 때, 사실 나는 너무 반가워서 다리가 좀 풀렸어.\n그걸 너는 얼굴만 보고 그렸어. 내가 거울에서 한 번도 본 적 없는 얼굴을.\n그 그림은 수장고에 있지. 가끔 생각해. 습도는 괜찮을까.", "s": "루카"}, {"n": 33, "d": "2월 13일", "t": "4월, 네 작업실 북향 창.\n습도계 다섯 개 내가 건 거 맞아. 너는 묻지 않았지만, 다 알았겠지.\n너 없을 때 열쇠 빌려서 걸었어. 다나 씨한테 열쇠 받았어. 다나 씨가 아무 말 없이 줬어. 그리고 '물감은 건드리지 마세요'라고 했어.\n안 건드렸어. 색상환 순서로 정리하고 싶은 걸 참았어. 그건 나중에, 우리 집에서 했지.", "s": "루카"}, {"n": 34, "d": "2월 13일", "t": "다리 위에서 '얼굴, 그려도 돼. 앞에서.'\n그 말 하기 전날 밤에 잠을 못 잤어. 허락하는 게 뭐가 그렇게 어려웠냐면, 앞에서 그려지면 내가 숨을 데가 없으니까.\n그런데 막상 네가 붓을 들고 나를 보는데, 숨을 필요가 없었어.\n너는 내가 숨기려던 걸 이미 다 알고 그리는 사람이니까.", "s": "루카"}, {"n": 35, "d": "2월 13일", "t": "빙판길.\n넘어지면서 상자 먼저 챙긴 거, 너는 멋있다고 했지. 안 멋있었어.\n병원 처치실에 네가 뛰어 들어왔을 때, 나는 사실 손목보다 그게 더 무서웠어. 네가 그 얼굴로 나를 보는 거.\n'루카보다 중요한 미팅은 없어요.' 그 말 듣고 창밖만 봤지. 얼굴 보면 울 것 같아서.\n그리고 네가 '책은 괜찮대요?' 하고 물었지. 그 질문에 무너질 뻔했어. 내가 지킨 걸, 너도 같이 지켜 준 것 같아서.", "s": "루카"}, {"n": 36, "d": "2월 14일", "t": "탄 계란.\n왼손으로 처음 만든 저녁. 너는 '탄 데가 맛있어요'라고 했지.\n나도 안다. 거짓말인 거.\n그런데 그 뒤로 내가 계란을 태울 때마다 너는 매번 그렇게 말해. 이제 나도 탄 데가 조금 좋아. 네가 그 말을 하니까.\n일부러 태우는 건 아니야. 그건 확실히 해 둘게.", "s": "루카"}, {"n": 37, "d": "2월 15일", "t": "처음으로 단추 풀어 달라고 손을 내린 밤.\n'한심하지'라고 했지. 너는 아니라고 했어.\n그날 네가 무릎 꿇고 단추를 위에서부터 하나씩 푸는데, 나는 네 정수리를 내려다보고 있었어. 붉은 머리 가르마가 조금 비뚤어져 있었어.\n고쳐 주고 싶었는데 왼손밖에 없어서 그냥 머리에 손을 얹었어. 너는 쓰다듬는 줄 알았지.\n반은 쓰다듬은 거 맞아.", "s": "루카"}, {"n": 38, "d": "2월 15일", "t": "코덱스 얘기 들은 날 컵을 깼지.\n깨진 조각 주우려는데 네가 손목을 잡았어. '왼손까지 다치면 어떡해요.'\n그때 나는 화가 났어. 너한테가 아니라 내 손한테.\n그런데 네가 끌어안았을 때, 밀어내지도 안기지도 못하고 서 있었지. 수프가 끓어 넘치는데.\n그날 수프 반은 냄비 밖으로 흘렀어. 남은 반은 정말 맛있었어. 말 못 했어.", "s": "루카"}, {"n": 39, "d": "2월 15일", "t": "도쿄 보낸 아침.\n'그거 동정이야'라고 했지. 미안해.\n너는 '루카는 제가 동정으로 사람 옆에 있는 사람 같아요?'라고 물었어. 그 질문에 대답 못 한 건, 대답이 '아니'라는 걸 알아서였어.\n알면서 그렇게 말했어. 네가 가야 내가 안 들킬 것 같아서. 단추 못 채우는 거.\n엇갈린 단추를 네가 다시 채워 줬지. 그 손이 아직도 기억나.", "s": "루카"}, {"n": 40, "d": "2월 16일", "t": "네가 '2주예요, 딱 2주'라고 하고 현관문이 닫혔을 때.\n나는 그 자리에 20분 서 있었어.\n집이 너무 조용해서. 원래 조용한 집이었는데. 네가 오기 전에도 늘 이만큼 조용했는데.\n그게 기억이 안 났어. 네가 없는 조용함이 어떤 건지.\n20분 지나서야 신발을 벗었어.", "s": "루카"}, {"n": 41, "d": "2월 17일", "t": "냉장고 안의 수프 통.\n'월요일', '화요일', '수요일'. 네 글씨.\n월요일 통 뚜껑이 너무 꽉 닫혀 있어서 무릎 사이에 끼우고 10분 걸려 열었어. 너 일부러 그렇게 닫은 거 아니지.\n데우지도 않고 먹었어. 차가웠어. 다 먹었어.\n일요일 통은 먹지 않았어. 너 오는 날 같이 먹으려고. 근데 네가 이틀 일찍 와서, 결국 월요일 통이랑 같이 먹었지.", "s": "루카"}, {"n": 42, "d": "2월 17일", "t": "나흘째 밤, 여섯 번째 신호에 받은 거.\n세 번째에 받으려고 했어. 손가락이 화면 위에 있었어.\n네 번째, 다섯 번째. 그리고 여섯 번째에 받은 건, 일곱 번째엔 네가 끊을 것 같아서.\n너는 끊지 않았을 거야. 지금은 알아. 그때는 몰랐어.", "s": "루카"}, {"n": 43, "d": "2월 17일", "t": "'무서워.'\n그 말을 처음 한 사람이 너야. 엘제 선생님보다 먼저.\n얼굴을 볼 수 없어서였는지, 여덟 시간 떨어져 있어서였는지 모르겠어.\n그 다음에 네가 그랬지. 추운 게 아니라 조용해진 거라고. 내가 너한테 했던 말을 돌려줬어.\n그날 처음으로 2주 만에 잤어. 네 숨소리 들으면서. 네가 끊지 않은 거 알아. 아침에 통화 시간 봤어. 두 시간 사십 분.", "s": "루카"}, {"n": 44, "d": "2월 18일", "t": "단추 서른네 개짜리 셔츠.\n'바보'라고 했지.\n사실은 그 셔츠 처음 봤을 때, 단추 수를 세기도 전에 알았어. 이걸 매일 아침 채우게 되겠구나. 평생.\n'재활 도구'라고 했지만, 너는 처음부터 그걸 알고 산 거지.\n리넨이 부드러워지는 속도로, 내 손가락도 돌아왔어. 그 셔츠가 해지면, 내 손이 다 나았다는 뜻이야.", "s": "루카"}, {"n": 45, "d": "2월 19일", "t": "금박 여섯 장 구긴 날.\n너 앞에서 처음 울었어. 울면 안 된다고 생각했는데 그게 안 됐어.\n너는 '괜찮아요'라고 안 했지. 그게 고마웠어. 그 말을 들었으면 더 울었을 거야.\n대신 내 손을 숨기지 못하게 잡았지. '제가 처음 그린 손이에요.'\n그 금박 여섯 장, 엘제 선생님이 봉투에 모아 두셨더라. 지금은 내 서랍에 있어.", "s": "루카"}, {"n": 46, "d": "2월 19일", "t": "일곱 살 너의 다리 그림.\n핀셋이 떨릴 때 '아무 말이나 해 봐'라고 했지.\n네가 부러진 크레용 얘기를 했어. 할아버지가 반으로 나눠 주면서 이제 두 개 생겼다고 한 거.\n그 얘기 듣는 동안 손이 멈췄어. 떨림이.\n나는 그날 알았어. 내 손이 정확한 건 타고나서가 아니라, 뭔가에 기대고 있을 때라는 걸. 15년 동안은 종이에 기댔어. 그날부터는 네 목소리에.", "s": "루카"}, {"n": 47, "d": "2월 19일", "t": "'여기 살아. 나랑.'\n그 말 석 달 연습했어. 단추 채우는 동안 매일 아침.\n처음엔 '이젤 여기로 가져와'까지만 하려고 했어. 그 정도면 알아들을 줄 알았어.\n그런데 네가 '그래도 괜찮았어요'라고 해서, 안 괜찮다고 했어. 그 다음부터는 준비한 말이 아니었어.\n'루카가 먼저 말한 거 처음이에요.' 그 말 들었을 때, 다음엔 더 빨리 말해야겠다고 생각했어. 그래서 지금 이걸 쓰고 있어.", "s": "루카"}, {"n": 48, "d": "2월 20일", "t": "네 어머니가 오시던 날.\n해바라기 줄기를 너무 세게 쥐어서 손가락이 하얘졌지. 너 봤지. 어머니도 보셨대.\n나중에 어머니가 그러셨어. 그거 보고 네 아버지 같은 사람인 줄 알았다고.\n나는 네 아버지를 모르지만, 해바라기를 3년 동안 매주 들고 왔다는 사람이라니, 좋은 사람이었을 거야.\n그 사람이 너를 키웠다는 게 이해가 돼.", "s": "루카"}, {"n": 49, "d": "2월 21일", "t": "아우구스트의 편지 61통을 읽는 동안.\n나는 그 사람이 나 같다고 생각했어. 말이 짧고, 대신 쓰는 사람.\n그런데 다 읽고 나서는 다르게 생각했어. 그 사람은 50년 동안 썼어. 마거릿은 끝내 못 읽었어.\n나는 그러고 싶지 않아. 그래서 61통을 두 달 안에 쓰기로 했어. 50년 말고.\n그리고 너는 읽을 수 있었으면 좋겠어. 언젠가. 아니, 이건 너무 큰 바람이야. 그냥 쓸게.", "s": "루카"}, {"n": 50, "d": "2월 21일", "t": "호텔 로비에서 네 어머니가 '루카라고 불러도 될까요' 하셨을 때.\n대답이 '네'밖에 안 나왔어. 그것도 한참 걸려서.\n그날 다리로 뛰어갔지. 2분 늦었어. 처음이었어.\n너한테 그 얘기 하면서 웃었지. 숨이 차서 웃은 거라고 생각했을 거야.\n아니야. 좋아서 웃었어. 내 이름을 그렇게 불러 주는 사람이 하나 늘어서. 너 때문에.", "s": "루카"}, {"n": 51, "d": "2월 21일", "t": "보스턴 크리스마스, 칠면조.\n두 조각 먹었어. 아무 말 없이.\n네 할아버지가 매년 그랬다길래. 그게 맛있다는 뜻이었다길래.\n진짜로 맛있었어. 그래서 두 조각. 세 조각 먹고 싶었는데, 그러면 뜻이 달라질까 봐 참았어.\n어머니가 부엌에서 한참 안 나오셨지. 나중에 네가 웃다가 울었다고 했어. 나는 그때 식탁에서 귀만 빨개져 있었어.", "s": "루카"}, {"n": 52, "d": "2월 22일", "t": "너는 붓을 씻을 때 콧노래를 불러.\n늘 같은 노래야. 제목은 몰라. 영어 노래 같은데 가사는 안 불러. 음만.\n2년 동안 들어서 이제 다 외웠어. 복원실에서 혼자 작업할 때 가끔 내가 그걸 흥얼거려. 요나스가 무슨 노래냐고 물었는데 대답 못 했어.\n언젠가 제목 알려 줘. 아니, 알려 주지 마. 그냥 계속 불러.", "s": "루카"}, {"n": 53, "d": "2월 23일", "t": "잠버릇.\n너는 새벽 세 시쯤 꼭 한 번 돌아누워. 그리고 팔을 내 허리에 감아. 깨어 있을 때는 그렇게 안 하면서.\n나는 그 시간에 자주 깨어 있어. 원래 잠이 얕아.\n그 팔 한 번도 뺀 적 없어. 네가 모르는 동안 매일.", "s": "루카"}, {"n": 54, "d": "2월 23일", "t": "소파 틈에서, 책장 사이에서, 내 코트 안쪽에서, 가끔 붉은 머리카락 한 가닥이 나와.\n복원실에서도 나와. 요나스가 '선배님 이거 증거물이에요'라고 했어.\n처음엔 그걸 털어 냈어. 지금은 그냥 둬.\n어제는 18세기 악보 상자를 열었는데 안에서 한 가닥 나왔어. 아마 내 소매에 묻어 있었겠지. 그거 꺼내면서 웃었어. 혼자.", "s": "루카"}, {"n": 55, "d": "2월 23일", "t": "빵집 창가에서 너랑 요나스를 봤어. 2주 전 화요일.\n요나스가 네 손등을 연필로 쳤지. 그거 보고 나는 다음 날 요나스를 지하 3층으로 보내려고 했어. 곰팡이 3주.\n엘제 선생님이 '질투니?' 하셨어. 아니라고 했어.\n질투였어. 처음 해 봤어. 생각보다 유치했어.\n요나스한테 핀셋 줬어. 일본제. 사과 대신. 너한테는 이걸로 사과할게. 미안.", "s": "루카"}, {"n": 56, "d": "2월 24일", "t": "네가 잠결에 '이히 블라이-베'라고 했어.\n그 다음 날 요나스한테 말했어. 아무것도 말하지 말라고. 모르는 척할 거라고.\n그러니까 지금 나는 네가 화요일, 목요일마다 뭘 하는지 반쯤 알아. 나머지 반은 모르는 척하는 중이야.\n처음으로 반쪽을 알고도 판결 안 내리고 기다리는 중이야. 이거 생각보다 어렵다. 매일 물어보고 싶어.\n네가 직접 말할 때까지. 끝까지.", "s": "루카"}, {"n": 57, "d": "2월 25일", "t": "런던.\n거절한 이유를 말 안 했지. '갈 생각이 없어서'라고만.\n진짜 이유는 이거야. 대영도서관 복원실은 템스강 근처야. 거기도 다리가 많아.\n그런데 그 다리들 중에 아침 일곱 시 오십오 분에 네가 서 있는 다리는 없어.\n수석 복원가보다 그게 더 중요했어. 이유는 그게 다야.", "s": "루카"}, {"n": 58, "d": "2월 25일", "t": "엘제 선생님 서랍에 사진이 하나 있어. 내가 열아홉 살 때 처음 복원한 반쪽 편지. 나머지 반쪽이랑 나란히.\n'그러니 기다려 주시오. 봄에 돌아가겠소.'\n나는 반쪽만 보고 이별 편지라고 했어. 선생님이 나머지를 찾아오셨지.\n그 뒤로 15년 동안 나는 계속 반쪽만 읽었어. 너를 만나고도.\n너는 내 나머지 반쪽을 찾아온 사람이야. 매번. 서점에서, 다리에서, 휘트니에서, 병원에서.", "s": "루카"}, {"n": 59, "d": "2월 25일", "t": "나이 들면.\n아우구스트는 마거릿 손이 떨리던 마지막 몇 년, 매일 아침 머리를 빗겨 줬대. 아무 말 없이. 네 어머니가 그 얘기 해 주셨어.\n나는 단추를 채울 거야. 네 손이 떨릴 때까지. 그 다음엔 머리를 빗겨 줄게. 무릎까지 오는 거, 끝에서부터, 조금씩, 위로.\n엉킨 데 나오면 멈추고, 손가락으로 풀고, 다시.\n그건 종이 다루는 거랑 같아. 나 그거 잘해.", "s": "루카"}, {"n": 60, "d": "2월 26일", "t": "이제 하나 남았어.\n60통 쓰는 데 두 달 걸렸어. 15년 동안 한 말보다 많은 말이야. 다시 읽어 보니까 너무 길어. 아우구스트가 왜 50년 걸렸는지 알겠어. 이건 원래 오래 걸리는 거야.\n네가 이걸 읽으려면 사전이 필요할 거야. 한 통에 한 시간쯤. 그럼 61시간.\n그래도 괜찮아. 천천히 읽어. 종이가 괜찮다고 할 때.\n마지막 한 통은 짧게 쓸 거야. 아직 못 썼어. 사흘째 만년필 뚜껑만 열었다 닫았다 하고 있어.", "s": "루카"}, {"n": 61, "d": "3월 2일", "t": "나 여기 있어.\n매일 아침 일곱 시 오십오 분에.\n내일도. 그 다음에도.\n그러니까 — 결혼하자.", "s": "루카"}];
const KEY='lukas-letters-v1';
let st={cur:1,read:[]};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.cur)st=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const grid=document.getElementById('grid'),box=document.getElementById('letter');
LETTERS.forEach(l=>{const b=document.createElement('button');b.className='env'+(l.n===61?' last':'');b.type='button';b.id='env'+l.n;b.textContent=l.n;b.setAttribute('aria-label',l.n+'번째 편지, '+l.d);b.onclick=()=>show(l.n,true);grid.appendChild(b)});
function show(n,scroll){
  const l=LETTERS[n-1];st.cur=n;if(!st.read.includes(n))st.read.push(n);save();
  box.className='letter'+(n===61?' final':'');
  box.innerHTML='';
  const meta=document.createElement('div');meta.className='meta';
  const a=document.createElement('b');a.textContent=n+'번째 편지';const d=document.createElement('span');d.textContent=l.d+(n===61?' · 7:55':'');
  meta.append(a,d);
  const body=document.createElement('div');body.className='body';body.textContent=l.t;
  const sig=document.createElement('div');sig.className='sig';sig.textContent='— '+l.s;
  box.append(meta,body,sig);
  if(n===10){const note=document.createElement('div');note.className='note';note.textContent='이 편지부터 서명이 바뀌어요';box.append(note)}
  document.querySelectorAll('.env').forEach(e=>e.classList.remove('on'));
  st.read.forEach(r=>{const e=document.getElementById('env'+r);if(e)e.classList.add('read')});
  document.getElementById('env'+n).classList.add('on');
  document.getElementById('prev').disabled=n===1;document.getElementById('next').disabled=n===61;
  document.getElementById('count').textContent=n+' / 61';
  document.getElementById('readCount').textContent=st.read.length+' / 61 읽음';
  if(scroll)box.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}
document.getElementById('prev').onclick=()=>st.cur>1&&show(st.cur-1,true);
document.getElementById('next').onclick=()=>st.cur<61&&show(st.cur+1,true);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&st.cur>1)show(st.cur-1,false);if(e.key==='ArrowRight'&&st.cur<61)show(st.cur+1,false)});
show(st.cur,false);
</script>
