<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bärenhöhle 곰굴 그림책</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Nanum+Myeongjo:wght@400;700;800&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: one picture book lying on a dark candlelit desk. Ribbon bookmarks stick out of the top edge; one parchment leaf is shown at a time and turns on its spine. */
:root{
  color-scheme:dark;
  --night:#17110c;
  --desk:#221911;
  --paper:#efe6d0;
  --paper-lo:#e2d6b8;
  --ink:#3a2c1c;
  --ink-soft:#75624a;
  --gold:#c4a676;
  --gold-hi:#e6d6b2;
  --wine:#8e2f25;
  --moss:#74825a;
  --mustard:#c9a44a;
  --pink:#d9a09c;
  --navy:#34405c;
  --white:#fbf6e9;
  --pencil:#5f5a52;
  --script:"Pinyon Script","Times New Roman",cursive;
  --latin:"Cormorant Garamond","Times New Roman",serif;
  --ko:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --hand:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--night);color:var(--gold-hi);font-family:var(--ko);font-size:16px;line-height:1.85;
  background-image:radial-gradient(ellipse 70% 420px at 50% 0,rgba(214,180,120,.16),transparent 70%);
  background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 56px;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
.stage{max-width:720px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.book,.leaf{min-width:0}
.shelf{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.shelf .t{font-family:var(--script);font-size:30px;line-height:1;color:var(--gold-hi)}
.shelf .s{font-size:12px;color:var(--gold);letter-spacing:.08em}

/* ribbons */
.marks{display:flex;gap:6px;padding:0 14px;position:relative;z-index:2}
.mark{flex:1 1 0;min-width:0;white-space:nowrap;border:0;padding:8px 2px 16px;font-family:var(--hand);font-weight:700;font-size:16px;line-height:1.1;color:var(--white);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 9px),0 100%);margin-bottom:-12px;transition:transform .2s}
.mark:nth-child(5n+1){background:var(--navy)}
.mark:nth-child(5n+2){background:var(--moss)}
.mark:nth-child(5n+3){background:var(--mustard);color:var(--ink)}
.mark:nth-child(5n+4){background:var(--pink);color:var(--ink)}
.mark:nth-child(5n+5){background:var(--ink-soft)}
.mark:hover,.mark:focus-visible{transform:translateY(-4px);outline:none}
.mark[aria-current="true"]{background:var(--wine);color:var(--white);transform:translateY(-6px)}

/* book */
.book{position:relative;perspective:1800px}
.leaf{position:relative;background:var(--paper);color:var(--ink);border-radius:4px 10px 10px 4px;min-height:560px;
  padding:44px 34px 70px 46px;
  box-shadow:0 22px 50px rgba(0,0,0,.55),inset 14px 0 18px -10px rgba(58,44,28,.35),inset 0 0 60px rgba(196,166,118,.25);
  background-image:linear-gradient(90deg,rgba(58,44,28,.16),transparent 26px)}
.ghost{position:absolute;inset:0;overflow:hidden;z-index:3;pointer-events:none;backface-visibility:hidden}
.ghost.fwd{transform-origin:left center;animation:turnF .55s ease-in forwards}
.ghost.back{transform-origin:left center;animation:turnB .5s ease-out forwards}
@keyframes turnF{to{transform:rotateY(-100deg);opacity:.15}}
@keyframes turnB{from{transform:rotateY(-100deg);opacity:.15}to{transform:rotateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.ghost{animation:none!important;display:none}}
.runhead{position:absolute;top:14px;left:46px;right:34px;display:flex;justify-content:space-between;font-family:var(--latin);font-style:italic;font-size:13px;color:var(--ink-soft)}
.folio{position:absolute;bottom:22px;left:0;right:0;pointer-events:none;text-align:center;font-family:var(--latin);font-size:14px;color:var(--ink-soft)}
.turn{position:absolute;bottom:12px;border:0;background:none;font-family:var(--hand);font-weight:700;font-size:18px;color:var(--wine);padding:8px 12px;border-radius:8px}
.turn:hover,.turn:focus-visible{background:var(--paper-lo);outline:none}
.turn.prev{left:36px}.turn.next{right:22px}
.turn[disabled]{visibility:hidden}

/* cover */
.cover{text-align:center;display:grid;gap:10px;justify-items:center;padding-top:8px}
.cover .eyebrow{font-family:var(--hand);font-size:18px;color:var(--ink-soft)}
.cover h1{margin:0;font-family:var(--script);font-weight:400;font-size:clamp(56px,15vw,92px);line-height:1;color:var(--wine)}
.cover .ko{font-weight:800;font-size:22px;letter-spacing:.04em}
.cover svg{width:min(100%,460px);height:auto}
.cover p{margin:0;max-width:30em;color:var(--ink)}
.cover .by{font-family:var(--hand);font-size:17px;color:var(--ink-soft)}
.open{border:2px solid var(--wine);background:none;color:var(--wine);font-family:var(--hand);font-weight:700;font-size:20px;padding:6px 22px;border-radius:30px}
.open:hover,.open:focus-visible{background:var(--wine);color:var(--white);outline:none}

/* chapter */
.ch-head{display:grid;gap:2px;margin-bottom:18px;border-bottom:1px dashed var(--ink-soft);padding-bottom:14px}
.ch-kicker{font-family:var(--hand);font-size:18px;color:var(--moss);font-weight:700}
.ch-head h2{margin:0;font-weight:800;font-size:clamp(22px,5.4vw,28px);line-height:1.35;text-wrap:balance;color:var(--ink)}
.prose{max-width:34em}
.prose p{margin:0 0 .95em}
.prose p:first-child::first-letter{font-size:2.5em;font-weight:800;color:var(--wine);float:left;line-height:.95;padding:.08em .1em 0 0}
.prose p.say{padding-left:1.1em;text-indent:-.55em;margin-bottom:.5em;font-weight:700}
.prose p.say.l{color:var(--navy)}
.prose h3.sub{margin:1.6em 0 .5em;font-family:var(--hand);font-weight:700;font-size:22px;line-height:1.3;color:var(--moss)}
.prose h3.sub+p::first-letter{all:unset}
.note{font-family:var(--hand);font-size:20px;line-height:1.4;background:var(--white);color:var(--ink);border:1px solid var(--paper-lo);
  padding:10px 16px;margin:4px 0 16px;display:inline-block;transform:rotate(-1.2deg);box-shadow:2px 3px 0 rgba(58,44,28,.18)}
.note:nth-of-type(even){transform:rotate(1deg)}
.fig{margin:6px 0 22px;text-align:center}
.fig img{max-width:min(100%,380px);height:auto;border-radius:3px;box-shadow:2px 4px 0 rgba(58,44,28,.2),0 8px 22px rgba(58,44,28,.18)}
.fig figcaption{font-family:var(--hand);font-size:17px;color:var(--ink-soft);margin-top:10px}
.endmark{text-align:center;color:var(--wine);font-size:18px;letter-spacing:.6em;margin-top:8px}

/* map */
.map-wrap{overflow-x:auto;margin:0 -10px 6px;padding:0 10px;-webkit-overflow-scrolling:touch}
.map-wrap svg{display:block;width:100%;min-width:780px;height:auto}
.hint{font-family:var(--hand);font-size:17px;color:var(--ink-soft);margin:0 0 8px}
.hot{cursor:pointer;outline:none}
.hot circle.dot{fill:var(--wine);stroke:var(--white);stroke-width:2;transition:r .15s}
.hot text{fill:var(--white);font-family:var(--ko);font-weight:800;font-size:17px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hot:hover circle.dot,.hot:focus-visible circle.dot{fill:var(--navy)}
.hot circle.ring{fill:none;stroke:var(--wine);stroke-width:1.5;opacity:.55;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{r:17;opacity:.55}70%,100%{r:30;opacity:0}}
@media (prefers-reduced-motion:reduce){.hot circle.ring{animation:none;opacity:0}}
.lbl{font-family:var(--hand);font-size:21px;fill:var(--ink-soft)}
.lbl.b{font-weight:700;fill:var(--ink);font-size:25px}
.legend{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.legend button{width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:6px;font-family:var(--hand);font-size:18px;color:var(--ink);display:flex;gap:8px;align-items:center}
.legend button:hover,.legend button:focus-visible{background:var(--paper-lo);outline:none}
.legend b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--wine);color:var(--white);font-family:var(--ko);font-size:11px;display:grid;place-items:center}

/* contents */
.toc{display:grid;gap:18px}
.toc h3{margin:0 0 4px;font-family:var(--hand);font-size:21px;color:var(--moss)}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:0}
.toc button{width:100%;border:0;background:none;display:flex;align-items:baseline;gap:8px;padding:5px 4px;border-radius:6px;text-align:left;color:var(--ink);font-size:16px}
.toc button:hover,.toc button:focus-visible{background:var(--paper-lo);outline:none}
.toc .dots{flex:1;border-bottom:1px dotted var(--ink-soft);transform:translateY(-4px);min-width:16px}
.toc .pg{font-family:var(--latin);color:var(--ink-soft)}


/* post box under the book */
.post{margin-top:38px;background:var(--paper-lo);color:var(--ink);border-radius:10px;padding:18px 18px 24px;border-top:12px solid var(--moss);box-shadow:0 18px 40px rgba(0,0,0,.5);min-width:0}
.post-head{width:100%;border:0;background:none;padding:0;text-align:left;color:inherit;display:flex;justify-content:space-between;align-items:center;gap:6px 14px}
.post-head .ph-t{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap;min-width:0}
.post-head .ph-c{flex:none;font-family:var(--hand);font-weight:700;font-size:19px;color:var(--wine);border:1.5px solid var(--wine);border-radius:20px;padding:2px 12px}
.post-head:hover .ph-c,.post-head:focus-visible .ph-c{background:var(--wine);color:var(--white)}
.post-head:focus-visible{outline:none}
#postBody{margin-top:2px}
.post-head h2{margin:0;font-family:var(--hand);font-weight:700;font-size:28px;line-height:1.2;color:var(--ink)}
.post-head p{margin:0;font-family:var(--hand);font-size:17px;color:var(--ink-soft)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 16px}
.slot{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 10px 10px;font-family:var(--hand);font-weight:700;font-size:21px;line-height:1.2;display:grid;gap:6px;justify-items:center}
.slot::before{content:"";width:70%;height:7px;border-radius:4px;background:var(--ink)}
.slot small{font-weight:400;font-size:15px;color:var(--ink-soft)}
.slot[aria-pressed="true"]{background:var(--wine);color:var(--white);border-color:var(--wine)}
.slot[aria-pressed="true"] small{color:var(--gold-hi)}
.slot[aria-pressed="true"]::before{background:var(--white)}
.slot:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.ex{display:flex;flex-direction:column;gap:7px;padding:14px 0;border-bottom:1px dashed var(--ink-soft)}
.ex:last-child{border-bottom:0}
.sl{font-family:var(--hand);font-size:20px;line-height:1.35;background:var(--white);color:var(--ink);padding:6px 14px;max-width:82%;align-self:flex-start;transform:rotate(-.8deg);box-shadow:2px 3px 0 rgba(58,44,28,.18)}
.sl.l{align-self:flex-end;transform:rotate(.7deg);background:var(--paper);color:var(--pencil)}
.sl.n{align-self:center;background:none;box-shadow:none;transform:none;font-family:var(--ko);font-size:13.5px;color:var(--ink-soft);max-width:100%;text-align:center;padding:0 6px}
.letters{display:grid;gap:10px}
.env{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--ink-soft);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 12px;min-width:0}
.env:hover,.env:focus-visible{border-color:var(--wine);outline:none}
.env .stamps{display:flex;flex:none;align-items:center}
.env .stamps svg{display:block}
.env .stamps .pm{margin-left:-16px}
.env .who{flex:1;min-width:0;display:grid;gap:0}
.env .who b{font-family:var(--hand);font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.env .who span{font-family:var(--latin);font-style:italic;font-size:13.5px;color:var(--ink-soft)}
.env .chev{flex:none;font-family:var(--hand);font-size:22px;color:var(--wine);transition:transform .2s}
.env[aria-expanded="true"] .chev{transform:rotate(90deg)}
.lt{background:var(--white);color:var(--ink);margin:-4px 6px 6px;padding:18px 18px 16px;box-shadow:2px 3px 0 rgba(58,44,28,.18);display:grid;gap:12px}
.lt .body{font-family:var(--hand);font-size:20.5px;line-height:1.5;white-space:pre-line;margin:0}
.lt .reply{justify-self:end;max-width:86%;border:1.5px dashed var(--pencil);color:var(--pencil);font-family:var(--hand);font-size:20px;line-height:1.4;padding:6px 14px;transform:rotate(1deg);white-space:pre-line}
.lt .reply small{display:block;font-size:14px;opacity:.8}
.lt .back{font-family:var(--hand);font-size:20px;line-height:1.4;white-space:pre-line;margin:0}
.lt .aside{font-family:var(--ko);font-size:13.5px;line-height:1.7;color:var(--ink-soft);margin:0;border-top:1px dashed var(--paper-lo);padding-top:10px}
@media (max-width:520px){.post{padding:14px 12px 18px}.env{gap:8px;padding:8px}.env .stamps svg.st{width:40px;height:50px}.env .stamps svg.pm{width:50px;height:50px}.sl{font-size:19px;max-width:90%}}
/* slip (hotspot detail) */
.veil{position:fixed;inset:0;z-index:20;background:rgba(15,10,6,.72);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.slip{background:var(--white);color:var(--ink);max-width:420px;width:100%;max-height:100%;overflow:auto;padding:22px 22px 18px;border-radius:4px;transform:rotate(-.8deg);
  box-shadow:0 18px 40px rgba(0,0,0,.5);border-top:10px solid var(--mustard)}
.slip .n{font-family:var(--hand);font-weight:700;color:var(--wine);font-size:18px}
.slip h3{margin:0 0 8px;font-weight:800;font-size:20px;line-height:1.4}
.slip p{margin:0 0 .8em;font-size:15.5px;line-height:1.8}
.slip .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.slip button{border:1.5px solid var(--ink-soft);background:none;color:var(--ink);font-family:var(--hand);font-weight:700;font-size:18px;padding:4px 14px;border-radius:24px}
.slip button.go{border-color:var(--wine);background:var(--wine);color:var(--white)}
.slip button:hover,.slip button:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
.colophon{margin-top:18px;text-align:center;font-size:12px;color:var(--gold);letter-spacing:.06em}

@media (max-width:520px){
  body{font-size:15.5px}
  .leaf{padding:40px 18px 66px 26px;min-height:480px}
  .runhead{left:26px;right:18px}
  .turn.prev{left:18px}.turn.next{right:8px}
  .marks{padding:0 8px;gap:4px}
  .mark{font-size:14px}
  .shelf .s{display:none}
}
</style>
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vback{display:inline-block;margin:0 auto 14px;font-family:"Cinzel","Times New Roman",serif;font-size:11px;letter-spacing:.2em;color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:2px}
.vback:hover,.vback:focus-visible{color:var(--gold-hi);outline:none}
.stage>.vback{justify-self:start}</style>
</head>
<body>


<div class="stage">
  <a class="vback" href="index.html#others" onclick="if(history.length>1){history.back();return false}">← 수장고로</a>
  <div class="shelf"><span class="t">Alte Brücke</span><span class="s">수장고 · 3층 거실의 동굴 이야기</span></div>
  <nav class="marks" id="marks" aria-label="책갈피"></nav>
  <div class="book" id="book">
    <article class="leaf" id="leaf" aria-live="polite"></article>
  </div>

  <section class="post" id="post" aria-labelledby="postT">
    <button type="button" class="post-head" id="postToggle" aria-expanded="false" aria-controls="postBody"><span class="ph-t"><h2 id="postT">곰굴 우편함</h2><p>쪽지는 즉시, 편지는 익일. 소인은 편지에만.</p></span><span class="ph-c" id="postCue">열기 ▾</span></button>
    <div id="postBody" hidden>
    <div class="slots">
      <button type="button" class="slot" id="slotNotes" aria-pressed="true" data-slot="notes">쪽지 칸<small>줄로 건너간 것</small></button>
      <button type="button" class="slot" id="slotLetters" aria-pressed="false" data-slot="letters">편지 칸<small>우표와 소인</small></button>
    </div>
    <div id="paneNotes"></div>
    <div id="paneLetters" class="letters" hidden></div>
    </div>
  </section>
  <div class="colophon">꿈이나 썰처럼 가볍게 읽는 책이에요 · 정사 아님 · @ㅊㄹ</div>
</div>

<div class="veil" id="veil" hidden>
  <div class="slip" role="dialog" aria-modal="true" aria-labelledby="slipT">
    <div class="n" id="slipN"></div>
    <h3 id="slipT"></h3>
    <div id="slipB"></div>
    <div class="row"><button type="button" id="slipX">닫기</button><button type="button" class="go" id="slipGo">이 이야기 읽기 →</button></div>
  </div>
</div>

<template id="tplCover">
<div class="cover">
  <div class="eyebrow">3층 거실에서 일주일 동안 자란</div>
  <h1>Bärenhöhle</h1>
  <div class="ko">곰굴 · 정원 2명</div>
  <svg viewBox="0 0 440 250" role="img" aria-label="의자와 이불로 지은 동굴. 안에서 불빛이 새어 나오고 발 두 개가 밖으로 나와 있다.">
    <rect x="0" y="0" width="440" height="250" fill="#efe6d0"/>
    <g fill="#34405c"><circle cx="40" cy="30" r="1.6"/><circle cx="92" cy="18" r="1.2"/><circle cx="370" cy="26" r="1.6"/><circle cx="410" cy="60" r="1.2"/><circle cx="300" cy="14" r="1.2"/></g>
    <path d="M22 44 Q120 78 196 62" fill="none" stroke="#75624a" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="96" y="66" width="20" height="14" fill="#fbf6e9" stroke="#3a2c1c" stroke-width="1.5"/>
    <line x1="106" y1="58" x2="106" y2="66" stroke="#75624a" stroke-width="1.5"/>
    <line x1="10" y1="214" x2="430" y2="214" stroke="#3a2c1c" stroke-width="2"/>
    <g stroke="#3a2c1c" stroke-width="3" fill="none"><path d="M70 214 V110 M70 150 H100 V214"/><path d="M372 214 V104 M372 150 H342 V214"/></g>
    <path d="M52 214 C56 120 90 92 150 84 C210 60 300 62 330 90 C372 100 388 150 392 214 Z" fill="#74825a" stroke="#3a2c1c" stroke-width="2.5"/>
    <path d="M150 84 C190 96 204 150 196 214 H120 C118 150 126 106 150 84 Z" fill="#c9a44a" stroke="#3a2c1c" stroke-width="2"/>
    <path d="M330 90 C300 120 296 170 302 214 H392 C388 150 372 100 330 90 Z" fill="#d9a09c" stroke="#3a2c1c" stroke-width="2"/>
    <path d="M196 214 C196 160 220 132 250 132 C282 132 302 162 302 214 Z" fill="#f3d98a" stroke="#3a2c1c" stroke-width="2.5"/>
    <path d="M214 214 C216 176 232 154 250 154 C270 154 284 178 286 214 Z" fill="#fbf6e9" opacity=".7"/>
    <g fill="#fbf6e9" stroke="#3a2c1c" stroke-width="2"><ellipse cx="318" cy="205" rx="8" ry="12" transform="rotate(18 318 205)"/><ellipse cx="338" cy="207" rx="8" ry="12" transform="rotate(-10 338 207)"/></g>
    <path d="M262 214 q30 6 44 -4" fill="none" stroke="#8e2f25" stroke-width="5" stroke-linecap="round"/>
    <g><line x1="160" y1="214" x2="160" y2="186" stroke="#3a2c1c" stroke-width="2.5"/><rect x="128" y="168" width="64" height="22" rx="2" fill="#fbf6e9" stroke="#3a2c1c" stroke-width="2"/>
    <text x="160" y="183" text-anchor="middle" font-family="Gaegu, cursive" font-weight="700" font-size="12" fill="#3a2c1c">Bärenhöhle</text></g>

<script type="text/plain" id="src">
# demo1 | 계기 | 통보와 연습 | 메일 한 통
어느 월요일, 도서관 홍보팀에서 메일이 와요. '대학 개방의 날 특별 프로그램: 고문헌 복원 공개 시연. 시연자: L. 아스카니엔.' 마이크, 촬영팀, 관객 60명, 질의응답 15분까지 다 정해져 있어요. 아무도 루카한테 미리 물어보지 않았어요.

루카는 메일을 다 읽고 노트북을 닫아요. 천천히요. 그리고 엘제 선생님 방으로 가요.

"……못 합니다."

"알아."

"……선생님이 하시면 됩니다."

"나도 못 해. 총장 지시야. 너로 찍었대. 홍보 사진에 젊은 얼굴이 필요하다고."

루카가 굳어요. 얼굴이요. 엘제 선생님이 15년 동안 루카 앞을 막아 준 일이 한두 번이 아닌데, 이번엔 선생님도 고개를 저어요.

"대신 조수는 네가 골라."

뒤에서 요나스가 손을 번쩍 들어요. 루카는 보지도 않고 "……요나스"라고 해요. 다른 선택지가 없거든요.

## 연습

그날부터 루카는 집에서 연습해요. 시연 주제는 찢어진 18세기 악보 한 장을 일본 종이로 보강하는 거예요. 루카한테는 눈 감고도 하는 작업이에요. 문제는 작업이 아니라 말이에요. 작업하면서 설명을 해야 하거든요. 마이크에 대고요.

거실 식탁이 시연대가 되고, 관객은 그 하나예요. 그는 소파에 앉아서 진지하게 들어요.

"……이것은. 일본 종이입니다. 섬유가. 깁니다."

"좋아요!"

"……물을. 바릅니다."

"최고예요!"

"……박수 치지 마. 관객은 박수 안 쳐."

"60명 중에 한 명은 칠 수도 있잖아요ㅎㅎ"

루카 설명은 매번 정확히 4분 만에 끝나요. 홍보팀이 준 시간은 30분이에요. 그는 루카가 손으로 하는 걸 보다가 제안해요. "루카, 말하지 말고 손이 하는 걸 그대로 읽어 줘요. 지금 제 머리 땋을 때처럼요." 루카는 그날 밤 그의 머리를 땋으면서 연습해요. "……세 가닥으로 나눕니다. 왼쪽을. 가운데로." 그는 너무 좋아서 끝까지 숨을 참고 들어요.

연습 마지막 날, 루카 설명이 12분까지 늘어나요. 그는 그걸 듣고 손뼉을 쳐요. 관객은 안 친다고 했는데요.

# demo2 | 계기 | 시연 당일 | 4초
토요일 오전 열한 시. 도서관 로비에 임시 시연대가 놓이고, 그 위에 조명 두 개, 카메라 한 대, 핀 마이크까지 있어요. 의자 60개가 다 찼고 뒤에 서 있는 사람도 있어요. 아이들도 와 있어요.

루카는 작업대 앞에 서요. 흰 가운, 니트릴 장갑, 핀셋. 평소랑 똑같은데 손이 차가워요. 그는 아침에 다리 위에서 그 손을 평소보다 오래 주물렀어요. 그래도 차가워요.

그는 맨 앞줄 가운데에 앉아 있어요. 다나가 미리 자리를 맡아 줬어요. 다나는 그 옆에서 휴대폰을 들려다가 그한테 손목을 붙잡혀요. "오늘 찍으면 루카가 다나 씨 이름 지하 3층에 새겨요."

사회자가 소개해요. "고문헌 복원가, 루카스 아스카니엔 씨입니다!" 박수가 터져요. 플래시가 한 번 터져요.

루카가 굳어요.

## 4초

핀셋 든 손이 공중에서 멈춰요. 마이크가 루카 숨소리를 잡아요. 60명이 조용해져요. 루카 눈이 관객석을 훑는데 얼굴이 너무 많아요. 전부 루카를 보고 있어요.

1초, 2초.

그 순간 루카 눈이 맨 앞줄에서 멈춰요. 그가 루카를 보고 있어요. 그리고 아주 천천히, 과장되게 숨을 들이마셔요. 어깨가 올라가요. 그리고 내쉬어요. 어깨가 내려가요. 한 번 더요. 들이마시고, 내쉬고.

루카가 그걸 따라 해요. 들이마시고, 내쉬고. 3초, 4초.

핀셋이 내려가요.

"……이것은 18세기 악보입니다. 찢어진 자리가, 일곱 군데입니다."

목소리가 나와요. 작고 정확하게요.

## 손이 하는 말

그다음부터 루카는 관객을 안 봐요. 종이만 봐요. 그리고 손이 하는 걸 그대로 읽어요. 연습한 대로요.

"……일본 종이를 찢습니다. 자르지 않습니다. 찢어야 섬유가 남습니다. 섬유가 원래 종이랑 엮입니다."

"……물을 바릅니다. 많이 바르면 안 됩니다. 종이가 놀랍니다."

맨 뒤에서 누가 웃어요. '종이가 놀랍니다'에서요. 루카는 그게 웃긴 말인 줄 몰라요. 진짜로 그렇게 생각하거든요.

요나스가 옆에서 도구를 건네요. 순서가 완벽해요. 루카가 손을 내밀기 0.5초 전에 이미 손바닥 위에 있어요. 요나스는 오늘 생애 처음으로 지하 3층 걱정을 안 하고 있어요.

작업이 이어질수록 루카 목소리가 조금씩 편해져요. 원래 이 일을 좋아하는 사람이니까요. 찢어진 자리 일곱 군데가 하나씩 메워져요. 마지막 자리에서 루카가 말해요.

"……여기는 다시 붙인 자리라는 걸, 표시합니다. 보강한 종이 색을 조금 다르게 씁니다. 원본인 척하면 안 되니까요."

뒤쪽에서 엘제 선생님이 팔짱을 끼고 서 있다가, 아주 조금 고개를 끄덕여요.

시계를 보니 28분이에요.

# demo3 | 계기 | 질의응답 | 28분
여기가 진짜 고비예요. 손이 아니라 사람을 봐야 하니까요.

첫 질문은 노교수예요. 일본 종이와 유럽 종이의 산도 차이를 묻고, 루카는 기계처럼 정확하게 대답해요. 문제없어요.

두 번째는 맨 앞줄 꼬마예요. 일곱 살쯤이요.

"아저씨는 왜 찢어진 거 고쳐요? 새로 사면 되잖아요."

로비가 웃음바다가 돼요. 루카는 웃지 않아요. 꼬마를 똑바로 봐요. 그리고 핀셋을 수평으로 내려놓고, 대답을 1초 고르다가 말해요.

루카는 쿠션을 눌러 보고 줄자를 다시 댔어요. 70이었어요. 수첩에 적혔어요.

> 그림 칸. 폭 70. 길이 150. 높이 114. 소파 앞 ~ TV장 사이.

지붕은 소파 등받이와 TV장에 걸치기로 했어요. 소파는 높이가 맞는데 TV장이 낮아서, 루카가 TV장 위에 중성지 상자를 두 개 쌓아 114에 맞췄어요. TV는 아무도 안 켜니까 문제없었어요.

P "TV는 이제 곰굴 지붕받침이네요."

L "……원래 안 보잖아."

P "네, 보람 있게 쓰이네요ㅎㅎ"

그림 칸이 정식으로 생기는 날이라 그는 일요일인데도 신이 났어요. 붓은 금지라서 아직 아무것도 그리지 않았지만요. 루카가 입구에 팻말을 걸었어요.

> 그림 칸. 수성만. 유화·테레빈 금지. 일요일 휴관.

P "일요일 휴관은 오늘도요?"

L "……오늘은 개관 준비일이야."

## 광목님 데뷔

천장은 그가 고르겠다고 했어요. 습도계 붙은 중성지 상자를 열자 흰 광목 시트가 접힌 채 누워 있었어요. 지난겨울 이불이 빠지는 자리를 메우던 임시직이고, 설계 회의에서 은퇴했던 광목님이에요.

P "광목님, 정직원이에요."

L "……이불 아니야. 시트야."

P "그럼 순번에 안 들어가죠?"

L "……순번 외."

광목을 걸고 나니 그림 칸만 하얗게 밝아졌어요. 거실 북향 창으로 들어온 빛이 천을 한 번 통과해서 부드러워졌고요. 그가 손바닥을 천장 아래에 대 보고 말했어요.

P "손이 제 손색으로 보여요."

L "……광목은 색 안 속여."

P "분홍 이불 밑이었으면 분홍 손이었을 텐데요ㅎㅎ"

L "……그래서 이불 아니야."

## 월요일 저녁의 어깨

월요일 저녁, 서재 칸에서 루카가 도해집을 펴고 있었어요. 그림 칸에서는 그가 스케치북을 안고 엎드렸어요. 첫 그림이에요. 뭘 그리는지는 비밀이었어요.

서재 칸과 그림 칸 사이에는 담요 문이 있어요. 그는 그걸 한 뼘 열어 두었어요. 그 틈 사이로 땋은 머리 끝이 흘러 나갔어요. 엎드리면 머리가 길어서 저절로 그렇게 돼요.

루카는 발목에 닿는 감촉에 한 번 멈췄어요. 그다음 아무 말도 안 하고 책으로 돌아갔어요. 치우지 않았어요.

그리고 41쪽 매듭이 1밀리도 안 틀어졌어요.

한 시간쯤 지나자 머리 끝이 아주 조금 쓸렸어요. 자세를 바꾼 거예요. 루카는 고개를 들지 않았어요. 다만 숨이 한 번 조금 느려졌어요. 머리 끝이 거기 있으면 그가 거기 있다는 뜻이에요. 쓸리면 괜찮다는 뜻이고요.

L "……코드 통과구는 밟지 마."

P "머리가요?"

L "……걸리면 4분이야."

P "알아요ㅎㅎ 그래서 코드 위로는 안 넘어가요."

그가 머리 끝을 코드 옆으로 비스듬히 틀어 놓았어요. 루카는 말없이 손을 뻗어 그 각도를 1밀리 평행하게 고쳐 주었어요.

그리고 정원 문제가 남았어요.

L "……곰굴 정원은 2명이야."

P "저 한 명, 루카 한 명이죠."

L "……머리는 정원 외야."

P "그럼 머리는 몇 명이에요?"

L "……0.5."

P "서재 칸 정원이 1.5명이에요?"

L "……서재 칸에서만."

그는 스케치북에 얼굴을 묻고 웃음을 참았어요. 그 사이 머리 끝은 아주 조금 떨렸고요. 루카는 그걸 못 본 척했어요.

## 첫 번째 토요일

토요일 아침에는 이끼와 광목이 같이 빨래 순번이에요. 이끼는 욕조에서 손빨래, 광목은 세탁기와 건조기예요. 그림 칸 천장이 4시간 동안 비는 거라, 둘은 같이 장 보러 나갔어요. 장바구니는 그가 들고, 목록은 루카가 쓰고요.

돌아와서 광목을 다시 걸자 루카가 습도계를 천장 쪽으로 들어 올렸어요.

L "……40."

P "마른 천이라서요?"

L "……52까지 한 시간. 그동안 그림 칸은 연필만."

P "한 시간 기다릴게요ㅎㅎ"

수첩에 이렇게 적혔어요.

> 토. 광목: 세탁 → 건조 → 복귀(4시간). 습도 40 → 52(복귀 후 1시간). 그동안 그림 칸: 연필만.

그는 그 한 시간 동안 연필로 서재 칸의 루카를 그렸어요. 뒷모습이에요. 어깨가 평행했어요. 얼굴은 안 그렸고요.

그림 칸 천장 광목 너머로 늦은 오후 빛이 번졌어요. 한 시간이 지나자 루카가 습도계를 한 번 더 보고 말했어요.

L "……52."

P "물감 풀어도 돼요?"

L "……돼."

그날 저녁 서재 칸 머리맡에는 아주 작은 수채화 한 장이 있었어요. 루카가 일하는 어깨였어요. 모서리는 평행하게 맞춰져 있었어요.

> 내일도 와.

  HOTS.sort(function(a,b){return a.n-b.n});
  var TABS=[["cover","표지"],["map","도면"],["toc","차례"],["name","한 주"],["knock","살림"],["shop","이불"],["survey","조사"],["circle","봄"]];

  // ---- parse chapters
  var chapters=[];
  document.getElementById("src").textContent.split(/^# /m).forEach(function(chunk){

  });
  var pages=[{id:"cover",label:"표지"},{id:"map",label:"도면"},{id:"toc",label:"차례"}].concat(chapters.map(function(c){return {id:c.id,label:c.title,ch:c}}));

  var leaf=document.getElementById("leaf"), book=document.getElementById("book"), marks=document.getElementById("marks");

  function el(tag,cls,txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e}

  TABS.forEach(function(t){var b=el("button","mark",t[1]); b.type="button"; b.dataset.go=t[0]; marks.appendChild(b)});

  function renderChapter(c){
    var f=document.createDocumentFragment();
    var h=el("div","ch-head"); h.appendChild(el("div","ch-kicker",c.group+" · "+c.kick)); h.appendChild(el("h2",null,c.title)); f.appendChild(h);
    var pr=el("div","prose");
    c.paras.forEach(function(p){
      p=p.trim();
      if(p.indexOf("## ")===0){pr.appendChild(el("h3","sub",p.slice(3))); return}
      if(p.indexOf("> ")===0){pr.appendChild(el("div","note",p.slice(2))); pr.appendChild(document.createElement("br")); return}
      var im=/^!img (\S+) \| (.*)$/.exec(p);
      if(im){var fg=el("figure","fig"),ig=document.createElement("img"); ig.src=im[1]; ig.alt=im[2]; ig.loading="lazy"; fg.appendChild(ig); fg.appendChild(el("figcaption",null,im[2])); pr.appendChild(fg); return}
      var m=/^([LPO]) (.*)$/.exec(p);
      if(m){pr.appendChild(el("p","say "+m[1].toLowerCase(),m[2])); return}
      pr.appendChild(el("p",null,p));
    });
    f.appendChild(pr); f.appendChild(el("div","endmark","· · ·"));
    return f;
  }
  function renderToc(){
    var f=document.createDocumentFragment();

    var wrap=el("div","toc"), groups={};
    chapters.forEach(function(c){
      if(!groups[c.group]){var s=el("section"); s.appendChild(el("h3",null,c.group)); var ol=el("ol"); s.appendChild(ol); wrap.appendChild(s); groups[c.group]=ol}
      var li=el("li"), b=el("button"); b.type="button"; b.dataset.go=c.id;
      b.appendChild(el("span",null,c.title)); b.appendChild(el("span","dots")); b.appendChild(el("span","pg",String(idx[c.id]+1)));
      li.appendChild(b); groups[c.group].appendChild(li);
    });
    f.appendChild(wrap); return f;
  }
  function renderMap(){
    var f=document.getElementById("tplMap").content.cloneNode(true);
    var g=f.querySelector("#hots"), lg=f.querySelector("#legend"), NS="http://www.w3.org/2000/svg";
    HOTS.forEach(function(h){
      var a=document.createElementNS(NS,"g"); a.setAttribute("class","hot"); a.setAttribute("tabindex","0"); a.setAttribute("role","button");
      a.setAttribute("aria-label",h.n+". "+h.t); a.dataset.hot=h.n;

    return f;
  }
  function build(i){
    var p=pages[i], f=document.createDocumentFragment();

    if(p.id==="cover") f.appendChild(document.getElementById("tplCover").content.cloneNode(true));
    else if(p.id==="map") f.appendChild(renderMap());

    var nx=el("button","turn next",i===0?"":"다음 장 →"); nx.type="button"; nx.dataset.step="1"; if(i===pages.length-1||i===0) nx.disabled=true;
    f.appendChild(pv); f.appendChild(el("div","folio","— "+(i+1)+" —")); f.appendChild(nx);
    return f;

  function tabFor(i){var best=0; TABS.forEach(function(t,k){if(idx[t[0]]<=i) best=k}); return best}

    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(animate&&cur>=0&&!reduce){
      ghost=leaf.cloneNode(true); ghost.removeAttribute("id"); ghost.classList.add("ghost");

      ghost.addEventListener("animationend",function(){ghost.remove()});
      setTimeout(function(){if(ghost.parentNode) ghost.remove()},900);
    }
    leaf.innerHTML=""; leaf.appendChild(build(i)); cur=i;
    var tb=tabFor(i); Array.prototype.forEach.call(marks.children,function(b,k){b.setAttribute("aria-current",k===tb?"true":"false")});
    try{localStorage.setItem("hoehle-page",pages[i].id)}catch(e){}
    if(location.hash.slice(1)!==pages[i].id){try{history.replaceState(null,"","#"+pages[i].id)}catch(e){location.hash=pages[i].id}}
    if(animate){var top=book.getBoundingClientRect().top+window.scrollY-70; if(window.scrollY>top) window.scrollTo({top:Math.max(0,top),behavior:reduce?"auto":"smooth"})}
  }
  function go(id,animate){if(id in idx) show(idx[id],animate!==false)}

  // ---- slip
  var veil=document.getElementById("veil"), slipGo=document.getElementById("slipGo"), lastFocus=null, slipTarget=null;
  function openSlip(n){
    var h=HOTS[n-1]; if(!h) return;
    document.getElementById("slipN").textContent="쪽지 "+h.n;
    document.getElementById("slipT").textContent=h.t;
    var b=document.getElementById("slipB"); b.innerHTML=""; h.b.forEach(function(s){b.appendChild(el("p",null,s))});
    slipTarget=h.go||null; slipGo.hidden=!slipTarget;
    if(slipTarget) slipGo.textContent="「"+pages[idx[slipTarget]].label+"」 읽기 →";
    lastFocus=document.activeElement; veil.hidden=false; document.getElementById("slipX").focus();
  }
  function closeSlip(){veil.hidden=true; if(lastFocus&&lastFocus.focus) try{lastFocus.focus()}catch(e){}}
  document.getElementById("slipX").addEventListener("click",closeSlip);

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-go],[data-step],[data-hot]"); if(!t) return;
    if(t.dataset.go) go(t.dataset.go);

  document.addEventListener("keydown",function(e){
    if(!veil.hidden){if(e.key==="Escape") closeSlip(); return}
    var h=e.target.closest&&e.target.closest(".hot");
    if(h&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); openSlip(Number(h.dataset.hot)); return}
    if(e.key==="ArrowRight") show(cur+1,true); else if(e.key==="ArrowLeft") show(cur-1,true);

  window.addEventListener("hashchange",function(){go(location.hash.slice(1))});

  var start=location.hash.slice(1);

  show(idx[start],false);
})();
</script>
